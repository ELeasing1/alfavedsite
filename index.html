<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Евгений Демин — Международные расчёты</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      color-scheme: light;
      --bg:      #f3efe9;
      --paper:   #ffffff;
      --sunk:    #f2ede5;
      --line:    #e6ded2;
      --line-2:  #f0e9df;
      --ink:     #241a14;
      --ink-2:   #55483e;
      --ink-3:   #827365;
      --red:     #c2352b;
      --red-2:   #d6281f;
      --red-ink: #96271f;
      --vtb:     #0a2896;
      --green:   #1c7a4d;
      --gold:    #9a6a24;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif; color: var(--ink);
      background-color: var(--bg);
      background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n' x='0' y='0'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.30'/></svg>"),
        radial-gradient(1000px 560px at 10% -6%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 62%),
        radial-gradient(900px 500px at 92% 4%, rgba(194,53,43,0.05) 0%, rgba(0,0,0,0) 60%);
      background-repeat: repeat, no-repeat, no-repeat;
      overflow-x: hidden;
    }
    #root { min-height: 100svh; }
    img, video, svg { max-width: 100%; }

    .wrap {
      width: 100%; max-width: 2000px; margin-left: auto; margin-right: auto;
      padding-left: clamp(12px, 2vw, 34px); padding-right: clamp(12px, 2vw, 34px);
    }
    /* секции больше не растягиваются на экран — сайт стал заметно короче */
    .slide { position: relative; width: 100%; padding-top: 40px; padding-bottom: 40px; }
    @media (min-width: 1024px) { .slide { padding-top: 52px; padding-bottom: 52px; } }

    /* ---------- рельеф ---------- */
    .card {
      background: linear-gradient(180deg, #ffffff 0%, #fdfbf7 100%);
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 1px 2px rgba(70,50,34,0.05), 0 10px 26px -16px rgba(70,50,34,0.28);
    }
    .card-soft {
      background: linear-gradient(180deg, #fdfbf7 0%, #f9f5ef 100%);
      border: 1px solid var(--line-2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 6px 18px -14px rgba(70,50,34,0.26);
    }
    .sunken {
      background: linear-gradient(180deg, #f0eae1 0%, #faf7f2 70%);
      border: 1px solid var(--line);
      box-shadow: inset 0 2px 4px rgba(90,66,44,0.08), inset 0 -1px 0 rgba(255,255,255,0.85);
    }
    .emboss { box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 2px 3px rgba(70,50,34,0.06), 0 16px 36px -22px rgba(70,50,34,0.34); }
    /* единый внутренний отступ карточек — компактный */
    .pad { padding: 13px; }
    @media (min-width: 640px) { .pad { padding: 16px; } }

    .ink { color: var(--ink); } .ink-2 { color: var(--ink-2); } .ink-3 { color: var(--ink-3); }
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* ---------- строки без наложений ---------- */
    .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .row > .row-l { min-width: 0; flex: 1 1 auto; }
    .row > .row-r { flex: 0 0 auto; text-align: right; }

    /* ---------- поля ---------- */
    .fld {
      width: 100%; border-radius: 10px; padding: 8px 11px; color: var(--ink);
      background: #fffdfa; border: 1px solid var(--line); outline: none;
      box-shadow: inset 0 2px 4px rgba(90,66,44,0.06); font-size: 14px; font-family: inherit;
    }
    .fld:focus { border-color: rgba(194,53,43,0.55); box-shadow: inset 0 2px 4px rgba(90,66,44,0.05), 0 0 0 3px rgba(194,53,43,0.10); }
    select.fld { appearance: none; -webkit-appearance: none; padding-right: 30px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2382736f' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat; background-position: right 9px center; }
    .fld-big { font-size: 20px; font-weight: 600; padding: 9px 38px 9px 12px; }
    input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="range"] { height: 22px; accent-color: #0a2896; }
    label { cursor: pointer; }

    /* ---------- кнопки ---------- */
    .btn-dark { background: linear-gradient(180deg, #3a2a20 0%, #241a14 100%); color: #fdf6ec; box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 8px 20px -14px rgba(36,26,20,0.9); }
    .btn-dark:hover { background: linear-gradient(180deg, #4a3628 0%, #31241b 100%); }
    .btn-red { background: linear-gradient(180deg, #d33a2f 0%, #bd2f26 100%); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 20px -14px rgba(189,47,38,0.9); }
    .btn-red:hover { filter: brightness(1.06); }
    .btn-ghost { background: rgba(255,255,255,0.75); border: 1px solid var(--line); color: var(--ink-2); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9); }
    .btn-ghost:hover { background: #fff; color: var(--ink); }

    /* ---------- вкладки калькулятора ---------- */
    .tab {
      position: relative; text-align: left; border-radius: 12px; padding: 9px 11px;
      background: linear-gradient(180deg, #fbf7f1 0%, #f4efe7 100%);
      border: 1px solid var(--line); color: var(--ink-2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease;
    }
    .tab:hover { background: #fffdfa; color: var(--ink); transform: translateY(-1px); }
    .tab.on {
      background: linear-gradient(180deg, #ffffff 0%, #fffaf6 100%);
      border-color: rgba(194,53,43,0.42); color: var(--ink);
      box-shadow: inset 0 1px 0 #fff, 0 0 0 3px rgba(194,53,43,0.10), 0 12px 26px -18px rgba(70,50,34,0.55);
    }

    /* ---------- бренд-карточки ---------- */
    .c-vtb  { background: linear-gradient(180deg, #eff2fc 0%, #ffffff 62%); border: 1px solid #c8d2ee; }
    .c-alfa { background: linear-gradient(180deg, #fdeeec 0%, #ffffff 62%); border: 1px solid #f2c6bf; }
    .c-gold { background: linear-gradient(180deg, #fbf2e2 0%, #ffffff 62%); border: 1px solid #ead6b4; }
    .win-red  { border-color: #d6281f; box-shadow: 0 0 0 3px rgba(214,40,31,0.14), 0 12px 28px -20px rgba(70,50,34,0.5); }
    .win-vtb  { border-color: #0a2896; box-shadow: 0 0 0 3px rgba(10,40,150,0.13), 0 12px 28px -20px rgba(70,50,34,0.5); }
    .win-gold { border-color: #b3862f; box-shadow: 0 0 0 3px rgba(179,134,47,0.16), 0 12px 28px -20px rgba(70,50,34,0.5); }

    .kp-pre {
      white-space: pre-wrap; overflow-wrap: anywhere;
      font-size: 13px; line-height: 1.62; color: var(--ink-2);
      max-height: min(44vh, 440px); overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    @media (max-width: 1023px) { .kp-pre { max-height: 260px; } }
    .kp-tall .kp-pre { max-height: min(66vh, 760px); }
    @media (max-width: 1023px) { .kp-tall .kp-pre { max-height: 320px; } }
    .bank-cols { column-count: 1; column-gap: 22px; }
    @media (min-width: 640px)  { .bank-cols { column-count: 2; } }
    @media (min-width: 1280px) { .bank-cols { column-count: 3; } }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .fu { animation: fadeUp .55s cubic-bezier(.2,.75,.2,1) both; }
    .rise { opacity: 0; transform: translateY(16px); transition: opacity .55s ease-out, transform .6s cubic-bezier(.2,.75,.2,1); }
    .rise.in { opacity: 1; transform: none; }
    @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .pulse { animation: pulseDot 1.8s ease-in-out infinite; }

    /* приветственный экран: плавно появляется, держится, плавно уходит */
    @keyframes greetIn { from { opacity: 0; transform: translateY(18px) scale(.96); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
    .greet-in { animation: greetIn .8s cubic-bezier(.2,.75,.2,1) both; }
    @keyframes greetOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-12px) scale(.98); } }
    .greet-out { animation: greetOut .45s ease-in both; }
    @keyframes greetBar { from { width: 0%; } to { width: 100%; } }
    .greet-bar { width: 0%; animation: greetBar 7s linear .5s both; }

    /* ---------- ПК: общий масштаб меньше, чтобы четыре колонки калькулятора влезали рядом ---------- */
    @media (min-width: 1024px) { .app-zoom { zoom: 0.8; } }
    @media (min-width: 1680px) { .app-zoom { zoom: 0.85; } }
    @media (min-width: 2200px) { .app-zoom { zoom: 0.95; } }

    /* ---------- печать инвойса: на бумагу уходит только документ ---------- */
    #print-root { display: none; }
    @media print {
      .app-zoom { zoom: 1 !important; }
      html.print-inv body { background: #fff !important; }
      html.print-inv #root { display: none !important; }
      html.print-inv #print-root { display: block !important; }
      @page { size: A4; margin: 12mm; }
    }

    a, button { -webkit-tap-highlight-color: rgba(0,0,0,0.06); }
    ::selection { background: rgba(194,53,43,0.16); }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .fu, .pulse { animation: none; }
      .rise { opacity: 1; transform: none; transition: none; }
    }
  </style>
</head>

    const MSK_TZ = "Europe/Moscow";
    const WORK_FROM = 9, WORK_TO = 18;   // финагенты работают с 9:00 до 18:00 МСК
    function mskParts(d) {
      try {
        const s = new Intl.DateTimeFormat("ru-RU", { timeZone: MSK_TZ, hour: "2-digit", minute: "2-digit", hour12: false }).format(d);
        const p = s.split(":");
        return { text: s, h: parseInt(p[0], 10), m: parseInt(p[1], 10) };
      } catch (e) {
        const u = d.getTime() + d.getTimezoneOffset() * 60000 + 3 * 3600000;
        const x = new Date(u);
        const hh = String(x.getHours()).padStart(2, "0"), mm = String(x.getMinutes()).padStart(2, "0");
        return { text: hh + ":" + mm, h: x.getHours(), m: x.getMinutes() };
      }
    }
    function useClock() {
      const [now, setNow] = useState(() => new Date());
      useEffect(() => {
        const id = setInterval(() => setNow(new Date()), 15000);
        return () => clearInterval(id);
      }, []);
      const msk = mskParts(now);
      let local = "";
      try { local = new Intl.DateTimeFormat("ru-RU", { hour: "2-digit", minute: "2-digit", hour12: false }).format(now); }
      catch (e) { local = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0"); }
      let tzName = "";
      try { tzName = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
      const sameAsMsk = local === msk.text;
      const open = msk.h >= WORK_FROM && msk.h < WORK_TO;
      const mins = msk.h * 60 + msk.m;
      let left = "";
      if (open) {
        const d = WORK_TO * 60 - mins;
        left = d >= 60 ? "ещё " + Math.floor(d / 60) + " ч " + (d % 60) + " мин" : "ещё " + d + " мин";
      } else {
        const d = mins < WORK_FROM * 60 ? WORK_FROM * 60 - mins : (24 * 60 - mins) + WORK_FROM * 60;
        left = d >= 60 ? "через " + Math.floor(d / 60) + " ч " + (d % 60) + " мин" : "через " + d + " мин";
      }
      return { local, msk: msk.text, tzName, sameAsMsk, open, left };
    }

      const c = useClock();

    /* ---------- 1. ИМПОРТ ЧЕРЕЗ ФИНАНСОВОГО АГЕНТА ---------- */

      const Pusd = eff.USD > 0 ? Prub / eff.USD : 0;

    /* ---------- ПОКУПКА ЮАНЯ: У НАС ИЛИ В ВТБ ---------- */
    function routes(R, mV, byCny, nWanted, budget) {
      const rateA = R + mV;
      const rateB = (R + ALFA_MARKUP) * (1 + ALFA_CONV) / (1 - ALFA_TRANSFER);
      let nA, nB, rubA, rubB;
      if (byCny) { nA = nB = nWanted; rubA = nA * rateA; rubB = nB * rateB; }
      else { rubA = rubB = budget; nA = rateA > 0 ? budget / rateA : 0; nB = rateB > 0 ? budget / rateB : 0; }
      const aWins = rateA < rateB;
      const diffRub = Math.abs(rubA - rubB), diffCny = Math.abs(nA - nB);
      const saveRub = byCny ? diffRub : diffCny * R;
      const saveCny = byCny ? (R > 0 ? diffRub / R : 0) : diffCny;
      const savePct = byCny ? (Math.max(rubA, rubB) > 0 ? (diffRub / Math.max(rubA, rubB)) * 100 : 0)
                            : (Math.max(nA, nB) > 0 ? (diffCny / Math.max(nA, nB)) * 100 : 0);
      return { rateA, rateB, nA, nB, rubA, rubB, aWins, saveRub, saveCny, savePct };
    }

    function YuanPanel() {
      const moex = useMoexCny();
      const { rates: cbr, status: cbrStatus } = useCbr();
      const [mode, setMode] = useState("cny");
      const [amtCny, setAmtCny] = useState("100000");
      const [amtRub, setAmtRub] = useState("1000000");

      const byCny = mode === "cny";

      const R = moex.status === "ok" && moex.price ? moex.price : cbr.CNY;
      const nWanted = parseNum(amtCny, 0), budget = parseNum(amtRub, 0);
      const r = routes(R, vtbMarkup, byCny, nWanted, budget);
      const scenarios = MARKUPS.map((m) => Object.assign({ markup: m }, routes(R, m, byCny, nWanted, budget)));

      const A_base = r.nA * R, A_markup = r.nA * vtbMarkup;
      const B_bought = r.nB / (1 - ALFA_TRANSFER);
      const B_base = B_bought * R, B_markup = B_bought * ALFA_MARKUP;
      const B_conv = B_bought * (R + ALFA_MARKUP) * ALFA_CONV;
      const B_transferCny = B_bought * ALFA_TRANSFER, B_transferRub = B_transferCny * (R + ALFA_MARKUP);
      const commA = r.rubA - r.nA * R, commB = r.rubB - r.nB * R;
      const pctA = r.nA * R > 0 ? (commA / (r.nA * R)) * 100 : 0;
      const pctB = r.nB * R > 0 ? (commB / (r.nB * R)) * 100 : 0;
      const breakEven = r.rateB - R;
      const shPayA = r.nA * SH_PAY, shVcA = r.nA * SH_VC;
      const shTotalRub = (shPayA + shVcA) * R;
      const winColor = r.aWins ? VTB_BLUE : ALFA_RED;

      const kp = [

        (r.aWins ? "Юань выгоднее покупать в ВТБ: разница " : "Юань выгоднее покупать у нас: разница ") + rub(r.saveRub) + " (" + cny(r.saveCny) + "), это " + pctStr(r.savePct) + ".",
        "База: биржевой курс " + rate4(R) + " за юань, " + (byCny ? "объём " + cny(nWanted) : "бюджет " + rub(budget)) + ".",
        "",
        "В ВТБ: наценка в курсе " + Math.round(vtbMarkup * 100) + " коп. = " + rub(A_markup) + ", конвертация 0%, перевод в Шанхай 0%.",
        "Эффективный курс " + rate4(r.rateA) + ", " + (byCny ? "итого " + rub(r.rubA) : "получите " + cny(r.nA)) + ".",

        "У нас: наценка 1 коп. = " + rub(B_markup) + ", конвертация 0,6% = " + rub(B_conv) + ", перевод в ВТБ 0,3% = " + rub(B_transferRub) + ".",

        "ПРИ РАЗНЫХ НАЦЕНКАХ ВТБ",
      ].concat(scenarios.map((s) => Math.round(s.markup * 100) + " коп.: " + (byCny
          ? "ВТБ " + rub(s.rubA) + ", у нас " + rub(s.rubB) + ", разница " + rub(s.saveRub)
          : "ВТБ " + cny(s.nA) + ", у нас " + cny(s.nB) + ", разница " + cny(s.saveCny))))
       .concat([
        "ВТБ сравнялся бы при наценке " + (breakEven * 100).toFixed(1).replace(".", ",") + " коп., а берёт от 14 до 25.",

        "Плюс ВТБ Шанхай берёт " + CN_VTB + " с вашего поставщика в Китае.",
        "",

        "Тарифы зависят от дня и объёма, финальные цифры фиксируем перед сделкой.",
        "",

                <div className="relative">
                  <input type="number" inputMode="decimal" min="0" value={byCny ? amtCny : amtRub} onChange={(e) => byCny ? setAmtCny(e.target.value) : setAmtRub(e.target.value)} className="fld fld-big num" />
                  <span className="absolute right-3.5 top-1/2 -translate-y-1/2 text-[17px] ink-3">{byCny ? "¥" : "₽"}</span>
                </div>
                <div className="text-[12px] ink-3 mt-1.5 num">{byCny ? "≈ " + rub(nWanted * R) : "≈ " + cny(budget / (R || 1))} по бирже</div>

            <Fold icon={IcScale} title="Разница при 14, 20 и 25 копейках" sub="три самых частых наценки ВТБ">
              <div className="space-y-1.5">

                        <span className="row-l ink font-semibold text-[13px]">{Math.round(s.markup * 100)} коп.{on && <span className="ml-1.5 text-[10.5px] px-1.5 py-0.5 rounded-full font-medium" style={{ background: "rgba(194,53,43,0.14)", color: "var(--red-ink)" }}>сейчас</span>}</span>
                        <span className="row-r num text-[13px] font-bold" style={{ color: s.aWins ? VTB_BLUE : ALFA_RED }}>{byCny ? rub(s.saveRub) : cny(s.saveCny)}</span>
                      </div>
                      <div className="text-[11.5px] ink-2 num mt-0.5">ВТБ {byCny ? rub(s.rubA) : cny(s.nA)} · у нас {byCny ? rub(s.rubB) : cny(s.nB)}</div>
                    </div>
                  );
                })}
              </div>
            </Fold>
          </Col>

          <Col>
            <div className={"rounded-2xl c-vtb emboss flex flex-col pad " + (r.aWins ? "win-vtb" : "")}>
              <div className="flex items-start justify-between gap-2 mb-0.5">
                <div className="flex items-center gap-1.5 min-w-0">
                  <span className="w-2 h-2 rounded-full shrink-0" style={{ background: VTB_BLUE }}></span>
                  <div className="text-[15px] font-semibold ink leading-tight">Покупаем юань в ВТБ</div>
                </div>
                {r.aWins && (<span className="shrink-0 inline-flex items-center gap-1 text-[11.5px] font-semibold px-2 py-0.5 rounded-full text-white" style={{ background: VTB_BLUE }}><IcTrophy size={12} />Выгоднее</span>)}
              </div>
              <div className="text-[11.5px] ink-3 mb-2">и сразу отправляем в ВТБ Шанхай</div>
              <div className="mb-2 inline-flex items-center gap-1.5 text-[12.5px] px-2 py-1 rounded-lg self-start" style={{ background: "rgba(10,40,150,0.08)", border: "1px solid rgba(10,40,150,0.24)", color: VTB_BLUE }}>Эффективный курс <span className="font-bold num">{rate4(r.rateA)}</span></div>

      const clearBody = nClear * Rcb;

      const byCny = mode === "cny";

      const Rmoex = moex.status === "ok" && moex.price ? moex.price : cbr.CNY;
      const Rfx = Rmoex + FX_MARKUP;                 // наш курс AlfaFX
      const perVtb = (1 + SH_PAY + SH_VC) * (Rmoex + vtbMarkup);
      const budget = parseNum(amtRub, 0);

      let nDand, nVtb;
      if (byCny) { nDand = nVtb = parseNum(amtCny, 0); }
      else {
        nDand = solveByBudget(budget, (n) => dandongCalc(n, Rmoex).total, budget / (Rmoex * 0.5) + 1);

      const dandTotal = byCny ? D.total : budget;
      const vtbTotal = byCny ? nVtb * perVtb : budget;
      const perDand = nDand > 0 ? dandTotal / nDand : Rfx;
      const dMinApplied = D.base * DANDONG_PCT < DANDONG_MIN;

      const dWins = byCny ? dandTotal < vtbTotal : nDand > nVtb;
      const diffRub = byCny ? Math.abs(vtbTotal - dandTotal) : Math.abs(nDand - nVtb) * Rmoex;
      const diffCny = byCny ? (Rmoex > 0 ? Math.abs(vtbTotal - dandTotal) / Rmoex : 0) : Math.abs(nDand - nVtb);
      const savePct = byCny ? (Math.max(vtbTotal, dandTotal) > 0 ? Math.abs(vtbTotal - dandTotal) / Math.max(vtbTotal, dandTotal) * 100 : 0)
                            : (Math.max(nDand, nVtb) > 0 ? Math.abs(nDand - nVtb) / Math.max(nDand, nVtb) * 100 : 0);
      const winColor = dWins ? GOLD : VTB_BLUE;

      const kp = [
        "Иван Иванович, добрый день!",
        "",
        (byCny
          ? "Прямой платёж в Bank of Dandong дешевле ВТБ Шанхай на " + rub(diffRub) + ", это " + pctStr(savePct) + "."
          : "На бюджет " + rub(budget) + " прямым платежом до поставщика доходит на " + cny(diffCny) + " больше, чем через ВТБ Шанхай, это " + pctStr(savePct) + "."),

          <Col>
            <RouteCard name="Bank of Dandong" sub="прямой платёж в юанях, курс AlfaFX" cls="c-gold" win="win-gold" color={GOLD}

                <p>Юань покупаем по нашему курсу AlfaFX: биржевой плюс одна копейка. Не по ЦБ и не по банковскому курсу с наценкой в четверть рубля.</p>

          </Col>

          <Col>

    /* ================= КОНСТРУКТОР КП ================= */
    const NA = "— не указано —";
    const O_TASK = [NA, "Импорт из Китая", "Экспорт в Китай", "Импорт из другой страны", "Экспорт в другую страну", "Импорт и экспорт", "Покупка юаня"];

    function Field({ label, children }) {
      return (<label className="block"><div className="text-[12.5px] font-semibold ink mb-1">{label}</div>{children}</label>);
    }
    function Sel({ value, onChange, options }) {
      return (<select className="fld" value={value} onChange={(e) => onChange(e.target.value)}>{options.map((o) => <option key={o} value={o}>{o}</option>)}</select>);
    }
    const isSet = (v) => v && v !== NA;

    /* ---- сборка текста ---- */
    function buildKp(f, c) {
      const S = parseNum(f.amount, 1000000);
      const has = S > 0;
      const L = [];
      const add = (s) => L.push(s);
      const gap = () => { if (L.length && L[L.length - 1] !== "") L.push(""); };
      /* строка «а на вашей сумме это столько» */
      const ex = (comm, pct) => { if (has) add("Например, на " + rub(S) + " это " + rub(comm) + " — " + pctStr(pct, 2) + " за всё."); };

      const who = (f.client || "").trim();
      const co = (f.company || "").trim();
      const on = f.blocks;

      const nBlocks = (on.china ? 1 : 0) + (on.vtb ? 1 : 0) + (on.world ? 1 : 0);

      add(who ? who + ", добрый день!" : "Добрый день!");
      gap();
      add(co ? "Подготовил предложение по международным расчётам для " + co + "." : "Подготовил предложение по международным расчётам.");
      if (isSet(f.task)) add("Задача: " + f.task.toLowerCase() + ".");

      /* ничего не отмечено — короткая визитка без разбора маршрутов */
      if (nBlocks === 0) {
        gap();
        add("Мы — крупнейший независимый частный банк в России. Проводим платежи практически куда угодно: там, где другие банки разводят руками, у нас, как правило, есть рабочий маршрут.");
        gap();
        add("Платежи в Китай проводим от 0,5%.");
        add("Платежи в любую другую точку планеты — от 0,8%.");
        add("Экспортную выручку от иностранного покупателя зачисляем под 0,2%.");
        add("Отдельно есть прямые платежи в Китай за 0,8%. Китайская сторона при этом не платит комиссию за зачисление — на рынке так бывает далеко не всегда, обычно с получателя тоже что-то удерживают, и он закладывает это в цену.");
        if (has) {
          gap();
          add("Например, на " + rub(S) + " платёж в Китай укладывается в " + rub(c.clearComm) + " за всё, а приём выручки — в " + rub(c.expComm) + ".");
        }
        gap();
        add("Конвертация по прозрачному курсу, без наценки, спрятанной внутри. Валютный контроль и проверку контракта берём на себя.");
        add("Тарифы действуют до " + PROMO_UNTIL + ".");
        add("Работаем с 9:00 до 18:00 по Москве. Напишите, что за сделка — подберу маршрут и посчитаю точную стоимость.");
        gap();
        add((f.manager || "Евгений Демин").trim());
        add("Международные расчёты");
        return L.join("\n");
      }

      if (on.china) {
        gap();
        add("ПЛАТЕЖИ В КИТАЙ");
        gap();
        add("Клиринг через финансового агента");
        add("Клиринг — совместный проект Центробанков России и Китая, мы аккредитованы по нему работать. Платёж идёт межбанковским каналом, без цепочки посредников, отсюда и цена.");
        add("Рубли уходят от нас, поставщику платит банк материкового Китая — для него это внутренний платёж, а не перевод из России.");
        add("Курс — ЦБ на день перевода, наценки в курсе нет.");
        add("Комиссия 0,5%, минимум 20 000 ₽. Это и есть вся стоимость: ни за платёж, ни за валютный контроль отдельно не берём.");
        if (has && c.clearMin) add("Например, на " + rub(S) + " это " + rub(c.clearComm) + ": здесь ещё работает минимум. Сама ставка 0,5% включается от " + rub(CLEARING_MIN / CLEARING_PCT) + ", и дальше комиссия почти не растёт вместе с суммой.");
        else ex(c.clearComm, c.clearPct);
        add("Получатель в Китае платит финагенту " + CN_CLEARING + ", тогда как в ВТБ Шанхай с него удержали бы " + CN_VTB + ". Ему тоже выгоднее.");
        add("Требования: китайская компания без иностранного участия — ни среди учредителей и юрлиц-участников, ни в лице генерального директора. Банк получателя — материковый Китай, кроме банков с американским участием.");
        add("География: " + PROVINCES.join(", ") + ", а также " + CITIES.join(" и ") + ".");
        gap();
        add("Bank of Dandong, прямой платёж");
        add("Юань уходит напрямую в банк получателя, без посредников в цепочке. В этом и смысл маршрута.");
        add("Конвертация по нашему курсу AlfaFX — биржевой плюс одна копейка на юань. Не по банковскому курсу с наценкой в четверть рубля.");
        add("Перевод 0,8%, минимум 3 000 ₽ — в начале года было 1,2%.");
        add("Валютный контроль, конвертация и перевод вместе не превышают 1,8%. Выше этой цифры не выйдет ни при каком раскладе.");
        ex(c.dandComm, c.dandPct);
        add("С получателя в Китае комиссия " + CN_DANDONG + ", по редким санкционным позициям 0,2%.");
      }

      if (on.vtb) {
        gap();
        add("ПЛАТЕЖИ НА ВТБ ШАНХАЙ");
        add("Для сравнения: сам банк удерживает 1,99% за платёж и 0,2% за валютный контроль, вместе 2,19%. Плюс " + CN_VTB + " с китайской стороны — это теряет ваш поставщик и закладывает в цену.");
        add("Юань под такой платёж: в ВТБ комиссий нет, но в курсе сидит наценка 14–25 копеек на юань, и в тарифах её не показывают.");
        add("У нас курс AlfaFX — биржа плюс копейка, конвертация 0,6%, перевод в ВТБ 0,3%. По эффективному курсу почти всегда выходит дешевле.");
        if (has) add("Например, на " + rub(S) + " один только ВТБ Шанхай возьмёт " + rub(c.vtbFee) + " — и это без наценки в курсе.");
        add("Если получатель проходит по клирингу, тот же платёж дешевле провести по курсу ЦБ, а деньги всё равно придут на счёт в ВТБ Шанхай.");
      }

      if (on.world) {
        gap();
        add("ПЛАТЕЖИ В ДРУГИЕ СТРАНЫ");
        gap();
        add("Импорт через финансового агента-нерезидента");
        add("Платёж уходит от лица агента, ваш банк в цепочке не участвует. Конвертация по курсу ЦБ или по Investing, на ваш выбор.");
        add("Ставка агента: до $50 000 — 1,4%, от $50 000 до $100 000 — 1,0%, свыше $100 000 — 0,8%. На платежи до $10 000 плюс фиксированные $100. Год назад те же ставки были 2,2%, 1,9% и 1,5%.");
        add("Сверху валютный контроль 0,2%, минимум 1 200 ₽, и перевод агенту 0,15%, минимум 1 000 ₽. Всё вместе на крупных суммах не превышает 1,15%.");
        ex(c.impComm, c.impPct);
        gap();
        add("Приём экспортной выручки");
        add("Покупатель платит удобной ему валютой: доллар, евро, юань, дирхам, лира, тенге, гонконгский доллар, рупия. Конвертируем по курсу ЦБ и зачисляем рубли на ваш счёт в России.");
        add("Комиссия 0,2% на любые суммы, было 0,5%. Больше ничего не удерживаем.");
        if (has) add("Например, с " + rub(S) + " удержим " + rub(c.expComm) + ", на счёт придёт " + rub(c.expNet) + ".");
        add("Страны: Китай и Гонконг, Турция, ОАЭ, Индия, Казахстан и ЕАЭС, Юго-Восточная Азия, Европа, Латинская Америка.");
      }

      gap();
      add("Тарифы действуют до " + PROMO_UNTIL + ". Курс меняется каждый день, поэтому суммы в примерах ориентировочные.");
      add("Работаем с 9:00 до 18:00 по Москве. Пришлите контракт или инвойс — посчитаю точно под вашу сделку и скажу, каким маршрутом её вести.");
      gap();
      add((f.manager || "Евгений Демин").trim());
      add("Международные расчёты");
      return L.join("\n");
    }

    const KP_DEFAULT = {
      client: "", company: "", manager: "Евгений Демин",
      task: NA,
      blocks: { china: false, vtb: false, world: false },
      amount: "1000000",
    };
    const PRESETS = [
      { id: "short", label: "Кратко",        hint: "о банке и ставках",  blocks: { china: false, vtb: false, world: false } },
      { id: "all",   label: "Подробно",      hint: "все три блока",      blocks: { china: true,  vtb: true,  world: true  } },
      { id: "china", label: "Китай",         hint: "клиринг и Dandong",  blocks: { china: true,  vtb: false, world: false } },
      { id: "vtb",   label: "ВТБ Шанхай",    hint: "юань и комиссии",    blocks: { china: false, vtb: true,  world: false } },
      { id: "world", label: "Другие страны", hint: "мир и экспорт",      blocks: { china: false, vtb: false, world: true  } },
    ];
    const BLOCK_LIST = [
      { key: "china", label: "Платежи в Китай", sub: "клиринг, Bank of Dandong" },
      { key: "vtb",   label: "ВТБ Шанхай",      sub: "покупка юаня и комиссии банка" },
      { key: "world", label: "Другие страны",   sub: "импорт по миру и приём выручки" },
    ];

    function KpBuilder() {
      const [f, setF] = useState(KP_DEFAULT);
      const { rates: cbr, cbrDate, status: cbrStatus } = useCbr();
      const moex = useMoexCny();
      const set = (k) => (v) => setF((o) => Object.assign({}, o, { [k]: v }));
      const toggleBlock = (k) => setF((o) => Object.assign({}, o, { blocks: Object.assign({}, o.blocks, { [k]: !o.blocks[k] }) }));
      const applyPreset = (b) => setF((o) => Object.assign({}, o, { blocks: Object.assign({}, b) }));
      const activePreset = PRESETS.find((p) => p.blocks.china === f.blocks.china && p.blocks.vtb === f.blocks.vtb && p.blocks.world === f.blocks.world);

      /* стоимость по каждому маршруту на введённую сумму */
      const S = parseNum(f.amount, 0);
      const Rcb = cbr.CNY;
      const Rmoex = moex.status === "ok" && moex.price ? moex.price : cbr.CNY;
      const nAt = Rmoex > 0 ? S / Rmoex : 0;
      const clearComm = Math.max(S * CLEARING_PCT, CLEARING_MIN);
      const D = dandongCalc(nAt, Rmoex);
      const vtbFee = S * (SH_PAY + SH_VC);
      const usd = cbr.USD > 0 ? S / cbr.USD : 0;
      const tier = tierFor(usd);
      const impComm = S * tier.pct + tier.fix * cbr.USD + Math.max(S * VC_PCT, VC_MIN) + Math.max(S * FA_PCT, FA_MIN);
      const expComm = S * EXPORT_PCT;
      const c = {
        clearComm, clearPct: S > 0 ? clearComm / S * 100 : 0, clearMin: S * CLEARING_PCT < CLEARING_MIN,
        dandComm: D.comm, dandPct: D.pct,
        vtbFee,
        impComm, impPct: S > 0 ? impComm / S * 100 : 0,
        expComm, expNet: S - expComm, tier,
      };
      const text = buildKp(f, c);
      const noBlocks = !f.blocks.china && !f.blocks.vtb && !f.blocks.world;

      return (
        <section id="kp" className="slide">
          <div className="wrap w-full">
            <Head badge="Конструктор КП" icon={IcEdit} tone="gold"
              title="Соберите коммерческое предложение"
              text="По умолчанию письмо короткое: кто мы и сколько стоит, без разбора маршрутов. Отметьте блоки, если нужно подробное КП. Впишите сумму сделки — в текст добавятся примеры вида «на такую сумму комиссия не превысит столько-то за всё»." />

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-3">
              <div className="rise lg:col-span-4">
                <div className="rounded-2xl card pad h-full">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-2.5">
                    <div className="text-[14px] font-semibold ink">Что войдёт в письмо</div>
                    <button onClick={() => setF(KP_DEFAULT)} className="inline-flex items-center gap-1 text-[12.5px] ink-2 hover:ink"><IcRefresh size={13} />сбросить</button>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-1.5 mb-2.5">
                    {PRESETS.map((p) => {
                      const on = activePreset && activePreset.id === p.id;
                      return (
                        <button key={p.id} onClick={() => applyPreset(p.blocks)} className={"rounded-lg px-2.5 py-2 text-left transition-all " + (on ? "btn-red" : "btn-ghost")}>
                          <div className="text-[12.5px] font-semibold leading-tight">{p.label}</div>
                          <div className={"text-[11px] leading-snug mt-0.5 " + (on ? "opacity-85" : "ink-3")}>{p.hint}</div>
                        </button>
                      );
                    })}
                  </div>

                  <div className="space-y-1.5 mb-3">
                    {BLOCK_LIST.map((b) => {

    /* kind: name | person | address | country | place | text

             mt — встроенный переводчик браузера (проверить), need — вывести нельзя, вписать вручную,
             no-mt — переводчика в браузере нет, mt-fail — переводчик не справился */
    async function invConvert(kind, text, to) {
      const t = String(text || "").trim();
      if (!t) return { v: "", how: "copy" };
      const sc = scriptOf(t);
      const src = sc === "han" ? "zh" : sc === "cyr" ? "ru" : "en";
      if (kind === "country") { const c = findCountry(t); return c ? { v: c[to], how: "dict" } : (src === to ? { v: t, how: "copy" } : { v: "", how: "need" }); }
      if (kind === "place") return src === to ? { v: t, how: "copy" } : placeConv(t, to);
      if (src === to) return { v: t, how: "copy" };
      if (kind === "name" || kind === "person" || kind === "address") {
        if (sc === "cyr") return { v: kind === "name" ? ruOrgToLatin(t) : kind === "person" ? translit(t) : ruAddressToEn(t), how: "rule" };
        if (sc === "lat") return { v: t, how: "copy" };
        /* иероглифы: официальное английское название и адрес китайской компании из них не выводятся —
           их берут из контракта или банковских реквизитов, иначе платёж может не пройти по имени получателя */
        return { v: "", how: "need" };
      }
      if (!hasOnDeviceMT()) return { v: "", how: "no-mt" };
      try { return { v: await invMT(t, src, to), how: "mt" }; }
      catch (e) { return { v: "", how: e && e.message === "no-mt" ? "no-mt" : "mt-fail" }; }
    }
    const kindOfPath = (path) => {
      const f = String(path).split(/[.:]/).pop();
      if (f === "name" || f === "bank") return "name";
      if (f === "contact") return "person";
      if (f === "address" || f === "bankAddress") return "address";
      if (f === "country") return "country";
      if (f === "incPlace" || f === "svcPlace") return "place";
      return "text";
    };

    /* ---- данные ---- */
    const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
    let INV_UID = 0;
    const invUid = () => "i" + (++INV_UID) + Date.now().toString(36);
    const ML = (ru, en, zh) => ({ ru: ru || "", en: en || "", zh: zh || "" });
    const INV_ML_FIELDS = ["name", "address", "country", "bank", "bankAddress", "contact"];
    const invPartyEmpty = () => ({ name: ML(), address: ML(), country: ML(), bank: ML(), bankAddress: ML(), contact: ML(), taxId: "", swift: "", account: "" });
    const invItemEmpty = () => ({ id: invUid(), desc: ML(), hs: "", period: "", qty: "1", unit: 0, price: "" });

    /* пути к мультиязычным полям: "seller.name", "info", "item:<id>:desc" */
    function invPaths(d) {
      const p = [];
      ["seller", "buyer"].forEach((s) => INV_ML_FIELDS.forEach((f) => p.push(s + "." + f)));
      p.push("info", "incPlace", "svcPlace");
      d.items.forEach((it) => p.push("item:" + it.id + ":desc"));
      return p;
    }
    function tGet(d, path) {
      if (path.indexOf("item:") === 0) { const a = path.split(":"); const it = d.items.find((x) => x.id === a[1]); return it ? it[a[2]] : null; }
      const a = path.split(".");
      return a.length > 1 ? (d[a[0]] || {})[a[1]] : d[a[0]];
    }
    function tSet(d, path, lang, val) {
      if (path.indexOf("item:") === 0) {
        const a = path.split(":");
        return Object.assign({}, d, { items: d.items.map((it) => (it.id !== a[1] ? it : Object.assign({}, it, { [a[2]]: Object.assign({}, it[a[2]], { [lang]: val }) }))) });
      }
      const a = path.split(".");
      if (a.length > 1) return Object.assign({}, d, { [a[0]]: Object.assign({}, d[a[0]], { [a[1]]: Object.assign({}, d[a[0]][a[1]], { [lang]: val }) }) });
      return Object.assign({}, d, { [a[0]]: Object.assign({}, d[a[0]], { [lang]: val }) });
    }
    function setManual(d, path, lang, on) {
      const cur = Object.assign({}, d.manual[path] || {});
      if (on) cur[lang] = true; else delete cur[lang];
      return Object.assign({}, d, { manual: Object.assign({}, d.manual, { [path]: cur }) });
    }

    /* одна модель для превью, печати, текста и Word */
    function invModel(d) {
      const L = d.langs.length ? d.langs : ["en"];
      const svc = d.kind === "services";
      const onlyRu = L.length === 1 && L[0] === "ru";
      const loc = onlyRu ? "ru-RU" : "en-US";
      const K = { title: svc ? "titleSvc" : "title", seller: svc ? "provider" : "seller", buyer: svc ? "customer" : "buyer", desc: svc ? "descSvc" : "desc", code: svc ? "period" : "hs" };
      const key = (k) => K[k] || k;
      const labs = (k) => L.map((l) => INV_T[key(k)][l]);
      const lab = (k) => labs(k).filter((x, i, a) => a.indexOf(x) === i).join(" / ");
      const uniq = (arr) => arr.map((x) => String(x == null ? "" : x).trim()).filter((x, i, a) => x && a.indexOf(x) === i);
      const multi = (o) => uniq(L.map((l) => (o || {})[l]));
      const money = (x) => new Intl.NumberFormat(loc, { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(x || 0);
      const qty = (x) => new Intl.NumberFormat(loc, { maximumFractionDigits: 3 }).format(x || 0);
      const date = (iso) => { if (!iso) return ""; const p = String(iso).split("-"); return onlyRu && p.length === 3 ? p[2] + "." + p[1] + "." + p[0] : iso; };
      const units = svc ? INV_UNITS_SVC : INV_UNITS;
      const rows = d.items.map((it) => {
        const q = parseNum(it.qty, 0), p = parseNum(it.price, 0);
        return { it, q, p, sum: Math.round(q * p * 100) / 100, descs: multi(it.desc), code: String((svc ? it.period : it.hs) || "").trim(), unit: uniq(L.map((l) => (units[it.unit] || units[0])[l])).join(" / ") };
      });
      const total = Math.round(rows.reduce((a, r) => a + r.sum, 0) * 100) / 100;
      const pay = uniq(L.map((l) => (INV_PAY[d.pay] || INV_PAY[0])[l])).join(" / ");
      const party = (p) => [
        ["company", multi(p.name)], ["address", multi(p.address)], ["country", multi(p.country)], ["taxId", uniq([p.taxId])],
        ["bank", multi(p.bank)], ["bankAddr", multi(p.bankAddress)], ["swift", uniq([p.swift])], ["account", uniq([p.account])], ["contact", multi(p.contact)],
      ].filter((x) => x[1].length);
      const places = multi(d.incPlace);
      const terms = svc
        ? [["currency", [d.currency]], ["payment", [pay]], ["place", multi(d.svcPlace).length ? [multi(d.svcPlace).join(" / ")] : ["—"]]]
        : [["currency", [d.currency]], ["payment", [pay]], ["delivery", [d.incoterm + (places.length ? " " + places.join(" / ") : "") + " (Incoterms® 2020)"]], ["origin", [uniq(L.map((l) => (INV_ORIGIN[d.origin] || INV_ORIGIN[0])[l])).join(" / ")]]];
      const words = L.map((l) => amountWords(total, d.currency, l));
      return { L, svc, lab, labs, money, qty, date, rows, total, party, terms, words, infos: multi(d.info), payLines: uniq(L.map((l) => (INV_PAY[d.pay] || INV_PAY[0])[l])) };
    }

    function invoiceText(d) {
      const m = invModel(d);
      const out = [];
      m.labs("title").forEach((t) => out.push(t.toUpperCase()));
      out.push(m.lab("no") + ": " + (d.no || "—") + "   " + m.lab("date") + ": " + (m.date(d.date) || "—"));
      if (d.contractNo || d.contractDate) out.push(m.lab("contract") + ": " + (d.contractNo || "—") + (d.contractDate ? " " + m.lab("contractDate") + " " + m.date(d.contractDate) : ""));
      [["seller", d.seller], ["buyer", d.buyer]].forEach((pair) => {
        out.push("");
        out.push(m.lab(pair[0]).toUpperCase());
        m.party(pair[1]).forEach((x) => out.push(m.lab(x[0]) + ": " + x[1].join(" / ")));
      });
      out.push("");
      m.terms.forEach((t) => out.push(m.lab(t[0]) + ": " + t[1].join(" ")));
      out.push("");
      m.rows.forEach((r, i) => {
        out.push((i + 1) + ". " + (r.descs.join(" / ") || "—"));
        out.push("   " + (r.code ? m.lab("code") + ": " + r.code + "; " : "") + m.lab("qty") + ": " + m.qty(r.q) + " " + r.unit + "; " + m.lab("price") + ": " + m.money(r.p) + "; " + m.lab("amount") + ": " + m.money(r.sum));
      });
      out.push("");
      out.push(m.lab("total") + ": " + m.money(m.total) + " " + d.currency);
      out.push(m.lab("words") + ":");
      m.words.forEach((w) => out.push(w));
      if (m.infos.length) { out.push(""); out.push(m.lab("info") + ":"); m.infos.forEach((s) => out.push(s)); }
      return out.join("\n");
    }

    /* ================= WORD (.docx) =================
       Настоящий документ Office Open XML, собирается прямо в браузере, без внешних библиотек.
       A4, поля: слева 20 мм, справа и сверху/снизу 15 мм. Шрифт Arial, для иероглифов — Microsoft YaHei. */
    const DX_W = 9921;
    const dxEsc = (s) => String(s == null ? "" : s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    function dxRun(text, o) {
      o = o || {};
      const sz = o.sz || 18;
      const rPr = '<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:eastAsia="Microsoft YaHei" w:cs="Arial"/>' + (o.b ? "<w:b/><w:bCs/>" : "") + (o.caps ? "<w:caps/>" : "") + '<w:color w:val="' + (o.color || "1B1510") + '"/><w:sz w:val="' + sz + '"/><w:szCs w:val="' + sz + '"/></w:rPr>';
      return String(text == null ? "" : text).split("\n").map((t, i) => "<w:r>" + rPr + (i ? "<w:br/>" : "") + '<w:t xml:space="preserve">' + (o.nb ? dxEsc(t).split("-").join('</w:t><w:noBreakHyphen/><w:t xml:space="preserve">') : dxEsc(t)) + "</w:t></w:r>").join("");
    }
    const DX_TAB = "<w:r><w:tab/></w:r>";
    function dxPar(runs, o) {
      o = o || {};
      return "<w:p><w:pPr>" + (o.keep ? "<w:keepNext/>" : "")
        + (o.bottom ? '<w:pBdr><w:bottom w:val="single" w:sz="' + o.bottom + '" w:space="1" w:color="1B1510"/></w:pBdr>' : "")
        + (o.tab ? '<w:tabs><w:tab w:val="right" w:pos="' + o.tab + '"/></w:tabs>' : "")
        + '<w:spacing w:before="' + (o.before || 0) + '" w:after="' + (o.after || 0) + '" w:line="' + (o.line || 252) + '" w:lineRule="' + (o.exact ? "exact" : "auto") + '"/>'
        + (o.jc ? '<w:jc w:val="' + o.jc + '"/>' : "")
        + (o.tiny ? '<w:rPr><w:sz w:val="2"/><w:szCs w:val="2"/></w:rPr>' : "")
        + "</w:pPr>" + (runs || "") + "</w:p>";
    }
    const dxGap = (h) => dxPar("", { tiny: true, exact: true, line: h || 140 });
    function dxBorders(tag, v, sz, color, inside) {
      const one = (s) => "<w:" + s + ' w:val="' + v + '" w:sz="' + sz + '" w:space="0" w:color="' + color + '"/>';
      return "<w:" + tag + ">" + ["top", "left", "bottom", "right"].concat(inside ? ["insideH", "insideV"] : []).map(one).join("") + "</w:" + tag + ">";
    }
    function dxCell(w, content, o) {
      o = o || {};
      const c = content || "";

    /* zip без сжатия — Word такие файлы открывает штатно */
    const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
    function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
    function zipStore(files) {
      const enc = new TextEncoder(), now = new Date();
      const tm = ((now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2)) & 0xFFFF;
      const dt = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
      const parts = [], central = [];
      let off = 0;
      files.forEach((f) => {
        const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
        const h = new DataView(new ArrayBuffer(30));
        [[0, 0x04034b50, 4], [4, 20, 2], [6, 0, 2], [8, 0, 2], [10, tm, 2], [12, dt, 2], [14, crc, 4], [18, data.length, 4], [22, data.length, 4], [26, name.length, 2], [28, 0, 2]]
          .forEach((x) => (x[2] === 4 ? h.setUint32(x[0], x[1], true) : h.setUint16(x[0], x[1], true)));
        parts.push(new Uint8Array(h.buffer), name, data);
        const c = new DataView(new ArrayBuffer(46));
        [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0, 2], [10, 0, 2], [12, tm, 2], [14, dt, 2], [16, crc, 4], [20, data.length, 4], [24, data.length, 4], [28, name.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, off, 4]]
          .forEach((x) => (x[2] === 4 ? c.setUint32(x[0], x[1], true) : c.setUint16(x[0], x[1], true)));
        central.push(new Uint8Array(c.buffer), name);
        off += 30 + name.length + data.length;
      });
      const cdSize = central.reduce((a, x) => a + x.length, 0);
      const e = new DataView(new ArrayBuffer(22));
      [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, files.length, 2], [10, files.length, 2], [12, cdSize, 4], [16, off, 4], [20, 0, 2]]
        .forEach((x) => (x[2] === 4 ? e.setUint32(x[0], x[1], true) : e.setUint16(x[0], x[1], true)));
      const all = parts.concat(central, [new Uint8Array(e.buffer)]);
      const out = new Uint8Array(all.reduce((a, x) => a + x.length, 0));
      let p = 0;
      all.forEach((x) => { out.set(x, p); p += x.length; });
      return out;
    }

    function InvoiceBuilder() {
      const [d, setD] = useState(() => invDemo("goods"));
      const [tab, setTab] = useState("doc");
      const [msg, setMsg] = useState("");
      const [autoOn, setAutoOn] = useState(true);
      const [busy, setBusy] = useState({});
      const [hows, setHows] = useState({});
      const [mtState, setMtState] = useState(() => (hasOnDeviceMT() ? "ok" : "no-mt"));
      const [printHost, setPrintHost] = useState(null);
      const docRef = useRef(null);
      const dRef = useRef(d);
      dRef.current = d;
      const timers = useRef({}), vers = useRef({}), prevLangs = useRef(d.langs);
      useEffect(() => { setPrintHost(document.getElementById("print-root")); }, []);

      const svc = d.kind === "services";
      const flash = (t) => { setMsg(t); setTimeout(() => setMsg(""), 2800); };
      const upd = (patch) => setD((o) => Object.assign({}, o, patch));
      const updParty = (side, k, v) => setD((o) => Object.assign({}, o, { [side]: Object.assign({}, o[side], { [k]: v }) }));
      const updItem = (id, patch) => setD((o) => Object.assign({}, o, { items: o.items.map((x) => (x.id === id ? Object.assign({}, x, patch) : x)) }));

      /* автоперевод: пишем в одном языке — остальные подтягиваются, если их не правили руками */
      const translatePath = async (path, text, v) => {
        const cur = dRef.current;
        const man = cur.manual[path] || {};
        const targets = cur.langs.filter((l) => !man[l]);
        if (!targets.length) return;
        if (!String(text || "").trim()) { setHows((h) => { const n = Object.assign({}, h); delete n[path]; return n; }); setD((o) => targets.reduce((acc, l) => ((acc.manual[path] || {})[l] ? acc : tSet(acc, path, l, "")), o)); return; }
        setBusy((b) => Object.assign({}, b, { [path]: true }));
        const kind = kindOfPath(path);
        const res = await Promise.all(targets.map((l) => Promise.resolve().then(() => invConvert(kind, text, l)).then((x) => [l, x], () => [l, { v: "", how: "mt-fail" }])));
        setBusy((b) => { const n = Object.assign({}, b); delete n[path]; return n; });
        if (vers.current[path] !== v) return;
        setHows((h) => Object.assign({}, h, { [path]: res.reduce((acc, r) => { acc[r[0]] = r[1].how; return acc; }, Object.assign({}, h[path] || {})) }));
        if (res.some((r) => r[1].how === "no-mt")) setMtState("no-mt"); else if (res.some((r) => r[1].how === "mt-fail")) setMtState("mt-fail"); else if (res.some((r) => r[1].how === "mt")) setMtState("ok");
        setD((o) => res.reduce((acc, r) => ((acc.manual[path] || {})[r[0]] ? acc : tSet(acc, path, r[0], r[1].v)), o));
      };
      const schedule = (path, text) => {
        clearTimeout(timers.current[path]);
        const v = (vers.current[path] = (vers.current[path] || 0) + 1);
        timers.current[path] = setTimeout(() => translatePath(path, text, v), 650);
      };
      const onType = (path, lang, val) => {
        setD((o) => setManual(tSet(o, path, lang, val), path, lang, !!String(val).trim()));
        if (autoOn) schedule(path, val);
      };
      const fillMissing = () => {
        const cur = dRef.current;
        invPaths(cur).forEach((path) => {
          const man = cur.manual[path] || {}, vals = tGet(cur, path) || {};
          const src = INV_ORDER.find((x) => man[x] && String(vals[x] || "").trim());
          if (src && cur.langs.some((x) => !man[x] && !String(vals[x] || "").trim())) schedule(path, vals[src]);
        });
      };
      useEffect(() => {
        const added = d.langs.some((l) => prevLangs.current.indexOf(l) < 0);
        prevLangs.current = d.langs;
        if (added && autoOn) fillMissing();
      }, [d.langs]);
      useEffect(() => { if (autoOn) fillMissing(); }, [autoOn]);

      const toggleLang = (l) => setD((o) => {
        const has = o.langs.indexOf(l) >= 0;
        if (has && o.langs.length === 1) return o;
        const next = (has ? o.langs.filter((x) => x !== l) : o.langs.concat([l])).sort((a, b) => INV_ORDER.indexOf(a) - INV_ORDER.indexOf(b));
        return Object.assign({}, o, { langs: next });
      });
      const setKind = (k) => setD((o) => (o.kind === k ? o : Object.assign({}, o, { kind: k, items: o.items.map((it) => Object.assign({}, it, { unit: 0 })) })));
      const swap = () => setD((o) => {
        const manual = {};
        Object.keys(o.manual).forEach((k) => { manual[k.indexOf("seller.") === 0 ? "buyer." + k.slice(7) : k.indexOf("buyer.") === 0 ? "seller." + k.slice(6) : k] = o.manual[k]; });
        return Object.assign({}, o, { seller: o.buyer, buyer: o.seller, manual });
      });
      const addItem = () => setD((o) => Object.assign({}, o, { items: o.items.concat([invItemEmpty()]) }));
      const delItem = (id) => setD((o) => Object.assign({}, o, { items: o.items.length > 1 ? o.items.filter((x) => x.id !== id) : [invItemEmpty()] }));

      const m = invModel(d);
      const units = svc ? INV_UNITS_SVC : INV_UNITS;
      const fileBase = (svc ? "invoice-services-" : "invoice-") + (String(d.no || "draft").replace(/[^\w\-]+/g, "_") || "draft");
      const doWord = () => {
        try { invSave(invoiceDocxBytes(d), "application/vnd.openxmlformats-officedocument.wordprocessingml.document", fileBase + ".docx"); flash("Сохранено: " + fileBase + ".docx"); }
        catch (e) { flash("Word не сохранился в этом окне — откройте сайт по прямой ссылке"); }
      };
      const doHtml = () => {
        try {
          const page = "<!DOCTYPE html><html lang=\"" + m.L[0] + "\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>" + fileBase + "</title><style>body{margin:0;padding:24px;background:#f3f0ea}" + INV_CSS_ALL + "@media print{body{padding:0;background:#fff}@page{size:A4;margin:12mm}}</style></head><body>" + (docRef.current ? docRef.current.outerHTML : "") + "</body></html>";
          invSave(page, "text/html;charset=utf-8", fileBase + ".html");
          flash("Сохранено: " + fileBase + ".html");
        } catch (e) { flash("Скачивание недоступно в этом окне"); }
      };
      const doPrint = () => {
        const html = document.documentElement;
        const done = () => { html.classList.remove("print-inv"); window.removeEventListener("afterprint", done); };
        html.classList.add("print-inv");
        window.addEventListener("afterprint", done);
        setTimeout(() => { try { window.print(); } catch (e) { done(); flash("Печать недоступна в этом окне"); } }, 60);
      };
      const doCopy = async () => { const ok = await copyText(invoiceText(d)); flash(ok ? "Текст инвойса скопирован" : "Не удалось скопировать"); };

      const TABS_INV = [["doc", "Документ"], ["seller", svc ? "Исполнитель" : "Продавец"], ["buyer", svc ? "Заказчик" : "Покупатель"], ["items", svc ? "Услуги" : "Товары"], ["info", "Информация"]];
      const inp = (value, onChange, extra) => (<input className="fld" value={value} onChange={(e) => onChange(e.target.value)} {...(extra || {})} />);
      const seg = (on) => "rounded-lg py-2 text-[13px] font-semibold transition-all " + (on ? "btn-dark" : "btn-ghost");
      const PH = {
        name: { ru: "ООО «Ромашка»", en: "Romashka LLC", zh: "广州恒达机械有限公司" },
        address: { ru: "123112, г. Москва, ул. Тверская, д. 7, офис 12", en: "No. 88 Huangpu Avenue, Guangzhou", zh: "广东省广州市天河区黄埔大道88号" },
        country: { ru: "Россия", en: "China", zh: "中国" },
        bank: { ru: "АО «Банк»", en: "Bank of China, Guangzhou Branch", zh: "中国银行广州分行" },
        bankAddress: { ru: "г. Москва", en: "Guangzhou, China", zh: "中国广东省广州市" },
        contact: { ru: "Иванов Иван, +7 900 000-00-00", en: "Li Wei, +86 20 0000 0000", zh: "李伟，+86 20 0000 0000" },
      };

      return (
        <section id="invoice" className="slide">
          <style>{INV_CSS_ALL}</style>
          <div className="wrap w-full">
            <Head badge="Конструктор инвойса" icon={IcDoc} tone="vtb"
              title="Инвойс на одном, двух или трёх языках"
              text="Пишете поле на одном языке — остальные заполняются сами, прямо на этом компьютере, без отправки данных. Названия и контакты с кириллицы — транслитерация, российский адрес — в английском порядке, страны и города — по словарю, описания — встроенным переводчиком браузера. Любое значение можно поправить руками, дальше оно не перезапишется." />

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-3 items-start">
              <div className="rise lg:col-span-5">
                <div className="rounded-2xl card pad">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                    <div className="text-[14px] font-semibold ink">Что оформляем</div>
                    <div className="flex items-center gap-3">
                      <button onClick={() => { setD(Object.assign(invDemo(d.kind), { langs: d.langs })); flash("Подставлен пример"); }} className="inline-flex items-center gap-1 text-[12.5px] ink-2 hover:ink"><IcEdit size={13} />пример</button>
                      <button onClick={() => { setD(invBlank(d.kind, d.langs)); setTab("doc"); flash("Форма очищена"); }} className="inline-flex items-center gap-1 text-[12.5px] ink-2 hover:ink"><IcRefresh size={13} />очистить</button>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-1.5 mb-3">
                    <button onClick={() => setKind("goods")} className={seg(!svc)}>Товары</button>
                    <button onClick={() => setKind("services")} className={seg(svc)}>Услуги</button>
                  </div>

                  <div className="text-[12.5px] font-semibold ink mb-1.5">Языки документа</div>
                  <div className="grid grid-cols-4 gap-1.5 mb-2">
                    {INV_LANGS.map((l) => {
                      const on = d.langs.indexOf(l.id) >= 0;
                      return (<button key={l.id} onClick={() => toggleLang(l.id)} aria-pressed={on} className={seg(on)}>{on && <IcCheck size={12} className="inline-block mr-1 -mt-0.5" />}{l.label}</button>);
                    })}
                    <button onClick={() => upd({ langs: ["ru", "en", "zh"] })} className={"rounded-lg py-2 text-[13px] font-semibold transition-all " + (d.langs.length === 3 ? "btn-red" : "btn-ghost")}>Все три</button>
                  </div>
                  <button onClick={() => setAutoOn((v) => !v)} className="w-full flex items-center gap-2 rounded-lg px-3 py-2 mb-3 text-left"
                    style={autoOn ? { background: "rgba(10,40,150,0.06)", border: "1px solid rgba(10,40,150,0.22)" } : { background: "#fbf8f4", border: "1px solid var(--line-2)" }}>
                    <span className="inline-flex items-center justify-center w-5 h-5 rounded shrink-0" style={autoOn ? { background: "var(--vtb)" } : { border: "1px solid var(--line)", background: "#fff" }}>{autoOn && <IcCheck size={12} stroke="#fff" />}</span>
                    <span className="min-w-0">
                      <span className="block text-[13px] font-semibold ink">Автозаполнение других языков</span>
                      <span className="block text-[11.5px] ink-3 leading-snug">{mtState === "no-mt" ? "Названия, контакты, адреса, страны и города заполняются. Описания в этом браузере переводить нечем — впишите их сами или откройте сайт в Chrome." : mtState === "mt-fail" ? "Встроенный переводчик не справился с последним текстом — впишите его вручную." : "Всё считается на этом компьютере, данные никуда не отправляются. Счёт, SWIFT и ИНН не переводятся."}</span>
                    </span>
                  </button>

                  <div className="flex flex-wrap gap-1.5 mb-3 pb-3" style={{ borderBottom: "1px solid var(--line-2)" }}>
                    {TABS_INV.map((t) => (<button key={t[0]} onClick={() => setTab(t[0])} className={"rounded-lg px-3 py-1.5 text-[13px] font-medium whitespace-nowrap transition-all " + (tab === t[0] ? "btn-dark" : "btn-ghost")}>{t[1]}</button>))}
                  </div>

                  {tab === "doc" && (
                    <div className="grid grid-cols-2 gap-2">
                      <Field label="Номер инвойса">{inp(d.no, (v) => upd({ no: v }), { placeholder: "INV-2026-001" })}</Field>
                      <Field label="Дата"><input type="date" className="fld" value={d.date} onChange={(e) => upd({ date: e.target.value })} /></Field>
                      <Field label="Номер контракта">{inp(d.contractNo, (v) => upd({ contractNo: v }), { placeholder: "CN-RU/2026-01" })}</Field>
                      <Field label="Дата контракта"><input type="date" className="fld" value={d.contractDate} onChange={(e) => upd({ contractDate: e.target.value })} /></Field>
                      <Field label="Валюта"><select className="fld" value={d.currency} onChange={(e) => upd({ currency: e.target.value })}>{Object.keys(INV_CUR).map((c) => <option key={c} value={c}>{c}</option>)}</select></Field>
                      <Field label="Условия оплаты"><select className="fld" value={d.pay} onChange={(e) => upd({ pay: parseInt(e.target.value, 10) })}>{INV_PAY.map((p, i) => <option key={i} value={i}>{p.ru}</option>)}</select></Field>
                      {!svc && <Field label="Incoterms 2020"><select className="fld" value={d.incoterm} onChange={(e) => upd({ incoterm: e.target.value })}>{INCOTERMS.map((x) => <option key={x} value={x}>{x}</option>)}</select></Field>}
                      {!svc && <Field label="Страна происхождения"><select className="fld" value={d.origin} onChange={(e) => upd({ origin: parseInt(e.target.value, 10) })}>{INV_ORIGIN.map((o, i) => <option key={i} value={i}>{o.ru} / {o.en}</option>)}</select></Field>}
                      <div className="col-span-2">
                        {svc
                          ? <MLInput d={d} path="svcPlace" label="Место оказания услуг" onType={onType} hows={hows} busy={busy.svcPlace} ph={{ ru: "Шанхай, Китай", en: "Shanghai, China", zh: "中国上海" }} />
                          : <MLInput d={d} path="incPlace" label="Место поставки (к Incoterms)" onType={onType} hows={hows} busy={busy.incPlace} ph={{ ru: "Шанхай", en: "Shanghai", zh: "上海" }} />}
                      </div>
                    </div>
                  )}

                  {(tab === "seller" || tab === "buyer") && (
                    <div className="space-y-2.5">
                      <div className="flex items-center justify-between gap-2">
                        <div className="text-[12.5px] ink-3">{tab === "seller" ? (svc ? "Кто оказывает услугу и получает деньги" : "Кто выставляет инвойс и получает деньги") : (svc ? "Кто заказывает и оплачивает" : "Кто оплачивает")}</div>
                        <button onClick={swap} className="inline-flex items-center gap-1 text-[12.5px] ink-2 hover:ink shrink-0"><IcSwap size={13} />поменять стороны</button>
                      </div>
                      <div className="text-[11.5px] ink-3 leading-snug rounded-lg px-2.5 py-1.5" style={{ background: "#fbf8f4", border: "1px solid var(--line-2)" }}>Английское название и адрес китайской компании из иероглифов не выводятся — впишите их из контракта или банковских реквизитов. Иначе платёж могут вернуть из-за несовпадения имени получателя.</div>
                      {[["name", "Наименование компании"], ["address", "Адрес"], ["country", "Страна"]].map((f) => (
                        <MLInput key={f[0]} d={d} path={tab + "." + f[0]} label={f[1]} onType={onType} hows={hows} busy={busy[tab + "." + f[0]]} ph={PH[f[0]]} />
                      ))}
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <Field label="ИНН / рег. номер">{inp(d[tab].taxId, (v) => updParty(tab, "taxId", v))}</Field>
                        <Field label="SWIFT">{inp(d[tab].swift, (v) => updParty(tab, "swift", v))}</Field>
                        <Field label="Счёт / IBAN">{inp(d[tab].account, (v) => updParty(tab, "account", v))}</Field>
                      </div>
                      {[["bank", "Банк"], ["bankAddress", "Адрес банка"], ["contact", "Контактное лицо и телефон"]].map((f) => (
                        <MLInput key={f[0]} d={d} path={tab + "." + f[0]} label={f[1]} onType={onType} hows={hows} busy={busy[tab + "." + f[0]]} ph={PH[f[0]]} />
                      ))}
                    </div>
                  )}

                  {tab === "items" && (
                    <div className="space-y-2">
                      {d.items.map((it, i) => (
                        <div key={it.id} className="rounded-xl card-soft p-2.5">
                          <div className="flex items-center justify-between mb-1.5">
                            <div className="text-[12.5px] font-semibold ink">{svc ? "Услуга" : "Позиция"} {i + 1}</div>
                            <button onClick={() => delItem(it.id)} className="inline-flex items-center gap-1 text-[12px] ink-3 hover:ink"><IcX size={12} />удалить</button>
                          </div>
                          <div className="mb-1.5">
                            <MLInput d={d} path={"item:" + it.id + ":desc"} label="Описание" onType={onType} hows={hows} busy={busy["item:" + it.id + ":desc"]}
                              ph={svc ? { ru: "Организация таможенного оформления", en: "Customs clearance services", zh: "报关服务" } : { ru: "Станок токарный с ЧПУ", en: "CNC lathe machine", zh: "数控车床" }} />
                          </div>
                          <div className="grid grid-cols-4 gap-1.5">
                            {svc
                              ? <Field label="Период">{inp(it.period, (v) => updItem(it.id, { period: v }), { placeholder: "08.2026" })}</Field>
                              : <Field label="Код ТН ВЭД">{inp(it.hs, (v) => updItem(it.id, { hs: v }), { placeholder: "8458110000" })}</Field>}
                            <Field label="Кол-во"><input type="number" inputMode="decimal" min="0" className="fld num" value={it.qty} onChange={(e) => updItem(it.id, { qty: e.target.value })} /></Field>
                            <Field label="Ед."><select className="fld" value={it.unit} onChange={(e) => updItem(it.id, { unit: parseInt(e.target.value, 10) })}>{units.map((u, k) => <option key={k} value={k}>{u.ru} / {u.en}</option>)}</select></Field>
                            <Field label={"Цена, " + d.currency}><input type="number" inputMode="decimal" min="0" className="fld num" value={it.price} onChange={(e) => updItem(it.id, { price: e.target.value })} /></Field>
                          </div>
                          <div className="text-right text-[12px] ink-3 mt-1 num">сумма {m.money(m.rows[i] ? m.rows[i].sum : 0)} {d.currency}</div>
                        </div>
                      ))}
                      <div className="flex items-center justify-between gap-2">
                        <button onClick={addItem} className="inline-flex items-center gap-1.5 rounded-lg btn-ghost px-3 py-2 text-[13px] font-medium">+ {svc ? "добавить услугу" : "добавить позицию"}</button>
                        <div className="text-[13px] ink num">Итого <span className="font-bold">{m.money(m.total)} {d.currency}</span></div>
                      </div>
                    </div>
                  )}

                  {tab === "info" && (
                    <div className="space-y-2">
                      <MLInput d={d} path="info" label="Дополнительная информация" onType={onType} hows={hows} busy={busy.info} area
                        ph={{ ru: "Назначение платежа, банк-корреспондент, условия отгрузки…", en: "Purpose of payment, correspondent bank…", zh: "付款用途、中间行…" }} />
                      <div className="text-[12px] ink-3">Пустые поля в документ не попадают.</div>
                    </div>
                  )}
                </div>
              </div>

              <div className="rise lg:col-span-7 lg:sticky lg:top-3" style={{ transitionDelay: "60ms" }}>
                <div className="rounded-2xl card pad">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-2.5">
                    <div className="flex items-center gap-2 min-w-0 flex-wrap">
                      <IcDoc size={17} style={{ color: "var(--vtb)" }} />
                      <div className="text-[14px] font-semibold ink">{svc ? "Инвойс за услуги" : "Инвойс"} · {d.langs.map(langShort).join(" + ")}</div>
                      {msg && <span className="text-[12px] font-medium" style={{ color: "var(--green)" }}>{msg}</span>}
                    </div>
                    <div className="flex flex-wrap gap-1.5">
                      <button onClick={doWord} className="inline-flex items-center gap-1.5 rounded-full btn-red px-3.5 py-2 text-[12.5px] font-semibold"><IcDoc size={14} />Word</button>
                      <button onClick={doPrint} className="inline-flex items-center gap-1.5 rounded-full btn-dark px-3.5 py-2 text-[12.5px] font-medium"><IcFile size={14} />Печать / PDF</button>
                      <button onClick={doHtml} className="inline-flex items-center gap-1.5 rounded-full btn-ghost px-3.5 py-2 text-[12.5px] font-medium"><IcInflow size={14} />HTML</button>
                      <button onClick={doCopy} className="inline-flex items-center gap-1.5 rounded-full btn-ghost px-3.5 py-2 text-[12.5px] font-medium"><IcCopy size={14} />Текст</button>
                    </div>
                  </div>
                  <div className="rounded-xl sunken p-2 sm:p-3" style={{ maxHeight: "min(78vh, 980px)", overflowY: "auto" }}>
                    <InvoiceDoc d={d} docRef={docRef} />
                  </div>
                  <div className="text-[11.5px] ink-3 mt-2">«Word» — готовый .docx на А4 с полями 20/15 мм, таблицы и подписи на местах. «Печать / PDF» — системный диалог, там «Сохранить как PDF».</div>
                </div>
              </div>
            </div>
          </div>
          {printHost && ReactDOM.createPortal(<InvoiceDoc d={d} />, printHost)}
        </section>
      );
    }
    /* ================= КОНТАКТЫ ================= */
    function Contacts({ onPick }) {
      return (
        <section id="contacts" className="w-full py-8 md:py-10">
          <div className="wrap">
            <div className="rise rounded-2xl card emboss pad">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 items-center">
                <div className="lg:col-span-7">
                  <div className="mb-2"><Badge tone="red" icon={IcZap}>Следующий шаг</Badge></div>
                  <h2 className="text-[22px] sm:text-[28px] font-semibold tracking-tight ink mb-2" style={{ letterSpacing: "-0.03em" }}>Подберу схему под вашу сделку</h2>
                  <p className="text-[13.5px] ink-2 leading-relaxed max-w-2xl">Клиринг, Bank of Dandong, прямой платёж или связка через агента — выбор зависит от суммы, страны, товара и сроков. Пришлите контракт, посчитаю точные цифры. Тарифы держим до {PROMO_UNTIL}.</p>
                  <div className="flex flex-wrap gap-2 mt-3">
                    <Ext href={TG} className="flex items-center gap-2 rounded-full btn-red px-5 py-2.5 font-medium text-[14px]">Telegram<IcArrow size={16} /></Ext>
                    <Ext href={PHONE} title={PHONE_TITLE} className="flex items-center gap-2 rounded-full btn-ghost px-5 py-2.5 font-medium text-[14px]"><IcPhone size={16} />{PHONE_DISPLAY}</Ext>
                    <Jump to="calc" className="flex items-center gap-2 rounded-full btn-ghost px-5 py-2.5 font-medium text-[14px]"><IcCalc size={16} />Калькулятор</Jump>
                  </div>
                </div>
                <div className="lg:col-span-5">
                  <WorkHours />
                  <div className="hidden sm:grid grid-cols-2 lg:grid-cols-3 gap-1.5 mt-2">
                    {TABS.map((t) => (
                      <button key={t.id} onClick={() => onPick(t.id)} className="tab">
                        <div className="flex items-center gap-1.5">
                          <t.Ic size={15} className="shrink-0" style={{ color: "var(--red)" }} />
                          <span className="text-[12.5px] font-semibold ink leading-tight">{t.short}</span>
                          <span className="ml-auto text-[12px] font-bold num" style={{ color: "var(--red)" }}>{t.price}</span>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
              <div className="mt-4 pt-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-[12px] ink-3" style={{ borderTop: "1px solid var(--line-2)" }}>
                <div className="flex items-center gap-3 flex-wrap">
                  <span className="flex items-center gap-1.5"><IcGlobe size={14} style={{ color: "var(--red)" }} /><span className="font-semibold ink">Евгений Демин</span> · международные расчёты</span>
                  <button onClick={() => { try { location.reload(); } catch (e) {} }} className="inline-flex items-center gap-1 ink-3 hover:ink"><IcLock size={12} />закрыть доступ</button>
                </div>
                <div>Расчёты ориентировочные. Финальные условия фиксируются перед сделкой.</div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    /* ================= ПРИЛОЖЕНИЕ ================= */
    function App() {
      const [tab, setTab] = useState("import");
      const pick = (id) => { setTab(id); setTimeout(() => goTo(null, "calc"), 30); };
      useEffect(() => {
        const els = Array.prototype.slice.call(document.querySelectorAll(".rise"));
        if (!("IntersectionObserver" in window)) { els.forEach((el) => el.classList.add("in")); return; }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
        }, { threshold: 0.05, rootMargin: "0px 0px -4% 0px" });
        els.forEach((el) => io.observe(el));
        return () => io.disconnect();
      }, []);
      return (
        <div className="app-zoom">
          <Hero onPick={pick} />
          <Promo onPick={pick} />
          <Pressure onPick={pick} />
          <CalcHub tab={tab} setTab={setTab} />
          <KpBuilder />
          <InvoiceBuilder />
          <Contacts onPick={pick} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Gate><App /></Gate>);
  </script>

    (function () {
      var src = document.getElementById("app-src").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      (0, eval)(out);
    })();
  </script>
