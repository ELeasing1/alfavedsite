    }

    function BkGroupHead({ k, n }) {
      const K = BK_KIND[k] || BK_KIND.agent;
      return (
        <div className="bk-ghead" style={{ background: K.color + "0f", borderTop: "2px solid " + K.color }}>
          <span className="t" style={{ color: K.color }}>{K.head}</span>
          <span className="n" style={{ color: K.color }}>{nf0.format(n)}</span>
          <span className="d">{K.desc}</span>
        </div>
      );
    }

    /* сообщение со списком банков по текущей выборке: страны по алфавиту, внутри — группы маршрута */
    function bkCursText(r) {
      const D = r.route.D, P = r.route.P;
      const s = (a) => a.map(curSign).join(", ");
      if (D.length && P.length) return "напрямую: " + s(D) + "; через прокси: " + s(P);
      if (D.length || P.length) return "валюта: " + s(D.concat(P));
      return "";
    }
    function bkListText(rows, title, detail, PU) {
      const L = [];
      L.push("Банки-получатели" + (title ? ": " + title : ""));
      L.push("Список Альфа-Банка" + (BK.asOf ? " на " + BK.asOf : "") + " — " + nf0.format(rows.length) + " " + bkPlur(rows.length, "банк", "банка", "банков"));
      const byC = {};
      rows.forEach((r) => { (byC[r.country] = byC[r.country] || []).push(r); });
      Object.keys(byC).sort((a, b) => a.localeCompare(b, "ru")).forEach((c) => {
        const arr = byC[c];
        L.push("");
        L.push(c.toUpperCase() + (countryCurText(c) ? " (" + countryCurText(c) + ")" : "") + " — " + nf0.format(arr.length));
        const order = bkSecIsRu(BK.sections[arr[0].sec]) ? BK_ORDER_RU : BK_ORDER_FX;
        order.forEach((k) => {
          const g = arr.filter((r) => r.g === k).sort((a, b) => a.name.localeCompare(b.name, "ru"));
          if (!g.length) return;
          L.push(BK_KIND[k].head + " (" + g.length + "):");
          g.forEach((r) => {
            const cur = bkCursText(r);
            L.push("• " + r.name + (r.swift ? " — SWIFT " + r.swift : "") + (cur ? " — " + cur : ""));
            if (!detail) return;
            if (r.cm) L.push("   " + r.cm.replace(/\s*\n+\s*/g, " ").trim());
            const t = bkTariff(r, PU);
            if (t.lines.length) L.push("   Комиссия за перевод: " + t.lines.map(tfLineText).join("; ") + (t.guess ? " — валюта в списке не указана" : ""));
          });
        });
      });
      const hasFx = rows.some((r) => !bkSecIsRu(BK.sections[r.sec]));
      L.push("");
      if (hasFx) L.push("Прямой платёж — Альфа отправляет его напрямую в банк получателя. Прокси-маршрут — через банк-корреспондент в РФ, обычно в местной валюте и только по несанкционным сделкам.");
      L.push("SWIFT — первые 6 знаков кода.");
      if (detail && hasFx) {
        const f = favkRule(PU, "4.1");
        L.push("Комиссии — по пакету услуг " + puName(PU) + " Альфа-Банка. К переводу добавляется валютный контроль " + pct2(f.pct) + ", от " + money(f.min) + " (+ НДС), и конвертация, если покупаете валюту за рубли. Комиссии банков-корреспондентов — отдельно.");
        if (rows.some((r) => CN_PROMO[sw6(r.swift)])) L.push("Акция: юани в Bank of Dandong и Shandong Changyi Rural Commercial Bank — 0,8%, от 3 000 ₽.");
      }
      return L.join("\n");
    }

    const BK_PAGE = 120;
    /* вкладка «Банки»: «Зарубежные» / «Юани по РФ», поиск, страны, группы маршрута */
    function BanksPage({ active }) {
      const puP = usePu().P;
      const [q, setQ] = useState("");
      const [sec, setSec] = useState(BK.fxSec);
      const [grp, setGrp] = useState("");
      const [country, setCountry] = useState("");
      const [limit, setLimit] = useState(BK_PAGE);
      const [openId, setOpenId] = useState(null);
      const [help, setHelp] = useState(false);
      const [copied, setCopied] = useState(null);
      const [copyOpen, setCopyOpen] = useState(false);
      const [copyMsg, setCopyMsg] = useState("");
      const [copyFallback, setCopyFallback] = useState("");
      const inputRef = useRef(null), topRef = useRef(null), moreRef = useRef(null);

      /* открыли из другого места — с поиском, разделом, группой или страной */
      useEffect(() => {
        const f = (e) => {
          const d = (e && e.detail) || {};
          setQ((old) => (d.q ? d.q : d.grp || d.country ? "" : old));
          if (typeof d.sec === "number" && d.sec >= 0) { setSec(d.sec); setCountry(""); }
          setGrp(d.grp || "");
          if (d.country) setCountry(d.country);
          if (d.focus) setTimeout(() => { try { inputRef.current.focus(); inputRef.current.select(); } catch (er) {} }, 60);
        };
        window.addEventListener("banks:open", f);
        return () => window.removeEventListener("banks:open", f);
      }, []);
      /* на компьютере курсор сразу в поиске */
      useEffect(() => {
        if (!active) return;
        let t = null;
        try { if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) t = setTimeout(() => { try { inputRef.current.focus({ preventScroll: true }); } catch (e) {} }, 60); } catch (e) {}
        return () => clearTimeout(t);
      }, [active]);

      const ru = bkSecIsRu(BK.sections[sec]);
      const order = ru ? BK_ORDER_RU : BK_ORDER_FX;
      const qq = useMemo(() => bkQuery(q), [q]);
      const hits = useMemo(() => (qq.toks.length ? BK.rows.filter((r) => bkHit(r, qq.toks)) : BK.rows), [qq]);
      const inSec = useMemo(() => hits.filter((r) => r.sec === sec), [hits, sec]);
      const ctys = useMemo(() => { const c = {}; BK.rows.forEach((r) => { if (r.sec === sec) c[r.country] = (c[r.country] || 0) + 1; }); return c; }, [sec]);
      const base = useMemo(() => (country ? inSec.filter((r) => r.country === country) : inSec), [inSec, country]);
      const cnt = useMemo(() => { const c = {}; base.forEach((r) => { c[r.g] = (c[r.g] || 0) + 1; }); return c; }, [base]);
      const secHits = useMemo(() => { const c = {}; hits.forEach((r) => { if (!country || r.country === country || r.sec !== sec) c[r.sec] = (c[r.sec] || 0) + 1; }); return c; }, [hits, country, sec]);
      const list = useMemo(() => {
        const l = grp ? base.filter((r) => r.g === grp) : base.slice();
        if (qq.toks.length) {
          const sc = {};
          l.forEach((r) => { sc[r.id] = bkScore(r, qq.toks); });
          l.sort((a, b) => (a.ord - b.ord) || (sc[a.id] - sc[b.id]));
        }
        return l;
      }, [base, grp, qq]);
      const otherSec = BK.sections.map((s, i) => i).filter((i) => i !== sec && (secHits[i] || 0) > 0);

      useEffect(() => {
        setLimit(BK_PAGE); setOpenId(null);
        try { const el = topRef.current; if (el && el.getBoundingClientRect().top < 0) el.scrollIntoView({ block: "start" }); } catch (e) {}
      }, [q, sec, country, grp]);
      useEffect(() => {
        if (!active || !moreRef.current || !("IntersectionObserver" in window)) return;
        const io = new IntersectionObserver((es) => { if (es[0] && es[0].isIntersecting) setLimit((n) => n + BK_PAGE); }, { rootMargin: "600px 0px" });
        io.observe(moreRef.current);
        return () => io.disconnect();
      }, [active, list, limit]);

      const goCalc = (id, opts) => openCalc(id, opts);
      const goTariff = (cat) => openTariff(cat);
      const copySwift = async (sw) => { const ok = await copyText(sw); setCopied(ok ? sw : null); setTimeout(() => setCopied(null), 1800); };
      const filtered = !!(q || country || grp);
      const reset = () => { setQ(""); setCountry(""); setGrp(""); };
      const pickSec = (i) => { setSec(i); setGrp(""); setCountry(""); };
      /* название выборки для сообщения: вкладка, страна, группа, поиск */
      const selTitle = [bkSecLabel(BK.sections[sec]), country ? countryLabel(country) : "", grp ? BK_KIND[grp].head : "", q.trim() ? "поиск «" + q.trim() + "»" : ""].filter(Boolean).join(" · ");
      const doCopyList = async (detail) => {
        const text = bkListText(list, selTitle, detail, puP);
        const ok = await copyText(text);
        setCopyFallback(ok ? "" : text);
        setCopyMsg(ok ? "Скопировано: " + nf0.format(list.length) + " " + bkPlur(list.length, "банк", "банка", "банков") + ". Можно вставлять в сообщение." : "Браузер не дал скопировать — выделите текст ниже и нажмите Ctrl+C.");
        if (ok) setTimeout(() => { setCopyMsg(""); setCopyOpen(false); }, 2200);
      };

      /* строки списка с заголовками групп */
      const rowsOut = [];
      let lastG = null;
      list.slice(0, limit).forEach((r) => {
        if (r.g !== lastG) { rowsOut.push(<BkGroupHead key={"g-" + r.g} k={r.g} n={cnt[r.g] || 0} />); lastG = r.g; }
        rowsOut.push(<BankRow key={r.id} r={r} re={qq.re} on={openId === r.id}
          onToggle={() => setOpenId((v) => (v === r.id ? null : r.id))}
          goCalc={goCalc} goTariff={goTariff} copySwift={copySwift} copied={copied} />);
      });

      return (
        <div className="page">
          <div ref={topRef} style={{ scrollMarginTop: "calc(var(--top-h) + 8px)" }}>
            <div className="flex flex-wrap items-start justify-between gap-3 mb-2">
              <div className="min-w-0">
                <h1 className="h1">Банки получателей</h1>
                <p className="lead mt-1">{nf0.format(BK.count.all)} {bkPlur(BK.count.all, "банк", "банка", "банков")} из {BK.countries.length} {bkPlur(BK.countries.length, "страны", "стран", "стран")}{BK.asOf ? ", список на " + BK.asOf : ""}. Найдите банк поставщика — и сразу видно, каким путём пойдут деньги и сколько стоит перевод.</p>
              </div>
              <div className="flex items-center gap-2 shrink-0 relative">
                <button onClick={() => setHelp((h) => !h)} aria-pressed={help}
                  className={"h-10 px-3.5 rounded-full inline-flex items-center gap-1.5 text-[13px] " + (help ? "btn-dark" : "btn-ghost")}>
                  <IcInfo size={15} />Как читать
                </button>
                <button onClick={() => { setCopyOpen((o) => !o); setCopyMsg(""); setCopyFallback(""); }} aria-expanded={copyOpen} disabled={!list.length}
                  className={"h-10 px-3.5 rounded-full inline-flex items-center gap-1.5 text-[13px] " + (copyOpen ? "btn-dark" : "btn-ghost") + (list.length ? "" : " opacity-50")}
                  title="Скопировать список банков по текущей выборке">
                  <IcCopy size={15} />Скопировать список
                </button>
                {copyOpen && (
                  <div className="absolute right-0 top-[48px] z-30 w-[min(340px,calc(100vw-32px))] rounded-xl card p-3 text-left" style={{ boxShadow: "0 20px 50px -20px rgba(36,26,20,0.55)" }}>
                    <div className="text-[13.5px] font-semibold ink">Скопировать выборку · {nf0.format(list.length)} {bkPlur(list.length, "банк", "банка", "банков")}</div>
                    <div className="text-[12px] ink-3 mt-0.5 mb-2 leading-snug">{selTitle}. Готовое сообщение: банки по странам и группам. Выборку меняют вкладка, страна, группа и поиск.</div>
                    <button onClick={() => doCopyList(false)} className="w-full text-left rounded-lg btn-ghost px-3 py-2 mb-1.5">
                      <span className="block text-[13px] font-semibold ink">Кратко</span>
                      <span className="block text-[11.5px] ink-3">название, SWIFT, маршрут и валюта</span>
                    </button>
                    <button onClick={() => doCopyList(true)} className="w-full text-left rounded-lg btn-ghost px-3 py-2">
                      <span className="block text-[13px] font-semibold ink">Подробно</span>
                      <span className="block text-[11.5px] ink-3">плюс комментарий банка и комиссия «от и до» по пакету {puName(puP)}</span>
                    </button>
                    {copyMsg && <div className="text-[12px] mt-2 leading-snug" style={{ color: copyFallback ? "var(--red-ink)" : "var(--green)" }}>{copyMsg}</div>}
                    {copyFallback && <textarea readOnly value={copyFallback} onFocus={(e) => e.target.select()} autoFocus className="fld mt-2 text-[12px]" style={{ height: "160px", resize: "vertical" }} />}
                  </div>
                )}
              </div>
            </div>
            <Why className="mb-3"><b>Зелёный «Прямой платёж»</b> — деньги уйдут из нашего банка прямо в банк поставщика. <b>Фиолетовый «Прокси»</b> — через банк-посредник. <b>Красный «Не рекомендованы»</b> — платёж скорее всего вернётся, платите через агента. Значки валют у банка показывают, в чём платить: зелёные — напрямую, фиолетовые — через посредника. Нажмите на банк — увидите комментарий и комиссию по пакету клиента.</Why>
            {help && <BkHelp />}
          </div>

          <div className="bk-sticky">
            <div className="flex flex-col md:flex-row md:items-center gap-2">
              <div className="bk-tabs shrink-0 self-start" role="tablist">
                {BK.sections.map((s, i) => (
                  <button key={i} role="tab" aria-selected={sec === i} onClick={() => pickSec(i)} className={"bk-tab " + (sec === i ? "on" : "")}>
                    {bkSecLabel(s)}<span className="n">{nf0.format(qq.toks.length ? (secHits[i] || 0) : (BK.secN[i] || 0))}</span>
                  </button>
                ))}
              </div>
              <div className="relative flex-1 min-w-0">
                <IcSearch size={17} className="absolute left-3 top-1/2 -translate-y-1/2 ink-3 pointer-events-none" />
                <input ref={inputRef} type="text" value={q} onChange={(e) => setQ(e.target.value)}
                  onKeyDown={(e) => { if ((e.key === "Escape" || e.key === "Esc") && q) setQ(""); }}
                  placeholder="Название банка, SWIFT, страна или валюта"
                  autoComplete="off" spellCheck="false" enterKeyHint="search" aria-label="Поиск банка"
                  className="fld" style={{ paddingLeft: "38px", paddingRight: "42px", fontSize: "15px", height: "44px" }} />
                {q && (
                  <button onClick={() => { setQ(""); try { inputRef.current.focus(); } catch (e) {} }}
                    className="absolute right-1.5 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full flex items-center justify-center ink-3 hover:ink" aria-label="Очистить поиск"><IcX size={15} /></button>
                )}
              </div>
            </div>
            <div className="bk-scroll flex items-center gap-1.5 mt-2 pb-0.5">
              {Object.keys(ctys).length > 1 && (
                <select value={country} onChange={(e) => setCountry(e.target.value)} aria-label="Страна"
                  className="fld shrink-0" style={{ width: "auto", minWidth: "150px", height: "33px", padding: "0 30px 0 11px", fontSize: "12.5px", borderRadius: "999px" }}>
                  <option value="">Все страны</option>
                  {Object.keys(ctys).sort((a, b) => a.localeCompare(b, "ru")).map((c) => <option key={c} value={c}>{countryLabel(c)} · {ctys[c]}</option>)}
                </select>
              )}
              <button onClick={() => setGrp("")} className={"bk-chip " + (!grp ? "on" : "")} aria-pressed={!grp}>Все<span className="n">{nf0.format(base.length)}</span></button>
              {order.map((k) => (
                <button key={k} onClick={() => setGrp(grp === k ? "" : k)} className={"bk-chip " + (grp === k ? "on" : "")} aria-pressed={grp === k} title={BK_KIND[k].desc}>
                  <span className="bk-dot" style={{ background: BK_KIND[k].color }}></span>{BK_KIND[k].chip}<span className="n">{nf0.format(cnt[k] || 0)}</span>
                </button>
              ))}
              {filtered && <button onClick={reset} className="shrink-0 px-2 text-[12.5px] ink-3 hover:ink underline underline-offset-2">Сбросить</button>}
            </div>
          </div>

          <div className="rounded-2xl card overflow-hidden mt-2">
            {qq.toks.length > 0 && otherSec.length > 0 && list.length > 0 && (
              <div className="m-3 rounded-lg px-3 py-2 text-[12.5px] ink-2 flex flex-wrap items-center gap-2" style={{ background: "#f6f1ea", border: "1px solid var(--line)" }}>
                <IcInfo size={14} className="ink-3 shrink-0" />
                {otherSec.map((i) => (
                  <button key={i} onClick={() => pickSec(i)} className="underline underline-offset-2 hover:ink">Ещё {nf0.format(secHits[i])} во вкладке «{bkSecLabel(BK.sections[i])}»</button>
                ))}
              </div>
            )}
            {list.length > 0 && (
              <div className="bk-colhead bk-grid px-[17px] py-2 text-[11px] font-semibold uppercase tracking-wider ink-3">
                <span className="a-name">Банк и комментарий · {nf0.format(list.length)}</span><span className="a-cty">Страна</span><span className="a-sw">SWIFT</span><span className="a-st">{ru ? "Юани" : "Маршрут"}</span>
              </div>
            )}
            {rowsOut}
            {list.length > limit && (
              <div ref={moreRef} className="p-4 text-center">
                <button onClick={() => setLimit((n) => n + BK_PAGE)} className="rounded-full btn-ghost px-5 py-2 text-[13px]">Показать ещё, осталось {nf0.format(list.length - limit)}</button>
              </div>
            )}
            {list.length > 0 && list.length <= limit && (
              <div className="px-4 py-5 text-center text-[13px] ink-3 leading-relaxed max-w-2xl mx-auto">
                Нужного банка нет в списке? Значит, платежей в него было меньше трёх или не было за месяц, и прямой путь не проверен. Платите через агента за границей.
              </div>
            )}
            {!list.length && (
              <div className="p-5 sm:p-10 text-center max-w-xl mx-auto">
                <div className="w-12 h-12 mx-auto rounded-2xl sunken flex items-center justify-center mb-3"><IcSearch size={20} className="ink-3" /></div>
                {qq.toks.length > 0 && otherSec.length > 0 ? (
                  <React.Fragment>
                    <div className="text-[16px] font-semibold ink mb-1.5">Здесь пусто, но есть в другой вкладке</div>
                    <p className="text-[14px] ink-2 leading-relaxed mb-4">По запросу «{q.trim()}» банки нашлись в другом разделе.</p>
                    <div className="flex flex-wrap justify-center gap-2">
                      {otherSec.map((i) => (
                        <button key={i} onClick={() => pickSec(i)} className="rounded-full btn-dark px-5 py-2.5 text-[13.5px] font-medium">{bkSecLabel(BK.sections[i])} · {nf0.format(secHits[i])}</button>
                      ))}
                    </div>
                  </React.Fragment>
                ) : (grp || country) && inSec.length > 0 ? (
                  <React.Fragment>
                    <div className="text-[16px] font-semibold ink mb-1.5">С этими фильтрами пусто</div>
                    <p className="text-[14px] ink-2 leading-relaxed mb-4">{country ? "В стране «" + country + "» таких банков в списке нет." : "Таких банков в списке нет."} Выберите другую группу или страну.</p>
                    <button onClick={() => { setCountry(""); setGrp(""); }} className="rounded-full btn-dark px-5 py-2.5 text-[13.5px] font-medium">Показать без фильтров</button>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <div className="text-[16px] font-semibold ink mb-1.5">{q.trim() ? "«" + q.trim() + "» в списке нет" : "Ничего не найдено"}</div>
                    <p className="text-[14px] ink-2 leading-relaxed mb-4">Если банка нет в списке, платежей в него было меньше трёх или не было за отчётный месяц, и прямой путь не проверен. Платите через агента за границей.</p>
                    <div className="flex flex-wrap justify-center gap-2">
                      <button onClick={() => goCalc("import")} className="inline-flex items-center gap-1.5 rounded-full btn-red px-5 py-2.5 text-[13.5px] font-medium"><IcCalc size={15} />Посчитать через агента</button>
                      {filtered && <button onClick={reset} className="rounded-full btn-ghost px-5 py-2.5 text-[13.5px]">Сбросить поиск</button>}
                    </div>
                  </React.Fragment>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ================= САНКЦИИ: список банков для урока ================= */
    const BANKS = "ДОМ.РФ, Ак Барс, Уралсиб, Зенит, Приморье, Металлинвест, МТС, Синара, СДМ, ТКБ, Центр-инвест, Авто Финанс, Абсолют, Точка, Озон, РСХБ, Кубань Кредит, Яндекс, МСП, Росэксим, Почта Банк, Генбанк, Локо, Фора, Экспобанк, Аверс, Примсоцбанк, СНГБ, ББР, ЦентроКредит, Газэнергобанк, РосДорБанк, Траст, НРБ, Челиндбанк, Челябинвестбанк, Инго, Энерготрансбанк, Солидарность, Авангард, Меткомбанк, Экономбанк, Нацстандарт, Держава, Модульбанк, БыстроБанк, Хлынов, Севергазбанк, Ренессанс Кредит, Финсервис, Кузнецкбизнесбанк, БКС, Акцепт, Итуруп, Еврофинанс, Мир Бизнес, Инвестторгбанк, ПСКБ, РостФинанс, Раунд, Трансстройбанк, Москоммерцбанк, Энергобанк, Тольяттихимбанк, Финам, Кошелев, Прио-Внешторг, Цифра, Белгородсоцбанк, Оренбург, Объединённый Капитал, Форштадт, Татсоцбанк, НБД, Кредит Урал, Алмазэргиэнбанк, Сибсоцбанк, Юг-Инвест, НОКССБАНК, Левобережный, Русский Стандарт, УБРиР, Вайлдберриз, Бланк, СПб, Реалист, Агророс, Углеметбанк, Роял Кредит, АКИБАНК.";

    /* ================= СПРАВОЧНИК ПО ВЭД: ТРИ ПАКЕТА УСЛУГ =================
       Таблицы собираются из PUS (выше) под выбранный пакет. Что одинаково во всех трёх — записано один раз. Номера пунктов — как в тарифах. */
    /* строка таблицы: p — пункт, op — операция, s — пояснение, v — ставка, min / max, vat — «без учёта НДС» */
    const tr = (p, op, v, min, max, x) => Object.assign({ p: p, op: op, v: v || "", min: min || "", max: max || "" }, x || {});
    const C_STD = [
      { k: "p", t: "Пункт", w: "112px" },
      { k: "op", t: "Операция", w: "minmax(0, 2.6fr)" },
      { k: "v", t: "Ставка", w: "minmax(0, 1fr)" },
      { k: "min", t: "Мин.", w: "minmax(0, .85fr)" },
      { k: "max", t: "Макс.", w: "minmax(0, .85fr)" },
    ];
    const TF_CATS = [
      { id: "main", label: "Главное", Ic: IcZap },
      { id: "pu",   label: "Сравнить пакеты", Ic: IcScale },
      { id: "fx",   label: "Переводы в валюте", Ic: IcSend },
      { id: "cny",  label: "Юани в Китай", Ic: IcBank },
      { id: "rub",  label: "Рубли за рубеж", Ic: IcSwap },
      { id: "in",   label: "Зачисление и розыск", Ic: IcInflow },
      { id: "vk",   label: "Валютный контроль", Ic: IcShield },
      { id: "conv", label: "Конвертация", Ic: IcRefresh },
      { id: "acc",  label: "Валютные счета", Ic: IcLayers },
      { id: "docs", label: "Справки", Ic: IcDoc },
      { id: "cash", label: "Наличная валюта", Ic: IcTag },
      { id: "time", label: "Время приёма", Ic: IcClock },
      { id: "rules", label: "Общие правила", Ic: IcInfo },
    ];
    const ucf = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    /* ячейка тарифа перевода: { v: "0,25%", s: "мин. 45 $, макс. 225 $" } */

    /* ---- поиск по справочнику ---- */
    const tfNorm = (s) => String(s || "").toLowerCase().replace(/ё/g, "е");
    const tfCellText = (x) => (x == null ? "" : typeof x === "object" ? [x.v, x.s].join(" ") : String(x));
    const tfRowText = (r) => tfNorm(Object.keys(r).map((k) => (k === "vat" ? (r.vat ? "ндс" : "") : tfCellText(r[k]))).join(" "));
    /* окончание отрезаем: «справка» находит и «справки», «юань» — и «юани» */
    function tfTokens(q) { return tfNorm(q).split(/\s+/).filter(Boolean).slice(0, 6).map((t) => (t.length >= 4 && /[аяыиеоуюьй]$/.test(t) ? t.slice(0, -1) : t)); }
    function tfRe(toks) {
      if (!toks.length) return null;
      try { return new RegExp("(" + toks.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/е/g, "[её]")).join("|") + ")", "gi"); } catch (e) { return null; }
    }
    const tfHit = (text, toks) => toks.every((t) => text.indexOf(t) >= 0);

    /* strong — колонка ставки (синим, жирно), mono — SWIFT */
    function TfCell({ x, re, strong, mono }) {
      if (x == null || x === "") return null;
      if (typeof x === "object") return (<span><span className={strong ? "tf-v" : "font-semibold"}><Hl text={x.v} re={re} /></span>{x.s && <span className="tf-s"><Hl text={x.s} re={re} /></span>}</span>);
      if (mono) return <span className="tf-p" style={{ color: "var(--ink-2)", fontSize: "12.5px" }}><Hl text={x} re={re} /></span>;
      return <span className={strong ? "tf-v" : "num"}><Hl text={x} re={re} /></span>;
    }
    function TfTable({ cols, rows, re }) {
      const C = cols || C_STD;
      const tpl = C.map((c) => c.w).join(" ");
      return (
        <div className="tf-t" style={{ "--cols": tpl }}>
          <div className="tf-h">{C.map((c) => <span key={c.k}>{c.t}</span>)}</div>
          {rows.map((r, i) => (
            <div key={i} className="tf-r">
              {C.map((c) => {
                if (c.k === "p") return <span key="p" className="c-p tf-p"><Hl text={r.p || ""} re={re} /></span>;
                if (c.k === "op") return (
                  <span key="op" className="c-op min-w-0">
                    <Hl text={r.op} re={re} />{r.vat ? <span className="tf-vat" title="Без учёта НДС: НДС начисляется сверху">+ НДС</span> : null}
                    {r.s && <span className="tf-s" style={{ fontWeight: 400 }}><Hl text={r.s} re={re} /></span>}
                  </span>
                );
                const val = r[c.k];
                const empty = val == null || val === "";
                return (
                  <span key={c.k} className={"c-x min-w-0" + (empty ? " empty" : "")}>
                    {!empty && <span className="tf-lbl">{c.t}:</span>}
                    {empty ? <span className="ink-3 hidden md:inline">—</span> : <TfCell x={val} re={re} strong={c.k === "v" || c.k === "reg" || c.k === "urg"} mono={c.mono} />}
                  </span>
                );
              })}
            </div>
          ))}
        </div>
      );
    }
    function TfNotes({ notes, re, title }) {
      if (!notes || !notes.length) return null;
      return (
        <div className="rounded-xl card-soft p-3.5 sm:p-4">

          <ul className="tf-notes">{notes.map((n, i) => <li key={i}><Hl text={n} re={re} /></li>)}</ul>
        </div>
      );
    }
    function TfBlock({ b, re }) {
      return (
        <div>
          <div className="flex flex-wrap items-baseline gap-x-3 gap-y-0.5 mb-2">

    /* ================= ВАЛЮТЫ, КОТОРЫЕ РЕАЛЬНО ПРОХОДЯТ ЧЕРЕЗ НАШ БАНК =================
       Считаем по списку банков-получателей, поэтому всё обновляется вместе со списком:
       банк рекомендован (прямой или прокси) и в комментарии названа валюта — валюта проходит (d — напрямую, p — через прокси);
       банк рекомендован, но валюта не названа — валюта страны «под вопросом» (q). Доллары и евро сюда не попадают:
       банки Европы, Британии, Швейцарии, ОАЭ, Гонконга в списке «не рекомендованы». */
    const FX_LIVE = (function () {
      const m = {};
      const add = (c, r, k) => {
        const x = m[c] || (m[c] = { d: 0, p: 0, q: 0, n: 0, cty: {} });
        x[k]++; x.n++;
        const y = x.cty[r.country] || (x.cty[r.country] = { d: 0, p: 0, q: 0 });
        y[k]++;
      };
      BK.rows.forEach((r) => {
        if (bkIsRu(r) || r.g === "agent" || r.g === "cond") return;
        const D = r.route.D, P = r.route.P;
        D.forEach((c) => add(c, r, "d"));
        P.filter((c) => D.indexOf(c) < 0).forEach((c) => add(c, r, "p"));
        if (!D.length && !P.length) { const nat = COUNTRY_CUR[r.country]; if (nat && nat !== "EUR") add(nat, r, "q"); }
      });
      return m;
    })();
    const fxLiveN = (c) => (FX_LIVE[c] ? FX_LIVE[c].d + FX_LIVE[c].p : 0);
    /* рубли первыми, дальше подтверждённые валюты, потом «под вопросом»; юани — в отдельном расчёте */
    const TC_CUR = Object.keys(FX_LIVE).filter((c) => c !== "CNY").sort((a, b) =>
      ((b === "RUB") - (a === "RUB")) || ((fxLiveN(b) > 0) - (fxLiveN(a) > 0)) || (FX_LIVE[b].n - FX_LIVE[a].n));
    const TC_GO = TC_CUR.filter((c) => fxLiveN(c) > 0), TC_ASK = TC_CUR.filter((c) => fxLiveN(c) === 0);
    /* привычные валюты, для которых в списке нет ни одного рабочего банка */
    const FX_NO_GO = ["USD", "EUR", "GBP", "CHF", "AED", "HKD", "JPY"].filter((c) => !FX_LIVE[c]);
    /* «Казахстан — 20 банков» */
    const fxCtyList = (c) => { const x = FX_LIVE[c]; return x ? Object.keys(x.cty).sort((a, b) => (x.cty[b].d + x.cty[b].p + x.cty[b].q) - (x.cty[a].d + x.cty[a].p + x.cty[a].q)) : []; };

    /* рубли за рубеж (п. 2.1.2.26): ставка зависит от корсчёта банка-получателя в РФ; одинаково во всех пакетах */

      { id: "CN_MKB", n: "Китай, Лаос — корсчёт в ПАО МКБ", pct: 0.031, min: 15000, p: "2.1.2.26.3" },

    /* поле «объём конвертаций за месяц» — только для «Активных расчётов» */
    function ConvVolume({ prev, setPrev, cur, setCur }) {
      return (
        <div className="rounded-lg px-3 py-2.5" style={{ background: "#f6f1ea", border: "1px solid var(--line)" }}>
          <div className="text-[12.5px] font-semibold ink mb-1">Объём обменов валюты, $ — для ставки «Активных расчётов»</div>
          <div className="grid grid-cols-2 gap-2">
            <label className="block"><span className="block text-[11.5px] ink-3 mb-0.5">в этом месяце уже</span><input type="number" inputMode="decimal" min="0" className="fld num" value={cur} onChange={(e) => setCur(e.target.value)} placeholder="0" /></label>
            <label className="block"><span className="block text-[11.5px] ink-3 mb-0.5">в прошлом месяце</span><input type="number" inputMode="decimal" min="0" className="fld num" value={prev} onChange={(e) => setPrev(e.target.value)} placeholder="0" /></label>
          </div>
          <div className="text-[11.5px] ink-3 mt-1 leading-snug">На этом пакете ставка обмена зависит от того, сколько клиент меняет за месяц: чем больше, тем дешевле. Берётся больший объём — прошлого месяца или этого вместе с текущей покупкой.</div>
        </div>
      );
    }

    /* ================= НАГЛЯДНЫЕ КУСОЧКИ ДЛЯ ВСЕХ РАСЧЁТОВ ================= */
    /* «1,25 ₽ с каждых 100 ₽» — проценты, понятные без калькулятора */
    const per100 = (pct) => (Math.round(pct * 100) / 100).toFixed(2).replace(".", ",") + " ₽ с каждых 100 ₽";
    /* итог одной фразой, крупно */
    function Gist({ children }) {
      return <div className="rounded-xl px-4 py-3 mb-1 text-[15px] leading-relaxed ink" style={{ background: "#f7f4ef", border: "1px solid var(--line-2)" }}>{children}</div>;
    }
    /* из чего состоят комиссии — полоска с долями */
    const BAR_COL = ["#0a2896", "#c2352b", "#b07a22", "#1c7a4d", "#6a3fb5", "#827365"];
    function CostBar({ parts }) {
      const list = parts.filter((p) => p.v > 0.5);
      const sum = list.reduce((a, p) => a + p.v, 0);
      if (list.length < 2 || !sum) return null;
      return (
        <div className="mt-3">
          <div className="text-[13px] font-semibold ink mb-1.5">Из чего состоят комиссии</div>
          <div className="flex h-3 rounded-full overflow-hidden gap-[2px]" style={{ background: "var(--sunk)" }}>
            {list.map((p, i) => <span key={i} style={{ width: (p.v / sum * 100) + "%", background: BAR_COL[i % BAR_COL.length] }} title={p.l + ": " + rub(p.v)} />)}
          </div>
          <div className="flex flex-wrap gap-x-3.5 gap-y-1 mt-1.5 text-[12.5px] ink-2">
            {list.map((p, i) => <span key={i} className="inline-flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm shrink-0" style={{ background: BAR_COL[i % BAR_COL.length] }} />{p.l} <b className="num ink">{Math.round(p.v / sum * 100)}%</b></span>)}
          </div>
        </div>
      );
    }
    /* два варианта рядом: у кого переплата больше */
    function VsBars({ title, items }) {
      const max = Math.max.apply(null, items.map((x) => x.v).concat([1]));
      return (
        <div className="mt-2.5">
          {title && <div className="text-[12.5px] ink-3 mb-1">{title}</div>}
          <div className="space-y-1.5">
            {items.map((x, i) => (
              <div key={i}>
                <div className="flex items-baseline justify-between gap-2 text-[13px]"><span className="ink-2">{x.l}</span><b className="num" style={{ color: x.c }}>{rub(x.v)}</b></div>
                <div className="h-2.5 rounded-full mt-0.5" style={{ background: "var(--sunk)" }}><div className="h-full rounded-full" style={{ width: Math.max(2, x.v / max * 100) + "%", background: x.c }} /></div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ================= КАКОЙ ПАКЕТ ВЫГОДНЕЕ КЛИЕНТУ =================
       Месяц клиента на каждом пакете = комиссии за k таких платежей + обслуживание рублёвого счёта (+ счёта в валюте, если он нужен).
       cost(P, k) — комиссии банка за ОДИН такой платёж на пакете P, когда в месяц их k (от этого зависит ставка обмена на «Активных расчётах»). */
    const accFx = (P) => (P.acc.fxFirst != null ? P.acc.fxFirst : P.acc.fx);
    const PER_MONTH = [1, 2, 4, 10];
    const AB_RULES = "«Активный бизнес» — только для новых клиентов: компании или ИП не меньше 6 месяцев, выручка до 500 млн ₽ в год.";
    function PuAdvice({ cost, needFx }) {
      const { id } = usePu();
      const [k, setK] = useState(1);
      const rows = PU_IDS.map((pid) => {
        const P = PUS[pid];
        const comm = cost(P, k) * k;
        const fee = P.acc.rubM + (needFx ? accFx(P) : 0);
        return { pid: pid, P: P, comm: comm, fee: fee, total: comm + fee };
      });
      const pickMin = (arr) => arr.reduce((a, b) => (b.total < a.total - 0.5 ? b : a));
      const best = pickMin(rows);
      const old = pickMin(rows.filter((r) => r.pid !== "ab"));
      const worst = rows.reduce((a, b) => (b.total > a.total ? b : a));
      const name = (r) => "«" + r.P.name + "»";
      const times = k + " " + bkPlur(k, "платёж", "платежа", "платежей");
      let say;
      if (best.pid === "ab") say = <span>выгоднее всего {name(best)} — <b className="ink">{rub(best.total)}</b> в месяц. Но он только для новых клиентов. Если клиент уже обслуживается в Альфе, лучше {name(old)} — {rub(old.total)} в месяц.</span>;
      else say = <span>выгоднее всего {name(best)} — <b className="ink">{rub(best.total)}</b> в месяц{worst.total - best.total >= 1 ? ", это на " + rub(worst.total - best.total) + " дешевле, чем " + name(worst) : ""}.</span>;
      return (
        <div className="rounded-2xl card pad" style={{ borderColor: "rgba(10,40,150,0.28)" }}>
          <div className="flex flex-wrap items-center justify-between gap-2 mb-1.5">
            <div className="text-[15.5px] font-semibold ink">Какой пакет выгоднее клиенту</div>
            <div className="flex items-center gap-1 text-[12.5px] ink-3" role="radiogroup" aria-label="Сколько таких платежей в месяц">
              <span className="mr-0.5">таких платежей в месяц:</span>
              {PER_MONTH.map((x) => <button key={x} role="radio" aria-checked={k === x} onClick={() => setK(x)} className={"min-w-[28px] px-1.5 py-0.5 rounded-md text-[12.5px] font-semibold " + (k === x ? "btn-dark" : "btn-ghost")}>{x}</button>)}
            </div>
          </div>
          <p className="text-[14px] ink-2 leading-relaxed mb-2.5">Если у клиента {times} такого размера в месяц, {say}</p>
          <div className="grid grid-cols-3 gap-1.5">
            {rows.map((r) => {
              const isBest = r.pid === best.pid;
              return (
                <div key={r.pid} className="rounded-xl px-2.5 py-2" style={isBest ? { background: "rgba(28,122,77,0.08)", border: "1px solid rgba(28,122,77,0.35)" } : { background: "#fbf8f4", border: "1px solid var(--line-2)" }}>
                  <div className="text-[12px] font-semibold ink leading-tight">{r.P.name}</div>
                  <div className="text-[16px] font-bold num mt-0.5" style={{ color: isBest ? "#166341" : "var(--ink)" }}>{rub(r.total)}</div>
                  <div className="text-[11px] ink-3 leading-snug mt-0.5">комиссии {rub(r.comm)} + счета {rub(r.fee)}</div>
                  <div className="flex flex-wrap gap-1 mt-1">
                    {isBest && <span className="tag" style={{ background: "#1c7a4d", color: "#fff" }}>выгоднее</span>}
                    {r.pid === id && <span className="tag" style={{ background: "rgba(10,40,150,0.08)", color: "var(--vtb)" }} title="Расчёт выше сделан по этому пакету">сейчас</span>}
                  </div>
                </div>
              );
            })}
          </div>
          <Why className="mt-2.5">Сложили всё, что клиент отдаст банку за месяц: комиссии за {times} и обслуживание рублёвого счёта{needFx ? " и счёта в валюте" : ""}. Меняется сумма или число платежей — меняется и лучший пакет. {AB_RULES} Пакет для расчёта выбирается вверху страницы.</Why>
        </div>
      );
    }
    /* расчёт, где пакет на цену не влияет (клиринг, экспорт) */
    function PuSame({ what }) {
      const cheap = PU_IDS.filter((k) => PUS[k].acc.rubM === Math.min.apply(null, PU_IDS.map((x) => PUS[x].acc.rubM)));
      return (
        <div className="rounded-2xl card pad">
          <div className="text-[15.5px] font-semibold ink mb-1">Какой пакет выгоднее клиенту</div>
          <p className="text-[14px] ink-2 leading-relaxed">{what} стоит одинаково на любом пакете — пакет на цену не влияет. Если клиенту нужен только этот платёж, подойдёт пакет с самым дешёвым рублёвым счётом: {cheap.map((k) => "«" + PUS[k].name + "»").join(" или ")} — {rub(PUS[cheap[0]].acc.rubM)} в месяц.</p>
          <Why className="mt-2">{AB_RULES} Если клиент ещё и покупает валюту или платит через наш банк — откройте тот расчёт: там пакет решает, и подсказка покажет лучший.</Why>
        </div>
      );
    }

    /* ================= ПЕРЕВОД ЧЕРЕЗ НАШ БАНК: ВАЛЮТЫ СНГ, РУБЛИ ЗА РУБЕЖ И ДРУГИЕ РАБОЧИЕ ВАЛЮТЫ ================= */
    /* все комиссии одного перевода по пакету P */
    function fxCost(P, o) {
      const isRub = o.cur === "RUB";
      const rub0 = o.A * o.R;
      const lines = [];
      if (isRub) {
        const b = TC_RUB.find((x) => x.id === o.rbank) || TC_RUB[0];
        lines.push({ l: "Перевод рублей за рубеж", s: pct2(b.pct) + ", мин. " + money(b.min) + (b.max ? ", макс. " + money(b.max) : "") + " · п. " + b.p, v: clamp(o.A * b.pct, b.min, b.max), b: "перевод",
          w: "Плата за перевод рублей на счёт иностранного банка. Цена зависит от того, через какой российский банк идёт платёж.", k: "отправка перевода, " + pct2(b.pct) });
        if (o.urgent) lines.push({ l: "Отправка сегодня", s: "0,10%, мин. 350 ₽, макс. 3 500 ₽ · п. 2.1.2.9 · с согласия банка", v: clamp(o.A * 0.001, 350, 3500), b: "срочность", w: "Доплата, чтобы рубли ушли в тот же день.", k: "доплата за отправку сегодня" });
      } else {
        const rule = fxRule(P, o.cur, o.urgent);
        lines.push({ l: o.urgent ? "Срочная отправка" : "Отправка перевода", s: ruleText(rule) + " · п. " + rule.p + (rule.other ? " (прочие валюты)" : ""), v: fxFee(rule, o.A, o.R), b: "перевод",
          w: "Плата банку за отправку денег за границу: процент от суммы, но не меньше минимума и не больше максимума.", k: (o.urgent ? "срочная отправка" : "отправка перевода") + ", " + ruleText(rule) });
      }
      if (o.conv && !isRub) {
        const c = convRule(P, o.cur, o.A, o.usd ? rub0 / o.usd : 0, o.volPrev, o.volCur);
        if (c) lines.push({ l: "Обмен рублей на валюту", s: pct2(c.pct) + " от суммы · " + c.how + " · п. " + c.p, v: rub0 * c.pct, b: "обмен", w: "Комиссия за конвертацию — зависит от пакета клиента.", k: "обмен рублей на валюту, " + pct2(c.pct) });
        else lines.push({ l: "Обмен рублей на валюту", s: "этой валюты нет в п. 5.2–5.15: по курсу банка (п. 5.1) или по согласованию, без комиссии", v: 0, zero: true });
      }
      let vkSum = 0, vkPct = 0;
      if (o.vk !== "none") {
        const fr = favkRule(P, o.vk);
        const fee = favkFee(P, o.vk, rub0);
        vkSum = fee * (1 + VAT_RATE); vkPct = fr.pct;
        lines.push({ l: "Валютный контроль", s: favkText(fr) + " · п. " + o.vk, v: fee, b: "валютный контроль", w: "Банк по закону проверяет каждый платёж за границу." });
        lines.push({ l: "НДС на валютный контроль", s: Math.round(VAT_RATE * 100) + "% — в тарифе указан без НДС", v: fee * VAT_RATE, b: "НДС", w: "Налог 22% добавляется сверху только к валютному контролю." });
      }
      return { lines: lines, total: lines.reduce((a, x) => a + x.v, 0), rub0: rub0, vkSum: vkSum, vkPct: vkPct };
    }

    function FxPanel({ preset }) {
      const pr = preset || {};
      const { P } = usePu();
      const { name: signName } = useSign();
      const { rates, cbrDate, status } = useCbr();
      const first = TC_CUR.indexOf(pr.cur) >= 0 ? pr.cur : (TC_GO[0] || "RUB");
      /* сумма по умолчанию — около миллиона рублей в выбранной валюте, круглым числом */
      const niceAmt = (c) => { if (c === "RUB") return "1000000"; const r = rates[c]; if (!r) return "100000"; const v = 1e6 / r; const p = Math.pow(10, Math.floor(Math.log10(v))); return String(Math.round(v / p) * p); };
      const [cur, setCur] = useState(first);
      const [amount, setAmount] = useState(() => niceAmt(first));
      const [rbank, setRbank] = useState(pr.cur === "RUB" && pr.bank ? pr.bank : "GEN");
      const [urgent, setUrgent] = useState(false);
      const [conv, setConv] = useState(true);
      const [vk, setVk] = useState("4.1");
      const [manual, setManual] = useState("");
      const [volPrev, setVolPrev] = useState("");
      const [volCur, setVolCur] = useState("");
      const [client, setClient] = useState("");
      const A = parseNum(amount, 0);
      const isRub = cur === "RUB";
      const auto = isRub ? 1 : rates[cur];
      const R = isRub ? 1 : parseNum(manual, 0) > 0 ? parseNum(manual, 0) : (auto || 0);
      const o = { cur: cur, A: A, R: R, rbank: rbank, urgent: urgent, conv: conv, vk: vk, usd: rates.USD, volPrev: parseNum(volPrev, 0), volCur: parseNum(volCur, 0) };
      const res = fxCost(P, o);
      const lines = res.lines, total = res.total, rub0 = res.rub0;
      const pct = rub0 > 0 ? total / rub0 * 100 : 0;
      const dateStr = cbrDate ? new Date(cbrDate).toLocaleDateString("ru-RU") : "";
      const lab = "text-[14px] font-semibold ink mb-1.5";
      const sign = curSign(cur);
      const live = FX_LIVE[cur] || { d: 0, p: 0, q: 0, cty: {} };
      const ask = fxLiveN(cur) === 0;
      const ctys = fxCtyList(cur);
      const curLabel = (c) => curSign(c) + " " + (c === "RUB" ? "рубли за рубеж" : curName(c)) + " — " + fxCtyList(c).slice(0, 3).join(", ") + (fxCtyList(c).length > 3 ? " и др." : "");
      const tog = (on, set, text, sub) => (
        <button onClick={() => set(!on)} className="w-full flex items-start gap-2.5 rounded-lg px-3 py-2 text-left" style={on ? { background: "rgba(10,40,150,0.06)", border: "1px solid rgba(10,40,150,0.22)" } : { background: "#fbf8f4", border: "1px solid var(--line-2)" }} aria-pressed={on}>
          <span className="inline-flex items-center justify-center w-5 h-5 rounded shrink-0 mt-0.5" style={on ? { background: "var(--vtb)" } : { border: "1px solid var(--line)", background: "#fff" }}>{on && <IcCheck size={12} stroke="#fff" />}</span>
          <span className="min-w-0"><span className="block text-[14px] font-semibold ink">{text}</span>{sub && <span className="block text-[12.5px] ink-3 leading-snug">{sub}</span>}</span>
        </button>
      );
      const who = client.trim();
      const kpLines = lines.filter((x) => x.v > 0 && x.k).map((x) => "• " + rub(x.v) + " — " + x.k + ".");
      if (res.vkSum > 0) kpLines.push("• " + rub(res.vkSum) + " — валютный контроль, " + pct2(res.vkPct) + " плюс НДС: банк по закону проверяет каждый платёж за границу.");
      const kp = [
        (who ? who + ", добрый день!" : "Добрый день!"),
        "",
        "Посчитал перевод " + nf0.format(A) + " " + sign + (isRub ? " (рубли)" : "") + " вашему получателю через наш банк.",
        "",
        "Комиссии банка: " + rub(total) + (rub0 > 0 ? " — это " + per100(pct) + "." : "."),
        isRub ? "Вместе с суммой перевода — " + rub(rub0 + total) + "." : "Сама сумма по курсу ЦБ — " + rub(rub0) + ", вместе с комиссиями ≈ " + rub(rub0 + total) + ".",
        "",
        "Из чего складываются комиссии:",
      ].concat(kpLines).concat([
        "",
        !isRub && conv ? "Валюту банк продаёт по своему курсу в момент покупки, поэтому итог может немного отличаться." : "",
        live.p > 0 ? "Деньги пойдут через банк-посредник, на который не действуют санкции. Так можно платить, если товар и компании не под санкциями." : "",
        "Комиссии иностранных банков-посредников, если будут, оплачиваются отдельно.",
        "Что нужно от вас: контракт и инвойс (счёт на оплату).",
        "",
      ]).filter((x, i, a) => x !== "" || a[i - 1] !== "").concat(signLines(signName)).join("\n");

      return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
          <div className="space-y-4">
            <div className="rounded-2xl card pad space-y-3.5">
              <label className="block"><div className={lab}>В какой валюте платим</div>
                <select className="fld" value={cur} onChange={(e) => { setCur(e.target.value); setAmount(niceAmt(e.target.value)); setManual(""); }}>
                  <optgroup label="Проходят — подтверждено в списке банков">
                    {TC_GO.map((c) => <option key={c} value={c}>{curLabel(c)}</option>)}
                  </optgroup>
                  {TC_ASK.length > 0 && (
                    <optgroup label="Банки есть, но валюта в списке не указана — уточните">
                      {TC_ASK.map((c) => <option key={c} value={c}>{curLabel(c)}</option>)}
                    </optgroup>
                  )}
                </select>
              </label>
              <div className="rounded-xl px-3 py-2.5 text-[13.5px] leading-relaxed" style={ask ? { background: "rgba(176,122,34,0.09)", border: "1px solid rgba(176,122,34,0.32)", color: "#6b4c14" } : { background: "rgba(28,122,77,0.07)", border: "1px solid rgba(28,122,77,0.26)", color: "#14553a" }}>
                {ask
                  ? <span><b>Под вопросом.</b> В списке есть рекомендованные банки, но валюта платежа там не указана — часто это рубли. Перед отправкой уточните у РН-ВЭД, пройдёт ли именно {curName(cur)}.</span>
                  : <span><b>Проходит.</b> {live.d > 0 && live.p > 0 ? "Напрямую — в " + live.d + " " + bkPlur(live.d, "банк", "банка", "банков") + ", через банк-посредник (прокси) — в " + live.p + ". Через посредника — только за несанкционные товары и между несанкционными компаниями." : live.p > 0 ? "Через банк-посредник (прокси): только за несанкционные товары и между несанкционными компаниями." : "Напрямую, без посредников."}</span>}
                <div className="flex flex-wrap gap-1.5 mt-2">
                  {ctys.map((c) => { const y = live.cty[c]; const n = y.d + y.p + y.q; return (
                    <button key={c} onClick={() => openBanks("", { sec: BK.fxSec, country: c })} className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[12.5px] font-medium" style={{ background: "#fff", border: "1px solid var(--line)", color: "var(--ink)" }}>
                      {c} · {n} {bkPlur(n, "банк", "банка", "банков")}<IcArrow size={12} />
                    </button>); })}
                </div>
              </div>
              <Why>Доллары, евро и другие «западные» валюты ({FX_NO_GO.map(curSign).join(" ")}) через наш банк сейчас не проходят: банки Европы, США, Британии, Швейцарии, ОАЭ и Гонконга в списке «не рекомендованы». Для них — расчёт «Через агента за границей».</Why>
              <label className="block"><div className={lab}>Сумма, {sign}</div>
                <input type="number" inputMode="decimal" min="0" className="fld fld-big num" value={amount} onChange={(e) => setAmount(e.target.value)} />
                {!isRub && <div className="text-[12.5px] ink-3 mt-1 num">≈ {rub(rub0)}</div>}
              </label>
              {isRub && (
                <label className="block"><div className={lab}>Через какой российский банк идёт платёж</div>

      rub: "Платить за границу можно и рублями — на счёт иностранного банка, открытый в российском банке (корсчёт). Ставка зависит от того, через какой российский банк идёт платёж.",

    function TariffPage() {
      const { P } = usePu();
      const D = tfDataFor(P);
      const [cat, setCat] = useState("main");
      const [q, setQ] = useState("");
      const topRef = useRef(null), navRef = useRef(null);
      /* на телефоне разделы — лента с прокруткой: выбранный раздел держим в поле зрения */
      useEffect(() => {
        const nav = navRef.current;
        if (!nav || nav.scrollWidth <= nav.clientWidth) return;
        const b = nav.querySelector("button.on");
        if (!b) return;
        const x = b.getBoundingClientRect().left - nav.getBoundingClientRect().left + nav.scrollLeft;
        nav.scrollTo({ left: Math.max(0, x - nav.clientWidth / 2 + b.offsetWidth / 2), behavior: "smooth" });
      }, [cat, q]);
      useEffect(() => {
        const f = (e) => {
          const d = (e && e.detail) || {};
          setCat(TF_CATS.some((x) => x.id === d.cat) ? d.cat : "main"); setQ("");
        };
        window.addEventListener("tariff:open", f);
        return () => window.removeEventListener("tariff:open", f);
      }, []);
      const go = (c) => { setCat(c); setQ(""); try { if (topRef.current && topRef.current.getBoundingClientRect().top < 0) topRef.current.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) {} };
      const toks = tfTokens(q);
      const re = tfRe(toks);
      /* результаты поиска: строки таблиц и оговорки из всех разделов выбранного пакета */
      const found = useMemo(() => {
        if (!toks.length) return null;
        const out = [];
        TF_CATS.forEach((c) => {
          const blocks = (D[c.id] && c.id !== "main" ? D[c.id] : []).map((b) => {
            const head = tfNorm(b.t + " " + (b.s || ""));
            const rows = (b.rows || []).filter((r) => tfHit(head + " " + tfRowText(r), toks));
            const notes = (b.notes || []).filter((n) => tfHit(tfNorm(n), toks));
            return rows.length || notes.length ? Object.assign({}, b, { rows: rows.length ? rows : null, notes: notes.length ? notes : null, foot: null }) : null;
          }).filter(Boolean);
          const notes = (D.notes[c.id] || []).filter((n) => tfHit(tfNorm(n), toks));
          if (blocks.length || notes.length) out.push({ c: c, blocks: blocks, notes: notes });
        });
        return out;
      }, [q, P.id]);
      const C = TF_CATS.find((x) => x.id === cat) || TF_CATS[0];
      return (
        <div className="page" ref={topRef} style={{ scrollMarginTop: "var(--top-h)" }}>
          <h1 className="h1">Тарифы банка по ВЭД</h1>
          <p className="lead mt-1 mb-3">Все комиссии Альфа-Банка по международным расчётам для пакета <b className="ink">{puName(P)}</b>. Номера пунктов — как в официальных тарифах, редакция от {PU_EDITION}.</p>
          <Why className="mb-4">Цифры зависят от пакета услуг клиента — он выбирается вверху страницы, в поле «Пакет клиента». Не знаете пакет — спросите клиента. Акция 0,8% на юани в Dandong и Shandong Changyi действует во всех пакетах.</Why>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-3 items-start">
            <aside className="lg:col-span-3 lg:sticky" style={{ top: "calc(var(--top-h) + 12px)" }}>
              <div className="rounded-2xl card p-2.5 sm:p-3">
                <div className="relative mb-2">
                  <IcSearch size={16} className="absolute left-3 top-1/2 -translate-y-1/2 ink-3 pointer-events-none" />
                  <input value={q} onChange={(e) => setQ(e.target.value)} className="fld" placeholder="Поиск: юани, справка, учёт…" aria-label="Поиск по тарифу"
                    style={{ paddingLeft: "34px", paddingRight: q ? "36px" : undefined, height: "40px" }} autoComplete="off" spellCheck="false" />
                  {q && <button onClick={() => setQ("")} className="absolute right-1 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full flex items-center justify-center ink-3 hover:ink" aria-label="Очистить"><IcX size={14} /></button>}
                </div>
                <nav ref={navRef} className="tf-nav" aria-label="Разделы тарифа">
                  {TF_CATS.map((c) => (
                    <button key={c.id} onClick={() => go(c.id)} className={!q && cat === c.id ? "on" : ""} aria-current={!q && cat === c.id ? "true" : undefined}>
                      <c.Ic size={15} className="shrink-0" />{c.label}
                    </button>
                  ))}
                </nav>
              </div>
            </aside>

            <div className="lg:col-span-9 min-w-0 space-y-4">
              {found ? (
                found.length ? found.map((g) => (
                  <div key={g.c.id} className="space-y-3">
                    <div className="flex items-center justify-between gap-2">
                      <div className="flex items-center gap-2 text-[13px] font-semibold uppercase tracking-wider ink-3"><g.c.Ic size={15} />{g.c.label}</div>
                      <button onClick={() => go(g.c.id)} className="text-[12.5px] underline underline-offset-2 ink-2 hover:ink">открыть раздел</button>
                    </div>
                    {g.blocks.map((b, i) => <TfBlock key={i} b={b} re={re} />)}
                    {g.notes.length > 0 && <TfNotes notes={g.notes} re={re} />}
                  </div>
                )) : (
                  <div className="rounded-2xl card pad text-center">
                    <div className="text-[16px] font-semibold ink mb-1">«{q.trim()}» в тарифе не нашлось</div>
                    <div className="text-[14px] ink-2">Попробуйте короче: «юан», «справк», «учёт», «срочн», знак валюты или номер пункта.</div>
                  </div>
                )
              ) : (
                <React.Fragment>
                  <div className="flex flex-wrap items-center gap-x-2 gap-y-1">
                    <C.Ic size={18} style={{ color: "var(--vtb)" }} />
                    <h2 className="text-[21px] font-semibold ink" style={{ letterSpacing: "-0.02em" }}>{C.label}</h2>
                    {cat !== "pu" && cat !== "time" && <span className="text-[13px] ink-3">· пакет {puName(P)}</span>}
                  </div>
                  {TF_INTRO[cat] && <Why>{TF_INTRO[cat]}</Why>}
                  {cat === "main" && <TfMain go={go} D={D} />}
                  {cat === "pu" && <TfCompare />}
                  {cat === "time" && <TfTime />}
                  {cat !== "main" && (D[cat] || []).map((b, i) => <TfBlock key={P.id + cat + i} b={b} />)}
                  {D.notes[cat] && <TfNotes notes={D.notes[cat]} />}
                  {cat === "cny" && (
                    <div className="flex flex-wrap gap-2">
                      <button onClick={() => openCalc("china")} className="inline-flex items-center gap-2 rounded-full btn-red px-4 py-2.5 text-[13.5px] font-medium"><IcCalc size={15} />Посчитать платёж в Китай</button>
                      <button onClick={() => openBanks("", { sec: BK.fxSec, country: "Китай" })} className="inline-flex items-center gap-2 rounded-full btn-ghost px-4 py-2.5 text-[13.5px] font-medium"><IcBank size={15} />Банки Китая: прямой путь или прокси</button>
                    </div>
                  )}
                </React.Fragment>
              )}
            </div>
          </div>
        </div>
      );
    }

                {SCEN.filter((x) => x.g === gi).map((x) => (
                  <button key={x.id} onClick={() => setCalc(x.id)} className={"scen " + (calc === x.id ? "on" : "")} aria-pressed={calc === x.id}>

          <div className="mt-6 mb-3 flex flex-wrap items-center gap-x-3 gap-y-1.5">
            <h2 className="h2">{S.t}</h2>
            {S.routes.map((n) => <RouteTag key={n} n={n} />)}

          {S.flow && (
            <div className="rounded-2xl card px-4 py-3 mb-4">
              <div className="text-[12px] font-bold uppercase tracking-wider ink-3 mb-2">Как пойдут деньги</div>
              <Flow nodes={S.flow} />
            </div>
          )}

          <div key={calc} className="fu">
            {calc === "import"   && <ImportPanel />}
            {calc === "export"   && <ExportPanel />}
            {calc === "yuan"     && <YuanPanel />}
            {calc === "clearing" && <ClearingPanel />}
            {calc === "china"    && <ChinaPanel key={calcOpts ? calcOpts.n : 0} opts={calcOpts} />}

    }

    /* ---------- 1. ИМПОРТ ЧЕРЕЗ ФИНАНСОВОГО АГЕНТА ---------- */
    const IMPORT_WAS_PCT = [0.017, 0.017, 0.015, 0.012];

    function ImportPanel() {
      const { rates, cbrDate, status } = useCbr();
      const { name: signName } = useSign();
      const [customMode, setCustomMode] = useState(false);
      const [cr, setCr] = useState({ USD: String(FALLBACK.USD), EUR: String(FALLBACK.EUR), CNY: String(FALLBACK.CNY) });
      const [currency, setCurrency] = useState("USD");
      const [amount, setAmount] = useState("25000");
      const [client, setClient] = useState("");
      useEffect(() => { if (status === "ok") setCr({ USD: rates.USD.toFixed(4), EUR: rates.EUR.toFixed(4), CNY: rates.CNY.toFixed(4) }); }, [status]);

      const eff = customMode ? { USD: parseNum(cr.USD, rates.USD), EUR: parseNum(cr.EUR, rates.EUR), CNY: parseNum(cr.CNY, rates.CNY) } : rates;
      const P = parseNum(amount, 0);
      const Prub = P * eff[currency];
      const Pusd = eff.USD > 0 ? Prub / eff.USD : 0;
      const tier = tierFor(Pusd);
      const tierIdx = IMPORT_TIERS.indexOf(tier);
      const mainComm = Prub * tier.pct + tier.fix * eff.USD;
      const wasComm  = Prub * IMPORT_WAS_PCT[tierIdx] + tier.fix * eff.USD;
      const PU = usePu().P;
      const vcRule = favkRule(PU, "4.1");
      const valCtl = favkFee(PU, "4.1", Prub) * (1 + VAT_RATE);   // ФАВК по пакету клиента + НДС
      const vcText = favkText(vcRule) + ", с НДС " + Math.round(VAT_RATE * 100) + "%";
      const finAg  = faFee(Prub);
      const totalComm = mainComm + valCtl + finAg;
      const total = Prub + totalComm;
      const totalWas = Prub + wasComm + valCtl + finAg;
      const saved = totalWas - total;
      const overall = Prub > 0 ? (totalComm / Prub) * 100 : 0;
      const dateStr = cbrDate ? new Date(cbrDate).toLocaleDateString("ru-RU") : "";
      const setCrField = (k, v) => setCr((o) => Object.assign({}, o, { [k]: v }));
      const symbol = CURRENCIES.find((c) => c.code === currency).sym;
      const srcName = customMode ? "Investing или свой курс" : "ЦБ" + (dateStr ? " на " + dateStr : "");
      const who = client.trim();

      const kp = [
        (who ? who + ", добрый день!" : "Добрый день!"),
        "",
        "Посчитал оплату вашему поставщику на " + cur(P) + " " + curSign(currency) + ".",
        "",
        "Всего с вас: " + rub(total) + ".",
        "Это сама сумма платежа и все комиссии вместе. Комиссии — " + rub(totalComm) + ", то есть " + per100(overall) + " платежа. Других платежей не будет.",
        "",
        "Как пойдут деньги:",
        "1. Вы переводите рубли со своего счёта нашему партнёру — финансовому агенту.",
        "2. Агент сам оплачивает вашему поставщику из-за границы.",
        "Ваш банк в этой цепочке не участвует — поэтому платёж проходит, даже если банк поставщика не принимает деньги из России.",
        "",
        "Из чего складывается сумма:",
        "• " + rub(Prub) + " — сам платёж: " + cur(P) + " " + curSign(currency) + " по курсу " + srcName + " " + rate(eff[currency]) + ".",
        "• " + rub(mainComm) + " — работа агента, " + tier.now + ".",
        "• " + rub(valCtl) + " — валютный контроль: банк по закону проверяет каждый платёж за границу. " + pct2(vcRule.pct) + " плюс НДС.",
        "• " + rub(finAg) + " — перевод денег агенту, 0,15%.",
        "",
        "Ставка агента зависит от суммы: до 50 000 $ — 1,4% (до 10 000 $ ещё плюс 100 $), до 100 000 $ — 1,0%, больше — 0,8%. Ставки действуют до " + PROMO_UNTIL + ".",
        "",
        "Что нужно от вас: контракт с поставщиком и инвойс (счёт на оплату).",
        "Курс может немного измениться к дню оплаты — точную сумму назовём перед платежом.",
        "",
      ].concat(signLines(signName)).join("\n");

      return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
          <div className="space-y-4">
            <div className="rounded-2xl card pad space-y-3">
              <div>
                <div className="text-[14.5px] font-semibold ink mb-2">В какой валюте платим поставщику</div>
                <CurrencyPicker currency={currency} setCurrency={setCurrency} />

                </div>
                <div className="text-[13px] ink-3 mt-1.5 num">≈ {rub(Prub)} · ${cur(Pusd)}</div>
              </div>
              <Why>Впишите сумму, которую должен получить поставщик, — как в инвойсе. Комиссии калькулятор добавит сам.</Why>
              <label className="block"><div className="text-[14.5px] font-semibold ink mb-1.5">Имя клиента для письма</div><input className="fld" value={client} onChange={(e) => setClient(e.target.value)} placeholder="Иван Иванович" /></label>
            </div>

            <div className="rounded-2xl card pad">
              <div className="flex items-center gap-2 mb-2">
                <div className="text-[14.5px] font-semibold ink">Ставка агента зависит от суммы</div>
                <PromoTag>{PROMO_SHORT}</PromoTag>
              </div>
              <div className="space-y-1.5">
                {IMPORT_TIERS.map((t, idx) => { const on = idx === tierIdx; return (
                  <div key={idx} className={"rounded-xl px-3 py-2 border " + (on ? "" : "card-soft")}
                    style={on ? { background: "rgba(194,53,43,0.08)", borderColor: "rgba(194,53,43,0.38)" } : null}>
                    <div className="row">
                      <span className={"row-l text-[14px] " + (on ? "ink font-semibold" : "ink-2")}>{t.range}{on && <span className="ml-1.5 text-[11px] font-semibold" style={{ color: "var(--red)" }}>← ваш платёж</span>}</span>
                      <span className="row-r"><WasNow was={t.was} now={t.now} /></span>
                    </div>
                  </div>); })}
              </div>
              <Why className="mt-2.5">Чем больше платёж, тем ниже процент. На маленьких платежах до 10 000 $ агент берёт ещё 100 $ сверху — так ему окупается работа.</Why>
            </div>

            <Fold icon={IcRefresh} title="Курс обмена" sub={status === "ok" ? "курс ЦБ на " + dateStr : (status === "loading" ? "загружаем курс ЦБ…" : "курс ЦБ не загрузился")}>
              <RateRows rates={rates} />
              <div className="mt-3 pt-3" style={{ borderTop: "1px solid var(--line-2)" }}>
                <label className="flex items-center gap-2.5 select-none">
                  <input type="checkbox" checked={customMode} onChange={(e) => setCustomMode(e.target.checked)} className="w-4 h-4" style={{ accentColor: "var(--red)" }} />
                  <span className="text-[14px] ink">Курс Investing или свой <span className="ink-3">(если рынок штормит)</span></span>
                </label>
                {customMode && (
                  <div className="space-y-2 mt-3">
                    {CURRENCIES.map((c) => (
                      <div key={c.code} className="flex items-center gap-2">
                        <div className="text-[13px] ink-3 w-[112px] shrink-0">{c.full}, ₽</div>
                        <input type="number" inputMode="decimal" step="0.0001" value={cr[c.code]} onChange={(e) => setCrField(c.code, e.target.value)} className="fld num flex-1 min-w-0" />
                      </div>
                    ))}
                  </div>
                )}
              </div>
              <Why className="mt-3">Агент переводит по курсу ЦБ на день платежа. Если курс на рынке сильно скачет, можно договориться о курсе с Investing — включите галочку и впишите его.</Why>
              <div className="mt-2">
                <Ext href={INVESTING} className="inline-flex items-center gap-1.5 text-[13px] underline underline-offset-4" style={{ color: "var(--red)" }}>курс на investing.com<IcExt size={14} /></Ext>
              </div>
            </Fold>
          </div>

          <div className="space-y-4">
            <div className="rounded-2xl card pad" style={{ borderColor: "rgba(194,53,43,0.30)" }}>
              <div className="flex flex-wrap items-center justify-between gap-2 mb-1">
                <div className="text-[16px] font-semibold ink">Сколько заплатит клиент</div>
                <div className="text-[13px] px-2.5 py-1 rounded-full font-semibold" style={{ background: "rgba(194,53,43,0.10)", color: "var(--red-ink)", border: "1px solid rgba(194,53,43,0.28)" }}>Ставка {tier.now}</div>
              </div>
              <Gist>Поставщик получит <b>{cur(P)} {symbol}</b>, клиент заплатит <b>{rub(total)}</b>. Из них комиссии — {rub(totalComm)}, то есть {per100(overall)}.</Gist>
              <Row label="Сумма платежа" sub={cur(P) + " " + symbol + " по курсу " + srcName} value={rub(Prub)} why="Деньги, которые получит поставщик, — переведённые в рубли." />
              <Row label="Работа агента" sub={tier.fix ? tier.now + ", включая 100 $" : tier.now + " от суммы"} value={rub(mainComm)} color="var(--red)" why="Плата финансовому агенту за то, что он оплатит поставщику из своей страны." />
              <Row label="Валютный контроль" sub={vcText + " · пакет " + puName(PU)} value={rub(valCtl)} why="Банк по закону проверяет каждый платёж за границу: есть ли контракт, совпадают ли суммы. Цена зависит от пакета клиента." />
              <Row label="Перевод денег агенту" sub={finAg >= FA_MAX ? "0,15%, сработал максимум 50 000 ₽" : "0,15%, от 1 000 до 50 000 ₽"} value={rub(finAg)} why="Плата нашему банку за перевод рублей со счёта клиента на счёт агента." />
              <Row label="Комиссии вместе" sub={pctStr(overall, 1) + " сверх суммы платежа"} value={rub(totalComm)} strong />
              <div className="mt-3 rounded-xl px-4 py-3.5" style={{ background: "rgba(194,53,43,0.07)", border: "1px solid rgba(194,53,43,0.26)" }}>
                <div className="row">
                  <div className="row-l"><div className="text-[16px] font-semibold ink">Всего с клиента</div><div className="text-[12.5px] ink-3 mt-0.5">платёж и все комиссии</div></div>
                  <div className="row-r">
                    <div className="num text-2xl font-bold" style={{ color: "var(--red)" }}>{rub(total)}</div>
                    <div className="text-[12.5px] ink-3 mt-0.5 num">${cur(total / eff.USD)} · ¥{cur(total / eff.CNY)} · €{cur(total / eff.EUR)}</div>
                  </div>
                </div>
              </div>
              <div className="mt-3 rounded-xl card-soft px-4 py-3">
                <div className="row">
                  <div className="row-l">
                    <div className="text-[14px] font-semibold ink">Выгода от акции</div>
                    <div className="text-[12.5px] ink-3 mt-0.5">по прежней ставке {tier.was} было бы {rub(totalWas)}</div>
                  </div>
                  <div className="row-r num text-[19px] font-bold" style={{ color: GREEN }}>−{rub(saved)}</div>
                </div>
              </div>
              <CostBar parts={[{ l: "работа агента", v: mainComm }, { l: "валютный контроль", v: valCtl }, { l: "перевод агенту", v: finAg }]} />
            </div>
            <PuAdvice needFx={false} cost={(PP) => mainComm + finAg + favkFee(PP, "4.1", Prub) * (1 + VAT_RATE)} />
            <KpBlock text={kp} note={"Ставки зафиксированы до " + PROMO_UNTIL + "."} />
          </div>
        </div>
      );
    }

    /* ---------- 2. ЭКСПОРТ ЧЕРЕЗ ФИНАНСОВОГО АГЕНТА ---------- */
    const ACCEPT = ["USD", "EUR", "CNY", "AED", "TRY", "KZT", "HKD", "INR", "GBP", "JPY"];
    const EXPORT_ADV = [
      { Ic: IcSwap,  t: "Покупатель платит удобной валютой", d: "Юанем, долларом, дирхамом — тем, что у него есть. Искать редкую валюту не нужно." },
      { Ic: IcBank,  t: "Курс ЦБ, без наценки",    d: "Агент меняет валюту на рубли по курсу ЦБ и зачисляет их на счёт клиента в России." },
      { Ic: IcTrend, t: "Одна ставка на любые суммы", d: "0,2% и на разовую отгрузку, и на годовой контракт." },
    ];

    function ExportPanel() {
      const { rates, cbrDate, status } = useCbr();
      const { name: signName } = useSign();
      const [currency, setCurrency] = useState("CNY");
      const [amount, setAmount] = useState("50000");
      const [client, setClient] = useState("");
      const eff = rates;
      const P = parseNum(amount, 0);
      const gross = P * eff[currency];
      const Pusd = eff.USD > 0 ? gross / eff.USD : 0;
      const comm = gross * EXPORT_PCT;
      const commWas = gross * 0.005;
      const net = gross - comm;
      const netWas = gross - commWas;
      const saved = net - netWas;
      const dateStr = cbrDate ? new Date(cbrDate).toLocaleDateString("ru-RU") : "";
      const symbol = CURRENCIES.find((c) => c.code === currency).sym;
      const who = client.trim();

      const kp = [
        (who ? who + ", добрый день!" : "Добрый день!"),
        "",
        "Посчитал, сколько вы получите, если покупатель заплатит " + cur(P) + " " + curSign(currency) + ".",
        "",
        "На ваш счёт придёт: " + rub(net) + ".",
        "Удерживаем только 0,2% — " + rub(comm) + ". Больше ничего.",
        "",
        "Как пойдут деньги:",
        "1. Покупатель платит в своей валюте нашему агенту за границей.",
        "2. Агент меняет валюту на рубли по курсу ЦБ — без наценки.",
        "3. Рубли приходят на ваш расчётный счёт в России.",
        "",
        "Расчёт:",
        "• " + cur(P) + " " + curSign(currency) + " по курсу ЦБ" + (dateStr ? " на " + dateStr : "") + " " + rate(eff[currency]) + " = " + rub(gross) + ".",
        "• Комиссия агента 0,2% — " + rub(comm) + " (раньше было 0,5%).",
        "• К зачислению — " + rub(net) + ".",
        "",
        "Покупатель может платить в удобной ему валюте: доллары $, евро €, юани ¥, дирхамы, лиры ₺, тенге ₸, гонконгские доллары HK$, рупии ₹, фунты £, иены и другие. Так вы не теряете деньги на двойном обмене валюты — на нём иногда уходит до 17% контракта.",
        "Ставка 0,2% действует до " + PROMO_UNTIL + " на любые суммы. Курс ЦБ меняется каждый день, поэтому точную сумму назовём в день платежа.",
        "",
      ].concat(signLines(signName)).join("\n");

      return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
          <div className="space-y-4">
            <div className="rounded-2xl card pad space-y-3">
              <div>
                <div className="text-[14.5px] font-semibold ink mb-2">В какой валюте платит покупатель</div>
                <CurrencyPicker currency={currency} setCurrency={setCurrency} />
              </div>
              <div>
                <div className="text-[14.5px] font-semibold ink mb-2">Сумма от покупателя</div>
                <div className="relative">
                  <input type="number" inputMode="decimal" min="0" value={amount} onChange={(e) => setAmount(e.target.value)} className="fld fld-big num" />
                  <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xl ink-3">{symbol}</span>
                </div>
                <div className="text-[13px] ink-3 mt-1.5 num">≈ {rub(gross)} · ${cur(Pusd)}</div>
              </div>
              <label className="block"><div className="text-[14.5px] font-semibold ink mb-1.5">Имя клиента для письма</div><input className="fld" value={client} onChange={(e) => setClient(e.target.value)} placeholder="Иван Иванович" /></label>
              <div className="pt-1">
                <div className="flex items-center justify-between gap-2 mb-2">
                  <span className="text-[14px] font-semibold ink">Курс ЦБ</span>
                  <span className="text-[13px] ink-3">{status === "ok" ? "на " + dateStr : (status === "loading" ? "загружаем…" : "нет связи")}</span>
                </div>
                <RateRows rates={rates} />
              </div>
            </div>
            <Fold icon={IcInflow} title="Почему это выгодно клиенту" sub="и в каких валютах принимаем">
              <div className="space-y-2">
                {EXPORT_ADV.map((a, i) => (
                  <div key={i} className="rounded-xl card-soft p-3">
                    <div className="flex items-center gap-2 mb-0.5">
                      <a.Ic size={16} className="shrink-0" style={{ color: GREEN }} />
                      <div className="text-[14.5px] font-semibold ink leading-tight">{a.t}</div>
                    </div>
                    <div className="text-[13.5px] ink-2 leading-relaxed">{a.d}</div>
                  </div>
                ))}
              </div>
              <div className="mt-3 rounded-xl px-4 py-3" style={{ background: "rgba(28,122,77,0.08)", border: "1px solid rgba(28,122,77,0.26)" }}>
                <div className="flex items-center gap-2 mb-1"><IcTrend size={18} style={{ color: GREEN }} /><span className="text-2xl font-bold num" style={{ color: GREEN }}>до 17%</span></div>
                <div className="text-[13.5px] ink-2 leading-relaxed">может теряться, когда покупатель платит в неудобной валюте и её меняют дважды. У нас потери — доли процента.</div>

                <div className="text-[13px] px-2.5 py-1 rounded-full font-semibold" style={{ background: "rgba(28,122,77,0.10)", color: "#166341", border: "1px solid rgba(28,122,77,0.28)" }}>Комиссия 0,2%</div>
              </div>

    const YUAN_TR = { pct: 0.003, min: 3000, max: 20000 };
    function yuanAlfa(PU, n, R, C, usd) {
      const cr = convRule(PU, "CNY", n, usd ? n * C / usd : 0, 0, 0);
      const base = n * R, mk = n * ALFA_MARKUP, conv = n * C * cr.pct, tr = clamp(n * C * YUAN_TR.pct, YUAN_TR.min, YUAN_TR.max);
      return { base, mk, conv, tr, cr, total: base + mk + conv + tr };
    }
    function routes(R, mV, byCny, nWanted, budget, PU, C, usd) {
      const rateA = R + mV;
      const costB = (n) => yuanAlfa(PU, n, R, C, usd).total;
      let nA, nB, rubA, rubB;
      if (byCny) { nA = nB = nWanted; rubA = nA * rateA; rubB = costB(nB); }
      else { rubA = rubB = budget; nA = rateA > 0 ? budget / rateA : 0; nB = solveByBudget(budget, costB, budget / ((R || 1) * 0.5) + 1); }
      const rateB = nB > 0 ? rubB / nB : R;
      const aWins = byCny ? rubA < rubB : nA > nB;
      const diffRub = Math.abs(rubA - rubB), diffCny = Math.abs(nA - nB);
      const saveRub = byCny ? diffRub : diffCny * R;
      const saveCny = byCny ? (R > 0 ? diffRub / R : 0) : diffCny;
      const savePct = byCny ? (Math.max(rubA, rubB) > 0 ? (diffRub / Math.max(rubA, rubB)) * 100 : 0)
                            : (Math.max(nA, nB) > 0 ? (diffCny / Math.max(nA, nB)) * 100 : 0);
      return { rateA, rateB, nA, nB, rubA, rubB, aWins, saveRub, saveCny, savePct };
    }

            </div>

        nVtb = perVtb > 0 ? budget / perVtb : 0;

      const clearBody = nClear * Rcb;
