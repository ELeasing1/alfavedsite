        setState((s) => Object.assign({}, s, { status: "loading" }));

        const getJson = (u) => fetch(u + bust, { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error("http"); return r.json(); });
        const run = (attempt) => {
          Promise.all([getJson(MOEX_MD).catch(() => null), getJson(MOEX_SEC).catch(() => null)])
            .then(([md, sec]) => {
              if (!alive) return;
              const lot = sec ? getCol(sec.securities, "LOTSIZE") : null;
              const live = md ? pickRow(md.marketdata, ["LAST", "MARKETPRICE", "WAPRICE"]) : null;
              if (live) {
                const kinds = { LAST: "последняя сделка", MARKETPRICE: "рыночная цена", WAPRICE: "средневзвешенная" };
                setState({ price: live.value, time: md ? getCol(md.marketdata, "UPDATETIME") : null, kind: kinds[live.name], lot: lot, status: "ok" });
                return;
              }
              const prev = sec ? pickRow(sec.securities, ["PREVPRICE", "PREVWAPRICE", "PREVADMITTEDQUOTE"]) : null;
              if (prev) {
                const d = sec ? getCol(sec.securities, "PREVDATE") : null;
                setState({ price: prev.value, time: d ? new Date(d).toLocaleDateString("ru-RU") : null, kind: "закрытие торгов", lot: lot, status: "ok" });
                return;
              }
              if (attempt < 2) { setTimeout(() => run(attempt + 1), 1200); return; }
              setState((s) => Object.assign({}, s, { status: "error" }));
            })
            .catch(() => { if (!alive) return; if (attempt < 2) setTimeout(() => run(attempt + 1), 1200); else setState((s) => Object.assign({}, s, { status: "error" })); });
        };
        run(1);
        return () => { alive = false; };
      }, [tick]);
      return Object.assign({}, state, { refresh: () => setTick((t) => t + 1) });
    }

    /* ============ 2. ИМПОРТ ============ */
    function tierFor(usd) {
      if (usd < 10000)  return { pct: 0.017, fixedUsd: 100, note: "1,7% + $100" };
      if (usd < 50000)  return { pct: 0.017, fixedUsd: 0,   note: "1,7%" };
      if (usd < 100000) return { pct: 0.015, fixedUsd: 0,   note: "1,5%" };
      return               { pct: 0.012, fixedUsd: 0,   note: "1,2%" };
    }
    const TIERS = [
      { range: "до $10 000",             note: "1,7% + $100", lo: 0,      hi: 10000 },
      { range: "от $10 000 до $50 000",  note: "1,7%",        lo: 10000,  hi: 50000 },
      { range: "от $50 000 до $100 000", note: "1,5%",        lo: 50000,  hi: 100000 },
      { range: "от $100 000",            note: "1,2%",        lo: 100000, hi: Infinity },
    ];

    function Calculator() {
      const { rates, cbrDate, status } = useCbr();
      const [customMode, setCustomMode] = useState(false);
      const [cr, setCr] = useState({ USD: String(FALLBACK.USD), EUR: String(FALLBACK.EUR), CNY: String(FALLBACK.CNY) });
      const [currency, setCurrency] = useState("USD");
      const [amount, setAmount] = useState("25000");
      useEffect(() => { if (status === "ok") setCr({ USD: rates.USD.toFixed(4), EUR: rates.EUR.toFixed(4), CNY: rates.CNY.toFixed(4) }); }, [status]);

      const eff = customMode ? { USD: parseNum(cr.USD, rates.USD), EUR: parseNum(cr.EUR, rates.EUR), CNY: parseNum(cr.CNY, rates.CNY) } : rates;
      const P = parseNum(amount, 0);
      const Prub = P * eff[currency];
      const Pusd = eff.USD > 0 ? Prub / eff.USD : 0;
      const tier = tierFor(Pusd);
      const mainComm = Prub * tier.pct + tier.fixedUsd * eff.USD;
      const valCtl = Math.max(Prub * 0.002, 1200);
      const finAg = Math.max(Prub * 0.0015, 1000);
      const totalComm = mainComm + valCtl + finAg;
      const total = Prub + totalComm;
      const overall = Prub > 0 ? (totalComm / Prub) * 100 : 0;
      const dateStr = cbrDate ? new Date(cbrDate).toLocaleDateString("ru-RU") : "";
      const setCrField = (k, v) => setCr((o) => Object.assign({}, o, { [k]: v }));
      const activeTierIdx = TIERS.findIndex((t) => Pusd >= t.lo && Pusd < t.hi);
      const symbol = CURRENCIES.find((c) => c.code === currency).sym;

      const kp = [
        "Иван Иванович, добрый день!",
        "",
        "Платёж " + cur(P) + " " + currency + " обойдётся в " + rub(total) + ". Все комиссии внутри, это " + pctStr(overall, 1) + " сверх суммы.",
        "",
        "РАСЧЁТ",
        "Сумма платежа: " + cur(P) + " " + currency + ", по курсу " + (customMode ? "(ваш курс)" : "ЦБ" + (dateStr ? " на " + dateStr : "")) + " " + rate(eff[currency]) + " это " + rub(Prub),
        "Комиссия агента, " + tier.note + ": " + rub(mainComm),
        "Валютный контроль, 0,2% (мин. 1 200 ₽): " + rub(valCtl),
        "Перевод финагенту-нерезиденту, 0,15% (мин. 1 000 ₽): " + rub(finAg),
        "Комиссии итого: " + rub(totalComm),
        "К ОПЛАТЕ: " + rub(total) + " ($" + cur(total / eff.USD) + " / ¥" + cur(total / eff.CNY) + " / €" + cur(total / eff.EUR) + ")",
        "",
        "УСЛОВИЯ",
        "• Платёж идёт через финансового агента-нерезидента.",
        "• Конвертация по курсу ЦБ, без спреда и накруток.",
        "• В волатильные дни сверяемся с биржей с 10:00 до 11:00 МСК и считаем по биржевому, если он выгоднее вам.",
        "• Проверка контракта и помощь с доработкой включены.",
        "• Тариф зависит от суммы: до $10 000 это 1,7% плюс $100, до $50 000 это 1,7%, до $100 000 это 1,5%, дальше 1,2%. От $100 000 можем дойти до 1%.",
        "• Расчёт ориентировочный, финальные цифры фиксируем перед сделкой.",
        "",
      ].concat(SIGN).join("\n");

      return (

    /* ============ 3. ЭКСПОРТ ============ */
    const ACCEPT = ["USD", "EUR", "CNY", "AED", "TRY", "KZT", "HKD", "INR", "GBP", "JPY"];

      { icon: "trend", title: "Выручка предсказуема", text: "Двойная конвертация съедает проценты контракта. Мы сводим потерю к долям процента." },

    const EXPORT_TIERS = [
      { range: "до $100 000",    note: "0,5%",  lo: 0,      hi: 100000 },
      { range: "свыше $100 000", note: "0,25%", lo: 100000, hi: Infinity },

      const eff = rates;
      const P = parseNum(amount, 0);

      const Pusd = eff.USD > 0 ? gross / eff.USD : 0;
      const pct = Pusd > 100000 ? 0.0025 : 0.005;
      const pctLabel = pct === 0.005 ? "0,5%" : "0,25%";
      const comm = gross * pct;
      const net = gross - comm;
      const dateStr = cbrDate ? new Date(cbrDate).toLocaleDateString("ru-RU") : "";
      const activeIdx = Pusd > 100000 ? 1 : 0;
      const advIcons = { swap: IconSwap, bank: IconBank, trend: IconTrend };
      const symbol = CURRENCIES.find((c) => c.code === currency).sym;

      const kp = [
        "Иван Иванович, добрый день!",
        "",
        "С платежа " + cur(P) + " " + currency + " вы получите " + rub(net) + " на расчётный счёт. Удержим только " + pctLabel + ", конвертация по курсу ЦБ без спреда.",
        "",
        "РАСЧЁТ",
        "Платёж от покупателя: " + cur(P) + " " + currency + ", по курсу ЦБ" + (dateStr ? " на " + dateStr : "") + " " + rate(eff[currency]) + " это " + rub(gross),
        "Комиссия агента, " + pctLabel + ": " + rub(comm),
        "К ЗАЧИСЛЕНИЮ: " + rub(net) + " ($" + cur(net / eff.USD) + " / ¥" + cur(net / eff.CNY) + " / €" + cur(net / eff.EUR) + ")",
        "",
        "КАК ЭТО РАБОТАЕТ",
        "• Покупатель платит удобной ему валютой: USD, EUR, CNY, AED, TRY, KZT, HKD, INR, GBP, JPY и другие.",
        "• Агент-нерезидент принимает платёж и конвертирует по курсу ЦБ на момент перевода.",
        "• Рубли приходят на ваш счёт в РФ.",
        "",
        "ЧТО ЭТО ДАЁТ",
        "• Покупателю не нужно искать неликвидную валюту, он платит тем, что есть.",
        "• Вы уходите от двойной конвертации, где теряется до 17% контракта.",
        "• Экономику сделки видно до отгрузки.",
        "",
        "ТАРИФ",
        "• До $100 000 это 0,5%, свыше 0,25%.",
        "• Расчёт ориентировочный, финальные цифры фиксируем перед сделкой.",
        "",
      ].concat(SIGN).join("\n");

      return (
        <section id="export" className="export-bg relative w-full overflow-hidden py-28 md:py-40">
          <div className="export-glow"></div>
          <div className="absolute inset-x-0 top-0 h-[24%] z-[1] pointer-events-none" style={{ background: "linear-gradient(to bottom, #0b060c 0%, rgba(11,6,12,0.88) 26%, rgba(11,6,12,0.58) 52%, rgba(11,6,12,0.24) 78%, rgba(11,6,12,0) 100%)" }}></div>
          <div className="absolute inset-x-0 bottom-0 h-[22%] z-[1] pointer-events-none" style={{ background: "linear-gradient(to top, #061013 0%, rgba(6,16,19,0.88) 28%, rgba(6,16,19,0.56) 55%, rgba(6,16,19,0.22) 80%, rgba(6,16,19,0) 100%)" }}></div>
          <div className="relative z-10 w-full max-w-5xl mx-auto px-4 sm:px-6 md:px-8">
            <div className="rise text-center max-w-3xl mx-auto mb-8 md:mb-10" style={{ transitionDelay: "0ms" }}>
              <div className="inline-flex items-center gap-2 mb-5 px-3.5 py-1.5 rounded-full text-[11px] sm:text-xs font-semibold tracking-[0.2em] uppercase text-emerald-100 bg-emerald-500/10 border border-emerald-300/30"><IconInflow size={15} className="text-emerald-300" />Приём выручки</div>
              <h2 className="text-3xl sm:text-4xl md:text-5xl font-semibold tracking-tight mb-4" style={{ letterSpacing: "-0.03em" }}>Принимайте выручку почти из любой точки мира</h2>
              <p className="text-base sm:text-lg text-emerald-50/85">Покупатель платит удобной ему валютой, вы получаете <span className="text-emerald-200 font-medium">рубли на счёт по курсу ЦБ</span>.</p>
            </div>
            <div className="rise flex flex-wrap items-center justify-center gap-2 mb-12" style={{ transitionDelay: "60ms" }}>
              {ACCEPT.map((c) => (<span key={c} className="px-3 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-white/[0.05] border border-emerald-300/20 text-emerald-50 tabular-nums">{c}</span>))}
              <span className="px-3 py-1.5 rounded-full text-xs sm:text-sm text-emerald-200/70 border border-emerald-300/20">и другие</span>
            </div>
            <div className="grid md:grid-cols-3 gap-4 mb-10">
              {EXPORT_ADV.map((a, idx) => { const Ic = advIcons[a.icon]; return (
                <div key={idx} className="rise rounded-2xl border border-emerald-300/15 bg-black/30 backdrop-blur-md p-5 sm:p-6" style={{ transitionDelay: `${120 + idx * 80}ms` }}>
                  <div className="w-11 h-11 rounded-xl bg-emerald-400/15 border border-emerald-300/30 flex items-center justify-center mb-4"><Ic size={20} className="text-emerald-300" /></div>
                  <div className="text-base font-semibold mb-2">{a.title}</div>
                  <div className="text-sm text-gray-300 leading-relaxed">{a.text}</div>
                </div>); })}
            </div>
            <div className="rise mb-12" style={{ transitionDelay: "180ms" }}>
              <div className="rounded-2xl border border-emerald-300/25 bg-emerald-400/[0.06] px-5 sm:px-7 py-5 flex flex-col sm:flex-row sm:items-center gap-4">
                <div className="flex items-center gap-3 shrink-0"><IconTrend size={22} className="text-emerald-300" /><span className="text-2xl sm:text-3xl font-bold text-emerald-300">до 17%</span></div>
                <div className="text-sm sm:text-base text-emerald-50/90">теряется на неликвидной валюте и двойной конвертации. У нас потери падают <span className="text-white font-medium">до долей процента</span>.</div>
              </div>
            </div>

            <div className="rise text-center max-w-2xl mx-auto mb-8" style={{ transitionDelay: "0ms" }}>
              <h3 className="text-2xl sm:text-3xl md:text-4xl font-semibold tracking-tight mb-3" style={{ letterSpacing: "-0.02em" }}>Сколько вы получите на счёт</h3>
              <p className="text-sm sm:text-base text-emerald-50/75">Конвертация <span className="text-emerald-200 font-medium">по курсу ЦБ на момент перевода</span>. Одна комиссия: 0,5% до $100 000 и 0,25% свыше.</p>
            </div>

            <div className="rise mb-6" style={{ transitionDelay: "80ms" }}>
              <div className="rounded-2xl border border-white/12 bg-black/35 backdrop-blur-md p-5 sm:p-6">
                <div className="flex items-center gap-2 text-sm text-emerald-50 mb-4">
                  <IconRefresh size={16} className={"text-emerald-300 " + (status === "loading" ? "animate-spin" : "")} />
                  <span className="font-medium">Курс ЦБ РФ</span>
                  {status === "ok" && <span className="text-gray-400">на {dateStr}</span>}
                </div>
                <RateCards rates={rates} />
              </div>
            </div>

            <div className="grid lg:grid-cols-5 gap-6">
              <div className="rise lg:col-span-2" style={{ transitionDelay: "140ms" }}>
                <div className="rounded-2xl border border-white/12 bg-black/35 backdrop-blur-md p-5 sm:p-6 h-full">
                  <div className="text-sm font-medium text-emerald-50 mb-3">Валюта покупателя</div>
                  <div className="mb-6"><CurrencyPicker currency={currency} setCurrency={setCurrency} tone="emerald" /></div>
                  <div className="text-sm font-medium text-emerald-50 mb-2">Сумма от покупателя</div>
                  <div className="relative">
                    <input type="number" inputMode="decimal" min="0" value={amount} onChange={(e) => setAmount(e.target.value)} className="w-full rounded-xl bg-black/40 border border-white/15 focus:border-emerald-300/70 outline-none pl-4 pr-12 py-3.5 text-xl sm:text-2xl font-semibold text-white tabular-nums" />
                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xl text-gray-400">{symbol}</span>
                  </div>
                  <div className="text-xs text-gray-400 mt-2 tabular-nums">≈ {rub(gross)}, это ${cur(Pusd)}</div>
                  <div className="mt-6">
                    <div className="text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Комиссия агента</div>
                    <div className="space-y-1.5">
                      {EXPORT_TIERS.map((t, idx) => { const on = idx === activeIdx; return (
                        <div key={idx} className={"flex items-center justify-between rounded-lg px-3 py-2 text-sm border " + (on ? "bg-emerald-400/15 border-emerald-300/50 text-white" : "bg-white/[0.02] border-white/8 text-gray-300")}>
                          <span>{t.range}</span><span className={"font-semibold " + (on ? "text-emerald-200" : "text-gray-300")}>{t.note}</span></div>); })}
                    </div>
                  </div>
                </div>
              </div>
              <div className="rise lg:col-span-3" style={{ transitionDelay: "200ms" }}>
                <div className="rounded-2xl border border-emerald-300/20 bg-black/40 backdrop-blur-md p-5 sm:p-7 h-full flex flex-col">
                  <div className="flex items-center justify-between mb-2">
                    <div className="text-sm font-medium text-emerald-50">Расчёт зачисления</div>
                    <div className="text-xs px-2.5 py-1 rounded-full bg-emerald-400/15 border border-emerald-300/40 text-emerald-200 font-medium">Комиссия {pctLabel}</div>
                  </div>
                  <Line label="Платёж от покупателя" sub="конвертация по курсу ЦБ" value={gross} rates={eff} border />
                  <Line label="Комиссия агента" sub={pctLabel + " от суммы"} value={comm} rates={eff} tone="emerald" accent border />
                  <div className="mt-4 pt-4 rounded-xl bg-emerald-400/10 border border-emerald-300/30 px-4 py-4 flex items-center justify-between gap-4">
                    <div>
                      <div className="text-base sm:text-lg font-semibold text-emerald-50">К зачислению на счёт</div>
                      <div className="text-[11px] sm:text-xs text-emerald-200/80 mt-0.5">рублями, по курсу ЦБ</div>
                    </div>
                    <Amount value={net} rates={eff} big accent tone="emerald" />
                  </div>
                  <div className="mt-5 text-[11px] sm:text-xs text-gray-400 leading-relaxed flex gap-2">
                    <IconInfo size={14} className="shrink-0 mt-0.5 text-emerald-300/70" />
                    <span>Цифры ориентировочные. <a href={TG} target="_blank" rel="noopener" className="text-emerald-200 underline decoration-emerald-400/40 underline-offset-2">Напишите, посчитаю под ваш контракт</a>.</span>
                  </div>
                </div>
              </div>
            </div>

            <div className="mt-6"><KpBlock tone="emerald" delay="240ms" title="Готовое КП, можно копировать" text={kp} /></div>

    function SunriseSeam() { return (<div className="sunrise-seam" aria-hidden="true"><div className="sunrise-glow"></div></div>); }
    function RoseSeam() { return (<div className="rose-seam" aria-hidden="true"><div className="rose-seam-glow"></div><div className="rose-seam-line"></div></div>); }

    /* ============ 4. ЮАНЬ: ВТБ ИЛИ АЛЬФА ============ */
    const ALFA_MARKUP = 0.01, ALFA_CONV = 0.006, ALFA_TRANSFER = 0.003;
    const SH_PAY = 0.0199, SH_VC = 0.002;
    const MARKUPS = [0.14, 0.20, 0.25];
    const VTB_BLUE = "#0a2896", ALFA_RED = "#d6281f";

    function routes(R, mV, mode, nWanted, budget) {
      const rateA = R + mV;
      const rateB = (R + ALFA_MARKUP) * (1 + ALFA_CONV) / (1 - ALFA_TRANSFER);
      let nA, nB, rubA, rubB;
      if (mode === "cny") { nA = nB = nWanted; rubA = nA * rateA; rubB = nB * rateB; }
      else { rubA = rubB = budget; nA = rateA > 0 ? budget / rateA : 0; nB = rateB > 0 ? budget / rateB : 0; }
      const aWins = rateA < rateB;
      const diffRub = Math.abs(rubA - rubB), diffCny = Math.abs(nA - nB);
      const saveRub = mode === "cny" ? diffRub : diffCny * R;
      const saveCny = mode === "cny" ? (R > 0 ? diffRub / R : 0) : diffCny;
      const savePct = mode === "cny" ? (Math.max(rubA, rubB) > 0 ? (diffRub / Math.max(rubA, rubB)) * 100 : 0)
                                     : (Math.max(nA, nB) > 0 ? (diffCny / Math.max(nA, nB)) * 100 : 0);
      return { rateA, rateB, nA, nB, rubA, rubB, aWins, saveRub, saveCny, savePct };
    }
    function shanghai(n, R) {
      const payCny = n * SH_PAY, vcCny = n * SH_VC;
      return { payCny, vcCny, payRub: payCny * R, vcRub: vcCny * R, totalCny: payCny + vcCny, totalRub: (payCny + vcCny) * R };
    }

    function CommRowLight({ label, sub, rubValue, cnyValue, zero, color, line }) {
      return (
        <div className="flex items-start justify-between gap-3 py-2.5" style={{ borderBottom: "1px solid " + (line || "#efe1cd") }}>
          <div className="min-w-0">
            <div className="text-[13px] sm:text-sm ink">{label}</div>
            {sub && <div className="text-[11px] ink-3 mt-0.5">{sub}</div>}
          </div>
          <div className="text-right shrink-0">
            {zero ? (<div className="text-[13px] sm:text-sm font-semibold" style={{ color: "#1f7a4d" }}>0 ₽</div>) : (
              <React.Fragment>
                <div className="text-[13px] sm:text-sm font-semibold tabular-nums" style={{ color: color || "#33201a" }}>{rub(rubValue)}</div>
                <div className="text-[11px] ink-3 tabular-nums">≈ {cny(cnyValue)}</div>
              </React.Fragment>
            )}
          </div>
        </div>
      );
    }

    function Compare() {
      const moex = useMoexCny();
      const { rates: cbr, status: cbrStatus } = useCbr();
      const [useCustom, setUseCustom] = useState(false);
      const [customRate, setCustomRate] = useState("");
      const [mode, setMode] = useState("cny");
      const [amtCny, setAmtCny] = useState("100000");
      const [amtRub, setAmtRub] = useState("1000000");
      const [vtbMarkup, setVtbMarkup] = useState(0.20);

      const baseAuto = moex.status === "ok" && moex.price ? moex.price : cbr.CNY;
      const R = useCustom ? parseNum(customRate, baseAuto) : baseAuto;
      const srcLabel = useCustom ? "свой курс" : (moex.status === "ok" ? "Мосбиржа, CNYRUB_TOM" : "курс ЦБ, биржа недоступна");
      const nWanted = parseNum(amtCny, 0), budget = parseNum(amtRub, 0);

      const r = routes(R, vtbMarkup, mode, nWanted, budget);
      const scenarios = MARKUPS.map((m) => Object.assign({ markup: m }, routes(R, m, mode, nWanted, budget)));

      const A_base = r.nA * R, A_markup = r.nA * vtbMarkup;
      const B_bought = r.nB / (1 - ALFA_TRANSFER);
      const B_base = B_bought * R, B_markup = B_bought * ALFA_MARKUP;
      const B_conv = B_bought * (R + ALFA_MARKUP) * ALFA_CONV;
      const B_transferCny = B_bought * ALFA_TRANSFER, B_transferRub = B_transferCny * (R + ALFA_MARKUP);
      const totalCommA = r.rubA - r.nA * R, totalCommB = r.rubB - r.nB * R;
      const pctA = r.nA * R > 0 ? (totalCommA / (r.nA * R)) * 100 : 0;
      const pctB = r.nB * R > 0 ? (totalCommB / (r.nB * R)) * 100 : 0;
      const breakEven = r.rateB - R;
      const shA = shanghai(r.nA, R), shB = shanghai(r.nB, R);
      const fullA = r.rubA + shA.totalRub, fullB = r.rubB + shB.totalRub;

      const kp = [
        "Иван Иванович, добрый день!",
        "",
        (r.aWins
          ? "Юань выгоднее покупать в ВТБ: экономия " + rub(r.saveRub) + " (" + cny(r.saveCny) + "), это " + pctStr(r.savePct) + "."
          : "Юань выгоднее покупать в Альфа-Банке: экономия " + rub(r.saveRub) + " (" + cny(r.saveCny) + "), это " + pctStr(r.savePct) + "."),
        "",
        "БАЗА",
        "Курс " + rate4(R) + " за 1 ¥, " + (useCustom ? "задан вручную" : (moex.status === "ok" ? "биржевой Мосбиржи" + (moex.time ? ", " + moex.kind + " в " + moex.time : "") : "курс ЦБ")),
        mode === "cny" ? "Объём " + cny(nWanted) + " в ВТБ Шанхай" : "Бюджет " + rub(budget),
        "",
        "ЕСЛИ ПОКУПАТЬ В ВТБ",
        "• Наценка в курсе, " + Math.round(vtbMarkup * 100) + " коп. на юань: " + rub(A_markup),
        "• Конвертация: 0%",
        "• Перевод в ВТБ Шанхай: 0%, внутри банка",
        "Эффективный курс " + rate4(r.rateA) + ", " + (mode === "cny" ? "итого " + rub(r.rubA) : "получите " + cny(r.nA)),
        "",
        "ЕСЛИ ПОКУПАТЬ В АЛЬФА-БАНКЕ",
        "• Наценка в курсе, 1 коп. на юань: " + rub(B_markup),
        "• Конвертация 0,6%: " + rub(B_conv),
        "• Перевод в ВТБ 0,3%: " + rub(B_transferRub) + " (" + cny(B_transferCny) + ", держат в юанях)",
        "• Перевод в ВТБ Шанхай: 0%, внутри банка",
        "Эффективный курс " + rate4(r.rateB) + ", " + (mode === "cny" ? "итого " + rub(r.rubB) : "получите " + cny(r.nB)),
        "",
        (r.aWins ? "" : "Почему так. У ВТБ комиссии нулевые, но наценка сидит в курсе и съедает больше, чем 0,6% и 0,3% у Альфы. ВТБ сравнялся бы при наценке " + (breakEven * 100).toFixed(1).replace(".", ",") + " коп., а берёт от 14 до 25."),
        "",
        "ПРИ РАЗНЫХ НАЦЕНКАХ ВТБ",
      ].concat(scenarios.map((s) => "• " + Math.round(s.markup * 100) + " коп.: " + (mode === "cny"
          ? "ВТБ " + rub(s.rubA) + ", Альфа " + rub(s.rubB) + ", разница " + rub(s.saveRub)
          : "ВТБ " + cny(s.nA) + ", Альфа " + cny(s.nB) + ", разница " + cny(s.saveCny))))
        .concat([
          "",
          "КОМИССИИ ВТБ ШАНХАЙ ПРИ ОТПРАВКЕ",
          "• Платёж 1,99%: " + rub(shA.payRub) + " (" + cny(shA.payCny) + ")",
          "• Валютный контроль 0,2%: " + rub(shA.vcRub) + " (" + cny(shA.vcCny) + ")",
          "Вместе 2,19%, это " + rub(shA.totalRub) + ". Одинаково для обоих вариантов, на выбор банка не влияет.",
          mode === "cny" ? "Полная стоимость: через ВТБ " + rub(fullA) + ", через Альфу " + rub(fullB) + "." : "",
          "",
          "Тарифы зависят от плана, объёма и дня. Финальные цифры фиксируем перед сделкой.",
          "",
        ]).concat(SIGN).join("\n");

      const winColor = r.aWins ? VTB_BLUE : ALFA_RED;

      return (
        <section id="compare" className="compare-bg relative w-full overflow-hidden pt-16 pb-24 md:pt-20 md:pb-28">
          <div className="relative z-10 w-full max-w-5xl mx-auto px-4 sm:px-6 md:px-8">

            <div className="rise text-center max-w-3xl mx-auto mb-10" style={{ transitionDelay: "0ms" }}>
              <div className="inline-flex items-center gap-2 mb-5 px-3.5 py-1.5 rounded-full text-[11px] sm:text-xs font-semibold tracking-[0.2em] uppercase" style={{ background: "rgba(198,62,45,0.10)", border: "1px solid rgba(198,62,45,0.30)", color: "#a32e22" }}><IconScale size={15} />Покупка юаня</div>
              <h2 className="text-3xl sm:text-4xl md:text-5xl font-semibold tracking-tight mb-4 ink" style={{ letterSpacing: "-0.03em" }}>Где покупать юани выгоднее</h2>
              <p className="text-base sm:text-lg ink-2">Два пути до <span className="font-medium ink">ВТБ Шанхай</span>: купить юань в ВТБ или купить в Альфа-Банке и перевести. Считаем со всеми комиссиями.</p>
            </div>

            <div className="rise mb-6" style={{ transitionDelay: "60ms" }}>
              <div className="rounded-2xl beige-card p-5 sm:p-6">
                <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                  <div className="flex items-center gap-2 text-sm ink">
                    <IconChart size={16} style={{ color: "#b5342b" }} />
                    <span className="font-medium">Базовый курс юаня</span>
                    <span className="ink-3">· {srcLabel}</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <button onClick={moex.refresh} className="inline-flex items-center gap-1.5 text-xs sm:text-sm ink-2 hover:ink"><IconRefresh size={14} className={moex.status === "loading" ? "animate-spin" : ""} />обновить</button>
                    <a href={MOEX_LINK} target="_blank" rel="noopener" className="inline-flex items-center gap-1.5 text-xs sm:text-sm underline underline-offset-4" style={{ color: "#b5342b" }}>moex.com<IconExt size={14} /></a>
                  </div>
                </div>
                <div className="grid sm:grid-cols-3 gap-3">
                  <div className="rounded-xl px-3 py-3 text-center" style={{ background: "rgba(198,62,45,0.07)", border: "1px solid rgba(198,62,45,0.22)" }}>
                    <div className="text-[11px] sm:text-xs mb-1" style={{ color: "#a32e22" }}>Мосбиржа · CNYRUB_TOM</div>
                    <div className="text-lg sm:text-2xl font-bold tabular-nums ink">{moex.status === "ok" ? rate4(moex.price) : (moex.status === "loading" ? "загрузка…" : "н/д")}</div>
                    <div className="text-[11px] ink-3 mt-0.5">{moex.status === "ok" ? (moex.kind + (moex.time ? ", " + moex.time : "")) : "тянем данные"}</div>
                  </div>
                  <div className="rounded-xl beige-soft px-3 py-3 text-center">
                    <div className="text-[11px] sm:text-xs ink-3 mb-1">Курс ЦБ РФ</div>
                    <div className="text-lg sm:text-2xl font-bold tabular-nums ink">{cbrStatus === "loading" ? "загрузка…" : rate4(cbr.CNY)}</div>
                    <div className="text-[11px] ink-3 mt-0.5">справочно</div>
                  </div>
                  <div className="rounded-xl beige-soft px-3 py-3">
                    <label className="flex items-center gap-2 cursor-pointer select-none mb-2">
                      <input type="checkbox" checked={useCustom} onChange={(e) => { setUseCustom(e.target.checked); if (e.target.checked && !customRate) setCustomRate(baseAuto.toFixed(4)); }} className="w-4 h-4" style={{ accentColor: "#b5342b" }} />
                      <span className="text-[11px] sm:text-xs ink-2">Свой курс, ₽ за 1 ¥</span>
                    </label>
                    <input type="number" inputMode="decimal" step="0.0001" disabled={!useCustom} value={customRate} onChange={(e) => setCustomRate(e.target.value)} placeholder={baseAuto.toFixed(4)} className={"w-full rounded-lg px-3 py-2 tabular-nums text-center ink outline-none " + (useCustom ? "" : "opacity-50")} style={{ background: "#fffdf9", border: "1px solid " + (useCustom ? "rgba(198,62,45,0.35)" : "#e7d5bd") }} />
                  </div>
                </div>
                <div className="mt-3 text-[11px] sm:text-xs ink-3 flex gap-2">
                  <IconInfo size={13} className="shrink-0 mt-0.5" style={{ color: "#b5342b" }} />
                  <span>Банки покупают юань на бирже и добавляют наценку, поэтому считаем от биржевого курса. Он тянется автоматически, вне сессии показываем закрытие{moex.lot ? ". Лот " + nf0.format(moex.lot) + " ¥" : ""}.</span>
                </div>
              </div>
            </div>

            <div className="rise mb-6" style={{ transitionDelay: "110ms" }}>
              <div className="rounded-2xl beige-card p-5 sm:p-6 grid md:grid-cols-2 gap-6">
                <div>
                  <div className="text-sm font-medium ink mb-3">Что задаём</div>
                  <div className="grid grid-cols-2 gap-2 mb-4">
                    <button onClick={() => setMode("cny")} className="rounded-xl py-2.5 text-sm transition-all" style={mode === "cny" ? { background: "#2a1712", color: "#fdf4e8", border: "1px solid #2a1712", fontWeight: 600 } : { background: "rgba(255,255,255,0.5)", border: "1px solid #ddc9ad", color: "#5b4234" }}>Сумму в юанях ¥</button>
                    <button onClick={() => setMode("rub")} className="rounded-xl py-2.5 text-sm transition-all" style={mode === "rub" ? { background: "#2a1712", color: "#fdf4e8", border: "1px solid #2a1712", fontWeight: 600 } : { background: "rgba(255,255,255,0.5)", border: "1px solid #ddc9ad", color: "#5b4234" }}>Бюджет в рублях ₽</button>
                  </div>
                  <div className="text-sm font-medium ink mb-2">{mode === "cny" ? "Сколько юаней нужно в Шанхае" : "Сколько рублей готовы потратить"}</div>
                  <div className="relative">
                    <input type="number" inputMode="decimal" min="0" value={mode === "cny" ? amtCny : amtRub} onChange={(e) => mode === "cny" ? setAmtCny(e.target.value) : setAmtRub(e.target.value)} className="w-full rounded-xl pl-4 pr-12 py-3.5 text-xl sm:text-2xl font-semibold tabular-nums ink outline-none" style={{ background: "#fffdf9", border: "1px solid #ddc9ad" }} />
                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xl ink-3">{mode === "cny" ? "¥" : "₽"}</span>
                  </div>
                  <div className="text-xs ink-3 mt-2 tabular-nums">{mode === "cny" ? "≈ " + rub(nWanted * R) : "≈ " + cny(budget / (R || 1))}</div>
                </div>
                <div>
                  <div className="flex items-baseline justify-between mb-3">
                    <div className="text-sm font-medium ink">Наценка ВТБ к курсу биржи</div>
                    <div className="text-lg font-bold tabular-nums" style={{ color: VTB_BLUE }}>{Math.round(vtbMarkup * 100)} коп.</div>
                  </div>
                  <input type="range" min="14" max="25" step="1" value={Math.round(vtbMarkup * 100)} onChange={(e) => setVtbMarkup(parseInt(e.target.value, 10) / 100)} className="w-full" style={{ accentColor: VTB_BLUE }} />
                  <div className="flex justify-between text-[11px] ink-3 mt-1"><span>14 коп.</span><span>25 коп.</span></div>
                  <div className="mt-4 rounded-xl beige-soft p-3.5 text-[12px] leading-relaxed ink-2">
                    ВТБ добавляет к биржевому курсу <span className="ink font-medium">от 14 до 25 копеек</span> на юань, точная цифра зависит от дня и объёма. Альфа добавляет <span className="ink font-medium">1 копейку</span>, но берёт комиссии сверху.
                  </div>
                </div>
              </div>
            </div>

            <div className="grid md:grid-cols-2 gap-4 sm:gap-6 mb-6">
              <div className="rise" style={{ transitionDelay: "160ms" }}>
                <div className={"rounded-2xl card-vtb h-full flex flex-col p-5 sm:p-6 " + (r.aWins ? "win-vtb" : "")}>
                  <div className="flex items-start justify-between gap-3 mb-1">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full" style={{ background: VTB_BLUE }}></span>
                      <div className="text-base sm:text-lg font-semibold ink">Покупаем юань в ВТБ</div>
                    </div>
                    {r.aWins && (<span className="shrink-0 inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-full text-white" style={{ background: VTB_BLUE }}><IconTrophy size={13} />Выгоднее</span>)}
                  </div>
                  <div className="text-[12px] ink-3 mb-4">и сразу отправляем в ВТБ Шанхай</div>
                  <div className="mb-3 inline-flex items-center gap-2 text-xs px-2.5 py-1 rounded-full self-start" style={{ background: "rgba(10,40,150,0.08)", border: "1px solid rgba(10,40,150,0.25)", color: VTB_BLUE }}>Эффективный курс: <span className="font-semibold tabular-nums">{rate4(r.rateA)}</span></div>
                  <div>
                    <CommRowLight label="Юань по курсу биржи" sub={cny(r.nA) + " по " + rate4(R)} rubValue={A_base} cnyValue={r.nA} />
                    <CommRowLight label="Наценка ВТБ в курсе" sub={Math.round(vtbMarkup * 100) + " коп. за юань"} rubValue={A_markup} cnyValue={A_markup / (R || 1)} color={VTB_BLUE} />
                    <CommRowLight label="Конвертация" sub="в ВТБ нет" zero />
                    <CommRowLight label="Перевод в ВТБ Шанхай" sub="внутри банка" zero />
                  </div>
                  <div className="mt-auto pt-4">
                    <div className="rounded-xl px-4 py-3.5" style={{ background: "rgba(10,40,150,0.06)", border: "1px solid rgba(10,40,150,0.20)" }}>
                      <div className="flex items-center justify-between gap-3">
                        <div className="text-sm font-medium ink-2">{mode === "cny" ? "Стоимость юаня" : "Получите юаней"}</div>
                        <div className="text-right">
                          <div className="text-xl sm:text-2xl font-bold tabular-nums" style={{ color: VTB_BLUE }}>{mode === "cny" ? rub(r.rubA) : cny(r.nA)}</div>
                          <div className="text-[11px] ink-3 tabular-nums">{mode === "cny" ? "за " + cny(r.nA) : "за " + rub(r.rubA)}</div>
                        </div>
                      </div>
                      <div className="mt-2 pt-2 flex items-center justify-between text-[11px] ink-3" style={{ borderTop: "1px solid rgba(10,40,150,0.15)" }}>
                        <span>Издержки сверх биржи</span><span className="tabular-nums ink-2">{rub(totalCommA)} · {pctStr(pctA)}</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div className="rise" style={{ transitionDelay: "220ms" }}>
                <div className={"rounded-2xl card-alfa h-full flex flex-col p-5 sm:p-6 " + (!r.aWins ? "win-alfa" : "")}>
                  <div className="flex items-start justify-between gap-3 mb-1">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full" style={{ background: ALFA_RED }}></span>
                      <div className="text-base sm:text-lg font-semibold ink">Покупаем юань в Альфа-Банке</div>
                    </div>
                    {!r.aWins && (<span className="shrink-0 inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-full text-white" style={{ background: ALFA_RED }}><IconTrophy size={13} />Выгоднее</span>)}
                  </div>
                  <div className="text-[12px] ink-3 mb-4">переводим в ВТБ, оттуда в ВТБ Шанхай</div>
                  <div className="mb-3 inline-flex items-center gap-2 text-xs px-2.5 py-1 rounded-full self-start" style={{ background: "rgba(214,40,31,0.08)", border: "1px solid rgba(214,40,31,0.25)", color: ALFA_RED }}>Эффективный курс: <span className="font-semibold tabular-nums">{rate4(r.rateB)}</span></div>
                  <div>
                    <CommRowLight label="Юань по курсу биржи" sub={"берём " + cny(B_bought) + " по " + rate4(R)} rubValue={B_base} cnyValue={B_bought} />
                    <CommRowLight label="Наценка Альфы в курсе" sub="1 коп. за юань" rubValue={B_markup} cnyValue={B_markup / (R || 1)} color={ALFA_RED} />
                    <CommRowLight label="Конвертация" sub="0,6% от суммы" rubValue={B_conv} cnyValue={B_conv / (R || 1)} color={ALFA_RED} />
                    <CommRowLight label="Перевод в ВТБ" sub="0,3%, держат в юанях" rubValue={B_transferRub} cnyValue={B_transferCny} color={ALFA_RED} />
                    <CommRowLight label="Перевод в ВТБ Шанхай" sub="внутри банка" zero />
                  </div>
                  <div className="mt-auto pt-4">
                    <div className="rounded-xl px-4 py-3.5" style={{ background: "rgba(214,40,31,0.06)", border: "1px solid rgba(214,40,31,0.20)" }}>
                      <div className="flex items-center justify-between gap-3">
                        <div className="text-sm font-medium ink-2">{mode === "cny" ? "Стоимость юаня" : "Получите юаней"}</div>
                        <div className="text-right">
                          <div className="text-xl sm:text-2xl font-bold tabular-nums" style={{ color: ALFA_RED }}>{mode === "cny" ? rub(r.rubB) : cny(r.nB)}</div>
                          <div className="text-[11px] ink-3 tabular-nums">{mode === "cny" ? "за " + cny(r.nB) : "за " + rub(r.rubB)}</div>
                        </div>
                      </div>
                      <div className="mt-2 pt-2 flex items-center justify-between text-[11px] ink-3" style={{ borderTop: "1px solid rgba(214,40,31,0.15)" }}>
                        <span>Издержки сверх биржи</span><span className="tabular-nums ink-2">{rub(totalCommB)} · {pctStr(pctB)}</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div className="rise mb-6" style={{ transitionDelay: "260ms" }}>
              <div className="rounded-2xl p-5 sm:p-7" style={{ background: "rgba(255,255,255,0.55)", border: "2px solid " + winColor }}>
                <div className="flex flex-col sm:flex-row sm:items-center gap-5">
                  <div className="flex items-center gap-3 shrink-0">
                    <div className="w-12 h-12 rounded-xl flex items-center justify-center" style={{ background: winColor }}><IconTrophy size={22} stroke="#fff" /></div>
                    <div>
                      <div className="text-[11px] uppercase tracking-wider ink-3">Вывод</div>
                      <div className="text-lg sm:text-xl font-bold" style={{ color: winColor }}>{r.aWins ? "Выгоднее покупать в ВТБ" : "Выгоднее покупать в Альфа-Банке"}</div>
                    </div>
                  </div>
                  <div className="flex-1 grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <div><div className="text-[11px] ink-3 mb-0.5">Экономия, ₽</div><div className="text-xl sm:text-2xl font-bold tabular-nums" style={{ color: winColor }}>{rub(r.saveRub)}</div></div>
                    <div><div className="text-[11px] ink-3 mb-0.5">Экономия, ¥</div><div className="text-xl sm:text-2xl font-bold tabular-nums" style={{ color: winColor }}>{cny(r.saveCny)}</div></div>
                    <div><div className="text-[11px] ink-3 mb-0.5">Разница</div><div className="text-xl sm:text-2xl font-bold tabular-nums" style={{ color: winColor }}>{pctStr(r.savePct)}</div></div>
                  </div>
                </div>
                <div className="mt-4 pt-4 text-[13px] sm:text-sm ink-2 leading-relaxed" style={{ borderTop: "1px solid #e7d5bd" }}>
                  ВТБ сравнялся бы при наценке <span className="font-semibold ink tabular-nums">{(breakEven * 100).toFixed(1).replace(".", ",")} коп.</span> Берёт от 14 до 25. Значит, переплата всегда.
                </div>
              </div>
            </div>

            <div className="rise mb-6" style={{ transitionDelay: "300ms" }}>
              <div className="rounded-2xl beige-card p-5 sm:p-6">
                <div className="flex items-center gap-2 mb-1"><IconScale size={17} style={{ color: "#b5342b" }} /><div className="text-base sm:text-lg font-semibold ink">Разница при 14, 20 и 25 копейках</div></div>
                <div className="text-[12px] ink-3 mb-4">Три самых частых наценки{mode === "cny" ? ", для " + cny(nWanted) : ", для " + rub(budget)}.</div>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm" style={{ minWidth: "560px" }}>
                    <thead>
                      <tr className="text-left" style={{ color: "#8a705f" }}>
                        <th className="font-medium pb-2 pr-3">Наценка</th>
                        <th className="font-medium pb-2 px-3 text-right" style={{ color: VTB_BLUE }}>В ВТБ</th>
                        <th className="font-medium pb-2 px-3 text-right" style={{ color: ALFA_RED }}>В Альфе</th>
                        <th className="font-medium pb-2 pl-3 text-right">Разница</th>
                      </tr>
                    </thead>
                    <tbody>
                      {scenarios.map((s, i) => {
                        const active = Math.round(s.markup * 100) === Math.round(vtbMarkup * 100);
                        return (
                          <tr key={i} style={{ borderTop: "1px solid #efe1cd", background: active ? "rgba(198,62,45,0.06)" : "transparent" }}>
                            <td className="py-3 pr-3"><span className="inline-flex items-center gap-2 ink font-medium">{Math.round(s.markup * 100)} коп.{active && <span className="text-[10px] px-1.5 py-0.5 rounded-full" style={{ background: "rgba(198,62,45,0.14)", color: "#a32e22" }}>сейчас</span>}</span></td>
                            <td className="py-3 px-3 text-right tabular-nums ink">{mode === "cny" ? rub(s.rubA) : cny(s.nA)}</td>
                            <td className="py-3 px-3 text-right tabular-nums ink">{mode === "cny" ? rub(s.rubB) : cny(s.nB)}</td>
                            <td className="py-3 pl-3 text-right">
                              <div className="font-bold tabular-nums" style={{ color: s.aWins ? VTB_BLUE : ALFA_RED }}>{mode === "cny" ? rub(s.saveRub) : cny(s.saveCny)}</div>
                              <div className="text-[11px] ink-3 tabular-nums">{pctStr(s.savePct)}</div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <div className="rise mb-6" style={{ transitionDelay: "330ms" }}>
              <div className="rounded-2xl p-5 sm:p-6" style={{ background: "rgba(255,252,247,0.9)", border: "1px solid rgba(198,62,45,0.28)", borderLeft: "4px solid #b5342b" }}>
                <div className="flex items-center gap-2 mb-1"><IconAlert size={17} style={{ color: "#b5342b" }} /><div className="text-base sm:text-lg font-semibold ink">Плюс комиссии самого ВТБ Шанхай</div></div>
                <div className="text-[13px] ink-2 mb-4">Когда юань уходит поставщику, банк удержит своё. Одинаково для обоих вариантов.</div>
                <div className="grid sm:grid-cols-3 gap-3">
                  <div className="rounded-xl beige-soft px-4 py-3">
                    <div className="text-[11px] ink-3 mb-1">Платёж, 1,99%</div>
                    <div className="text-lg font-bold tabular-nums ink">{rub(shA.payRub)}</div>
                    <div className="text-[11px] ink-3 tabular-nums">≈ {cny(shA.payCny)}</div>
                  </div>
                  <div className="rounded-xl beige-soft px-4 py-3">
                    <div className="text-[11px] ink-3 mb-1">Валютный контроль, 0,2%</div>
                    <div className="text-lg font-bold tabular-nums ink">{rub(shA.vcRub)}</div>
                    <div className="text-[11px] ink-3 tabular-nums">≈ {cny(shA.vcCny)}</div>
                  </div>
                  <div className="rounded-xl px-4 py-3" style={{ background: "rgba(198,62,45,0.08)", border: "1px solid rgba(198,62,45,0.25)" }}>
                    <div className="text-[11px] mb-1" style={{ color: "#a32e22" }}>Вместе 2,19%</div>
                    <div className="text-lg font-bold tabular-nums" style={{ color: "#b5342b" }}>{rub(shA.totalRub)}</div>
                    <div className="text-[11px] ink-3 tabular-nums">≈ {cny(shA.totalCny)}</div>
                  </div>
                </div>
                {mode === "cny" && (
                  <div className="mt-4 pt-4 grid sm:grid-cols-2 gap-3" style={{ borderTop: "1px solid #e7d5bd" }}>
                    <div className="flex items-center justify-between rounded-xl px-4 py-3" style={{ background: "rgba(10,40,150,0.06)", border: "1px solid rgba(10,40,150,0.20)" }}>
                      <div className="text-[13px] ink-2">Полностью через ВТБ</div>
                      <div className="text-base font-bold tabular-nums" style={{ color: VTB_BLUE }}>{rub(fullA)}</div>
                    </div>
                    <div className="flex items-center justify-between rounded-xl px-4 py-3" style={{ background: "rgba(214,40,31,0.06)", border: "1px solid rgba(214,40,31,0.20)" }}>
                      <div className="text-[13px] ink-2">Через Альфу</div>
                      <div className="text-base font-bold tabular-nums" style={{ color: ALFA_RED }}>{rub(fullB)}</div>
                    </div>
                  </div>
                )}
              </div>
            </div>

            <div className="mb-6"><KpBlock tone="beige" delay="360ms" title="Готовое КП, можно копировать" text={kp} /></div>

            <div className="rise" style={{ transitionDelay: "400ms" }}>
              <div className="rounded-2xl beige-card p-5 sm:p-6">
                <div className="flex items-center gap-2 mb-3"><IconInfo size={17} style={{ color: "#b5342b" }} /><div className="text-base font-semibold ink">Как считаем</div></div>
                <div className="text-[13px] sm:text-sm ink-2 leading-relaxed space-y-2.5">
                  <p>Банк покупает валюту на бирже и добавляет наценку. Поэтому считаем от биржевого курса, а не от курса ЦБ.</p>
                  <p><span className="font-semibold" style={{ color: VTB_BLUE }}>ВТБ:</span> наценка от 14 до 25 копеек сидит в курсе, конвертация 0%, перевод в Шанхай 0%.</p>
                  <p><span className="font-semibold" style={{ color: ALFA_RED }}>Альфа:</span> наценка 1 копейка, конвертация 0,6%, перевод в ВТБ 0,3%. Последнюю держат в юанях, поэтому покупаем чуть больше нужного.</p>
                  <p>Сравниваем по эффективному курсу: во сколько обходится юань в Шанхае со всеми издержками. Проценты сравнивать бесполезно, у ВТБ комиссия нулевая, но наценка в курсе съедает больше.</p>
                </div>
              </div>
            </div>

          </div>
        </section>
      );
    }

    /* ============ 5. КЛИРИНГ ============ */
    const CLEARING_PCT = 0.009, CLEARING_MIN = 20000;
    const PROVINCES = ["Шаньдун","Сычуань","Хэйлунцзян","Цзилинь","Чжэцзян","Хэбэй","Аньхой","Шанхай","Гуандун","Пекин","Синьцзян","Цзянсу","Шэньси","Хэнань","Фуцзянь","Внутренняя Монголия"];

    function Clearing() {
      const { rates: cbr, cbrDate, status: cbrStatus } = useCbr();
      const moex = useMoexCny();
      const [mode, setMode] = useState("cny");
      const [amtCny, setAmtCny] = useState("100000");
      const [amtRub, setAmtRub] = useState("1500000");
      const [vtbMarkup, setVtbMarkup] = useState(0.20);

      const Rcb = cbr.CNY;
      const Rmoex = moex.status === "ok" && moex.price ? moex.price : cbr.CNY;
      const dateStr = cbrDate ? new Date(cbrDate).toLocaleDateString("ru-RU") : "";

      // стоимость одного юаня через ВТБ Шанхай: покупка с наценкой плюс 2,19% комиссий банка
      const vtbPerCny = (1 + SH_PAY + SH_VC) * (Rmoex + vtbMarkup);

      let N, clearBody, clearComm, clearTotal, vtbTotal;
      if (mode === "cny") {
        N = parseNum(amtCny, 0);
        clearBody = N * Rcb;
        clearComm = Math.max(clearBody * CLEARING_PCT, CLEARING_MIN);
        clearTotal = clearBody + clearComm;
        vtbTotal = N * vtbPerCny;
      } else {
        const budget = parseNum(amtRub, 0);
        // сколько юаней дойдёт при клиринге: budget = N*Rcb + max(N*Rcb*0.009, 20000)
        const nIfPct = budget / (Rcb * (1 + CLEARING_PCT));
        const nIfMin = (budget - CLEARING_MIN) / Rcb;
        N = (nIfPct * Rcb * CLEARING_PCT >= CLEARING_MIN) ? nIfPct : Math.max(nIfMin, 0);
        clearBody = N * Rcb;
        clearComm = Math.max(clearBody * CLEARING_PCT, CLEARING_MIN);
        clearTotal = clearBody + clearComm;
        vtbTotal = budget;
      }
      const nVtb = mode === "cny" ? N : (vtbPerCny > 0 ? vtbTotal / vtbPerCny : 0);
      const commPct = clearBody > 0 ? (clearComm / clearBody) * 100 : 0;
      const minApplied = clearBody * CLEARING_PCT < CLEARING_MIN;

      const clearWins = mode === "cny" ? clearTotal < vtbTotal : N > nVtb;
      const saveRub = mode === "cny" ? Math.abs(vtbTotal - clearTotal) : Math.abs(N - nVtb) * Rcb;
      const saveCny = mode === "cny" ? (Rcb > 0 ? Math.abs(vtbTotal - clearTotal) / Rcb : 0) : Math.abs(N - nVtb);
      const savePct = mode === "cny" ? (Math.max(vtbTotal, clearTotal) > 0 ? Math.abs(vtbTotal - clearTotal) / Math.max(vtbTotal, clearTotal) * 100 : 0)
                                     : (Math.max(N, nVtb) > 0 ? Math.abs(N - nVtb) / Math.max(N, nVtb) * 100 : 0);
      // с какой суммы клиринг начинает выигрывать
      const denom = vtbPerCny - Rcb * (1 + CLEARING_PCT);
      const denomMin = vtbPerCny - Rcb;
      const thresholdCny = denomMin > 0 ? CLEARING_MIN / denomMin : 0;
      const winColor = clearWins ? ALFA_RED : VTB_BLUE;

      const kp = [
        "Иван Иванович, добрый день!",
        "",
        (clearWins
          ? "Клиринг через Альфа-Банк дешевле платежа через ВТБ Шанхай на " + rub(saveRub) + " (" + cny(saveCny) + "), это " + pctStr(savePct) + "."
          : "На такой сумме клиринг пока не выигрывает, минимальная комиссия 20 000 ₽ съедает выгоду. Он становится дешевле примерно от " + cny(thresholdCny) + "."),
        "",
        "КАК УСТРОЕН КЛИРИНГ",
        "Вы отправляете рубли из Альфа-Банка. Поставщику приходят деньги от банка материкового Китая. Конвертация строго по курсу ЦБ, комиссия 0,9%, но не менее 20 000 ₽. Других удержаний нет.",
        "По мере наработки объёма комиссию 0,9% можно обсуждать в сторону снижения.",
        "",
        "УСЛОВИЯ ПО ПОЛУЧАТЕЛЮ",
        "• Банк получателя должен быть китайским, материковый Китай. Подходит почти любой, кроме банков с американским участием.",
        "• Сам поставщик должен быть полностью китайской компанией: без иностранного участия среди учредителей, юрлиц-участников и в лице генерального директора.",
        "• Работаем по 16 провинциям: " + PROVINCES.join(", ") + ".",
        "",
        "РАСЧЁТ",
        "Сумма: " + cny(N) + ", по курсу ЦБ" + (dateStr ? " на " + dateStr : "") + " " + rate4(Rcb) + " это " + rub(clearBody),
        "Комиссия 0,9%" + (minApplied ? " (сработал минимум 20 000 ₽)" : "") + ": " + rub(clearComm) + ", по факту " + pctStr(commPct) + " от суммы",
        "ИТОГО: " + rub(clearTotal),
        "",
        "ЕСЛИ ИДТИ ЧЕРЕЗ ВТБ ШАНХАЙ",
        "Покупка юаня в ВТБ с наценкой " + Math.round(vtbMarkup * 100) + " коп. к бирже, плюс комиссии банка при отправке: платёж 1,99% и валютный контроль 0,2%.",
        "Один юань обходится в " + rate4(vtbPerCny) + " против " + rate4(clearTotal / (N || 1)) + " на клиринге.",
        "ИТОГО: " + rub(vtbTotal),
        "",
        (clearWins ? "ВЫГОДА КЛИРИНГА: " + rub(saveRub) + " (" + cny(saveCny) + "), " + pctStr(savePct) + "." : "На этой сумме выгоднее ВТБ, разница " + rub(saveRub) + "."),
        "",
        "Расчёт ориентировочный, финальные цифры фиксируем перед сделкой.",
        "",
      ].concat(SIGN).join("\n");

      return (
        <section id="clearing" className="clearing-bg relative w-full overflow-hidden pt-10 pb-24 md:pt-14 md:pb-28">
          <div className="relative z-10 w-full max-w-5xl mx-auto px-4 sm:px-6 md:px-8">

            <div className="rise text-center max-w-3xl mx-auto mb-10" style={{ transitionDelay: "0ms" }}>
              <div className="inline-flex items-center gap-2 mb-5 px-3.5 py-1.5 rounded-full text-[11px] sm:text-xs font-semibold tracking-[0.2em] uppercase" style={{ background: "rgba(214,40,31,0.10)", border: "1px solid rgba(214,40,31,0.32)", color: "#a32e22" }}><IconMap size={15} />Клиринг через Альфа-Банк</div>
              <h2 className="text-3xl sm:text-4xl md:text-5xl font-semibold tracking-tight mb-4 ink" style={{ letterSpacing: "-0.03em" }}>Рубли из Альфы, деньги из Китая</h2>
              <p className="text-base sm:text-lg ink-2">Вы отправляете рубли из Альфа-Банка, а поставщику приходят деньги от банка материкового Китая. Конвертация <span className="font-medium ink">строго по курсу ЦБ</span>, комиссия 0,9%, но не менее 20 000 ₽.</p>
            </div>

            <div className="rise mb-6" style={{ transitionDelay: "50ms" }}>
              <div className="rounded-2xl rose-card p-5 sm:p-6">
                <div className="text-sm font-semibold ink mb-4">Как идут деньги</div>
                <div className="grid sm:grid-cols-3 gap-3">
                  {[
                    { n: "1", t: "Рубли из Альфа-Банка", d: "Вы платите рублями со своего счёта, никакой валюты покупать не нужно." },
                    { n: "2", t: "Конвертация по ЦБ", d: "Курс берётся строго по ЦБ на момент перевода, наценки в курсе нет." },
                    { n: "3", t: "Деньги от банка КНР", d: "Поставщик получает средства от банка материкового Китая, внутренним платежом." },
                  ].map((s, i) => (
                    <div key={i} className="rounded-xl rose-soft p-4">
                      <div className="w-7 h-7 rounded-full flex items-center justify-center text-[12px] font-bold text-white mb-2.5" style={{ background: ALFA_RED }}>{s.n}</div>
                      <div className="text-[14px] font-semibold ink mb-1">{s.t}</div>
                      <div className="text-[12.5px] ink-2 leading-relaxed">{s.d}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="rise grid sm:grid-cols-3 gap-4 mb-6" style={{ transitionDelay: "80ms" }}>
              {[
                { t: "Курс ЦБ без наценки", d: "Конвертация по курсу ЦБ на момент перевода. Банковская наценка в курсе не появляется." },
                { t: "Одна комиссия 0,9%", d: "Минимум 20 000 ₽. Ни за платёж, ни за валютный контроль отдельно не берут." },
                { t: "Ставку можно снизить", d: "По мере наработки объёма комиссию 0,9% обсуждаем в сторону уменьшения." },
              ].map((x, i) => (
                <div key={i} className="rounded-2xl card-clearing p-5">
                  <div className="w-10 h-10 rounded-xl flex items-center justify-center mb-3" style={{ background: "rgba(214,40,31,0.12)", border: "1px solid rgba(214,40,31,0.30)" }}><IconCheck size={18} stroke={ALFA_RED} /></div>
                  <div className="text-base font-semibold ink mb-1.5">{x.t}</div>
                  <div className="text-[13px] ink-2 leading-relaxed">{x.d}</div>
                </div>
              ))}
            </div>

            <div className="rise mb-6" style={{ transitionDelay: "100ms" }}>
              <div className="rounded-2xl p-5 sm:p-6" style={{ background: "#fffbfa", border: "1px solid rgba(214,40,31,0.28)", borderLeft: "4px solid " + ALFA_RED }}>
                <div className="flex items-center gap-2 mb-3"><IconAlert size={17} style={{ color: ALFA_RED }} /><div className="text-base sm:text-lg font-semibold ink">Кому можно платить</div></div>
                <div className="grid md:grid-cols-2 gap-4">
                  <div className="flex gap-2.5">
                    <span className="mt-2 w-1.5 h-1.5 rounded-full shrink-0" style={{ background: ALFA_RED }}></span>
                    <div className="text-[13.5px] ink-2 leading-relaxed"><span className="ink font-semibold">Банк получателя китайский, материковый.</span> Подходит почти любой, кроме банков с американским участием.</div>
                  </div>
                  <div className="flex gap-2.5">
                    <span className="mt-2 w-1.5 h-1.5 rounded-full shrink-0" style={{ background: ALFA_RED }}></span>
                    <div className="text-[13.5px] ink-2 leading-relaxed"><span className="ink font-semibold">Поставщик полностью китайский.</span> Без иностранного участия: ни среди учредителей и юрлиц-участников, ни в лице генерального директора.</div>
                  </div>
                </div>
              </div>
            </div>

            <div className="rise mb-6" style={{ transitionDelay: "120ms" }}>
              <div className="rounded-2xl rose-card p-5 sm:p-6">
                <div className="text-sm font-semibold ink mb-3">16 провинций, куда работает клиринг</div>
                <div className="flex flex-wrap gap-2">
                  {PROVINCES.map((p) => (<span key={p} className="px-3 py-1.5 rounded-full text-xs sm:text-[13px] font-medium" style={{ background: "rgba(214,40,31,0.07)", border: "1px solid rgba(214,40,31,0.22)", color: "#8c3a30" }}>{p}</span>))}
                </div>
              </div>
            </div>

            <div className="rise mb-6" style={{ transitionDelay: "140ms" }}>
              <div className="rounded-2xl rose-card p-5 sm:p-6 grid md:grid-cols-2 gap-6">
                <div>
                  <div className="text-sm font-medium ink mb-3">Что задаём</div>
                  <div className="grid grid-cols-2 gap-2 mb-4">
                    <button onClick={() => setMode("cny")} className="rounded-xl py-2.5 text-sm transition-all" style={mode === "cny" ? { background: "#2a1712", color: "#fdf4e8", border: "1px solid #2a1712", fontWeight: 600 } : { background: "rgba(255,255,255,0.5)", border: "1px solid #eccfc9", color: "#5b4234" }}>Сумму в юанях ¥</button>
                    <button onClick={() => setMode("rub")} className="rounded-xl py-2.5 text-sm transition-all" style={mode === "rub" ? { background: "#2a1712", color: "#fdf4e8", border: "1px solid #2a1712", fontWeight: 600 } : { background: "rgba(255,255,255,0.5)", border: "1px solid #eccfc9", color: "#5b4234" }}>Бюджет в рублях ₽</button>
                  </div>
                  <div className="text-sm font-medium ink mb-2">{mode === "cny" ? "Сумма платежа поставщику" : "Бюджет на платёж"}</div>
                  <div className="relative">
                    <input type="number" inputMode="decimal" min="0" value={mode === "cny" ? amtCny : amtRub} onChange={(e) => mode === "cny" ? setAmtCny(e.target.value) : setAmtRub(e.target.value)} className="w-full rounded-xl pl-4 pr-12 py-3.5 text-xl sm:text-2xl font-semibold tabular-nums ink outline-none" style={{ background: "#fffdf9", border: "1px solid #eccfc9" }} />
                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xl ink-3">{mode === "cny" ? "¥" : "₽"}</span>
                  </div>
                  <div className="text-xs ink-3 mt-2 tabular-nums">Курс ЦБ {cbrStatus === "loading" ? "загружается…" : rate4(Rcb)}{dateStr ? ", на " + dateStr : ""}</div>
                </div>
                <div>
                  <div className="flex items-baseline justify-between mb-3">
                    <div className="text-sm font-medium ink">Наценка ВТБ для сравнения</div>
                    <div className="text-lg font-bold tabular-nums" style={{ color: VTB_BLUE }}>{Math.round(vtbMarkup * 100)} коп.</div>
                  </div>
                  <input type="range" min="14" max="25" step="1" value={Math.round(vtbMarkup * 100)} onChange={(e) => setVtbMarkup(parseInt(e.target.value, 10) / 100)} className="w-full" style={{ accentColor: VTB_BLUE }} />
                  <div className="flex justify-between text-[11px] ink-3 mt-1"><span>14 коп.</span><span>25 коп.</span></div>
                  <div className="mt-4 rounded-xl rose-soft p-3.5 text-[12px] leading-relaxed ink-2">
                    Сравниваем с обычным путём: купить юань в ВТБ по биржевому курсу с наценкой, затем отправить из ВТБ Шанхай, где банк удержит 1,99% за платёж и 0,2% за валютный контроль. Биржевой курс {moex.status === "ok" ? rate4(Rmoex) : "загружается"}.
                  </div>
                </div>
              </div>
            </div>

            <div className="grid md:grid-cols-2 gap-4 sm:gap-6 mb-6">
              <div className="rise" style={{ transitionDelay: "180ms" }}>
                <div className={"rounded-2xl card-clearing h-full flex flex-col p-5 sm:p-6 " + (clearWins ? "win-clearing" : "")}>
                  <div className="flex items-start justify-between gap-3 mb-1">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full" style={{ background: ALFA_RED }}></span>
                      <div className="text-base sm:text-lg font-semibold ink">Клиринг через Альфа-Банк</div>
                    </div>
                    {clearWins && (<span className="shrink-0 inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-full text-white" style={{ background: ALFA_RED }}><IconTrophy size={13} />Выгоднее</span>)}
                  </div>
                  <div className="text-[12px] ink-3 mb-4">рубли из Альфы, поставщику платит банк КНР</div>
                  <div>
                    <CommRowLight label="Сумма платежа по курсу ЦБ" sub={cny(N) + " по " + rate4(Rcb)} rubValue={clearBody} cnyValue={N} line="#f6e2de" />
                    <CommRowLight label="Комиссия клиринга" sub={minApplied ? "0,9%, но сработал минимум 20 000 ₽" : "0,9% от суммы"} rubValue={clearComm} cnyValue={clearComm / (Rcb || 1)} color={ALFA_RED} line="#f6e2de" />
                    <CommRowLight label="Наценка к курсу" sub="её нет, идём по ЦБ" zero line="#f6e2de" />
                    <CommRowLight label="Валютный контроль" sub="отдельно не берётся" zero line="#f6e2de" />
                  </div>
                  <div className="mt-auto pt-4">
                    <div className="rounded-xl px-4 py-3.5" style={{ background: "rgba(214,40,31,0.07)", border: "1px solid rgba(214,40,31,0.22)" }}>
                      <div className="flex items-center justify-between gap-3">
                        <div className="text-sm font-medium ink-2">Итого к оплате</div>
                        <div className="text-right">
                          <div className="text-xl sm:text-2xl font-bold tabular-nums" style={{ color: ALFA_RED }}>{rub(clearTotal)}</div>
                          <div className="text-[11px] ink-3 tabular-nums">за {cny(N)}</div>
                        </div>
                      </div>
                      <div className="mt-2 pt-2 flex items-center justify-between text-[11px] ink-3" style={{ borderTop: "1px solid rgba(214,40,31,0.18)" }}>
                        <span>Один юань обходится в</span><span className="tabular-nums ink-2">{rate4(clearTotal / (N || 1))}</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div className="rise" style={{ transitionDelay: "240ms" }}>
                <div className={"rounded-2xl card-vtb h-full flex flex-col p-5 sm:p-6 " + (!clearWins ? "win-vtb" : "")}>
                  <div className="flex items-start justify-between gap-3 mb-1">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full" style={{ background: VTB_BLUE }}></span>
                      <div className="text-base sm:text-lg font-semibold ink">Через ВТБ Шанхай</div>
                    </div>
                    {!clearWins && (<span className="shrink-0 inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-full text-white" style={{ background: VTB_BLUE }}><IconTrophy size={13} />Выгоднее</span>)}
                  </div>
                  <div className="text-[12px] ink-3 mb-4">покупка юаня в ВТБ, затем платёж из Шанхая</div>
                  <div>
                    <CommRowLight label="Юань по курсу биржи" sub={cny(nVtb) + " по " + rate4(Rmoex)} rubValue={nVtb * Rmoex} cnyValue={nVtb} />
                    <CommRowLight label="Наценка ВТБ в курсе" sub={Math.round(vtbMarkup * 100) + " коп. за юань"} rubValue={nVtb * vtbMarkup} cnyValue={nVtb * vtbMarkup / (Rmoex || 1)} color={VTB_BLUE} />
                    <CommRowLight label="Платёж из ВТБ Шанхай" sub="1,99% от суммы" rubValue={nVtb * SH_PAY * (Rmoex + vtbMarkup)} cnyValue={nVtb * SH_PAY} color={VTB_BLUE} />
                    <CommRowLight label="Валютный контроль" sub="0,2% от суммы" rubValue={nVtb * SH_VC * (Rmoex + vtbMarkup)} cnyValue={nVtb * SH_VC} color={VTB_BLUE} />
                  </div>
                  <div className="mt-auto pt-4">
                    <div className="rounded-xl px-4 py-3.5" style={{ background: "rgba(10,40,150,0.06)", border: "1px solid rgba(10,40,150,0.20)" }}>
                      <div className="flex items-center justify-between gap-3">
                        <div className="text-sm font-medium ink-2">Итого к оплате</div>
                        <div className="text-right">
                          <div className="text-xl sm:text-2xl font-bold tabular-nums" style={{ color: VTB_BLUE }}>{rub(vtbTotal)}</div>
                          <div className="text-[11px] ink-3 tabular-nums">за {cny(nVtb)}</div>
                        </div>
                      </div>
                      <div className="mt-2 pt-2 flex items-center justify-between text-[11px] ink-3" style={{ borderTop: "1px solid rgba(10,40,150,0.15)" }}>
                        <span>Один юань обходится в</span><span className="tabular-nums ink-2">{rate4(vtbPerCny)}</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div className="rise mb-6" style={{ transitionDelay: "280ms" }}>
              <div className="rounded-2xl p-5 sm:p-7" style={{ background: "rgba(255,255,255,0.6)", border: "2px solid " + winColor }}>
                <div className="flex flex-col sm:flex-row sm:items-center gap-5">
                  <div className="flex items-center gap-3 shrink-0">
                    <div className="w-12 h-12 rounded-xl flex items-center justify-center" style={{ background: winColor }}><IconTrophy size={22} stroke="#fff" /></div>
                    <div>
                      <div className="text-[11px] uppercase tracking-wider ink-3">Вывод</div>
                      <div className="text-lg sm:text-xl font-bold" style={{ color: winColor }}>{clearWins ? "Клиринг дешевле" : "На этой сумме дешевле ВТБ"}</div>
                    </div>
                  </div>
                  <div className="flex-1 grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <div><div className="text-[11px] ink-3 mb-0.5">{mode === "cny" ? "Разница, ₽" : "Разница, ₽"}</div><div className="text-xl sm:text-2xl font-bold tabular-nums" style={{ color: winColor }}>{rub(saveRub)}</div></div>
                    <div><div className="text-[11px] ink-3 mb-0.5">Разница, ¥</div><div className="text-xl sm:text-2xl font-bold tabular-nums" style={{ color: winColor }}>{cny(saveCny)}</div></div>
                    <div><div className="text-[11px] ink-3 mb-0.5">В процентах</div><div className="text-xl sm:text-2xl font-bold tabular-nums" style={{ color: winColor }}>{pctStr(savePct)}</div></div>
                  </div>
                </div>
                <div className="mt-4 pt-4 text-[13px] sm:text-sm ink-2 leading-relaxed" style={{ borderTop: "1px solid #f2ddd9" }}>
                  {clearWins
                    ? "Через ВТБ юань стоит " + rate4(vtbPerCny) + ", на клиринге " + rate4(clearTotal / (N || 1)) + ". Разница копится с каждого юаня."
                    : "Минимум 20 000 ₽ пока перевешивает. Клиринг становится дешевле примерно от " + cny(thresholdCny) + "."}
                </div>
              </div>
            </div>

            <div className="mb-6"><KpBlock tone="beige" delay="320ms" title="Готовое КП, можно копировать" text={kp} /></div>

            <div className="rise" style={{ transitionDelay: "360ms" }}>
              <div className="rounded-2xl rose-card p-5 sm:p-6 flex flex-col md:flex-row md:items-center gap-5">
                <div className="flex-1 text-sm ink-2 leading-relaxed"><span className="ink font-semibold">Подберу схему под вашу сделку.</span> Клиринг, прямой платёж или связка через агента, выбор зависит от суммы, провинции и сроков.</div>
                <div className="flex flex-wrap gap-3 shrink-0">
                  <a href={TG} target="_blank" rel="noopener" className="flex items-center gap-2 btn-ink rounded-full font-medium px-6 py-3 transition-colors">Обсудить платёж<IconArrow size={18} stroke="#fdf4e8" /></a>
                  <a href={PHONE} title={PHONE_TITLE} className="flex items-center gap-2 btn-outline-ink rounded-full px-5 py-3 text-sm transition-colors"><IconPhone size={18} />{PHONE_DISPLAY}</a>
                </div>
              </div>
            </div>

          </div>
        </section>
      );
    }

    function App() {
      useEffect(() => {
        const els = Array.prototype.slice.call(document.querySelectorAll(".reveal, .rise"));
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
        }, { threshold: 0.12 });
        els.forEach((el) => io.observe(el));
        return () => io.disconnect();
      }, []);
      return (<React.Fragment><Hero /><Pressure /><Calculator /><ExportCalculator /><SunriseSeam /><Compare /><RoseSeam /><Clearing /></React.Fragment>);
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    (function () {
      var src = document.getElementById("app-src").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      (0, eval)(out);
    })();
  </script>
</body>
</html>
