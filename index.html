    /* ---------- ПОКУПКА ЮАНЯ: У НАС ИЛИ В ВТБ ---------- */
    function routes(R, mV, byCny, nWanted, budget) {
      const rateA = R + mV;
      const rateB = (R + ALFA_MARKUP) * (1 + ALFA_CONV) / (1 - ALFA_TRANSFER);
      let nA, nB, rubA, rubB;
      if (byCny) { nA = nB = nWanted; rubA = nA * rateA; rubB = nB * rateB; }
      else { rubA = rubB = budget; nA = rateA > 0 ? budget / rateA : 0; nB = rateB > 0 ? budget / rateB : 0; }
      const aWins = rateA < rateB;
      const diffRub = Math.abs(rubA - rubB), diffCny = Math.abs(nA - nB);
      const saveRub = byCny ? diffRub : diffCny * R;
      const saveCny = byCny ? (R > 0 ? diffRub / R : 0) : diffCny;
      const savePct = byCny ? (Math.max(rubA, rubB) > 0 ? (diffRub / Math.max(rubA, rubB)) * 100 : 0)
                            : (Math.max(nA, nB) > 0 ? (diffCny / Math.max(nA, nB)) * 100 : 0);
      return { rateA, rateB, nA, nB, rubA, rubB, aWins, saveRub, saveCny, savePct };
    }

    function YuanPanel() {
      const moex = useMoexCny();
      const { rates: cbr, status: cbrStatus } = useCbr();
      const [mode, setMode] = useState("cny");
      const [amtCny, setAmtCny] = useState("100000");
      const [amtRub, setAmtRub] = useState("1000000");
      const [vtbMarkup, setVtbMarkup] = useState(0.20);
      const byCny = mode === "cny";

      const R = moex.status === "ok" && moex.price ? moex.price : cbr.CNY;
      const nWanted = parseNum(amtCny, 0), budget = parseNum(amtRub, 0);
      const r = routes(R, vtbMarkup, byCny, nWanted, budget);
      const scenarios = MARKUPS.map((m) => Object.assign({ markup: m }, routes(R, m, byCny, nWanted, budget)));

      const A_base = r.nA * R, A_markup = r.nA * vtbMarkup;
      const B_bought = r.nB / (1 - ALFA_TRANSFER);
      const B_base = B_bought * R, B_markup = B_bought * ALFA_MARKUP;
      const B_conv = B_bought * (R + ALFA_MARKUP) * ALFA_CONV;
      const B_transferCny = B_bought * ALFA_TRANSFER, B_transferRub = B_transferCny * (R + ALFA_MARKUP);
      const commA = r.rubA - r.nA * R, commB = r.rubB - r.nB * R;
      const pctA = r.nA * R > 0 ? (commA / (r.nA * R)) * 100 : 0;
      const pctB = r.nB * R > 0 ? (commB / (r.nB * R)) * 100 : 0;
      const breakEven = r.rateB - R;
      const shPayA = r.nA * SH_PAY, shVcA = r.nA * SH_VC;
      const shTotalRub = (shPayA + shVcA) * R;
      const winColor = r.aWins ? VTB_BLUE : ALFA_RED;

      const kp = [
        "Иван Иванович, добрый день!",
        "",
        (r.aWins ? "Юань выгоднее покупать в ВТБ: разница " : "Юань выгоднее покупать у нас: разница ") + rub(r.saveRub) + " (" + cny(r.saveCny) + "), это " + pctStr(r.savePct) + ".",
        "База: биржевой курс " + rate4(R) + " за юань, " + (byCny ? "объём " + cny(nWanted) : "бюджет " + rub(budget)) + ".",
        "",
        "В ВТБ: наценка в курсе " + Math.round(vtbMarkup * 100) + " коп. = " + rub(A_markup) + ", конвертация 0%, перевод в Шанхай 0%.",
        "Эффективный курс " + rate4(r.rateA) + ", " + (byCny ? "итого " + rub(r.rubA) : "получите " + cny(r.nA)) + ".",
        "",
        "У нас: наценка 1 коп. = " + rub(B_markup) + ", конвертация 0,6% = " + rub(B_conv) + ", перевод в ВТБ 0,3% = " + rub(B_transferRub) + ".",
        "Эффективный курс " + rate4(r.rateB) + ", " + (byCny ? "итого " + rub(r.rubB) : "получите " + cny(r.nB)) + ".",
        "",
        "ПРИ РАЗНЫХ НАЦЕНКАХ ВТБ",
      ].concat(scenarios.map((s) => Math.round(s.markup * 100) + " коп.: " + (byCny
          ? "ВТБ " + rub(s.rubA) + ", у нас " + rub(s.rubB) + ", разница " + rub(s.saveRub)
          : "ВТБ " + cny(s.nA) + ", у нас " + cny(s.nB) + ", разница " + cny(s.saveCny))))
       .concat([
        "ВТБ сравнялся бы при наценке " + (breakEven * 100).toFixed(1).replace(".", ",") + " коп., а берёт от 14 до 25.",
        "",
        "ПРИ ОТПРАВКЕ ИЗ ВТБ ШАНХАЙ",
        "Платёж 1,99% = " + rub(shPayA * R) + ", валютный контроль 0,2% = " + rub(shVcA * R) + ". Вместе 2,19% = " + rub(shTotalRub) + ". Одинаково для обоих вариантов.",
        "Плюс ВТБ Шанхай берёт " + CN_VTB + " с вашего поставщика в Китае.",
        "",
        "Дешевле обоих вариантов — клиринг: 0,5% по курсу ЦБ, без наценки в курсе и без 2,19% ВТБ Шанхай.",
        "Тарифы зависят от дня и объёма, финальные цифры фиксируем перед сделкой.",
        "",
      ]).concat(SIGN).join("\n");

      return (
        <div className={GRID4}>
          <Col>
            <div className="rounded-2xl card pad">
              <MoexBox moex={moex} cbr={cbr} cbrStatus={cbrStatus} vtbMarkup={vtbMarkup} setVtbMarkup={setVtbMarkup} />
              <div className="mt-2.5 pt-2.5" style={{ borderTop: "1px solid var(--line-2)" }}>
                <ModeSwitch byCny={byCny} setMode={setMode} />
                <div className="text-[13px] font-medium ink mt-2 mb-1.5">{byCny ? "Сколько юаней нужно в Шанхае" : "Сколько рублей готовы потратить"}</div>
                <div className="relative">
                  <input type="number" inputMode="decimal" min="0" value={byCny ? amtCny : amtRub} onChange={(e) => byCny ? setAmtCny(e.target.value) : setAmtRub(e.target.value)} className="fld fld-big num" />
                  <span className="absolute right-3.5 top-1/2 -translate-y-1/2 text-[17px] ink-3">{byCny ? "¥" : "₽"}</span>
                </div>
                <div className="text-[12px] ink-3 mt-1.5 num">{byCny ? "≈ " + rub(nWanted * R) : "≈ " + cny(budget / (R || 1))} по бирже</div>
              </div>
            </div>
            <Fold icon={IcScale} title="Разница при 14, 20 и 25 копейках" sub="три самых частых наценки ВТБ">
              <div className="space-y-1.5">
                {scenarios.map((s, i) => {
                  const on = Math.round(s.markup * 100) === Math.round(vtbMarkup * 100);
                  return (
                    <div key={i} className={"rounded-lg px-3 py-2 " + (on ? "" : "card-soft")} style={on ? { background: "rgba(194,53,43,0.07)", border: "1px solid rgba(194,53,43,0.26)" } : null}>
                      <div className="row">
                        <span className="row-l ink font-semibold text-[13px]">{Math.round(s.markup * 100)} коп.{on && <span className="ml-1.5 text-[10.5px] px-1.5 py-0.5 rounded-full font-medium" style={{ background: "rgba(194,53,43,0.14)", color: "var(--red-ink)" }}>сейчас</span>}</span>
                        <span className="row-r num text-[13px] font-bold" style={{ color: s.aWins ? VTB_BLUE : ALFA_RED }}>{byCny ? rub(s.saveRub) : cny(s.saveCny)}</span>
                      </div>
                      <div className="text-[11.5px] ink-2 num mt-0.5">ВТБ {byCny ? rub(s.rubA) : cny(s.nA)} · у нас {byCny ? rub(s.rubB) : cny(s.nB)}</div>
                    </div>
                  );
                })}
              </div>
            </Fold>
          </Col>

          <Col>
            <div className={"rounded-2xl c-vtb emboss flex flex-col pad " + (r.aWins ? "win-vtb" : "")}>
              <div className="flex items-start justify-between gap-2 mb-0.5">

      const perVtb = (1 + SH_PAY + SH_VC) * (Rmoex + vtbMarkup);
      const budget = parseNum(amtRub, 0);

      let nClear, nVtb;
      if (byCny) { nClear = nVtb = parseNum(amtCny, 0); }
      else {
        const cPct = budget / (Rcb * (1 + CLEARING_PCT));
        nClear = (cPct * Rcb * CLEARING_PCT >= CLEARING_MIN) ? cPct : Math.max((budget - CLEARING_MIN) / Rcb, 0);
        nVtb = perVtb > 0 ? budget / perVtb : 0;
      }
      const clearBody = nClear * Rcb;
      const clearComm = Math.max(clearBody * CLEARING_PCT, CLEARING_MIN);
      const clearTotal = byCny ? clearBody + clearComm : budget;
      const vtbTotal = byCny ? nVtb * perVtb : budget;
      const perClear = nClear > 0 ? clearTotal / nClear : Rcb * (1 + CLEARING_PCT);
      const minApplied = clearBody * CLEARING_PCT < CLEARING_MIN;
      const commPct = clearBody > 0 ? (clearComm / clearBody) * 100 : 0;

      const clearWins = byCny ? clearTotal < vtbTotal : nClear > nVtb;
      const diffRub = byCny ? Math.abs(vtbTotal - clearTotal) : Math.abs(nClear - nVtb) * Rcb;

      const savePct = byCny ? (Math.max(vtbTotal, clearTotal) > 0 ? Math.abs(vtbTotal - clearTotal) / Math.max(vtbTotal, clearTotal) * 100 : 0)

        "География: " + PROVINCES.join(", ") + ", а также " + CITIES.join(" и ") + ".",

              </div>

            <WorkHours />

          <Col>
            <RouteCard name="Клиринг через финагента" sub="рубли от нас, платит банк КНР" cls="c-alfa" win="win-red" color={ALFA_RED}
              per={perClear} best={clearWins} byCny={byCny} total={clearTotal} n={nClear} budget={budget} cnFee={CN_CLEARING}
              rows={[
                { l: "Сумма по курсу ЦБ", s: cny(nClear) + " по " + rate4(Rcb), v: rub(clearBody) },
                { l: "Комиссия клиринга", s: minApplied ? "0,5%, сработал минимум 20 000 ₽" : "0,5% от суммы, было 0,9%", v: rub(clearComm), c: ALFA_RED },
                { l: "Наценка к курсу", s: "её нет, идём по ЦБ", zero: true },

              foot={"Получателю тоже дешевле: в ВТБ Шанхай с него удержали бы " + CN_VTB + "."} />
            <Fold icon={IcMap} title="Как идут деньги" sub="совместный проект ЦБ России и ЦБ Китая">
              <div className="rounded-lg px-3 py-2 mb-2 text-[12.5px] ink-2 leading-relaxed" style={{ background: "rgba(194,53,43,0.07)", border: "1px solid rgba(194,53,43,0.22)" }}>

              </div>
              <div className="space-y-1.5">
                {CLEARING_STEPS.map((s, i) => (
                  <div key={i} className="rounded-lg card-soft p-2.5">

              per={perVtb} best={!clearWins} byCny={byCny} total={vtbTotal} n={nVtb} budget={budget} cnFee={CN_VTB}
              rows={[

    /* ---------- BANK OF DANDONG: ПРЯМОЙ ПЛАТЁЖ ---------- */
    function DandongPanel() {
      const { rates: cbr, status: cbrStatus } = useCbr();
      const moex = useMoexCny();
      const [mode, setMode] = useState("cny");
      const [amtCny, setAmtCny] = useState("100000");
      const [amtRub, setAmtRub] = useState("1000000");
      const [vtbMarkup, setVtbMarkup] = useState(0.20);
      const byCny = mode === "cny";

      const Rmoex = moex.status === "ok" && moex.price ? moex.price : cbr.CNY;
      const Rfx = Rmoex + FX_MARKUP;                 // наш курс AlfaFX
      const perVtb = (1 + SH_PAY + SH_VC) * (Rmoex + vtbMarkup);
      const budget = parseNum(amtRub, 0);

      let nDand, nVtb;
      if (byCny) { nDand = nVtb = parseNum(amtCny, 0); }
      else {
        nDand = solveByBudget(budget, (n) => dandongCalc(n, Rmoex).total, budget / (Rmoex * 0.5) + 1);

      const nAt = Rmoex > 0 ? S / Rmoex : 0;
      const clearComm = Math.max(S * CLEARING_PCT, CLEARING_MIN);
      const D = dandongCalc(nAt, Rmoex);
      const vtbFee = S * (SH_PAY + SH_VC);
      const usd = cbr.USD > 0 ? S / cbr.USD : 0;
      const tier = tierFor(usd);
      const impComm = S * tier.pct + tier.fix * cbr.USD + Math.max(S * VC_PCT, VC_MIN) + faFee(S);
      const expComm = S * EXPORT_PCT;
      const c = {
        clearComm, clearPct: S > 0 ? clearComm / S * 100 : 0, clearMin: S * CLEARING_PCT < CLEARING_MIN,
        dandComm: D.comm, dandPct: D.pct,
        vtbFee,
        impComm, impPct: S > 0 ? impComm / S * 100 : 0,
        expComm, expNet: S - expComm, tier,
      };
      const text = buildKp(f, c);
      const noBlocks = !f.blocks.china && !f.blocks.vtb && !f.blocks.world;

      return (
        <section id="kp" className="slide">
          <div className="wrap w-full">
            <Head badge="Конструктор КП" icon={IcEdit} tone="gold"
              title="Соберите коммерческое предложение"
              text="По умолчанию письмо короткое: кто мы и сколько стоит, без разбора маршрутов. Отметьте блоки, если нужно подробное КП. Впишите сумму сделки — в текст добавятся примеры вида «на такую сумму комиссия не превысит столько-то за всё»." />

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-3">
              <div className="rise lg:col-span-4">
                <div className="rounded-2xl card pad h-full">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-2.5">
                    <div className="text-[14px] font-semibold ink">Что войдёт в письмо</div>
                    <button onClick={() => setF(KP_DEFAULT)} className="inline-flex items-center gap-1 text-[12.5px] ink-2 hover:ink"><IcRefresh size={13} />сбросить</button>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-1.5 mb-2.5">
                    {PRESETS.map((p) => {
                      const on = activePreset && activePreset.id === p.id;
                      return (
                        <button key={p.id} onClick={() => applyPreset(p.blocks)} className={"rounded-lg px-2.5 py-2 text-left transition-all " + (on ? "btn-red" : "btn-ghost")}>
                          <div className="text-[12.5px] font-semibold leading-tight">{p.label}</div>
                          <div className={"text-[11px] leading-snug mt-0.5 " + (on ? "opacity-85" : "ink-3")}>{p.hint}</div>
                        </button>
                      );
                    })}
                  </div>

                  <div className="space-y-1.5 mb-3">
                    {BLOCK_LIST.map((b) => {
                      const on = f.blocks[b.key];
                      return (
                        <button key={b.key} onClick={() => toggleBlock(b.key)} className="w-full rounded-lg px-3 py-2 text-left transition-all"
                          style={on ? { background: "rgba(194,53,43,0.07)", border: "1px solid rgba(194,53,43,0.30)" } : { background: "#fbf8f4", border: "1px solid var(--line-2)" }}>
                          <div className="row">
                            <div className="row-l">
                              <div className={"text-[13px] font-semibold " + (on ? "ink" : "ink-3")}>{b.label}</div>
                              <div className="text-[11.5px] ink-3">{b.sub}</div>
                            </div>
                            <div className="row-r">
                              <span className="inline-flex items-center justify-center w-5 h-5 rounded" style={on ? { background: "var(--red)" } : { border: "1px solid var(--line)", background: "#fff" }}>
                                {on && <IcCheck size={12} stroke="#fff" />}
                              </span>
                            </div>
                          </div>
                        </button>
                      );
                    })}
                    {noBlocks && <div className="text-[12px] rounded-lg px-2.5 py-1.5 ink-2" style={{ background: "#fbf8f4", border: "1px solid var(--line-2)" }}>Ничего не отмечено — соберётся короткая визитка: кто мы и сколько стоит, без разбора маршрутов.</div>}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <Field label="Имя клиента"><input className="fld" value={f.client} onChange={(e) => set("client")(e.target.value)} placeholder="Иван Иванович" /></Field>
                    <Field label="Компания"><input className="fld" value={f.company} onChange={(e) => set("company")(e.target.value)} placeholder="ООО «Ромашка»" /></Field>
                    <Field label="Задача"><Sel value={f.task} onChange={set("task")} options={O_TASK} /></Field>
                    <Field label="Сумма сделки для примера">
                      <div className="relative">
                        <input type="number" inputMode="decimal" min="0" value={f.amount} onChange={(e) => set("amount")(e.target.value)} className="fld num" style={{ paddingRight: "28px" }} />
                        <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[14px] ink-3">₽</span>
                      </div>
                    </Field>
                  </div>

                  {S > 0 && (
                    <div className="mt-2.5 rounded-lg sunken p-2.5">
                      <div className="text-[12px] font-semibold ink mb-1.5">На {rub(S)} комиссия не превысит</div>
                      <div className="grid grid-cols-2 gap-1.5">
                        {[
                          { k: "Клиринг", v: pctStr(c.clearPct, 2), s: rub(c.clearComm), on: f.blocks.china || noBlocks, col: ALFA_RED },
                          { k: "Dandong", v: pctStr(c.dandPct, 2), s: rub(c.dandComm), on: f.blocks.china || noBlocks, col: GOLD },
                          { k: "Импорт", v: pctStr(c.impPct, 2), s: rub(c.impComm), on: f.blocks.world || noBlocks, col: GREEN },
                          { k: "Экспорт", v: "0,20%", s: rub(c.expComm), on: f.blocks.world || noBlocks, col: VTB_BLUE },
                        ].filter((x) => x.on).map((x, i) => (
                          <div key={i} className="rounded-lg card-soft px-2.5 py-1.5">
                            <div className="text-[11.5px] ink-3 leading-tight">{x.k}</div>
                            <div className="text-[15px] font-bold num leading-tight" style={{ color: x.col }}>{x.v}</div>
                            <div className="text-[11px] ink-3 num">{x.s}</div>
                          </div>
                        ))}
                      </div>
                      <div className="text-[11px] ink-3 mt-1.5">Курс ЦБ {cbrStatus === "loading" ? "…" : rate4(Rcb)}, биржа {moex.status === "ok" ? rate4(Rmoex) : "…"}.</div>
                    </div>
                  )}
                </div>
              </div>

              <div className="rise lg:col-span-8" style={{ transitionDelay: "60ms" }}>
                <KpBlock tall text={text} title={noBlocks ? "Короткое предложение" : "Коммерческое предложение"}
                  note={S > 0 ? "Примеры посчитаны на " + rub(S) + " по живому курсу." : "Впишите сумму сделки, чтобы в письме появились примеры расчёта."} />
              </div>
            </div>
          </div>
        </section>
      );
    }

    /* ================= КОНТАКТЫ ================= */
    function Contacts({ onPick }) {
      return (
        <section id="contacts" className="w-full py-8 md:py-10">
          <div className="wrap">
            <div className="rise rounded-2xl card emboss pad">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 items-center">
                <div className="lg:col-span-7">
                  <div className="mb-2"><Badge tone="red" icon={IcZap}>Следующий шаг</Badge></div>
                  <h2 className="text-[22px] sm:text-[28px] font-semibold tracking-tight ink mb-2" style={{ letterSpacing: "-0.03em" }}>Подберу схему под вашу сделку</h2>
                  <p className="text-[13.5px] ink-2 leading-relaxed max-w-2xl">Клиринг, Bank of Dandong, прямой платёж или связка через агента — выбор зависит от суммы, страны, товара и сроков. Пришлите контракт, посчитаю точные цифры. Тарифы держим до {PROMO_UNTIL}.</p>
                  <div className="flex flex-wrap gap-2 mt-3">
                    <Ext href={TG} className="flex items-center gap-2 rounded-full btn-red px-5 py-2.5 font-medium text-[14px]">Telegram<IcArrow size={16} /></Ext>
                    <Ext href={PHONE} title={PHONE_TITLE} className="flex items-center gap-2 rounded-full btn-ghost px-5 py-2.5 font-medium text-[14px]"><IcPhone size={16} />{PHONE_DISPLAY}</Ext>
                    <Jump to="calc" className="flex items-center gap-2 rounded-full btn-ghost px-5 py-2.5 font-medium text-[14px]"><IcCalc size={16} />Калькулятор</Jump>
                  </div>
                </div>
                <div className="lg:col-span-5">
                  <WorkHours />
                  <div className="hidden sm:grid grid-cols-2 lg:grid-cols-3 gap-1.5 mt-2">
                    {TABS.map((t) => (
                      <button key={t.id} onClick={() => onPick(t.id)} className="tab">
                        <div className="flex items-center gap-1.5">
                          <t.Ic size={15} className="shrink-0" style={{ color: "var(--red)" }} />
                          <span className="text-[12.5px] font-semibold ink leading-tight">{t.short}</span>
                          <span className="ml-auto text-[12px] font-bold num" style={{ color: "var(--red)" }}>{t.price}</span>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
              <div className="mt-4 pt-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-[12px] ink-3" style={{ borderTop: "1px solid var(--line-2)" }}>
                <div className="flex items-center gap-3 flex-wrap">
                  <span className="flex items-center gap-1.5"><IcGlobe size={14} style={{ color: "var(--red)" }} /><span className="font-semibold ink">Евгений Демин</span> · международные расчёты</span>
                  <button onClick={() => { try { location.reload(); } catch (e) {} }} className="inline-flex items-center gap-1 ink-3 hover:ink"><IcLock size={12} />закрыть доступ</button>
                </div>
                <div>Расчёты ориентировочные. Финальные условия фиксируются перед сделкой.</div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    /* ================= ПРИЛОЖЕНИЕ ================= */
    function App() {
      const [tab, setTab] = useState("import");
      const pick = (id) => { setTab(id); setTimeout(() => goTo(null, "calc"), 30); };
      useEffect(() => {
        const els = Array.prototype.slice.call(document.querySelectorAll(".rise"));
        if (!("IntersectionObserver" in window)) { els.forEach((el) => el.classList.add("in")); return; }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
        }, { threshold: 0.05, rootMargin: "0px 0px -4% 0px" });
        els.forEach((el) => io.observe(el));
        /* страховка: если наблюдатель не сработал (фоновая вкладка, встраивание), всё, что уже на экране или выше, показываем сами */
        let t2 = 0;
        const check = () => {
          const h = window.innerHeight || document.documentElement.clientHeight;
          els.forEach((el) => { if (!el.classList.contains("in") && el.getBoundingClientRect().top < h) { el.classList.add("in"); io.unobserve(el); } });
        };
        const onScroll = () => { clearTimeout(t2); t2 = setTimeout(check, 150); };
        const t1 = setTimeout(check, 1200);
        window.addEventListener("scroll", onScroll, { passive: true });
        document.addEventListener("visibilitychange", check);
        return () => { io.disconnect(); clearTimeout(t1); clearTimeout(t2); window.removeEventListener("scroll", onScroll); document.removeEventListener("visibilitychange", check); };
      }, []);
      /* «/» в любом месте страницы (кроме полей ввода) — сразу поиск банка */
      const gateOk = useContext(GateCtx);
      useEffect(() => {
        if (!gateOk) return;
        const f = (e) => {
          /* code «Slash» — та же клавиша в русской раскладке (там она печатает точку) */
          if ((e.key !== "/" && e.code !== "Slash") || e.ctrlKey || e.metaKey || e.altKey) return;
          const t = e.target, tag = t && t.tagName;
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable)) return;
          if (document.querySelector(".bk-layer")) return;
          e.preventDefault();
          openBanks("", { sec: BK.fxSec });
        };
        window.addEventListener("keydown", f);
        return () => window.removeEventListener("keydown", f);
      }, [gateOk]);
      return (
        <div className="app-zoom">
          <StickyNav />
          <Hero onPick={pick} />
          <Promo onPick={pick} />
          <Pressure onPick={pick} />
          <TariffPU />
          <CalcHub tab={tab} setTab={setTab} />
          <KpBuilder />
          <Contacts onPick={pick} />
          <BanksModal onPick={pick} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Gate><App /></Gate>);
  </script>

  <script>
    (function () {
      var src = document.getElementById("app-src").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      (0, eval)(out);
    })();
  </script>
