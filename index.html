    /* ---------- ПЛАТЁЖ В КИТАЙ: ПРЯМОЙ ИЛИ ПРОКСИ, ВСЕ КОМИССИИ ПО ПАКЕТУ ----------
       Юань покупаем по курсу Мосбиржи + 1 копейка. Комиссии — по тарифу пакета: перевод (или акция 0,8%), конвертация, ФАВК + НДС.
       Все комиссии банк считает от рублёвого эквивалента по курсу ЦБ. */
    function chinaCost(P, swift, n, M, C, o) {
      o = o || {};
      const rate = M + FX_MARKUP;
      const buy = o.noConv ? 0 : n * rate;
      const rubCb = n * C;
      const t = cnyTariff(swift, o.urgent);
      const tr = clamp(rubCb * t.pct, t.min, t.max);
      const cr = o.noConv ? null : convRule(P, "CNY", n, o.usd ? rubCb / o.usd : 0, o.volPrev, o.volCur);
      const conv = cr ? rubCb * cr.pct : 0;
      const fr = favkRule(P, o.vk || "4.1");
      const favk = o.vk === "none" ? 0 : clamp(rubCb * fr.pct, fr.min, fr.max);
      const vat = favk * VAT_RATE;
      const comm = tr + conv + favk + vat;
      const ref = n * rate;
      return { rate, buy, rubCb, t, tr, cr, conv, fr, favk, vat, comm, total: buy + comm, per: n > 0 ? (buy + comm) / n : rate,
        pct: ref > 0 ? comm / ref * 100 : 0, trMin: rubCb * t.pct < t.min, favkMin: rubCb * fr.pct < fr.min, mk: n * FX_MARKUP };
    }
    /* банки Китая, Гонконга и Тайваня из списка: сначала прямые, потом прокси и остальные */
    const CN_ROWS = BK.rows.filter((r) => !bkIsRu(r) && /китай|гонконг|тайвань/i.test(r.country));
    function cnRouteNote(r) {
      if (!r) return null;
      if (r.custom) return { tone: "warn", t: "Банка нет в списке — маршрут не проверен. Если платежей в него было меньше трёх за месяц, прямой путь не гарантирован." };
      const noCny = /юан[^.\n]*не провод|не провод[^.\n]*юан/i.test(r.cm);
      if (noCny) return { tone: "bad", t: "Юани в этот банк сейчас не проводятся (см. комментарий). Возможны рубли — трансграничный перевод." };
      if (r.g === "agent") return { tone: "bad", t: "Прямые расчёты в этот банк не рекомендованы — платёж скорее всего вернётся. Лучше клиринг или платёж через финансового агента." };
      if (r.g === "cond") return { tone: "warn", t: "С оговорками: " + r.st.s + ". Платёж может вернуться." };
      if (r.g === "proxy") return { tone: "info", t: "Прокси-маршрут: платёж идёт через банк-корреспондент в РФ, обычно только за несанкционные товары и между несанкционными сторонами." };
      if (r.g === "mixed") return { tone: "info", t: "Маршрут зависит от валюты — сверьтесь с комментарием банка." };
      return { tone: "ok", t: "Прямой платёж: юани уходят напрямую в банк получателя." };
    }

    function CnBankPicker({ sel, onPick }) {
      const [q, setQ] = useState("");
      const [open, setOpen] = useState(false);
      const qq = useMemo(() => bkQuery(q), [q]);
      const list = useMemo(() => {
        const l = qq.toks.length ? CN_ROWS.filter((r) => bkHit(r, qq.toks)) : CN_ROWS.filter((r) => r.g !== "agent");
        return l.slice().sort((a, b) => (CN_PROMO[sw6(b.swift)] ? 1 : 0) - (CN_PROMO[sw6(a.swift)] ? 1 : 0) || a.ord - b.ord || a.name.localeCompare(b.name)).slice(0, 60);
      }, [qq]);
      const swq = q.trim().toUpperCase().replace(/\s/g, "");
      /* «посчитать по SWIFT» — только для полного кода (8 или 11 знаков) или если по названию ничего не нашлось */
      const customOk = /^[A-Z]{6}([A-Z0-9]{2}([A-Z0-9]{3})?)?$/.test(swq) && !CN_ROWS.some((r) => r.swift === swq.slice(0, 6)) && (swq.length >= 8 || !list.length);
      const pick = (r) => { onPick(r); setOpen(false); setQ(""); };
      const t = sel ? cnyTariff(sel.swift) : null;
      return (
        <div>
          {sel && (
            <div className="rounded-xl card-soft px-3 py-2.5 mb-2">
              <div className="flex items-start justify-between gap-2">
                <div className="min-w-0">
                  <div className="text-[14px] font-semibold ink leading-snug">{sel.name}</div>
                  <div className="text-[12px] ink-3 mt-0.5 num">SWIFT {sel.swift || "—"}{sel.country ? " · " + sel.country : ""}</div>
                </div>
                {!sel.custom && <BkPill k={sel.g} />}
              </div>
              {t && <div className="text-[12.5px] mt-1.5 num">{t.promo && <span className="tf-promo">акция</span>}<b style={{ color: t.promo ? "var(--red)" : "var(--vtb)" }}>{pct2(t.pct)}</b> <span className="ink-2">от {money(t.min)}{t.max ? " до " + money(t.max) : ""}</span>{t.promo ? <span className="ink-3"> · по тарифу {pct2(t.was.pct)}</span> : t.grp ? <span className="ink-3"> · {t.grp}</span> : null}</div>}
            </div>
          )}
          <div className="relative">
            <IcSearch size={16} className="absolute left-3 top-1/2 -translate-y-1/2 ink-3 pointer-events-none" />
            <input value={q} onChange={(e) => { setQ(e.target.value); setOpen(true); }} onFocus={() => setOpen(true)} className="fld" style={{ paddingLeft: "34px" }}
              placeholder={sel ? "Сменить банк: название или SWIFT" : "Банк получателя: название или SWIFT"} autoComplete="off" spellCheck="false" aria-label="Банк получателя в Китае" />
          </div>
          {open && (
            <div className="cn-list mt-1.5 rounded-xl" style={{ border: "1px solid var(--line)" }}>
              {customOk && (
                <button onClick={() => pick({ swift: swq.slice(0, 6), name: "Банк не из списка (SWIFT " + swq + ")", custom: true, country: swq.slice(4, 6) === "CN" ? "Китай" : "", cm: "", g: "cond" })} className="cn-opt">
                  <span className="min-w-0"><b>SWIFT {swq}</b><span className="block text-[11.5px] ink-3">банка нет в списке — посчитать по тарифу</span></span>
                </button>
              )}
              {list.map((r) => {
                const tt = cnyTariff(r.swift);
                return (
                  <button key={r.id} onClick={() => pick(r)} className={"cn-opt " + (sel && sel.id === r.id ? "on" : "")}>
                    <span className="min-w-0 flex-1"><span className="block text-[13px] font-semibold ink leading-snug"><Hl text={r.name} re={qq.re} /></span><span className="block text-[11.5px] ink-3 num"><Hl text={r.swift} re={qq.re} /> · {BK_KIND[r.g].title}</span></span>
                    <span className="num text-[12.5px] shrink-0" style={{ color: tt.promo ? "var(--red)" : "var(--vtb)", fontWeight: 700 }}>{pct2(tt.pct)}</span>
                  </button>
                );
              })}
              {!list.length && !customOk && <div className="px-3 py-3 text-[12.5px] ink-3">Не нашлось. Введите SWIFT — посчитаем по тарифу для любого банка.</div>}
              {!q && <div className="px-3 py-2 text-[11.5px] ink-3" style={{ borderTop: "1px solid var(--line-2)" }}>Без поиска показаны банки с рабочим маршрутом. Найти любой — по названию или SWIFT.</div>}
            </div>
          )}
        </div>
      );
    }

    /* путь платежа простыми словами — для письма клиенту */
    function cnRouteKp(sel) {
      if (!sel || sel.custom) return "Этого банка нет в нашем списке проверенных — путь платежа уточним перед отправкой.";
      if (sel.g === "proxy") return "Деньги пойдут через банк-посредник, на который не действуют санкции. Так можно платить, если товар и компании не под санкциями.";
      if (sel.g === "mixed") return "Путь зависит от валюты — для юаней уточним его перед отправкой.";
      if (sel.g === "direct") return "Деньги уйдут из нашего банка прямо в банк поставщика, без посредников.";
      return "Путь платежа в этот банк уточним перед отправкой.";
    }
    function chinaKpText(o) {
      const { c, n, sel, client, noConv, sign } = o;
      const who = (client || "").trim();
      const L = [];
      L.push(who ? who + ", добрый день!" : "Добрый день!");
      L.push("");
      L.push("Посчитал оплату вашему поставщику в Китай на " + cny(n) + ".");
      L.push("Банк поставщика: " + sel.name + (sel.swift ? " (SWIFT " + sel.swift + ")" : "") + ".");
      L.push(cnRouteKp(sel));
      L.push("");
      if (noConv) {
        L.push("С вашего счёта в юанях уйдёт " + cny(n) + ", а с рублёвого — " + rub(c.comm) + " комиссий.");
      } else {
        L.push("Всего с вас: " + rub(c.total) + ".");
        L.push("Это и юани, и все комиссии нашего банка — " + rate4(c.per) + " за каждый юань.");
      }
      L.push("");
      L.push("Из чего складывается:");
      if (!noConv) L.push("• " + rub(c.buy) + " — сами юани. Покупаем по курсу Мосбиржи плюс 1 копейка: " + rate4(c.rate) + " за юань. Это почти та цена, по которой банки покупают валюту между собой.");
      L.push("• " + rub(c.tr) + " — отправка денег в Китай, " + pct2(c.t.pct) + (c.t.promo ? " по акции" : "") + (c.trMin ? " (здесь сработал минимум " + money(c.t.min) + ")" : "") + ".");
      if (!noConv) L.push("• " + rub(c.conv) + " — обмен рублей на юани, " + pct2(c.cr.pct) + ".");
      if (c.favk) L.push("• " + rub(c.favk + c.vat) + " — валютный контроль, " + pct2(c.fr.pct) + (c.favkMin ? " (минимум " + money(c.fr.min) + ")" : "") + " плюс НДС: банк по закону проверяет каждый платёж за границу.");
      L.push("");
      L.push("Комиссии вместе: " + rub(c.comm) + " — это " + per100(c.pct) + " платежа.");
      if (c.t.promo) L.push("Банк вашего поставщика ничего не удержит с него за зачисление — так бывает далеко не везде.");
      L.push("");
      L.push("Что нужно от вас: контракт с поставщиком и инвойс (счёт на оплату).");
      L.push("Курс фиксируется в момент покупки — сейчас посчитано по сегодняшнему. Если по пути комиссию возьмут иностранные банки, она оплачивается отдельно.");
      L.push("");
      return L.concat(signLines(sign)).join("\n");
    }

    function ChinaPanel({ opts }) {
      const { P } = usePu();
      const { name: signName } = useSign();
      const { rates: cbr, cbrDate, status: cbrStatus } = useCbr();
      const moex = useMoexCny();
      const initRow = (sw) => { const s = sw6(sw); return CN_ROWS.find((r) => r.swift === s) || (s ? { swift: s, name: "Банк не из списка (SWIFT " + s + ")", custom: true, country: s.slice(4, 6) === "CN" ? "Китай" : "", cm: "", g: "cond" } : null); };
      const [sel, setSel] = useState(() => initRow((opts && opts.bank) || "DDBKCN"));
      const [mode, setMode] = useState("cny");
      const [amtCny, setAmtCny] = useState("100000");
      const [amtRub, setAmtRub] = useState("1500000");
      const [vk, setVk] = useState("4.1");
      const [urgent, setUrgent] = useState(false);
      const [noConv, setNoConv] = useState(false);
      const [volPrev, setVolPrev] = useState("");
      const [volCur, setVolCur] = useState("");
      const [client, setClient] = useState("");
      const byCny = mode === "cny" || noConv;
      const C = cbr.CNY;
      const M = moex.status === "ok" && moex.price ? moex.price : C;
      const o = { vk: vk, urgent: urgent, noConv: noConv, usd: cbr.USD, volPrev: parseNum(volPrev, 0), volCur: parseNum(volCur, 0) };
      const sw = sel ? sel.swift : "";
      const budget = parseNum(amtRub, 0);
      const n = byCny ? parseNum(amtCny, 0) : solveByBudget(budget, (x) => chinaCost(P, sw, x, M, C, o).total, budget / ((M || 1) * 0.5) + 1);
      const c = chinaCost(P, sw, n, M, C, o);
      const note = cnRouteNote(sel);
      const dateStr = cbrDate ? new Date(cbrDate).toLocaleDateString("ru-RU") : "";
      const kp = chinaKpText({ c: c, n: n, sel: sel || { name: "—" }, client: client, noConv: noConv, sign: signName });
      const tone = { ok: ["rgba(28,122,77,0.08)", "rgba(28,122,77,0.28)", "#166341"], info: ["rgba(106,63,181,0.07)", "rgba(106,63,181,0.26)", "#4f2d8a"], warn: ["rgba(176,122,34,0.09)", "rgba(176,122,34,0.32)", "#7d5518"], bad: ["rgba(194,53,43,0.08)", "rgba(194,53,43,0.30)", "#96271f"] };
      const lab = "text-[14px] font-semibold ink mb-1.5";
      return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
          <div className="space-y-4">
            <div className="rounded-2xl card pad space-y-3.5">
              <div>
                <div className={lab}>Банк поставщика</div>
                <CnBankPicker sel={sel} onPick={setSel} />
                <Why className="mt-2">Спросите у клиента SWIFT-код банка поставщика — он есть в инвойсе. По нему видно и путь (прямой или прокси), и цену перевода: от 0,8% до 4,9%.</Why>
              </div>
              {!noConv && <ModeSwitch byCny={mode === "cny"} setMode={setMode} />}
              <label className="block"><div className={lab}>{byCny ? "Сколько юаней должен получить поставщик" : "Сколько рублей готов потратить клиент"}</div>
                <div className="relative">
                  <input type="number" inputMode="decimal" min="0" value={byCny ? amtCny : amtRub} onChange={(e) => byCny ? setAmtCny(e.target.value) : setAmtRub(e.target.value)} className="fld fld-big num" />
                  <span className="absolute right-3.5 top-1/2 -translate-y-1/2 text-[17px] ink-3">{byCny ? "¥" : "₽"}</span>
                </div>
                {!byCny && <div className="text-[12.5px] ink-3 mt-1 num">дойдёт до поставщика ≈ {cny(n)}</div>}
              </label>
              <label className="block"><div className={lab}>Валютный контроль</div>
                <select className="fld" value={vk} onChange={(e) => setVk(e.target.value)}>
                  <option value="4.1">Контракт поставлен на учёт — п. 4.1</option>
                  <option value="4.3">Контракт без постановки на учёт — п. 4.3</option>
                  <option value="none">Без валютного контроля</option>
                </select>
                <Why className="mt-2">Контракт ставят на учёт в банке, если его сумма от 3 млн ₽. Не знаете — оставьте «поставлен на учёт».</Why>
              </label>
              <div className="grid grid-cols-1 gap-1.5">
                <label className="flex items-start gap-2 text-[14px] ink"><input type="checkbox" checked={urgent} onChange={(e) => setUrgent(e.target.checked)} className="w-4 h-4 shrink-0 mt-0.5" style={{ accentColor: "var(--vtb)" }} /><span>Срочный перевод <span className="ink-3">(для юаней цена та же)</span></span></label>
                <label className="flex items-start gap-2 text-[14px] ink"><input type="checkbox" checked={noConv} onChange={(e) => setNoConv(e.target.checked)} className="w-4 h-4 shrink-0 mt-0.5" style={{ accentColor: "var(--vtb)" }} /><span>У клиента уже есть юани <span className="ink-3">(покупать не нужно)</span></span></label>
              </div>
              {!noConv && P.conv.kind === "month" && <ConvVolume prev={volPrev} setPrev={setVolPrev} cur={volCur} setCur={setVolCur} />}
              <label className="block"><div className={lab}>Имя клиента для письма</div><input className="fld" value={client} onChange={(e) => setClient(e.target.value)} placeholder="Иван Иванович" /></label>
            </div>

            <div className="rounded-2xl card pad">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                <div className="flex items-center gap-1.5 text-[14px] ink"><IcChart size={15} style={{ color: "var(--red)" }} /><span className="font-semibold">Курсы юаня</span></div>
                <button onClick={moex.refresh} className="inline-flex items-center gap-1 text-[13px] ink-2 hover:ink"><IcRefresh size={13} className={moex.status === "loading" ? "animate-spin" : ""} />обновить</button>
              </div>
              <div className="space-y-1.5">
                <div className="row rounded-lg px-3 py-2" style={{ background: "rgba(10,40,150,0.06)", border: "1px solid rgba(10,40,150,0.22)" }}>
                  <div className="row-l"><div className="text-[13px] font-semibold" style={{ color: "var(--vtb)" }}>Продаём клиенту</div><div className="text-[12px] ink-3">Мосбиржа + 1 копейка</div></div>
                  <div className="row-r num text-[17px] font-bold" style={{ color: "var(--vtb)" }}>{moex.status === "loading" && !moex.price ? "…" : rate4(c.rate)}</div>
                </div>
                <div className="row rounded-lg card-soft px-3 py-2">
                  <div className="row-l"><div className="text-[13px] font-medium ink-2">Мосбиржа · CNYRUB_TOM</div><div className="text-[12px] ink-3">{moex.status === "ok" ? moex.kind + (moex.time ? ", " + moex.time : "") : moex.status === "loading" ? "загружаем…" : "нет связи — взят курс ЦБ"}</div></div>
                  <div className="row-r num text-[15px] font-bold ink">{rate4(M)}</div>
                </div>
                <div className="row rounded-lg card-soft px-3 py-2">
                  <div className="row-l"><div className="text-[13px] font-medium ink-2">Курс ЦБ{dateStr ? " на " + dateStr : ""}</div><div className="text-[12px] ink-3">от него банк считает комиссии</div></div>
                  <div className="row-r num text-[15px] font-bold ink">{cbrStatus === "loading" ? "…" : rate4(C)}</div>
                </div>
              </div>
              <Why className="mt-2.5">Мосбиржа — место, где банки покупают и продают валюту между собой. Её курс меняется весь день; мы продаём юань по нему плюс 1 копейка. А проценты комиссий банк считает от курса ЦБ — так написано в тарифах.</Why>
            </div>
          </div>

          <div className="space-y-4">
            <div className="rounded-2xl card pad" style={{ borderColor: "rgba(10,40,150,0.28)" }}>
              <div className="flex flex-wrap items-center justify-between gap-2 mb-1">
                <div className="text-[16px] font-semibold ink">Сколько заплатит клиент</div>
                <span className="text-[12px] px-2.5 py-1 rounded-full font-semibold" style={{ background: "rgba(10,40,150,0.08)", color: "var(--vtb)", border: "1px solid rgba(10,40,150,0.24)" }}>пакет {puName(P)}</span>
              </div>
              <Gist>{noConv
                ? <span>Поставщик получит <b>{cny(n)}</b> со счёта клиента. Комиссии банка — <b>{rub(c.comm)}</b>.</span>
                : <span>Поставщик получит <b>{cny(n)}</b>, клиент заплатит <b>{rub(c.total)}</b>. Из них комиссии банка — {rub(c.comm)}, то есть {per100(c.pct)}.</span>}</Gist>
              {noConv
                ? <Row label="Юани со счёта клиента" sub="покупать не нужно" value={cny(n)} />
                : <Row label="Сами юани" sub={cny(n) + " × " + rate4(c.rate) + "; из них 1 копейка = " + rub(c.mk)} value={rub(c.buy)} why="Цена юаней по курсу Мосбиржи плюс наша 1 копейка на каждый юань." />}
              <Row label={"Отправка в Китай" + (c.t.promo ? " — акция" : "")} sub={pct2(c.t.pct) + ", от " + money(c.t.min) + (c.t.max ? " до " + money(c.t.max) : "") + (c.trMin ? " — сработал минимум" : "") + (c.t.promo ? " · по тарифу " + pct2(c.t.was.pct) : " · п. " + c.t.p)} value={rub(c.tr)} color={c.t.promo ? "var(--red)" : "var(--vtb)"} why="Плата банку за перевод юаней в банк поставщика. Цена зависит от банка поставщика." />
              {!noConv && <Row label="Обмен рублей на юани" sub={pct2(c.cr.pct) + " · " + c.cr.how + " · п. " + c.cr.p} value={rub(c.conv)} color="var(--vtb)" why="Комиссия за конвертацию — по пакету клиента." />}
              {vk !== "none" && <Row label="Валютный контроль" sub={favkText(c.fr) + (c.favkMin ? " — сработал минимум" : "") + " · п. " + vk} value={rub(c.favk)} color="var(--vtb)" why="Банк по закону проверяет каждый платёж за границу: контракт, суммы, сроки." />}
              {vk !== "none" && <Row label="НДС на валютный контроль" sub={Math.round(VAT_RATE * 100) + "%"} value={rub(c.vat)} color="var(--vtb)" why="В тарифе валютный контроль указан без НДС, поэтому 22% добавляется сверху." />}
              <Row label="Комиссии вместе" sub={pctStr(c.pct, 2) + " от суммы платежа"} value={rub(c.comm)} strong />
              <div className="mt-3 rounded-xl px-4 py-3.5" style={{ background: "rgba(10,40,150,0.06)", border: "1px solid rgba(10,40,150,0.22)" }}>
                <div className="row">
                  <div className="row-l"><div className="text-[16px] font-semibold ink">{noConv ? "Спишем рублями" : "Всего с клиента"}</div><div className="text-[12.5px] ink-3 mt-0.5">{noConv ? "только комиссии" : "1 юань со всеми комиссиями — " + rate4(c.per)}</div></div>
                  <div className="row-r num text-2xl font-bold" style={{ color: "var(--vtb)" }}>{rub(c.total)}</div>
                </div>
              </div>
              {note && <div className="mt-3 rounded-lg px-3 py-2 text-[13px] leading-snug" style={{ background: tone[note.tone][0], border: "1px solid " + tone[note.tone][1], color: tone[note.tone][2] }}>{note.t}</div>}
              {sel && sel.cm && <div className="mt-2 text-[12.5px] ink-3 leading-snug bk-pre"><b className="ink-2">Комментарий в списке банков:</b> {sel.cm}</div>}
              <CostBar parts={[{ l: "отправка", v: c.tr }, { l: "обмен", v: c.conv }, { l: "валютный контроль", v: c.favk }, { l: "НДС", v: c.vat }]} />
              <ul className="tf-notes mt-3">
                <li>Комиссии иностранных банков сюда не входят{c.t.noThird ? " — для этого банка их не будет" : ""}.</li>
                <li>С поставщика Dandong и Changyi за зачисление ничего не берут; по редким санкционным товарам — 0,2%.</li>
              </ul>
            </div>
            <PuAdvice needFx={true} cost={(PP, k) => chinaCost(PP, sw, n, M, C, Object.assign({}, o, { volPrev: 0, volCur: (k - 1) * (cbr.USD ? n * C / cbr.USD : 0) })).comm} />
            <KpBlock text={kp} />
          </div>
        </div>
      );
    }

    /* ================= КОНСТРУКТОР КП ================= */
    function Field({ label, children }) {
      return (<label className="block"><div className="text-[13.5px] font-semibold ink mb-1">{label}</div>{children}</label>);
    }

    /* ---- сборка общего письма ---- */
    function buildKp(f, c, sign) {
      const S = parseNum(f.amount, 0);
      const has = S > 0;
      const L = [];
      const add = (s) => L.push(s);
      const gap = () => { if (L.length && L[L.length - 1] !== "") L.push(""); };
      const ex = (comm, pct) => { if (has) add("Например, на " + rub(S) + " это " + rub(comm) + " за всё — " + pctStr(pct, 2) + "."); };
      const who = (f.client || "").trim();
      const co = (f.company || "").trim();
      const on = f.blocks;
      const nBlocks = (on.china ? 1 : 0) + (on.vtb ? 1 : 0) + (on.world ? 1 : 0);

      add(who ? who + ", добрый день!" : "Добрый день!");
      gap();
      add(co ? "Подготовил для " + co + " коротко и по делу: как мы можем платить вашим поставщикам за границей и получать деньги от покупателей." : "Коротко и по делу: как мы можем платить вашим поставщикам за границей и получать деньги от покупателей.");

      if (nBlocks === 0) {
        gap();
        add("Сколько это стоит:");
        add("• Оплатить поставщику в Китае — от 0,5%.");
        add("• Оплатить поставщику в любой другой стране — от 0,8%.");
        add("• Получить оплату от покупателя из-за границы — 0,2%.");
        add("• Перевести юани напрямую в Bank of Dandong или Shandong Changyi — 0,8%. Китайский поставщик при этом ничего не платит за зачисление — так бывает далеко не везде.");
        if (has) {
          gap();
          add("Например, на " + rub(S) + " платёж в Китай обойдётся в " + rub(c.clearComm) + " за всё, а приём оплаты от покупателя — в " + rub(c.expComm) + ".");
        }
        gap();
        add("Почему у нас платёж доходит: мы знаем четыре разных пути для денег. Если один закрылся из-за санкций, платим другим — сделка не стоит неделями.");
        add("Курс прозрачный, без спрятанной наценки. Валютный контроль и проверку контракта берём на себя.");
      }

      if (on.china) {
        gap();
        add("ПЛАТЕЖИ В КИТАЙ — ДВА ПУТИ");
        gap();
        add("1. Клиринг — 0,5%, минимум 20 000 ₽.");
        add("Вы платите рублями, мы меняем их на юани по курсу ЦБ без наценки, и ваш поставщик получает юани от банка в Китае — для него это обычный платёж внутри страны. В 0,5% уже входит всё, включая валютный контроль.");
        if (has && c.clearMin) add("Например, на " + rub(S) + " это " + rub(c.clearComm) + ": на такой сумме работает минимум. Ставка 0,5% начинается от " + rub(CLEARING_MIN / CLEARING_PCT) + ".");
        else ex(c.clearComm, c.clearPct);
        add("Подходит, если поставщик — китайская компания без иностранных учредителей и директора, а его банк — в материковом Китае и без американского участия.");
        gap();
        add("2. Прямой платёж в Bank of Dandong или Shandong Changyi — 0,8%, минимум 3 000 ₽.");
        add("Юани уходят из нашего банка прямо в банк поставщика. Юань покупаем по биржевому курсу плюс 1 копейка — не по банковскому курсу с наценкой в четверть рубля.");
        add("Сверху — обмен рублей на юани (" + c.convTxt + ") и валютный контроль (" + c.vcTxt + " плюс НДС). Больше ничего.");
        ex(c.dandComm, c.dandPct);
        add("Поставщик за зачисление ничего не платит (только по редким санкционным товарам — 0,2%).");
      }

      if (on.vtb) {
        gap();
        add("ЕСЛИ ВЫ ПЛАТИТЕ ПОСТАВЩИКУ ИЗ ВТБ");
        add("Платите из ВТБ — продолжайте, но юани для платежа выгоднее покупать у нас. В ВТБ нет комиссии за обмен, зато юань там дороже биржевого курса на 14–25 копеек за каждый юань — в тарифах этого не видно.");
        add("У нас юань по биржевому курсу плюс 1 копейка, обмен " + c.convTxt + " и перевод юаней на ваш счёт в ВТБ 0,3% (от 3 000 до 20 000 ₽). Дальше вы платите поставщику из ВТБ, как обычно.");
        if (has) add("Например, на " + rub(S) + " наценка ВТБ в 20 копеек — это около " + rub(c.vtbMk) + ", а у нас наценка, обмен и перевод вместе — около " + rub(c.yuanComm) + ".");
        add("А если поставщик подходит под клиринг, выйдет ещё дешевле: вы платите рублями, мы меняем их на юани по курсу ЦБ за 0,5%.");
      }

      if (on.world) {
        gap();
        add("ПЛАТЕЖИ В ДРУГИЕ СТРАНЫ И ЭКСПОРТ");
        gap();
        add("Оплата поставщику через агента — от 0,8%.");
        add("Вы платите рублями нашему партнёру, а он оплачивает поставщику из-за границы. Ваш банк в цепочке не участвует — платёж проходит, даже если банк поставщика не принимает деньги из России.");
        add("Ставка зависит от суммы: до 50 000 $ — 1,4% (до 10 000 $ ещё плюс 100 $), до 100 000 $ — 1,0%, больше — 0,8%. Сверху — валютный контроль " + c.vcTxt + " плюс НДС и перевод агенту 0,15% (от 1 000 до 50 000 ₽).");
        ex(c.impComm, c.impPct);
        gap();
        add("Приём оплаты от покупателя — 0,2%.");
        add("Покупатель платит в удобной ему валюте: доллары $, евро €, юани ¥, дирхамы, лиры ₺, тенге ₸, рупии ₹. Мы меняем её на рубли по курсу ЦБ и зачисляем на ваш счёт. Больше ничего не удерживаем.");
        if (has) add("Например, с " + rub(S) + " удержим " + rub(c.expComm) + ", на счёт придёт " + rub(c.expNet) + ".");
      }

      gap();
      add("Ставки действуют до " + PROMO_UNTIL + ". Курс меняется каждый день, поэтому суммы в примерах — ориентир.");
      add("Пришлите контракт или инвойс — посчитаю точно и подскажу, каким путём надёжнее платить.");
      gap();
      return L.concat(signLines(sign)).join("\n");
    }

    /* ставка конвертации юаня в тексте КП: «0,30%» / «0,3–0,6% по сумме» / «0,25–0,55% по объёму за месяц» */
    const P_CONV_TXT = (PU) => (PU.conv.kind === "flat" ? pct2(PU.conv.pct) : PU.conv.kind === "month" ? "0,25–0,55% в зависимости от объёма за месяц" : "0,3–0,6% в зависимости от суммы");
    const KP_DEFAULT = { client: "", company: "", blocks: { china: false, vtb: false, world: false }, amount: "1000000" };
    const BLOCK_LIST = [
      { key: "china", label: "Платежи в Китай", sub: "клиринг и прямые 0,8% в Dandong и Changyi" },
      { key: "vtb",   label: "Клиент платит поставщику из ВТБ", sub: "почему юани дешевле купить у нас" },
      { key: "world", label: "Другие страны и экспорт", sub: "оплата через агента и приём выручки" },
    ];

    function KpBuilder() {
      const [f, setF] = useState(KP_DEFAULT);
      const PU = usePu().P;
      const { name: signName, set: setSign } = useSign();
      const { rates: cbr } = useCbr();
      const moex = useMoexCny();
      const set = (k) => (v) => setF((o) => Object.assign({}, o, { [k]: v }));
      const toggleBlock = (k) => setF((o) => Object.assign({}, o, { blocks: Object.assign({}, o.blocks, { [k]: !o.blocks[k] }) }));

      /* стоимость по каждому пути на введённую сумму */
      const S = parseNum(f.amount, 0);
      const Rcb = cbr.CNY;
      const Rmoex = moex.status === "ok" && moex.price ? moex.price : cbr.CNY;
      const nAt = Rmoex > 0 ? S / Rmoex : 0;
      const clearComm = Math.max(S * CLEARING_PCT, CLEARING_MIN);
      const D = chinaCost(PU, "DDBKCN", nAt, Rmoex, Rcb, { usd: cbr.USD });
      const YA = yuanAlfa(PU, nAt, Rmoex, Rcb, cbr.USD);
      const vtbMk = nAt * 0.20, yuanComm = YA.mk + YA.conv + YA.tr;
      const usd = cbr.USD > 0 ? S / cbr.USD : 0;
      const tier = tierFor(usd);
      const impComm = S * tier.pct + tier.fix * cbr.USD + favkFee(PU, "4.1", S) * (1 + VAT_RATE) + faFee(S);
      const expComm = S * EXPORT_PCT;
      const c = {
        clearComm, clearPct: S > 0 ? clearComm / S * 100 : 0, clearMin: S * CLEARING_PCT < CLEARING_MIN,
        dandComm: D.comm, dandPct: D.pct,
        convTxt: P_CONV_TXT(PU), vcTxt: ((r) => pct2(r.pct) + " (минимум " + money(r.min) + (r.max ? ", максимум " + money(r.max) : "") + ")")(favkRule(PU, "4.1")),
        vtbMk, yuanComm,
        impComm, impPct: S > 0 ? impComm / S * 100 : 0,
        expComm, expNet: S - expComm, tier,
      };
      const text = buildKp(f, c, signName);
      const noBlocks = !f.blocks.china && !f.blocks.vtb && !f.blocks.world;

      return (
        <div className="page">
          <h1 className="h1">Письмо клиенту</h1>
          <p className="lead mt-1 mb-3">Общее письмо, когда клиент ещё не назвал сумму и страну: что мы умеем и сколько это стоит. Для конкретного платежа письмо уже готово под каждым расчётом во вкладке «Посчитать».</p>
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
            <div className="lg:col-span-5 rounded-2xl card pad space-y-4">
              <div>
                <div className="text-[15px] font-semibold ink mb-2">О чём рассказать подробнее</div>
                <div className="space-y-1.5">
                  {BLOCK_LIST.map((b) => {
                    const on = f.blocks[b.key];
                    return (
                      <button key={b.key} onClick={() => toggleBlock(b.key)} aria-pressed={on} className="w-full rounded-xl px-3 py-2.5 text-left transition-all"
                        style={on ? { background: "rgba(194,53,43,0.07)", border: "1px solid rgba(194,53,43,0.30)" } : { background: "#fbf8f4", border: "1px solid var(--line-2)" }}>
                        <div className="row">
                          <div className="row-l">
                            <div className="text-[14px] font-semibold ink">{b.label}</div>
                            <div className="text-[12.5px] ink-3">{b.sub}</div>
                          </div>
                          <div className="row-r">
                            <span className="inline-flex items-center justify-center w-5 h-5 rounded" style={on ? { background: "var(--red)" } : { border: "1px solid var(--line)", background: "#fff" }}>
                              {on && <IcCheck size={12} stroke="#fff" />}
                            </span>
                          </div>
                        </div>
                      </button>
                    );
                  })}
                </div>
                <Why className="mt-2">{noBlocks ? "Ничего не отмечено — получится короткое письмо: что умеем и сколько стоит. Отметьте темы, которые интересны клиенту, — добавятся подробности." : "Отмеченные темы добавятся в письмо с подробностями и примерами на вашу сумму."}</Why>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <Field label="Имя клиента"><input className="fld" value={f.client} onChange={(e) => set("client")(e.target.value)} placeholder="Иван Иванович" /></Field>
                <Field label="Компания"><input className="fld" value={f.company} onChange={(e) => set("company")(e.target.value)} placeholder="ООО «Ромашка»" /></Field>
                <Field label="Сумма для примера">
                  <div className="relative">
                    <input type="number" inputMode="decimal" min="0" value={f.amount} onChange={(e) => set("amount")(e.target.value)} className="fld num" style={{ paddingRight: "28px" }} />
                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[14px] ink-3">₽</span>
                  </div>
                </Field>
                <Field label="Ваше имя в подписи"><input className="fld" value={signName} onChange={(e) => setSign(e.target.value)} placeholder={SIGN_DEF} /></Field>
              </div>
              <Why>Подпись подставляется во все письма на сайте и запоминается в этом браузере. Сумма нужна, чтобы в письме появились примеры: «на такую сумму — столько-то за всё».</Why>
              <button onClick={() => setF(KP_DEFAULT)} className="inline-flex items-center gap-1.5 text-[13px] ink-2 hover:ink"><IcRefresh size={13} />Начать заново</button>
            </div>
            <div className="lg:col-span-7">
              <KpBlock tall text={text} title={noBlocks ? "Короткое письмо" : "Подробное письмо"}
                note={S > 0 ? "Примеры посчитаны на " + rub(S) + " по сегодняшнему курсу." : "Впишите сумму, чтобы в письме появились примеры расчёта."} />
            </div>
          </div>
        </div>
      );
    }

    /* ================= ПРИЛОЖЕНИЕ: вкладки, адрес в строке браузера, клавиша «/» ================= */
    function readHash() {
      try {
        const h = String(location.hash || "").replace(/^#/, "").split("/");
        return { page: PAGES.some((x) => x.id === h[0]) ? h[0] : "home", calc: SCEN.some((x) => x.id === h[1]) ? h[1] : null };
      } catch (e) { return { page: "home", calc: null }; }
    }
    function App() {
      const init = readHash();
      const [page, setPageState] = useState(init.page);
      const [calc, setCalcState] = useState(init.calc || "clearing");
      const [calcOpts, setCalcOpts] = useState(null);
      const gateOk = useContext(GateCtx);
      /* адрес вида #calc/china: вкладку можно сохранить в закладки, кнопка «назад» возвращает на прошлую */
      const writeHash = (p, c) => {
        const h = "#" + p + (p === "calc" && c ? "/" + c : "");
        try { if (location.hash !== h) history.pushState(null, "", h); } catch (e) {}
      };
      const toTop = () => { try { window.scrollTo(0, 0); } catch (e) {} };
      const go = (p, c, opts) => {
        setPageState(p);
        if (c) setCalcState(c);
        setCalcOpts(opts ? Object.assign({ n: Date.now() }, opts) : null);
        writeHash(p, c || (p === "calc" ? calc : null));
        toTop();
      };
      const setPage = (p) => go(p, null, null);
      const setCalc = (c) => { setCalcState(c); setCalcOpts(null); writeHash("calc", c); };
      useEffect(() => {
        const onPop = () => { const h = readHash(); setPageState(h.page); if (h.calc) setCalcState(h.calc); toTop(); };
        const onNav = (e) => { const d = (e && e.detail) || {}; go(d.page || "home", d.calc || null, d.opts || null); };
        const onCalc = (e) => { const d = (e && e.detail) || {}; go("calc", d.tab || null, d.opts || null); };
        const onBanks = () => { setPageState("banks"); writeHash("banks"); toTop(); };
        const onTariff = () => { setPageState("tariff"); writeHash("tariff"); toTop(); };
        window.addEventListener("popstate", onPop);
        window.addEventListener("nav:go", onNav);
        window.addEventListener("calc:open", onCalc);
        window.addEventListener("banks:open", onBanks);
        window.addEventListener("tariff:open", onTariff);
        return () => {
          window.removeEventListener("popstate", onPop);
          window.removeEventListener("nav:go", onNav);
          window.removeEventListener("calc:open", onCalc);
          window.removeEventListener("banks:open", onBanks);
          window.removeEventListener("tariff:open", onTariff);
        };
      }, [calc]);
      /* «/» в любом месте страницы (кроме полей ввода) — сразу поиск банка */
      useEffect(() => {
        if (!gateOk) return;
        const f = (e) => {
          /* code «Slash» — та же клавиша в русской раскладке (там она печатает точку) */
          if ((e.key !== "/" && e.code !== "Slash") || e.ctrlKey || e.metaKey || e.altKey) return;
          const t = e.target, tag = t && t.tagName;
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable)) return;
          e.preventDefault();
          openBanks("", { focus: true });
        };
        window.addEventListener("keydown", f);
        return () => window.removeEventListener("keydown", f);
      }, [gateOk]);
      const show = (id) => (page === id ? null : { display: "none" });
      return (
        <div>
          <TopBar page={page} setPage={setPage} />
          <main>
            <div style={show("home")}><HomePage /></div>
            <div style={show("lesson")}><LessonPage /></div>
            <div style={show("calc")}><CalcPage calc={calc} setCalc={setCalc} calcOpts={calcOpts} /></div>
            <div style={show("banks")}><BanksPage active={page === "banks"} /></div>
            <div style={show("tariff")}><TariffPage /></div>
            <div style={show("kp")}><KpBuilder /></div>
          </main>
          <footer className="max-w-[1200px] mx-auto px-4 sm:px-6 pb-6 -mt-4 text-[12.5px] ink-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2" style={{ paddingBottom: "calc(24px + var(--bot-h))" }}>
            <span className="flex items-center gap-3 flex-wrap">
              <span className="flex items-center gap-1.5"><IcGlobe size={14} style={{ color: "var(--red)" }} /><span className="font-semibold ink-2">Евгений Демин</span> · международные расчёты</span>
              <Ext href={PHONE} title={PHONE_TITLE} className="inline-flex items-center gap-1 hover:ink"><IcPhone size={12} />{PHONE_DISPLAY}</Ext>
              <button onClick={() => { try { location.reload(); } catch (e) {} }} className="inline-flex items-center gap-1 hover:ink"><IcLock size={12} />закрыть доступ</button>
            </span>
            <span>Расчёты ориентировочные. Финальные условия фиксируются перед сделкой.</span>
          </footer>
          <BottomNav page={page} setPage={setPage} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Gate><PuProvider><HintProvider><SignProvider><App /></SignProvider></HintProvider></PuProvider></Gate>);
  </script>

  <script>
    (function () {
      var src = document.getElementById("app-src").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      (0, eval)(out);
    })();
  </script>
</body>
</html>
