    .rise { opacity: 0; transform: translateY(22px); transition: opacity .7s ease-out, transform .8s cubic-bezier(.2,.75,.2,1); }
    .rise.in { opacity: 1; transform: none; }
    @keyframes softBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
    .bounce { animation: softBounce 1.8s ease-in-out infinite; }
    @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .pulse { animation: pulseDot 1.8s ease-in-out infinite; }

    a, button { -webkit-tap-highlight-color: rgba(0,0,0,0.06); }
    ::selection { background: rgba(194,53,43,0.16); }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .fu, .bounce, .pulse { animation: none; }
      .rise { opacity: 1; transform: none; transition: none; }
    }
  </style>
</head>

      try { if (window.top !== window.self) { window.top.location.href = url; return; } } catch (_) {}

    function pickRow(block, names) {
      if (!block || !block.data || !block.data[0]) return null;
      const cols = block.columns, row = block.data[0];
      for (let i = 0; i < names.length; i++) {
        const idx = cols.indexOf(names[i]);
        if (idx >= 0 && row[idx] !== null && row[idx] !== undefined && row[idx] !== 0) return { value: row[idx], name: names[i] };
      }
      return null;
    }
    function getCol(block, name) {

    function useMoexCny() {
      const [state, setState] = useState({ price: null, time: null, kind: null, status: "loading" });
      const [tick, setTick] = useState(0);
      useEffect(() => {
        let alive = true;
        setState((s) => Object.assign({}, s, { status: "loading" }));
        const bust = "&_=" + Date.now();
        const getJson = (u) => fetch(u + bust, { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error("http"); return r.json(); });
        const run = (attempt) => {
          Promise.all([getJson(MOEX_MD).catch(() => null), getJson(MOEX_SEC).catch(() => null)])
            .then(([md, sec]) => {
              if (!alive) return;
              const live = md ? pickRow(md.marketdata, ["LAST", "MARKETPRICE", "WAPRICE"]) : null;
              if (live) {
                const kinds = { LAST: "последняя сделка", MARKETPRICE: "рыночная цена", WAPRICE: "средневзвешенная" };
                setState({ price: live.value, time: md ? getCol(md.marketdata, "UPDATETIME") : null, kind: kinds[live.name], status: "ok" });
                return;
              }
              const prev = sec ? pickRow(sec.securities, ["PREVPRICE", "PREVWAPRICE", "PREVADMITTEDQUOTE"]) : null;
              if (prev) {
                const d = sec ? getCol(sec.securities, "PREVDATE") : null;
                setState({ price: prev.value, time: d ? new Date(d).toLocaleDateString("ru-RU") : null, kind: "закрытие торгов", status: "ok" });
                return;
              }
              if (attempt < 2) { setTimeout(() => run(attempt + 1), 1200); return; }
              setState((s) => Object.assign({}, s, { status: "error" }));
            })
            .catch(() => { if (!alive) return; if (attempt < 2) setTimeout(() => run(attempt + 1), 1200); else setState((s) => Object.assign({}, s, { status: "error" })); });
        };
        run(1);
        return () => { alive = false; };
      }, [tick]);
      return Object.assign({}, state, { refresh: () => setTick((t) => t + 1) });

    async function copyText(t) {
      try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(t); return true; } } catch (e) {}

        const ta = document.createElement("textarea");
        ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0";
        ta.style.width = "1px"; ta.style.height = "1px"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand("copy"); document.body.removeChild(ta); return ok;
      } catch (e) { return false; }
    }
    function selectNode(node) {

    /* ---------- 1. ИМПОРТ ЧЕРЕЗ ФИНАНСОВОГО АГЕНТА ---------- */
    const IMPORT_WAS_PCT = [0.017, 0.017, 0.015, 0.012];

    function ImportPanel() {
      const { rates, cbrDate, status } = useCbr();
      const [customMode, setCustomMode] = useState(false);
      const [cr, setCr] = useState({ USD: String(FALLBACK.USD), EUR: String(FALLBACK.EUR), CNY: String(FALLBACK.CNY) });
      const [currency, setCurrency] = useState("USD");
      const [amount, setAmount] = useState("25000");
      useEffect(() => { if (status === "ok") setCr({ USD: rates.USD.toFixed(4), EUR: rates.EUR.toFixed(4), CNY: rates.CNY.toFixed(4) }); }, [status]);

      const eff = customMode ? { USD: parseNum(cr.USD, rates.USD), EUR: parseNum(cr.EUR, rates.EUR), CNY: parseNum(cr.CNY, rates.CNY) } : rates;
      const P = parseNum(amount, 0);
      const Prub = P * eff[currency];
      const Pusd = eff.USD > 0 ? Prub / eff.USD : 0;
      const tier = tierFor(Pusd);
      const tierIdx = IMPORT_TIERS.indexOf(tier);
      const mainComm = Prub * tier.pct + tier.fix * eff.USD;
      const wasComm  = Prub * IMPORT_WAS_PCT[tierIdx] + tier.fix * eff.USD;
      const valCtl = Math.max(Prub * VC_PCT, VC_MIN);
      const finAg  = Math.max(Prub * FA_PCT, FA_MIN);
      const totalComm = mainComm + valCtl + finAg;
      const total = Prub + totalComm;
      const totalWas = Prub + wasComm + valCtl + finAg;
      const saved = totalWas - total;
      const overall = Prub > 0 ? (totalComm / Prub) * 100 : 0;
      const dateStr = cbrDate ? new Date(cbrDate).toLocaleDateString("ru-RU") : "";
      const setCrField = (k, v) => setCr((o) => Object.assign({}, o, { [k]: v }));
      const symbol = CURRENCIES.find((c) => c.code === currency).sym;
      const srcName = customMode ? "Investing или свой курс" : "ЦБ" + (dateStr ? " на " + dateStr : "");

      const kp = [
        "Иван Иванович, добрый день!",
        "",
        "Платёж " + cur(P) + " " + currency + " обойдётся в " + rub(total) + ". Все комиссии внутри, это " + pctStr(overall, 1) + " сверх суммы.",
        "",
        "РАСЧЁТ",
        "Сумма платежа: " + cur(P) + " " + currency + ", по курсу " + srcName + " " + rate(eff[currency]) + " это " + rub(Prub),
        "Комиссия агента, " + tier.now + ": " + rub(mainComm),
        "Валютный контроль, 0,2% (мин. 1 200 ₽): " + rub(valCtl),
        "Перевод финансовому агенту, 0,15% (мин. 1 000 ₽): " + rub(finAg),
        "Комиссии итого: " + rub(totalComm),
        "К ОПЛАТЕ: " + rub(total) + " ($" + cur(total / eff.USD) + " / ¥" + cur(total / eff.CNY) + " / €" + cur(total / eff.EUR) + ")",
        "",
        "АКЦИЯ ДО " + PROMO_UNTIL.toUpperCase(),
        "Ставка агента снижена: " + tier.jan + " в начале года, " + tier.was + " ещё недавно, сейчас " + tier.now + ".",
        "По прежним условиям этот же платёж стоил бы " + rub(totalWas) + ". Экономия " + rub(saved) + ".",
        "",
        "ТАРИФНАЯ СЕТКА АГЕНТА",
      ].concat(IMPORT_TIERS.map((t) => "• " + t.range + ": " + t.now + " (было " + t.was + ")"))
       .concat([
        "",
        "УСЛОВИЯ",
        "• Платёж идёт через финансового агента-нерезидента, ваш банк в цепочке не светится.",
        "• Конвертация по курсу ЦБ или по Investing, на ваш выбор, без спреда и накруток.",
        "• В волатильные дни сверяемся с биржей с 10:00 до 11:00 МСК и считаем по биржевому, если он выгоднее вам.",
        "• Проверка контракта и валютный контроль под ключ включены.",
        "• Если маршрут закрывается, переводим сделку на клиринг, Bank of Dandong или прямой платёж.",
        "• Расчёт ориентировочный, финальные цифры фиксируем перед сделкой.",
        "",
      ]).concat(SIGN).join("\n");

      return (

    /* ---------- 3. ПОКУПКА ЮАНЯ В АЛЬФЕ И ВТБ ---------- */
    function routes(R, mV, byCny, nWanted, budget) {
      const rateA = R + mV;
      const rateB = (R + ALFA_MARKUP) * (1 + ALFA_CONV) / (1 - ALFA_TRANSFER);
      let nA, nB, rubA, rubB;
      if (byCny) { nA = nB = nWanted; rubA = nA * rateA; rubB = nB * rateB; }
      else { rubA = rubB = budget; nA = rateA > 0 ? budget / rateA : 0; nB = rateB > 0 ? budget / rateB : 0; }
      const aWins = rateA < rateB;
      const diffRub = Math.abs(rubA - rubB), diffCny = Math.abs(nA - nB);
      const saveRub = byCny ? diffRub : diffCny * R;
      const saveCny = byCny ? (R > 0 ? diffRub / R : 0) : diffCny;
      const savePct = byCny ? (Math.max(rubA, rubB) > 0 ? (diffRub / Math.max(rubA, rubB)) * 100 : 0)
                            : (Math.max(nA, nB) > 0 ? (diffCny / Math.max(nA, nB)) * 100 : 0);
      return { rateA, rateB, nA, nB, rubA, rubB, aWins, saveRub, saveCny, savePct };
    }
    function ModeSwitch({ byCny, setMode }) {
      return (
        <div className="grid grid-cols-2 gap-2">
          <button onClick={() => setMode("cny")} className={"rounded-xl py-2.5 text-[14px] font-medium transition-all " + (byCny ? "btn-dark" : "btn-ghost")}>Сумму в ¥</button>
          <button onClick={() => setMode("rub")} className={"rounded-xl py-2.5 text-[14px] font-medium transition-all " + (!byCny ? "btn-dark" : "btn-ghost")}>Бюджет в ₽</button>
        </div>
      );
    }
    /* колонка: карточки складываются в столбик, ряд один — так секция короче */
    function Col({ children }) { return (<div className="flex flex-col gap-3.5 sm:gap-4">{children}</div>); }
    const GRID4 = "grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3.5 sm:gap-4 items-start";

    function YuanPanel() {
      const moex = useMoexCny();
      const { rates: cbr, status: cbrStatus } = useCbr();
      const [useCustom, setUseCustom] = useState(false);
      const [customRate, setCustomRate] = useState("");
      const [mode, setMode] = useState("cny");
      const [amtCny, setAmtCny] = useState("100000");
      const [amtRub, setAmtRub] = useState("1000000");
      const [vtbMarkup, setVtbMarkup] = useState(0.20);
      const byCny = mode === "cny";

      const baseAuto = moex.status === "ok" && moex.price ? moex.price : cbr.CNY;
      const R = useCustom ? parseNum(customRate, baseAuto) : baseAuto;
      const nWanted = parseNum(amtCny, 0), budget = parseNum(amtRub, 0);
      const r = routes(R, vtbMarkup, byCny, nWanted, budget);
      const scenarios = MARKUPS.map((m) => Object.assign({ markup: m }, routes(R, m, byCny, nWanted, budget)));

      const A_base = r.nA * R, A_markup = r.nA * vtbMarkup;
      const B_bought = r.nB / (1 - ALFA_TRANSFER);
      const B_base = B_bought * R, B_markup = B_bought * ALFA_MARKUP;
      const B_conv = B_bought * (R + ALFA_MARKUP) * ALFA_CONV;
      const B_transferCny = B_bought * ALFA_TRANSFER, B_transferRub = B_transferCny * (R + ALFA_MARKUP);
      const commA = r.rubA - r.nA * R, commB = r.rubB - r.nB * R;
      const pctA = r.nA * R > 0 ? (commA / (r.nA * R)) * 100 : 0;
      const pctB = r.nB * R > 0 ? (commB / (r.nB * R)) * 100 : 0;
      const breakEven = r.rateB - R;
      const shPayA = r.nA * SH_PAY, shVcA = r.nA * SH_VC;
      const shTotalRub = (shPayA + shVcA) * R;
      const fullA = r.rubA + shTotalRub, fullB = r.rubB + (r.nB * (SH_PAY + SH_VC)) * R;
      const winColor = r.aWins ? VTB_BLUE : ALFA_RED;

      const kp = [
        "Иван Иванович, добрый день!",
        "",
        (r.aWins ? "Юань выгоднее покупать в ВТБ: экономия " : "Юань выгоднее покупать в Альфа-Банке: экономия ") + rub(r.saveRub) + " (" + cny(r.saveCny) + "), это " + pctStr(r.savePct) + ".",
        "",
        "БАЗА",
        "Курс " + rate4(R) + " за 1 ¥, " + (useCustom ? "задан вручную" : (moex.status === "ok" ? "биржевой Мосбиржи" + (moex.time ? ", " + moex.kind + " в " + moex.time : "") : "курс ЦБ")),
        byCny ? "Объём " + cny(nWanted) + " в ВТБ Шанхай" : "Бюджет " + rub(budget),
        "",
        "ЕСЛИ ПОКУПАТЬ В ВТБ",
        "• Наценка в курсе, " + Math.round(vtbMarkup * 100) + " коп. на юань: " + rub(A_markup),
        "• Конвертация: 0%",
        "• Перевод в ВТБ Шанхай: 0%, внутри банка",
        "Эффективный курс " + rate4(r.rateA) + ", " + (byCny ? "итого " + rub(r.rubA) : "получите " + cny(r.nA)),
        "",
        "ЕСЛИ ПОКУПАТЬ В АЛЬФА-БАНКЕ",
        "• Наценка в курсе, 1 коп. на юань: " + rub(B_markup),
        "• Конвертация 0,6%: " + rub(B_conv),
        "• Перевод в ВТБ 0,3%: " + rub(B_transferRub) + " (" + cny(B_transferCny) + ", держат в юанях)",
        "• Перевод в ВТБ Шанхай: 0%, внутри банка",
        "Эффективный курс " + rate4(r.rateB) + ", " + (byCny ? "итого " + rub(r.rubB) : "получите " + cny(r.nB)),
        "",
        (r.aWins ? "" : "Почему так. У ВТБ комиссии нулевые, но наценка сидит в курсе и съедает больше, чем 0,6% и 0,3% у Альфы. ВТБ сравнялся бы при наценке " + (breakEven * 100).toFixed(1).replace(".", ",") + " коп., а берёт от 14 до 25."),
        "",
        "ПРИ РАЗНЫХ НАЦЕНКАХ ВТБ",
      ].concat(scenarios.map((s) => "• " + Math.round(s.markup * 100) + " коп.: " + (byCny
          ? "ВТБ " + rub(s.rubA) + ", Альфа " + rub(s.rubB) + ", разница " + rub(s.saveRub)
          : "ВТБ " + cny(s.nA) + ", Альфа " + cny(s.nB) + ", разница " + cny(s.saveCny))))
       .concat([
        "",
        "КОМИССИИ ВТБ ШАНХАЙ ПРИ ОТПРАВКЕ",
        "• Платёж 1,99%: " + rub(shPayA * R) + " (" + cny(shPayA) + ")",
        "• Валютный контроль 0,2%: " + rub(shVcA * R) + " (" + cny(shVcA) + ")",
        "Вместе 2,19%, это " + rub(shTotalRub) + ". Одинаково для обоих вариантов, на выбор банка не влияет.",
        byCny ? "Полная стоимость: через ВТБ " + rub(fullA) + ", через Альфу " + rub(fullB) + "." : "",
        "",
        "ВАЖНО: ЭТО ЕЩЁ НЕ САМЫЙ ДЕШЁВЫЙ ПУТЬ",
        "Клиринг через ФА-резидента стоит 0,5% при курсе ЦБ, без наценки в курсе и без 1,99% ВТБ Шанхай. Акция действует до " + PROMO_UNTIL + ".",
        "",
        "Тарифы зависят от плана, объёма и дня. Финальные цифры фиксируем перед сделкой.",
        "",
      ]).concat(SIGN).join("\n");

      return (
        <div className={GRID4}>

          <Col>
            <div className="rounded-2xl card p-4 sm:p-5">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                <div className="flex items-center gap-2 text-[15px] ink"><IcChart size={16} style={{ color: "var(--red)" }} /><span className="font-semibold">Базовый курс юаня</span></div>
                <div className="flex items-center gap-3">
                  <button onClick={moex.refresh} className="inline-flex items-center gap-1.5 text-[13px] ink-2 hover:ink"><IcRefresh size={14} className={moex.status === "loading" ? "animate-spin" : ""} />обновить</button>
                  <Ext href={MOEX_LINK} className="inline-flex items-center gap-1 text-[13px] underline underline-offset-4" style={{ color: "var(--red)" }}>moex<IcExt size={13} /></Ext>
                </div>
              </div>
              <div className="space-y-2">
                <div className="row rounded-xl px-3.5 py-2.5" style={{ background: "rgba(194,53,43,0.07)", border: "1px solid rgba(194,53,43,0.22)" }}>
                  <div className="row-l">
                    <div className="text-[13px] font-semibold" style={{ color: "var(--red-ink)" }}>Мосбиржа · CNYRUB_TOM</div>
                    <div className="text-[12.5px] ink-3 mt-0.5 leading-snug">{moex.status === "ok" ? (moex.kind + (moex.time ? ", " + moex.time : "")) : "тянем данные"}</div>
                  </div>
                  <div className="row-r num text-[19px] font-bold ink">{moex.status === "ok" ? rate4(moex.price) : (moex.status === "loading" ? "…" : "н/д")}</div>
                </div>
                <div className="row rounded-xl card-soft px-3.5 py-2.5">
                  <div className="row-l"><div className="text-[13px] font-medium ink-2">Курс ЦБ РФ</div><div className="text-[12.5px] ink-3 mt-0.5">справочно</div></div>
                  <div className="row-r num text-[19px] font-bold ink">{cbrStatus === "loading" ? "…" : rate4(cbr.CNY)}</div>
                </div>
                <div className="rounded-xl card-soft px-3.5 py-2.5">
                  <label className="flex items-center gap-2 select-none mb-2">
                    <input type="checkbox" checked={useCustom} onChange={(e) => { setUseCustom(e.target.checked); if (e.target.checked && !customRate) setCustomRate(baseAuto.toFixed(4)); }} className="w-4 h-4" style={{ accentColor: "var(--red)" }} />
                    <span className="text-[13px] ink-2 font-medium">Свой курс, ₽ за 1 ¥</span>
                  </label>
                  <input type="number" inputMode="decimal" step="0.0001" disabled={!useCustom} value={customRate} onChange={(e) => setCustomRate(e.target.value)} placeholder={baseAuto.toFixed(4)} className={"fld num text-center " + (useCustom ? "" : "opacity-50")} />
                </div>
              </div>
              <div className="mt-3 pt-3" style={{ borderTop: "1px solid var(--line-2)" }}>
                <div className="text-[14px] font-semibold ink mb-2">Что задаём</div>
                <ModeSwitch byCny={byCny} setMode={setMode} />
                <div className="text-[14px] font-medium ink mt-3 mb-2">{byCny ? "Сколько юаней нужно в Шанхае" : "Сколько рублей готовы потратить"}</div>
                <div className="relative">
                  <input type="number" inputMode="decimal" min="0" value={byCny ? amtCny : amtRub} onChange={(e) => byCny ? setAmtCny(e.target.value) : setAmtRub(e.target.value)} className="fld fld-big num" />
                  <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xl ink-3">{byCny ? "¥" : "₽"}</span>
                </div>
                <div className="text-[13px] ink-3 mt-2 num">{byCny ? "≈ " + rub(nWanted * R) : "≈ " + cny(budget / (R || 1))} по биржевому курсу</div>
              </div>
              <div className="mt-3 pt-3" style={{ borderTop: "1px solid var(--line-2)" }}>
                <div className="flex items-baseline justify-between mb-2">
                  <div className="text-[14px] font-semibold ink">Наценка ВТБ к бирже</div>
                  <div className="text-lg font-bold num" style={{ color: VTB_BLUE }}>{Math.round(vtbMarkup * 100)} коп.</div>
                </div>
                <input type="range" min="14" max="25" step="1" value={Math.round(vtbMarkup * 100)} onChange={(e) => setVtbMarkup(parseInt(e.target.value, 10) / 100)} className="w-full" />
                <div className="flex justify-between text-[12.5px] ink-3"><span>14 коп.</span><span>25 коп.</span></div>
              </div>
            </div>

            <div className="rounded-2xl card p-4 sm:p-5">
              <div className="flex items-center gap-2 mb-1"><IcScale size={17} style={{ color: "var(--red)" }} /><div className="text-[15px] font-semibold ink">Разница при 14, 20 и 25 копейках</div></div>
              <div className="text-[12.5px] ink-3 mb-3">Три самых частых наценки{byCny ? ", для " + cny(nWanted) : ", для " + rub(budget)}.</div>
              <div className="space-y-2">
                {scenarios.map((s, i) => {
                  const on = Math.round(s.markup * 100) === Math.round(vtbMarkup * 100);
                  return (
                    <div key={i} className={"rounded-xl px-3.5 py-2.5 " + (on ? "" : "card-soft")} style={on ? { background: "rgba(194,53,43,0.07)", border: "1px solid rgba(194,53,43,0.26)" } : null}>
                      <div className="row mb-1">
                        <span className="row-l inline-flex items-center gap-2 ink font-semibold text-[14px]">{Math.round(s.markup * 100)} коп.{on && <span className="text-[11px] px-1.5 py-0.5 rounded-full font-medium" style={{ background: "rgba(194,53,43,0.14)", color: "var(--red-ink)" }}>сейчас</span>}</span>
                        <span className="row-r num text-[14px] font-bold" style={{ color: s.aWins ? VTB_BLUE : ALFA_RED }}>{byCny ? rub(s.saveRub) : cny(s.saveCny)} · {pctStr(s.savePct)}</span>
                      </div>
                      <div className="text-[12.5px] ink-2 num">ВТБ {byCny ? rub(s.rubA) : cny(s.nA)} · Альфа {byCny ? rub(s.rubB) : cny(s.nB)}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          </Col>

          <Col>
            <div className={"rounded-2xl c-vtb emboss flex flex-col p-4 sm:p-5 " + (r.aWins ? "win-vtb" : "")}>
              <div className="flex items-start justify-between gap-2 mb-1">
                <div className="flex items-center gap-2 min-w-0">
                  <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: VTB_BLUE }}></span>
                  <div className="text-[16px] font-semibold ink leading-tight">Покупаем юань в ВТБ</div>
                </div>
                {r.aWins && (<span className="shrink-0 inline-flex items-center gap-1.5 text-[12px] font-semibold px-2.5 py-1 rounded-full text-white" style={{ background: VTB_BLUE }}><IcTrophy size={13} />Выгоднее</span>)}
              </div>
              <div className="text-[12.5px] ink-3 mb-3">и сразу отправляем в ВТБ Шанхай</div>
              <div className="mb-3 inline-flex flex-wrap items-center gap-x-2 text-[13px] px-2.5 py-1.5 rounded-lg self-start" style={{ background: "rgba(10,40,150,0.08)", border: "1px solid rgba(10,40,150,0.24)", color: VTB_BLUE }}>Эффективный курс: <span className="font-bold num">{rate4(r.rateA)}</span></div>
              <Row label="Юань по курсу биржи" sub={cny(r.nA) + " по " + rate4(R)} value={rub(A_base)} alt={"≈ " + cny(r.nA)} />
              <Row label="Наценка ВТБ в курсе" sub={Math.round(vtbMarkup * 100) + " коп. за юань"} value={rub(A_markup)} alt={"≈ " + cny(A_markup / (R || 1))} color={VTB_BLUE} />
              <Row label="Конвертация" sub="в ВТБ нет" zero />
              <Row label="Перевод в ВТБ Шанхай" sub="внутри банка" zero />
              <div className="mt-3 rounded-xl px-4 py-3" style={{ background: "rgba(10,40,150,0.06)", border: "1px solid rgba(10,40,150,0.20)" }}>
                <div className="row">
                  <div className="row-l text-[14px] font-medium ink-2">{byCny ? "Стоимость юаня" : "Получите юаней"}</div>
                  <div className="row-r">
                    <div className="text-2xl font-bold num" style={{ color: VTB_BLUE }}>{byCny ? rub(r.rubA) : cny(r.nA)}</div>
                    <div className="text-[12.5px] ink-3 num">{byCny ? "за " + cny(r.nA) : "за " + rub(r.rubA)}</div>
                  </div>
                </div>
                <div className="mt-2 pt-2 row text-[12.5px] ink-3" style={{ borderTop: "1px solid rgba(10,40,150,0.15)" }}>
                  <span className="row-l">Издержки сверх биржи</span><span className="row-r num ink-2">{rub(commA)} · {pctStr(pctA)}</span>
                </div>
              </div>
            </div>

            <div className="rounded-2xl card p-4 sm:p-5" style={{ borderLeft: "4px solid var(--red)" }}>
              <div className="flex items-center gap-2 mb-1"><IcAlert size={17} style={{ color: "var(--red)" }} /><div className="text-[15px] font-semibold ink">Плюс комиссии самого ВТБ Шанхай</div></div>
              <div className="text-[13px] ink-2 mb-3">Когда юань уходит поставщику, банк удержит своё. Одинаково для обоих вариантов, на выбор банка не влияет.</div>
              <Row label="Платёж, 1,99%" value={rub(shPayA * R)} alt={"≈ " + cny(shPayA)} />
              <Row label="Валютный контроль, 0,2%" value={rub(shVcA * R)} alt={"≈ " + cny(shVcA)} />
              <div className="row rounded-xl px-3.5 py-2.5 mt-2" style={{ background: "rgba(194,53,43,0.08)", border: "1px solid rgba(194,53,43,0.24)" }}>
                <div className="row-l text-[13.5px] font-semibold" style={{ color: "var(--red-ink)" }}>Вместе 2,19%</div>
                <div className="row-r"><div className="text-[15px] font-bold num" style={{ color: "var(--red)" }}>{rub(shTotalRub)}</div><div className="text-[12.5px] ink-3 num">≈ {cny(shPayA + shVcA)}</div></div>
              </div>
              {byCny && (
                <div className="mt-3 pt-3 space-y-2" style={{ borderTop: "1px solid var(--line-2)" }}>
                  <div className="row rounded-xl px-3.5 py-2.5" style={{ background: "rgba(10,40,150,0.06)", border: "1px solid rgba(10,40,150,0.18)" }}><div className="row-l text-[13.5px] ink-2">Полностью через ВТБ</div><div className="row-r text-[15px] font-bold num" style={{ color: VTB_BLUE }}>{rub(fullA)}</div></div>
                  <div className="row rounded-xl px-3.5 py-2.5" style={{ background: "rgba(214,40,31,0.06)", border: "1px solid rgba(214,40,31,0.18)" }}><div className="row-l text-[13.5px] ink-2">Через Альфу</div><div className="row-r text-[15px] font-bold num" style={{ color: ALFA_RED }}>{rub(fullB)}</div></div>
                </div>
              )}
            </div>
          </Col>

          <Col>
            <div className={"rounded-2xl c-alfa emboss flex flex-col p-4 sm:p-5 " + (!r.aWins ? "win-red" : "")}>
              <div className="flex items-start justify-between gap-2 mb-1">
                <div className="flex items-center gap-2 min-w-0">
                  <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: ALFA_RED }}></span>
                  <div className="text-[16px] font-semibold ink leading-tight">Покупаем юань в Альфа-Банке</div>
                </div>
                {!r.aWins && (<span className="shrink-0 inline-flex items-center gap-1.5 text-[12px] font-semibold px-2.5 py-1 rounded-full text-white" style={{ background: ALFA_RED }}><IcTrophy size={13} />Выгоднее</span>)}
              </div>
              <div className="text-[12.5px] ink-3 mb-3">переводим в ВТБ, оттуда в ВТБ Шанхай</div>
              <div className="mb-3 inline-flex flex-wrap items-center gap-x-2 text-[13px] px-2.5 py-1.5 rounded-lg self-start" style={{ background: "rgba(214,40,31,0.08)", border: "1px solid rgba(214,40,31,0.24)", color: ALFA_RED }}>Эффективный курс: <span className="font-bold num">{rate4(r.rateB)}</span></div>
              <Row label="Юань по курсу биржи" sub={"берём " + cny(B_bought) + " по " + rate4(R)} value={rub(B_base)} alt={"≈ " + cny(B_bought)} />
              <Row label="Наценка Альфы в курсе" sub="1 коп. за юань" value={rub(B_markup)} alt={"≈ " + cny(B_markup / (R || 1))} color={ALFA_RED} />
              <Row label="Конвертация" sub="0,6% от суммы" value={rub(B_conv)} alt={"≈ " + cny(B_conv / (R || 1))} color={ALFA_RED} />
              <Row label="Перевод в ВТБ" sub="0,3%, держат в юанях" value={rub(B_transferRub)} alt={"≈ " + cny(B_transferCny)} color={ALFA_RED} />
              <Row label="Перевод в ВТБ Шанхай" sub="внутри банка" zero />
              <div className="mt-3 rounded-xl px-4 py-3" style={{ background: "rgba(214,40,31,0.06)", border: "1px solid rgba(214,40,31,0.20)" }}>
                <div className="row">
                  <div className="row-l text-[14px] font-medium ink-2">{byCny ? "Стоимость юаня" : "Получите юаней"}</div>
                  <div className="row-r">
                    <div className="text-2xl font-bold num" style={{ color: ALFA_RED }}>{byCny ? rub(r.rubB) : cny(r.nB)}</div>
                    <div className="text-[12.5px] ink-3 num">{byCny ? "за " + cny(r.nB) : "за " + rub(r.rubB)}</div>
                  </div>
                </div>
                <div className="mt-2 pt-2 row text-[12.5px] ink-3" style={{ borderTop: "1px solid rgba(214,40,31,0.15)" }}>
                  <span className="row-l">Издержки сверх биржи</span><span className="row-r num ink-2">{rub(commB)} · {pctStr(pctB)}</span>
                </div>
              </div>
            </div>

            <div className="rounded-2xl card p-4 sm:p-5">
              <div className="flex items-center gap-2 mb-2"><IcInfo size={17} style={{ color: "var(--red)" }} /><div className="text-[15px] font-semibold ink">Как считаем</div></div>
              <div className="text-[13.5px] ink-2 leading-relaxed space-y-2">
                <p>Банк покупает валюту на бирже и добавляет наценку. Поэтому считаем от биржевого курса, а не от курса ЦБ.</p>
                <p><span className="font-semibold" style={{ color: VTB_BLUE }}>ВТБ:</span> наценка от 14 до 25 копеек сидит в курсе, конвертация 0%, перевод в Шанхай 0%.</p>
                <p><span className="font-semibold" style={{ color: ALFA_RED }}>Альфа:</span> наценка 1 копейка, конвертация 0,6%, перевод в ВТБ 0,3%. Последнюю держат в юанях, поэтому покупаем чуть больше нужного.</p>
                <p className="rounded-xl px-3 py-2.5" style={{ background: "rgba(194,53,43,0.07)", border: "1px solid rgba(194,53,43,0.22)" }}><span className="font-semibold ink">И самое главное:</span> клиринг через ФА-резидента обходит оба варианта — 0,5% по курсу ЦБ, без наценки и без 1,99% ВТБ Шанхай.</p>
              </div>
            </div>
          </Col>

          <Col>
            <div className="rounded-2xl card p-4 sm:p-5" style={{ border: "2px solid " + winColor }}>
              <div className="flex items-center gap-3 mb-3">
                <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0" style={{ background: winColor }}><IcTrophy size={21} stroke="#fff" /></div>
                <div className="min-w-0">
                  <div className="text-[12px] uppercase tracking-wider ink-3">Вывод</div>
                  <div className="text-[17px] font-bold leading-tight" style={{ color: winColor }}>{r.aWins ? "Выгоднее в ВТБ" : "Выгоднее в Альфа-Банке"}</div>
                </div>
              </div>
              <div className="grid grid-cols-3 gap-2">
                <div className="rounded-lg sunken px-2.5 py-2"><div className="text-[12px] ink-3 mb-0.5">Экономия, ₽</div><div className="text-[17px] font-bold num leading-tight" style={{ color: winColor }}>{rub(r.saveRub)}</div></div>
                <div className="rounded-lg sunken px-2.5 py-2"><div className="text-[12px] ink-3 mb-0.5">Экономия, ¥</div><div className="text-[17px] font-bold num leading-tight" style={{ color: winColor }}>{cny(r.saveCny)}</div></div>
                <div className="rounded-lg sunken px-2.5 py-2"><div className="text-[12px] ink-3 mb-0.5">Разница</div><div className="text-[17px] font-bold num leading-tight" style={{ color: winColor }}>{pctStr(r.savePct)}</div></div>
              </div>
              <div className="mt-3 pt-3 text-[13px] ink-2 leading-relaxed" style={{ borderTop: "1px solid var(--line-2)" }}>
                ВТБ сравнялся бы при наценке <span className="font-semibold ink num">{(breakEven * 100).toFixed(1).replace(".", ",")} коп.</span> Берёт от 14 до 25. Значит, переплата всегда.
              </div>
            </div>
            <KpBlock text={kp} note="В КП отдельным блоком идёт напоминание про клиринг как более дешёвый маршрут." />
          </Col>
        </div>
      );
    }

    /* ---------- 4. КЛИРИНГОВЫЕ ПЛАТЕЖИ ---------- */
    const CLEARING_STEPS = [
      { n: "1", t: "Рубли из Альфа-Банка", d: "Вы платите рублями со своего счёта, никакой валюты покупать не нужно." },
      { n: "2", t: "Конвертация по ЦБ", d: "Курс берётся строго по ЦБ на момент перевода, наценки в курсе нет." },
      { n: "3", t: "Платит банк КНР", d: "Поставщик получает средства от банка материкового Китая, внутренним платежом." },
    ];

    function RouteCard({ rt, isBest, byCny, budget }) {
      return (
        <div className={"rounded-2xl emboss flex flex-col p-4 sm:p-5 " + rt.cls + " " + (isBest ? rt.win : "")}>
          <div className="flex items-start justify-between gap-2 mb-1">
            <div className="flex items-center gap-2 min-w-0">
              <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: rt.color }}></span>
              <div className="text-[16px] font-semibold ink leading-tight">{rt.name}</div>
            </div>
            {isBest
              ? <span className="shrink-0 inline-flex items-center gap-1.5 text-[12px] font-semibold px-2.5 py-1 rounded-full text-white" style={{ background: rt.color }}><IcTrophy size={13} />Выгоднее</span>
              : <span className="shrink-0 text-[11.5px] font-semibold uppercase tracking-wider ink-3">{rt.tag}</span>}
          </div>
          <div className="text-[12.5px] ink-3 mb-3">{rt.sub}</div>
          <div className="mb-3 inline-flex flex-wrap items-center gap-x-2 text-[13px] px-2.5 py-1.5 rounded-lg self-start" style={{ background: "rgba(0,0,0,0.03)", border: "1px solid " + rt.color + "44", color: rt.color }}>Один юань обходится в <span className="font-bold num">{rate4(rt.per)}</span></div>
          {rt.rows.map((x, i) => (<Row key={i} label={x.l} sub={x.s} value={x.v} alt={x.a} color={x.c} zero={x.zero} />))}
          <div className="mt-3 rounded-xl px-4 py-3" style={{ background: rt.color + "12", border: "1px solid " + rt.color + "33" }}>
            <div className="row">
              <div className="row-l text-[14px] font-medium ink-2">{byCny ? "Итого к оплате" : "Дойдёт до поставщика"}</div>
              <div className="row-r">
                <div className="text-2xl font-bold num" style={{ color: rt.color }}>{byCny ? rub(rt.total) : cny(rt.n)}</div>
                <div className="text-[12.5px] ink-3 num">{byCny ? "за " + cny(rt.n) : "из " + rub(budget)}</div>
              </div>
            </div>
            <div className="mt-2 pt-2 text-[12.5px] ink-3" style={{ borderTop: "1px solid " + rt.color + "26" }}>{rt.foot}</div>
          </div>
        </div>
      );
    }

    function ClearingPanel() {
      const { rates: cbr, cbrDate, status: cbrStatus } = useCbr();
      const moex = useMoexCny();
      const [mode, setMode] = useState("cny");
      const [amtCny, setAmtCny] = useState("100000");
      const [amtRub, setAmtRub] = useState("1500000");
      const [vtbMarkup, setVtbMarkup] = useState(0.20);
      const byCny = mode === "cny";

      const Rcb = cbr.CNY;
      const Rmoex = moex.status === "ok" && moex.price ? moex.price : cbr.CNY;
      const dateStr = cbrDate ? new Date(cbrDate).toLocaleDateString("ru-RU") : "";
      const vtbPerCny = (1 + SH_PAY + SH_VC) * (Rmoex + vtbMarkup);

      const N0 = parseNum(amtCny, 0);
      const budget = parseNum(amtRub, 0);
      function clearingFor(n) { const body = n * Rcb; const comm = Math.max(body * CLEARING_PCT, CLEARING_MIN); return { body, comm, total: body + comm }; }
      function dandongFor(n)  { const body = n * Rcb; const tr = Math.max(body * DANDONG_PCT, DANDONG_MIN); const ex = body * DANDONG_EXTRA; return { body, tr, ex, total: body + tr + ex }; }

      let nClear, nDand, nVtb;
      if (byCny) { nClear = nDand = nVtb = N0; }
      else {
        const cPct = budget / (Rcb * (1 + CLEARING_PCT));
        nClear = (cPct * Rcb * CLEARING_PCT >= CLEARING_MIN) ? cPct : Math.max((budget - CLEARING_MIN) / Rcb, 0);
        const dPct = budget / (Rcb * (1 + DANDONG_PCT + DANDONG_EXTRA));
        nDand = (dPct * Rcb * DANDONG_PCT >= DANDONG_MIN) ? dPct : Math.max((budget - DANDONG_MIN) / (Rcb * (1 + DANDONG_EXTRA)), 0);
        nVtb = vtbPerCny > 0 ? budget / vtbPerCny : 0;
      }
      const C = clearingFor(nClear), D = dandongFor(nDand);
      const vtbTotal = byCny ? nVtb * vtbPerCny : budget;
      const clearTotal = byCny ? C.total : budget;
      const dandTotal  = byCny ? D.total : budget;
      const perClear = nClear > 0 ? clearTotal / nClear : Rcb * (1 + CLEARING_PCT);
      const perDand  = nDand  > 0 ? dandTotal  / nDand  : Rcb * (1 + DANDONG_PCT + DANDONG_EXTRA);
      const minApplied = C.body * CLEARING_PCT < CLEARING_MIN;
      const clearCommPct = C.body > 0 ? (C.comm / C.body) * 100 : 0;

      const R3 = [
        { id: "clear", name: "Клиринг · ФА-резидент", sub: "Пэйдинг, Глобал Холдинг · 14 провинций КНР", cls: "c-alfa", win: "win-red", color: ALFA_RED, n: nClear, total: clearTotal, per: perClear, tag: "Наш козырь",
          rows: [
            { l: "Сумма платежа по курсу ЦБ", s: cny(nClear) + " по " + rate4(Rcb), v: rub(C.body), a: "≈ " + cny(nClear) },
            { l: "Комиссия клиринга", s: minApplied ? "0,5%, но сработал минимум 20 000 ₽" : "0,5% от суммы, было 0,9%", v: rub(C.comm), a: "≈ " + cny(C.comm / (Rcb || 1)), c: ALFA_RED },
            { l: "Наценка к курсу", s: "её нет, идём строго по ЦБ", zero: true },
            { l: "Валютный контроль", s: "отдельно не берётся", zero: true },
          ],
          foot: "Комиссия по факту " + pctStr(clearCommPct) + " от суммы." },
        { id: "dand", name: "Bank of Dandong", sub: "перевод в юанях, курс ЦБ", cls: "c-gold", win: "win-gold", color: GOLD, n: nDand, total: dandTotal, per: perDand, tag: "Юани",
          rows: [
            { l: "Сумма платежа по курсу ЦБ", s: cny(nDand) + " по " + rate4(Rcb), v: rub(D.body), a: "≈ " + cny(nDand) },
            { l: "Перевод", s: "0,8% от суммы, мин. 3 000 ₽, было 1,2%", v: rub(D.tr), a: "≈ " + cny(D.tr / (Rcb || 1)), c: GOLD },
            { l: "Конвертация и валютный контроль", s: "совокупно всё вместе не более 1,8%", v: rub(D.ex), a: "≈ " + cny(D.ex / (Rcb || 1)), c: GOLD },
            { l: "Комиссия с получателя в КНР", s: "ВТБ Шанхай берёт с китайцев 1–1,2%", zero: true },
          ],
          foot: "По редким санкционным позициям с получателя 0,2%, по остальным 0%." },
        { id: "vtb", name: "Через ВТБ Шанхай", sub: "покупка юаня в ВТБ и платёж из Шанхая", cls: "c-vtb", win: "win-vtb", color: VTB_BLUE, n: nVtb, total: vtbTotal, per: vtbPerCny, tag: "Для сравнения",
          rows: [
            { l: "Юань по курсу биржи", s: cny(nVtb) + " по " + rate4(Rmoex), v: rub(nVtb * Rmoex), a: "≈ " + cny(nVtb) },
            { l: "Наценка ВТБ в курсе", s: Math.round(vtbMarkup * 100) + " коп. за юань", v: rub(nVtb * vtbMarkup), a: "≈ " + cny(nVtb * vtbMarkup / (Rmoex || 1)), c: VTB_BLUE },
            { l: "Платёж из ВТБ Шанхай", s: "1,99% от суммы", v: rub(nVtb * SH_PAY * (Rmoex + vtbMarkup)), a: "≈ " + cny(nVtb * SH_PAY), c: VTB_BLUE },
            { l: "Валютный контроль", s: "0,2% от суммы", v: rub(nVtb * SH_VC * (Rmoex + vtbMarkup)), a: "≈ " + cny(nVtb * SH_VC), c: VTB_BLUE },
          ],
          foot: "Плюс 1–1,2%, которые ВТБ Шанхай удерживает с китайской стороны." },
      ];
      const best = byCny ? R3.reduce((a, b) => (b.total < a.total ? b : a)) : R3.reduce((a, b) => (b.n > a.n ? b : a));
      const vtbR = R3[2], clearR = R3[0];
      const diffCny = byCny ? (Rcb > 0 ? (vtbR.total - clearR.total) / Rcb : 0) : (clearR.n - vtbR.n);
      const diffRub = byCny ? (vtbR.total - clearR.total) : (clearR.n - vtbR.n) * Rcb;
      const savePct = byCny ? (vtbR.total > 0 ? (vtbR.total - clearR.total) / vtbR.total * 100 : 0)
                            : (clearR.n > 0 ? (clearR.n - vtbR.n) / clearR.n * 100 : 0);
      const thresholdCny = (vtbPerCny - Rcb) > 0 ? CLEARING_MIN / (vtbPerCny - Rcb) : 0;

      const kp = [
        "Иван Иванович, добрый день!",
        "",
        (byCny
          ? "Клиринг через ФА-резидента дешевле платежа через ВТБ Шанхай на " + rub(Math.abs(diffRub)) + ", это " + pctStr(Math.abs(savePct)) + "."
          : "На один и тот же бюджет " + rub(budget) + " клиринг доводит до поставщика на " + cny(Math.abs(diffCny)) + " больше, чем ВТБ Шанхай, это " + pctStr(Math.abs(savePct)) + "."),
        "",
        "АКЦИЯ ДО " + PROMO_UNTIL.toUpperCase(),
        "Комиссия клиринга снижена до 0,5% при минимуме 20 000 ₽. Bank of Dandong: перевод 0,8% при минимуме 3 000 ₽, было 1,2%.",
        "",
        "КАК УСТРОЕН КЛИРИНГ",
        "Вы отправляете рубли из Альфа-Банка. Поставщику приходят деньги от банка материкового Китая. Конвертация строго по курсу ЦБ, комиссия 0,5%, но не менее 20 000 ₽. Других удержаний нет.",
        "Работаем через ФА-резидентов Пэйдинг и Глобал Холдинг. Платежи свободно проходят даже на ВТБ Шанхай.",
        "По мере наработки объёма ставку можно обсуждать в сторону дальнейшего снижения.",
        "",
        "УСЛОВИЯ ПО ПОЛУЧАТЕЛЮ",
        "• Банк получателя должен быть китайским, материковый Китай. Подходит почти любой, кроме банков с американским участием.",
        "• Сам поставщик должен быть полностью китайской компанией: без иностранного участия среди учредителей, юрлиц-участников и в лице генерального директора.",
        "• География: " + PROVINCES.join(", ") + ", а также " + CITIES.join(" и ") + ".",
        "",
        (byCny ? "РАСЧЁТ НА " + cny(nClear) : "РАСЧЁТ НА БЮДЖЕТ " + rub(budget)),
        "Клиринг: тело " + rub(C.body) + " по курсу ЦБ" + (dateStr ? " на " + dateStr : "") + " " + rate4(Rcb) + ", комиссия " + rub(C.comm) + (minApplied ? " (сработал минимум)" : "") + ", итого " + rub(clearTotal) + ". Один юань обходится в " + rate4(perClear) + ".",
        "Bank of Dandong: перевод " + rub(D.tr) + ", конвертация и контроль " + rub(D.ex) + ", итого " + rub(dandTotal) + ". Один юань " + rate4(perDand) + ".",
        "ВТБ Шанхай: покупка юаня с наценкой " + Math.round(vtbMarkup * 100) + " коп. к бирже (" + rate4(Rmoex) + "), платёж 1,99% и валютный контроль 0,2%. Итого " + rub(vtbTotal) + ". Один юань " + rate4(vtbPerCny) + ".",
        (byCny ? "" : "На тот же бюджет до поставщика дойдёт: клиринг " + cny(nClear) + ", Dandong " + cny(nDand) + ", ВТБ " + cny(nVtb) + "."),
        "",
        "ПОЧЕМУ ЭТО СИЛЬНЕЕ ВТБ",
        "• У ВТБ комиссия 1,99% плюс наценка в курсе юаня 14–25 копеек, которую в тарифах не показывают.",
        "• У нас курс ЦБ без переплаты в курсе и одна прозрачная ставка.",
        "• ВТБ Шанхай дополнительно берёт 1–1,2% с китайской стороны, у нас с получателя 0%, и лишь 0,2% по редким санкционным позициям.",
        "",
        "Расчёт ориентировочный, финальные цифры фиксируем перед сделкой.",
        "",
      ].concat(SIGN).join("\n");

      return (
        <div className={GRID4}>

          <Col>
            <div className="rounded-2xl card p-4 sm:p-5">
              <div className="text-[14px] font-semibold ink mb-2">Что задаём</div>
              <ModeSwitch byCny={byCny} setMode={setMode} />
              <div className="text-[14px] font-medium ink mt-3 mb-2">{byCny ? "Сумма платежа поставщику" : "Бюджет на платёж"}</div>
              <div className="relative">
                <input type="number" inputMode="decimal" min="0" value={byCny ? amtCny : amtRub} onChange={(e) => byCny ? setAmtCny(e.target.value) : setAmtRub(e.target.value)} className="fld fld-big num" />
                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xl ink-3">{byCny ? "¥" : "₽"}</span>
              </div>
              <div className="text-[13px] ink-3 mt-2 num">Курс ЦБ {cbrStatus === "loading" ? "загружается…" : rate4(Rcb)}{dateStr ? ", на " + dateStr : ""}</div>
              {!byCny && (
                <div className="mt-2 text-[13px] rounded-lg px-3 py-2" style={{ background: "rgba(194,53,43,0.07)", border: "1px solid rgba(194,53,43,0.22)", color: "var(--red-ink)" }}>
                  Бюджет одинаковый у всех трёх маршрутов — сравниваем, <span className="font-semibold">сколько юаней дойдёт до поставщика</span>.
                </div>
              )}
              <div className="mt-3 pt-3" style={{ borderTop: "1px solid var(--line-2)" }}>
                <div className="flex items-baseline justify-between mb-2">
                  <div className="text-[14px] font-semibold ink">Наценка ВТБ для сравнения</div>
                  <div className="text-lg font-bold num" style={{ color: VTB_BLUE }}>{Math.round(vtbMarkup * 100)} коп.</div>
                </div>
                <input type="range" min="14" max="25" step="1" value={Math.round(vtbMarkup * 100)} onChange={(e) => setVtbMarkup(parseInt(e.target.value, 10) / 100)} className="w-full" />
                <div className="flex justify-between text-[12.5px] ink-3"><span>14 коп.</span><span>25 коп.</span></div>
                <div className="text-[12.5px] ink-3 mt-2">Биржевой курс {moex.status === "ok" ? rate4(Rmoex) : "загружается"}.</div>
              </div>
              <div className="mt-3 rounded-xl p-3.5" style={{ background: "rgba(194,53,43,0.06)", border: "1px solid rgba(194,53,43,0.24)" }}>
                <div className="flex items-center gap-2 mb-1"><PromoTag>Акция</PromoTag><span className="text-[13px] font-semibold ink">0,5% вместо 0,9%</span></div>
                <div className="text-[12.5px] ink-2 leading-relaxed">Ставка клиринга и минимум 20 000 ₽ зафиксированы до {PROMO_UNTIL}. Bank of Dandong: перевод 0,8% вместо 1,2%.</div>
              </div>
            </div>

            <div className="rounded-2xl card p-4 sm:p-5">
              <div className="text-[15px] font-semibold ink mb-2">Как идут деньги</div>
              <div className="space-y-2 mb-4">
                {CLEARING_STEPS.map((s, i) => (
                  <div key={i} className="rounded-xl card-soft p-3">
                    <div className="flex items-center gap-2 mb-1">
                      <div className="w-6 h-6 rounded-full flex items-center justify-center text-[12px] font-bold text-white shrink-0" style={{ background: ALFA_RED }}>{s.n}</div>
                      <div className="text-[14px] font-semibold ink leading-tight">{s.t}</div>
                    </div>
                    <div className="text-[12.5px] ink-2 leading-relaxed">{s.d}</div>
                  </div>
                ))}
              </div>
              <div className="rounded-xl p-3.5" style={{ background: "rgba(194,53,43,0.06)", border: "1px solid rgba(194,53,43,0.24)" }}>
                <div className="flex items-center gap-2 mb-1.5"><IcAlert size={16} style={{ color: ALFA_RED }} /><div className="text-[14px] font-semibold ink">Кому можно платить</div></div>
                <div className="text-[12.5px] ink-2 leading-relaxed space-y-1.5">
                  <div><span className="ink font-semibold">Банк получателя китайский, материковый.</span> Подходит почти любой, кроме банков с американским участием.</div>
                  <div><span className="ink font-semibold">Поставщик полностью китайский.</span> Без иностранного участия ни среди учредителей и юрлиц-участников, ни в лице генерального директора.</div>
                </div>
              </div>
            </div>
          </Col>

          <Col>
            <RouteCard rt={R3[0]} isBest={best.id === R3[0].id} byCny={byCny} budget={budget} />
            <div className="rounded-2xl card p-4 sm:p-5 flex flex-col">
              <div className="flex items-center gap-2 mb-1"><IcMap size={17} style={{ color: "var(--red)" }} /><div className="text-[15px] font-semibold ink">География клиринга</div></div>
              <div className="text-[12.5px] ink-3 mb-3">14 провинций и автономных районов КНР, плюс города федерального значения.</div>
              <div className="flex flex-wrap gap-1.5">
                {PROVINCES.map((p) => (<span key={p} className="px-2.5 py-1 rounded-full text-[12.5px] font-medium card-soft ink-2">{p}</span>))}
                {CITIES.map((p) => (<span key={p} className="px-2.5 py-1 rounded-full text-[12.5px] font-semibold" style={{ background: "rgba(194,53,43,0.09)", border: "1px solid rgba(194,53,43,0.24)", color: "var(--red-ink)" }}>{p}</span>))}
              </div>
              <div className="mt-3 rounded-xl p-3.5" style={{ background: "rgba(194,53,43,0.06)", border: "1px solid rgba(194,53,43,0.22)" }}>
                <div className="text-[13px] ink-2 leading-relaxed"><span className="ink font-semibold">Платежи свободно проходят даже на ВТБ Шанхай.</span> Клиринг не заменяет банк получателя, а снимает переплату по дороге.</div>
              </div>
            </div>
          </Col>

          <Col>
            <RouteCard rt={R3[1]} isBest={best.id === R3[1].id} byCny={byCny} budget={budget} />
            <div className="rounded-2xl card p-4 sm:p-5" style={{ border: "2px solid " + best.color }}>
              <div className="flex items-center gap-3 mb-3">
                <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0" style={{ background: best.color }}><IcTrophy size={21} stroke="#fff" /></div>
                <div className="min-w-0">
                  <div className="text-[12px] uppercase tracking-wider ink-3">Вывод</div>
                  <div className="text-[17px] font-bold leading-tight" style={{ color: best.color }}>{best.name}</div>
                </div>
              </div>
              <div className="grid grid-cols-3 gap-2">
                <div className="rounded-lg sunken px-2.5 py-2"><div className="text-[12px] ink-3 mb-0.5">{byCny ? "Дешевле ВТБ, ₽" : "Юаней больше ВТБ"}</div><div className="text-[17px] font-bold num leading-tight" style={{ color: best.color }}>{byCny ? rub(Math.abs(diffRub)) : cny(Math.abs(diffCny))}</div></div>
                <div className="rounded-lg sunken px-2.5 py-2"><div className="text-[12px] ink-3 mb-0.5">{byCny ? "Это, ¥" : "В деньгах"}</div><div className="text-[17px] font-bold num leading-tight" style={{ color: best.color }}>{byCny ? cny(Math.abs(diffCny)) : rub(Math.abs(diffRub))}</div></div>
                <div className="rounded-lg sunken px-2.5 py-2"><div className="text-[12px] ink-3 mb-0.5">В процентах</div><div className="text-[17px] font-bold num leading-tight" style={{ color: best.color }}>{pctStr(Math.abs(savePct))}</div></div>
              </div>
              <div className="mt-3 pt-3 text-[13.5px] ink-2 leading-relaxed space-y-2" style={{ borderTop: "1px solid var(--line-2)" }}>
                <p>Юань обходится: клиринг <span className="ink font-semibold num">{rate4(perClear)}</span>, Dandong <span className="ink font-semibold num">{rate4(perDand)}</span>, ВТБ <span className="ink font-semibold num">{rate4(vtbPerCny)}</span>.</p>
                {minApplied && <p className="ink-3">На этой сумме у клиринга сработал минимум 20 000 ₽. Он перестаёт мешать примерно от {cny(thresholdCny)}.</p>}
                <p>У ВТБ к 1,99% добавляется наценка в курсе 14–25 копеек, которую в тарифах не показывают. Плюс 1–1,2% они удерживают с китайской стороны.</p>
              </div>
            </div>
          </Col>

          <Col>
            <RouteCard rt={R3[2]} isBest={best.id === R3[2].id} byCny={byCny} budget={budget} />
            <KpBlock text={kp} note={"Ставка 0,5% и минимум 20 000 ₽ действуют до " + PROMO_UNTIL + "."} />
          </Col>
        </div>
      );
    }

    /* ================= КОНСТРУКТОР УНИВЕРСАЛЬНОГО КП ================= */
    const O_DIR = ["Импорт", "Экспорт", "Импорт и экспорт", "Пока определяемся"];
    const O_GEO = ["Материковый Китай", "Гонконг", "Турция", "ОАЭ", "Индия", "Казахстан и страны ЕАЭС", "Европа", "Юго-Восточная Азия", "Латинская Америка", "Несколько стран сразу"];
    const O_CUR = ["Юань", "Доллар", "Евро", "Дирхам ОАЭ", "Турецкая лира", "Гонконгский доллар", "Индийская рупия", "Тенге", "Валюту подберём под сделку"];
    const O_ROUTE = ["Подберём маршрут под сделку", "Финансовый агент-нерезидент", "Клиринг через финансового агента-резидента", "Bank of Dandong, расчёты в юанях", "Прямой платёж из банка", "Приём экспортной выручки через агента"];
    const O_GOODS = ["Обычные товары народного потребления", "Оборудование и станки", "Комплектующие и электроника", "Сырьё и материалы", "Товары двойного назначения", "Позиции с санкционным риском", "Услуги, работы и лицензии"];
    const O_SUP = ["Китайская компания без иностранного участия", "Компания с иностранным участием", "Трейдер в Гонконге", "Поставщик из Турции или ОАЭ", "Европейский поставщик", "Поставщик пока не выбран"];
    const O_PAIN = ["Банк вернул платёж", "Платёж завис в пути", "Валютный контроль тянется неделями", "Дорогая конвертация и переплата в курсе", "Поставщик не принимает рубли", "Обслуживающий банк попал под санкции", "Нет канала в нужную страну", "Комплаенс просит слишком много документов", "Всё работает, ищем условия выгоднее"];
    const O_URG = ["Платёж нужен на этой неделе", "Нужно в течение месяца", "Планируем на следующий квартал", "Пока изучаем варианты"];
    const O_FMT = ["Развёрнутое коммерческое предложение", "Короткое письмо на одну прокрутку"];
    const O_PRIOR = ["Проходимость платежа", "Скорость", "Цена", "Валютный контроль под ключ", "Конфиденциальность сделки", "Сложные и нестандартные товары", "Приём экспортной выручки", "Один менеджер на все вопросы"];

    const PAIN_TEXT = {
      "Банк вернул платёж": "Возврат почти всегда упирается не в вашу сделку, а в цепочку банков-корреспондентов. Мы меняем саму цепочку: платёж уходит от лица финансового агента, и ваш банк в маршруте не участвует.",
      "Платёж завис в пути": "Пока идёт розыск, мы параллельно готовим запасной канал, чтобы отгрузка не встала. Клиент не должен ждать, пока чужой комплаенс закончит проверку.",
      "Валютный контроль тянется неделями": "Валютный контроль мы берём на себя целиком: смотрим контракт заранее, подсказываем формулировки и ведём документы, чтобы вопросов на этапе платежа просто не возникало.",
      "Дорогая конвертация и переплата в курсе": "Основные потери сидят не в комиссии, а в курсе. Мы считаем по курсу Центрального банка, а там, где банк добавляет наценку, показываем её отдельной строкой, чтобы вы видели реальную цену денег.",
      "Поставщик не принимает рубли": "Поставщик получает свою валюту от резидента своей страны, внутренним платежом. Для него это обычное поступление, а не трансграничный перевод из России.",
      "Обслуживающий банк попал под санкции": "Расчёты идут через агента, а ваш банк в цепочке не светится. Санкционный статус обслуживающего банка перестаёт влиять на проходимость платежа.",
      "Нет канала в нужную страну": "У нас несколько независимых маршрутов и партнёров-агентов. Если прямого канала в страну нет, собираем связку и проверяем её до того, как вы отправите деньги.",
      "Комплаенс просит слишком много документов": "Мы заранее знаем, что спросят, и готовим пакет так, чтобы запрос был один, а не пять. Это экономит недели на каждой сделке.",
      "Всё работает, ищем условия выгоднее": "Тогда разговор короткий: покажем расчёт по вашему текущему маршруту и по нашему, рядом, без лукавства. Если у вас лучше, я так и скажу.",
    };
    const GOODS_TEXT = {
      "Обычные товары народного потребления": "Стандартная номенклатура проходит быстрее всего, здесь важнее цена и предсказуемость сроков.",
      "Оборудование и станки": "По оборудованию заранее проверяем описание и назначение, чтобы вопрос о применении не всплыл в момент платежа.",
      "Комплектующие и электроника": "По электронике смотрим коды и описание особенно внимательно: именно здесь чаще всего возникают уточняющие запросы.",
      "Сырьё и материалы": "По сырью считаем экономику вместе с логистикой, потому что комиссия за платёж редко бывает главной статьёй.",
      "Товары двойного назначения": "Такие позиции ведём отдельно и заранее согласуем маршрут, чтобы не получить отказ на середине пути.",
      "Позиции с санкционным риском": "Здесь мы честно оцениваем проходимость до старта и не берёмся, если видим, что платёж не дойдёт. Отказ на берегу дешевле зависших денег.",
      "Услуги, работы и лицензии": "По услугам основной вопрос всегда к документам, поэтому формулировки в договоре мы смотрим до подписания.",
    };
    const SUP_TEXT = {
      "Китайская компания без иностранного участия": "Такой поставщик открывает самый выгодный маршрут: платёж внутри Китая от банка материкового Китая.",
      "Компания с иностранным участием": "Иностранное участие закрывает часть маршрутов, поэтому подбираем канал под конкретную структуру собственности.",
      "Трейдер в Гонконге": "Гонконг ведём отдельно от материка: там своя логика по банкам и своя скорость прохождения.",
      "Поставщик из Турции или ОАЭ": "По Турции и Эмиратам работаем через агентов в регионе, платёж приходит поставщику как местный.",
      "Европейский поставщик": "По Европе маршрут собираем точечно и проверяем проходимость до отправки денег.",
      "Поставщик пока не выбран": "Могу подсказать, какого поставщика брать, чтобы платежи потом шли дёшево и без сюрпризов. Это экономит больше, чем торг по комиссии.",
    };
    const PRIOR_TEXT = {
      "Проходимость платежа": "проходимость держим за счёт нескольких независимых маршрутов",
      "Скорость": "по срочным платежам подключаем самый быстрый из открытых каналов",
      "Цена": "показываем цену целиком, вместе с курсом, а не только комиссию",
      "Валютный контроль под ключ": "валютный контроль ведём мы, от контракта до закрытия",
      "Конфиденциальность сделки": "детали сделки остаются между нами, лишних участников в цепочке нет",
      "Сложные и нестандартные товары": "по сложной номенклатуре согласуем маршрут заранее",
      "Приём экспортной выручки": "выручку от покупателя заводим на ваш счёт в России",
      "Один менеджер на все вопросы": "вы работаете с одним человеком, а не с колл-центром",
    };
    const URG_TEXT = {
      "Платёж нужен на этой неделе": "Если платёж нужен уже на этой неделе, пришлите контракт и реквизиты получателя сегодня, и я скажу по срокам в тот же день.",
      "Нужно в течение месяца": "Времени достаточно, чтобы спокойно выбрать маршрут и заранее снять вопросы по документам.",
      "Планируем на следующий квартал": "Раз сделка на перспективу, давайте разберём маршрут заранее и заложим правильные формулировки прямо в контракт.",
      "Пока изучаем варианты": "Если пока просто смотрите варианты, предлагаю созвониться без обязательств и разобрать вашу схему на конкретных примерах.",
    };

    function Field({ label, hint, children }) {
      return (
        <label className="block">
          <div className="text-[13px] font-semibold ink mb-1.5">{label}</div>
          {children}
          {hint && <div className="text-[12px] ink-3 mt-1 leading-snug">{hint}</div>}
        </label>
      );
    }
    function Sel({ value, onChange, options }) {
      return (<select className="fld" value={value} onChange={(e) => onChange(e.target.value)}>{options.map((o) => <option key={o} value={o}>{o}</option>)}</select>);
    }

    function buildKp(f) {
      const short = f.fmt === O_FMT[1];
      const who = (f.client || "").trim();
      const co  = (f.company || "").trim();
      const dirLow = f.dir === "Пока определяемся" ? "внешнеэкономические расчёты" : f.dir.toLowerCase();
      const L = [];

      L.push((who ? who + ", д" : "Д") + "обрый день!");
      L.push("");
      L.push("Задача, как я её понял: " + dirLow + ", направление — " + f.geo + ", расчёты в валюте — " + f.cur.toLowerCase() + (co ? ". Компания — " + co : "") + ".");
      L.push("Ниже коротко о том, как мы проводим такие платежи и почему деньги дойдут.");
      L.push("");

      L.push("ЧТО ВЫ ПОЛУЧАЕТЕ");
      L.push("• Маршрут под вашу сделку: " + f.route.toLowerCase() + ".");
      L.push("• Запасной канал на случай, если основной закроется. Маршруты независимы друг от друга, переключение занимает не недели, а часы.");
      L.push("• Конвертацию по курсу Центрального банка, без спреда и без наценки, спрятанной в курсе.");
      L.push("• Валютный контроль под ключ: смотрим контракт заранее, помогаем дооформить, ведём документы до закрытия сделки.");
      L.push("• Прозрачный расчёт до отправки денег: вы видите каждую составляющую стоимости, а не итоговую цифру.");
      L.push("");

      L.push("ПОЧЕМУ ЭТО РАБОТАЕТ, КОГДА БАНК ОТКАЗЫВАЕТ");
      L.push(PAIN_TEXT[f.pain] || PAIN_TEXT[O_PAIN[0]]);
      L.push("");

      if (!short) {
        L.push("ПОД ВАШУ СПЕЦИФИКУ");
        L.push("• Товар: " + f.goods.toLowerCase() + ". " + (GOODS_TEXT[f.goods] || ""));
        L.push("• Поставщик: " + f.sup.toLowerCase() + ". " + (SUP_TEXT[f.sup] || ""));
        if (f.prior && f.prior.length) {
          L.push("• Что для вас важно: " + f.prior.map((p) => p.toLowerCase()).join(", ") + ".");
          f.prior.forEach((p) => { if (PRIOR_TEXT[p]) L.push("   — " + PRIOR_TEXT[p].charAt(0).toUpperCase() + PRIOR_TEXT[p].slice(1) + "."); });
        }
        L.push("");

        L.push("МАРШРУТЫ, КОТОРЫЕ У НАС ЕСТЬ");
        L.push("• Финансовые агенты-нерезиденты. Платёж уходит поставщику почти в любую точку мира, ваш банк в цепочке не участвует.");
        L.push("• Клиринг через финансового агента-резидента. Вы отправляете рубли из Альфа-Банка, а поставщику платит банк материкового Китая внутренним платежом, по курсу Центрального банка.");
        L.push("• Bank of Dandong. Расчёты в юанях с прозрачной комиссией за перевод и без удержаний с китайской стороны.");
        L.push("• Прямой платёж из банка. Когда канал открыт, это самый короткий и дешёвый путь, и мы честно скажем, если он вам подходит.");
        L.push("• Приём экспортной выручки. Покупатель платит удобной ему валютой, вы получаете рубли на расчётный счёт в России.");
        L.push("");

        L.push("ПОЧЕМУ АЛЬФА-БАНК");
        L.push("Альфа-Банк сегодня сильнейший эксперт по внешнеэкономической деятельности: инфраструктура, партнёры и практика, которых нет у большинства участников рынка. Мы заходим в сделку с позиции силы, а не с позиции надежды на чужой комплаенс.");
        L.push("Внешнеэкономические расчёты — это только вход. Дальше расчётный счёт, зарплатный проект, эквайринг, кредитование и валютный контроль ведёт одна команда, и вам не нужно объяснять свою историю каждый раз заново.");
        L.push("");
      } else {
        L.push("ЧТО У НАС ЕСТЬ ПОД ЭТО");
        L.push("Агенты-нерезиденты, клиринг через агента-резидента, расчёты в юанях через Bank of Dandong, прямые платежи и приём экспортной выручки. За всем этим стоит инфраструктура Альфа-Банка, сильнейшего эксперта по внешнеэкономической деятельности.");
        L.push("");
      }

      L.push("ЧТО НУЖНО ОТ ВАС");
      L.push("• Контракт или инвойс, чтобы я посмотрел формулировки до платежа.");
      L.push("• Реквизиты получателя и страну банка.");
      L.push("• Короткий разговор, чтобы понять сроки и объём.");
      L.push("");

      L.push("СЛЕДУЮЩИЙ ШАГ");
      L.push(URG_TEXT[f.urg] || URG_TEXT[O_URG[0]]);
      L.push("Точные ставки и полный расчёт по вашей сумме пришлю отдельно: они зависят от маршрута, валюты и объёма, и я не хочу называть цифру наугад.");
      L.push("");

      const sign = SIGN.slice();
      const man = (f.manager || "").trim();
      if (man) sign[0] = man + ", международные расчёты";
      return L.concat(sign).join("\n");
    }

    const KP_DEFAULT = {
      client: "Иван Иванович", company: "ООО «Ромашка»", manager: "Евгений Демин",
      dir: O_DIR[0], geo: O_GEO[0], cur: O_CUR[0], route: O_ROUTE[0], goods: O_GOODS[0],
      sup: O_SUP[0], pain: O_PAIN[0], urg: O_URG[0], fmt: O_FMT[0],
      prior: ["Проходимость платежа", "Цена"],
    };

    function KpBuilder() {
      const [f, setF] = useState(KP_DEFAULT);
      const set = (k) => (v) => setF((o) => Object.assign({}, o, { [k]: v }));
      const togglePrior = (p) => setF((o) => Object.assign({}, o, { prior: o.prior.indexOf(p) >= 0 ? o.prior.filter((x) => x !== p) : o.prior.concat([p]) }));
      const text = buildKp(f);

      return (
        <section id="kp" className="slide py-16 lg:py-14">
          <div className="wrap w-full">
            <Head badge="Универсальное КП" icon={IcEdit} tone="gold"
              title="Соберите предложение под клиента за минуту"
              text="Здесь нет ни одной цифры: это письмо про возможности, а не про тарифы. Заполните поля из списков — текст пересобирается сам. Точные ставки считаются в калькуляторе выше и вставляются отдельным сообщением." />

            <div className="grid grid-cols-1 xl:grid-cols-12 gap-3.5 sm:gap-4">
              <div className="rise xl:col-span-5">
                <div className="rounded-2xl card p-4 sm:p-5 h-full">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                    <div className="text-[15px] font-semibold ink">Данные для письма</div>
                    <button onClick={() => setF(KP_DEFAULT)} className="inline-flex items-center gap-1.5 text-[13px] ink-2 hover:ink"><IcRefresh size={14} />сбросить</button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <Field label="Как обращаться к клиенту"><input className="fld" value={f.client} onChange={(e) => set("client")(e.target.value)} placeholder="Иван Иванович" /></Field>
                    <Field label="Компания клиента"><input className="fld" value={f.company} onChange={(e) => set("company")(e.target.value)} placeholder="ООО «Ромашка»" /></Field>
                    <Field label="Направление"><Sel value={f.dir} onChange={set("dir")} options={O_DIR} /></Field>
                    <Field label="Страна или регион"><Sel value={f.geo} onChange={set("geo")} options={O_GEO} /></Field>
                    <Field label="Валюта расчётов"><Sel value={f.cur} onChange={set("cur")} options={O_CUR} /></Field>
                    <Field label="Маршрут платежа"><Sel value={f.route} onChange={set("route")} options={O_ROUTE} /></Field>
                    <Field label="Что везут или продают"><Sel value={f.goods} onChange={set("goods")} options={O_GOODS} /></Field>
                    <Field label="Кто контрагент"><Sel value={f.sup} onChange={set("sup")} options={O_SUP} /></Field>
                    <Field label="Что у клиента болит"><Sel value={f.pain} onChange={set("pain")} options={O_PAIN} /></Field>
                    <Field label="Насколько срочно"><Sel value={f.urg} onChange={set("urg")} options={O_URG} /></Field>
                    <Field label="Формат письма"><Sel value={f.fmt} onChange={set("fmt")} options={O_FMT} /></Field>
                    <Field label="Подпись"><input className="fld" value={f.manager} onChange={(e) => set("manager")(e.target.value)} placeholder="Евгений Демин" /></Field>
                  </div>

                  <div className="mt-4 pt-4" style={{ borderTop: "1px solid var(--line-2)" }}>
                    <div className="text-[13px] font-semibold ink mb-2">Что для клиента важно <span className="ink-3 font-normal">— можно выбрать несколько</span></div>
                    <div className="flex flex-wrap gap-2">
                      {O_PRIOR.map((p) => {
                        const on = f.prior.indexOf(p) >= 0;
                        return (
                          <button key={p} onClick={() => togglePrior(p)}
                            className={"px-3 py-1.5 rounded-full text-[13px] font-medium transition-all " + (on ? "btn-red" : "btn-ghost")}>
                            {on && <IcCheck size={13} className="inline-block mr-1 -mt-0.5" />}{p}
                          </button>
                        );
                      })}
                    </div>
                    {f.fmt === O_FMT[1] && <div className="text-[12.5px] ink-3 mt-3 flex items-start gap-1.5"><IcInfo size={13} className="shrink-0 mt-0.5" />В коротком формате блок «под вашу специфику» и список маршрутов не выводятся.</div>}
                  </div>
                </div>
              </div>

              <div className="rise xl:col-span-7" style={{ transitionDelay: "80ms" }}>
                <KpBlock text={text} title="Универсальное коммерческое предложение" note="В письме намеренно нет ставок и сумм. Расчёт по конкретной сделке считается в калькуляторе и отправляется вторым сообщением." />
              </div>
            </div>
          </div>
        </section>
      );
    }

    /* ================= КОНТАКТЫ ================= */
    function Contacts({ onPick }) {
      return (
        <section id="contacts" className="w-full py-14 md:py-16">
          <div className="wrap">
            <div className="rise rounded-3xl card emboss p-5 sm:p-8">
              <div className="grid grid-cols-1 xl:grid-cols-12 gap-6 items-center">
                <div className="xl:col-span-7">
                  <div className="mb-3"><Badge tone="red" icon={IcZap}>Следующий шаг</Badge></div>
                  <h2 className="text-3xl sm:text-4xl font-semibold tracking-tight ink mb-3" style={{ letterSpacing: "-0.03em" }}>Подберу схему под вашу сделку</h2>
                  <p className="text-[16px] ink-2 leading-relaxed max-w-2xl">Клиринг, прямой платёж, Bank of Dandong или связка через агента — выбор зависит от суммы, страны, товара и сроков. Пришлите контракт, и я посчитаю точные цифры под вас. Новые тарифы держим до {PROMO_UNTIL}.</p>
                  <div className="flex flex-wrap gap-3 mt-5">
                    <Ext href={TG} className="flex items-center gap-2 rounded-full btn-red px-7 py-3 font-medium text-[15px]">Написать в Telegram<IcArrow size={18} /></Ext>
                    <Ext href={PHONE} title={PHONE_TITLE} className="flex items-center gap-2 rounded-full btn-ghost px-6 py-3 font-medium text-[15px]"><IcPhone size={17} />{PHONE_DISPLAY}</Ext>
                    <Jump to="calc" className="flex items-center gap-2 rounded-full btn-ghost px-6 py-3 font-medium text-[15px]"><IcCalc size={17} />К калькулятору</Jump>
                  </div>
                </div>
                <div className="xl:col-span-5">
                  <div className="grid grid-cols-2 gap-2.5">
                    {TABS.map((t) => (
                      <button key={t.id} onClick={() => onPick(t.id)} className="tab">
                        <div className="flex items-center gap-2 mb-1">
                          <t.Ic size={17} className="shrink-0" style={{ color: "var(--red)" }} />
                          <span className="text-[14px] font-semibold ink leading-tight">{t.short}</span>
                          <span className="ml-auto text-[13px] font-bold num" style={{ color: "var(--red)" }}>{t.price}</span>
                        </div>
                        <div className="text-[12.5px] ink-3 leading-snug">{t.note}</div>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
              <div className="mt-6 pt-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-[13px] ink-3" style={{ borderTop: "1px solid var(--line-2)" }}>
                <div className="flex items-center gap-2"><IcGlobe size={16} style={{ color: "var(--red)" }} /><span className="font-semibold ink">Евгений Демин</span> · международные расчёты</div>
                <div>Расчёты на странице ориентировочные. Финальные условия фиксируются перед сделкой.</div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    /* ================= ПРИЛОЖЕНИЕ ================= */
    function App() {
      const [tab, setTab] = useState("import");
      const pick = (id) => { setTab(id); setTimeout(() => goTo(null, "calc"), 30); };
      useEffect(() => {
        const els = Array.prototype.slice.call(document.querySelectorAll(".rise"));
        if (!("IntersectionObserver" in window)) { els.forEach((el) => el.classList.add("in")); return; }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
        }, { threshold: 0.06, rootMargin: "0px 0px -5% 0px" });
        els.forEach((el) => io.observe(el));
        return () => io.disconnect();
      }, []);
      return (
        <React.Fragment>
          <Hero onPick={pick} />
          <Promo />
          <Pressure onPick={pick} />
          <CalcHub tab={tab} setTab={setTab} />
          <KpBuilder />
          <Contacts onPick={pick} />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    (function () {
      var src = document.getElementById("app-src").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      (0, eval)(out);
    })();
  </script>
