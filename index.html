    /* ================= БАНКИ-ПОЛУЧАТЕЛИ: прямой платёж, прокси или через агента =================
       Данные лежат в <script id="banks-data">, их переносит из Excel «обновление списка банков/обновить.py». */
    const bkSecLabel = (s) => (/зарубеж/i.test(s) ? "Зарубежные банки" : s);
    const bkPlur = (n, one, few, many) => { const a = n % 100, b = n % 10; return (a > 10 && a < 20) ? many : b === 1 ? one : (b >= 2 && b <= 4) ? few : many; };
    const bkSecIsRu = (s) => /юан/i.test(s || "");
    const bkIsRu = (r) => bkSecIsRu(BK.sections[r.sec]);

    /* ---- маршрут из комментария: прямой, прокси или оба сразу (по валютам) ----
       В исходном списке маршрут написан только в комментарии. Если про прокси не сказано — платёж прямой. */
    const BK_CUR_RE = [
      ["KZT", /тенге|kzt/], ["UZS", /узбекск|uzs/], ["KGS", /киргизск|kgs/], ["AZN", /манат|azn/],
      ["AMD", /драм(?:а|ы|ах|ов)?(?![а-я])|amd/], ["GEL", /(?:^|[^а-я])лари(?![а-я])|gel/],
      ["TRY", /(?:^|[^а-я])лир(?:а|ы|ах|ам|ой|у)?(?![а-я])|турецк/], ["BRL", /(?:^|[^а-я])реал(?:ах|ы|ов)?(?![а-я])|brl/],
      ["CNY", /юан|cny/], ["INR", /рупи|inr/], ["VND", /донг|vnd/], ["RSD", /динар|rsd/], ["BYN", /белорусск\S*\s+рубл|byn/],
    ];
    function bkCurs(t, country) {
      const out = [];
      BK_CUR_RE.forEach((x) => { if (x[1].test(t)) out.push(x[0] === "AZN" && /туркмен/i.test(country) ? "TMT" : x[0]); });
      if (/рубл|(?:^|[^a-z])rub(?![a-z])/.test(t.replace(/белорусск\S*\s+рубл\S*/g, ""))) out.push("RUB");
      return out;
    }
    function bkRoute(cm, country) {
      const res = { P: [], D: [], hasP: false, hasD: false };
      if (!cm) return res;
      /* «г. Москва» не должно рвать фразу на две */
      const text = cm.replace(/(^|[\s(])г\.\s+/g, "$1г ");
      text.split(/\n+|\.\s+(?=[А-ЯЁA-Z])|;\s*/).forEach((c) => {
        const t = c.toLowerCase().replace(/ё/g, "е");
        const px = /прокси|покси/.test(t);
        const dr = /прям\S*\s+(?:маршрут|расч)/.test(t) || (/напрямую/.test(t) && !/обрат\S*\s+напрямую/.test(t));
        if (!px && !dr) return;
        if (/не провод|не рекоменд|отсутств|нет маршрут|заглушк|не принима/.test(t)) return;
        const cs = bkCurs(t, country);
        if (px) { res.hasP = true; cs.forEach((x) => { if (res.P.indexOf(x) < 0) res.P.push(x); }); }
        if (dr) { res.hasD = true; cs.forEach((x) => { if (res.D.indexOf(x) < 0) res.D.push(x); }); }
      });
      return res;
    }

    /* группы: зарубежные банки и «Юани по РФ» — разные шкалы, не смешиваем */
    const BK_ORDER_FX = ["direct", "proxy", "mixed", "cond", "agent"];
    const BK_ORDER_RU = ["ru_ok", "ru_cond", "ru_no"];
    const BK_KIND = {
      direct:  { title: "Прямой платёж",     chip: "Прямые",          color: "#1c7a4d", Ic: IcCheck, head: "Прямые платежи",                desc: "Платёж уходит напрямую в банк получателя." },
      proxy:   { title: "Прокси-маршрут",    chip: "Прокси",          color: "#6a3fb5", Ic: IcSwap,  head: "Прокси-маршрут",                desc: "Платёж идёт через банк-корреспондент в РФ, обычно в местной валюте и только по несанкционным сделкам." },
      mixed:   { title: "Прямой + прокси",   chip: "Прямые + прокси", color: "#0e7c86", Ic: IcLayers, head: "Прямой и прокси — по валюте",  desc: "В одной валюте платёж идёт напрямую, в другой — через прокси. Валюты указаны у банка." },
      cond:    { title: "С оговорками",      chip: "С оговорками",    color: "#b07a22", Ic: IcAlert, head: "Прямые с оговорками",           desc: "Условно или на усмотрение банка-получателя: платёж может вернуться." },
      agent:   { title: "Не рекомендованы",  chip: "Не рекомендованы", color: "#c2352b", Ic: IcX,    head: "Прямые расчёты не рекомендованы", desc: "Платёж скорее всего вернётся. Платим через финансовых агентов." },
      ru_ok:   { title: "Принимает юани",    chip: "Принимают",       color: "#1c7a4d", Ic: IcCheck, head: "Принимают юани",                desc: "Юани в этот российский банк можно отправить." },
      ru_cond: { title: "Условно",           chip: "Условно",         color: "#b07a22", Ic: IcAlert, head: "Условно",                       desc: "По согласованию с банком-получателем, платёж может вернуться." },
      ru_no:   { title: "Не принимает юани", chip: "Не принимают",    color: "#c2352b", Ic: IcX,     head: "Не принимают юани",             desc: "Спросите у клиента, в каких ещё банках у него счёт в юанях." },
    };

    const BK_TR = { "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ж":"zh","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"","э":"e","ю":"yu","я":"ya" };
    const bkNorm = (s) => String(s || "").toLowerCase().replace(/ё/g, "е").replace(/[«»"'`“”„‘’()\[\]{},.;:!?\/\\|+*_–—-]+/g, " ").replace(/\s+/g, " ").trim();
    /* латиницей: «втб» находит VTB BANK, «sber» — Сбер */
    const bkLat = (s) => s.replace(/[а-я]/g, (ch) => (BK_TR[ch] !== undefined ? BK_TR[ch] : ch));

    const BK = (function () {
      let d = {};
      try { d = JSON.parse(document.getElementById("banks-data").textContent || "{}"); } catch (e) {}
      const secs = d.sections || [], ctys = d.countries || [], sts = d.statuses || [], cms = d.comments || [];
      const byCountry = {}, inSec = {};
      (d.rows || []).forEach((r) => {
        const c = ctys[r[1]] || "";
        byCountry[c] = (byCountry[c] || 0) + 1;
        inSec[r[0] + "|" + c] = (inSec[r[0] + "|" + c] || 0) + 1;
      });
      const rows = (d.rows || []).map((r, i) => {
        const st = sts[r[4]] || { k: "none", s: "Статус не указан", f: "" };
        const o = { id: i, sec: r[0], country: ctys[r[1]] || "", swift: r[2] || "", name: r[3] || "", st: st, cm: r[5] >= 0 ? (cms[r[5]] || "") : "" };
        const ru = bkSecIsRu(secs[o.sec]);
        const low = o.cm.toLowerCase().replace(/ё/g, "е");
        /* «рекомендованы», но в комментарии банк платежи из РФ не принимает — верим комментарию */
        o.stop = !ru && st.k !== "agent" && /не принимает платежи из рф|установлена заглушка|банк под заглушкой/.test(low) && !/открыти\S* заглушк/.test(low);
        o.route = ru ? { P: [], D: [], hasP: false, hasD: false } : bkRoute(o.cm, o.country);
        if (ru) o.g = st.k === "direct" ? "ru_ok" : st.k === "cond" ? "ru_cond" : "ru_no";
        else if (st.k === "agent" || st.k === "none" || o.stop) o.g = "agent";
        else if (st.k === "cond") o.g = "cond";
        else o.g = o.route.hasP && o.route.hasD ? "mixed" : o.route.hasP ? "proxy" : "direct";
        o.ord = ru ? BK_ORDER_RU.indexOf(o.g) : BK_ORDER_FX.indexOf(o.g);
        o.nameN = bkNorm(o.name);
        o.nameLat = bkLat(o.nameN);
        o.hay = bkNorm([o.name, o.country, secs[o.sec], st.s, st.f, o.cm, BK_KIND[o.g].title, o.route.P.join(" "), o.route.D.join(" ")].join(" "));
        o.hayLat = bkLat(o.hay);
        return o;
      });
      /* внутри раздела: сначала группа (прямые, прокси…), потом страны, где банков больше */
      rows.sort((a, b) => (a.sec - b.sec) || (a.ord - b.ord)
        || ((inSec[b.sec + "|" + b.country] || 0) - (inSec[a.sec + "|" + a.country] || 0))
        || a.country.localeCompare(b.country, "ru")
        || a.name.localeCompare(b.name, "ru"));
      const count = { all: rows.length };
      Object.keys(BK_KIND).forEach((k) => { count[k] = 0; });
      const secN = {};
      rows.forEach((r) => { count[r.g]++; secN[r.sec] = (secN[r.sec] || 0) + 1; });
      const fxSec = secs.findIndex((s) => !bkSecIsRu(s));
      const ruSec = secs.findIndex((s) => bkSecIsRu(s));
      return { asOf: d.asOf || "", sections: secs, secN: secN, fxSec: fxSec < 0 ? 0 : fxSec, ruSec: ruSec,
        countries: Object.keys(byCountry).sort((a, b) => a.localeCompare(b, "ru")), byCountry: byCountry, rows: rows, count: count };
    })();

    function bkAdvice(r) {
      switch (r.g) {
        case "direct": return "Прямой платёж: Альфа отправляет его напрямую в банк получателя. Валюта и ограничения, если есть, — в комментарии.";
        case "proxy":  return "Прокси-маршрут: платёж идёт через банк-корреспондент в РФ" + (r.route.P.length ? " в " + r.route.P.join(", ") : "") + ". Обычно только несанкционные товары и стороны — сверьтесь с комментарием.";
        case "mixed":  return "Маршрут зависит от валюты: " + [r.route.D.length ? "напрямую — " + r.route.D.join(", ") : "", r.route.P.length ? "через прокси — " + r.route.P.join(", ") : ""].filter(Boolean).join("; ") + ".";
        case "cond":   return "Прямой платёж возможен, но может вернуться. Если важны сроки, надёжнее через финансового агента.";
        case "ru_ok":  return "Банк принимает юани, платёж можно отправить напрямую. Ограничения, если есть, — в комментарии.";
        case "ru_cond": return "Юани — условно, по согласованию с банком-получателем. Платёж может вернуться.";
        case "ru_no":  return "Юани в этот банк не проходят. Спросите у клиента, в каких ещё банках у него счёт в юанях. Расчёты возможны через финансовых агентов.";
        default:
          if (r.stop) return "В исходном списке банк отмечен как рекомендованный, но в комментарии сказано, что платежи из РФ он не принимает. Считаем прямые расчёты невозможными — платим через финансовых агентов.";
          if (r.st.k === "none") return "Статус в списке не указан, маршрут перед отправкой уточняйте. Расчёты возможны через финансовых агентов.";
          return "Прямые расчёты не рекомендованы, платёж скорее всего вернётся. Расчёты возможны через финансовых агентов.";
      }
    }

    /* поиск: все слова должны найтись; SWIFT сверяется с начала кода,
       полный SWIFT (8 или 11 знаков) — по первым шести, как записано в списке */
    function bkQuery(q) {
      const n = bkNorm(q);
      if (!n) return { toks: [], re: null };
      const toks = n.split(" ").filter(Boolean).slice(0, 8).map((s) => {
        const lat = bkLat(s), lat2 = bkLat(s.replace(/х/g, "h"));   // «халык» находит и HALYK
        return { s: s, lat: lat, lat2: lat2 !== lat ? lat2 : "", up: lat.length >= 3 ? lat.toUpperCase() : "", sw: /^[a-z]{6}[a-z0-9]{0,5}$/.test(s) ? s.slice(0, 6).toUpperCase() : "" };
      });
      const esc = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const alts = [];
      toks.forEach((t) => {
        alts.push(esc(t.s).replace(/е/g, "[её]"));
        if (t.lat !== t.s && t.lat.length >= 2) alts.push(esc(t.lat));
        if (t.lat2) alts.push(esc(t.lat2));
      });
      let re = null;
      try { re = new RegExp("(" + alts.join("|") + ")", "gi"); } catch (e) {}
      return { toks: toks, re: re };
    }
    const bkSwiftHit = (r, t) => !!r.swift && ((t.sw && r.swift === t.sw) || (t.up && r.swift.indexOf(t.up) === 0));
    function bkHit(r, toks) {
      for (let i = 0; i < toks.length; i++) {
        const t = toks[i];
        if (bkSwiftHit(r, t)) continue;
        if (r.hay.indexOf(t.s) >= 0 || r.hayLat.indexOf(t.lat) >= 0 || (t.lat2 && r.hayLat.indexOf(t.lat2) >= 0)) continue;
        return false;
      }
      return true;
    }
    function bkScore(r, toks) {
      const t = toks[0];
      if (bkSwiftHit(r, t)) return 0;
      const p = r.nameN.indexOf(t.s);
      if (p === 0) return 1;
      if (p > 0 || r.nameLat.indexOf(t.lat) >= 0 || (t.lat2 && r.nameLat.indexOf(t.lat2) >= 0)) return 2;
      return 3;
    }
    function Hl({ text, re }) {
      if (!re || !text) return text || null;
      const parts = String(text).split(re);
      if (parts.length < 2) return text;
      return parts.map((p, i) => (i % 2 ? <mark key={i} className="bk-mark">{p}</mark> : p));
    }
    /* открыть окно банков: можно сразу с поиском, разделом, группой или страной */
    function openBanks(q, opts) {
      try { window.dispatchEvent(new CustomEvent("banks:open", { detail: Object.assign({ q: q || "" }, opts || {}) })); } catch (e) {}
    }
    /* открыть справочник по тарифу на нужном разделе */
    function openTariff(cat, calc) {
      try { window.dispatchEvent(new CustomEvent("tariff:open", { detail: { cat: cat || "main", calc: calc || null } })); } catch (e) {}
    }

    /* ---- тариф «Быстрое развитие» у каждого банка: ставка и комиссия «от и до» ----
       Цифры берутся из тех же таблиц, что и калькулятор тарифа (TC_FX, TC_CNY, TC_RUB), — расходиться им не с чего. */
    const TF_CNY_GROUP1 = ["HFCBCN", "FJIBCN", "JNSHCN", "HSSYCN", "NBRCCN", "FSBCCN", "GDROCN", "YZBKCN", "NJCBCN", "JRCBCN", "BOLFCN"];
    /* валюта страны — если в списке валюта не указана, показываем её и рубли */
    const BK_NAT = {
      "Армения": "AMD", "Беларусь": "BYN", "Вьетнам": "VND", "Индия": "INR", "Казахстан": "KZT", "Киргизия": "KGS", "Узбекистан": "UZS",
      "Азербайджан": "AZN", "Грузия": "GEL", "Бразилия": "BRL", "Сербия": "RSD", "Турция": "TRY", "Таджикистан": "TJS",
      "Молдова, Республика": "MDL", "Монголия": "MNT", "Иордания": "JOD", "ОАЭ": "AED", "Гонконг": "HKD", "Таиланд": "THB",
    };
    /* рубли за рубеж: какие корсчета бывают для страны */
    const BK_RUB_OPTS = {
      "Казахстан": [["KZ_VTB", "через корсчёт в ВТБ"], ["KZ_UZ", "через другие корсчета"]],
      "Узбекистан": [["KZ_UZ", "трансграничный перевод"]],
      "Индия": [["IN_SBER", "через корсчёт в Сбербанке"], ["GEN", "через другие корсчета"]],
      "Вьетнам": [["VN_VTB", "через корсчёт в ВТБ"], ["GEN", "через другие корсчета"]],
      "Китай": [["CN_SOL", "через КБ «Солидарность»"], ["CN_MKB", "через МКБ"], ["CN_VTB", "через ВТБ"], ["GEN", "через другие корсчета"]],
    };
    const fmtMoney = (x, unit) => nf0.format(x) + " " + unit;
    /* «от 3 000 ₽» / «от 3 000 до 20 000 ₽» */
    const tfRange = (l) => (l.max ? "от " + nf0.format(l.min) + " до " + fmtMoney(l.max, l.unit) : "от " + fmtMoney(l.min, l.unit) + ", без потолка");
    const tfRangeShort = (l) => (l.max ? nf0.format(l.min) + "–" + fmtMoney(l.max, l.unit) : "от " + fmtMoney(l.min, l.unit));
    function tfLineCur(code) {
      const f = TC_FX[code];
      const o = f || TC_FX.OTHER;
      return { code: code, label: f ? "Перевод в " + code : "Перевод в " + code + " (прочие валюты)", pct: o.pct, min: o.min, max: o.max, unit: o.cur ? code : "₽", p: o.p, calc: { cur: code } };
    }
    function tfLineCny(sw) {
      const id = TC_CNY.some((x) => x.id === sw) ? sw : TF_CNY_GROUP1.indexOf(sw) >= 0 ? "G1" : "OTHER_CN";
      const b = TC_CNY.find((x) => x.id === id);
      const lbl = id === "G1" ? " (банки группы 1)" : id === "OTHER_CN" ? " (прочие банки Китая)" : "";
      return { code: "CNY", label: "Юани в этот банк" + lbl, pct: b.pct, min: b.min, max: b.max, unit: "₽", p: "2.2.2.1." + b.p, s: b.noThird ? "без комиссий стороннего банка" : "", calc: { cur: "CNY", bank: id } };
    }
    function tfLinesRub(country) {
      return (BK_RUB_OPTS[country] || [["GEN", "трансграничный перевод"]]).map((x) => {
        const b = TC_RUB.find((y) => y.id === x[0]);
        return { code: "RUB", label: "Рубли — " + x[1], pct: b.pct, min: b.min, max: b.max, unit: "₽", p: b.p, calc: { cur: "RUB", bank: x[0] } };
      });
    }
    function bkTariff(r) {
      if (bkIsRu(r) || r.g === "agent") return { lines: [], guess: false };
      const out = [];
      const curs = r.route.D.concat(r.route.P).filter((c, i, a) => a.indexOf(c) === i);
      const sw = r.swift || "";
      /* банк Китая — «CN» в 5–6 знаке SWIFT; ставка за юани зависит от конечного банка получателя */
      const inCN = sw.length >= 6 && sw.slice(4, 6) === "CN";
      const noCny = /юан[^.\n]*не провод|не провод[^.\n]*юан/i.test(r.cm);
      let guess = false;
      if (inCN && !noCny) out.push(tfLineCny(sw));
      else if (!inCN && curs.indexOf("CNY") >= 0) out.push({ code: "CNY", label: "Юани в банк вне материкового Китая", pct: 0.003, min: 3000, max: 20000, unit: "₽", p: "2.2.2.1.9.2", calc: { cur: "CNY", bank: "NOT_CN" } });
      let list = curs.filter((c) => c !== "CNY");
      /* валюта в списке не указана — ставки для валюты страны и рублей */
      if (!curs.length && !inCN && BK_NAT[r.country]) { list = [BK_NAT[r.country], "RUB"]; guess = true; }
      list.forEach((c) => {
        if (c === "RUB") tfLinesRub(r.country).forEach((l) => out.push(l));
        else out.push(tfLineCur(c));
      });
      return { lines: out, guess: guess };
    }
    /* одна строка для сообщения: «KGS 1% (от 4 500 ₽, без потолка)» */
    const tfLineText = (l) => l.code + " " + pct2(l.pct) + " (" + tfRange(l) + ", п. " + l.p + ")";

    function BkPill({ k }) {
      const K = BK_KIND[k] || BK_KIND.agent;
      const solid = k === "direct" || k === "proxy" || k === "mixed" || k === "ru_ok";
      const st = solid ? { background: K.color, boxShadow: "0 4px 12px -6px " + K.color }
        : { background: K.color + "12", borderColor: K.color + "55", color: k === "cond" || k === "ru_cond" ? "#7d5518" : "#96271f" };
      return (<span className={"bk-pill " + (solid ? "solid" : "")} style={st}><K.Ic size={12} className="shrink-0" />{K.title}</span>);
    }
    /* валюты маршрута: зелёные — напрямую, фиолетовые — через прокси */
    function BkCurs({ r }) {
      const D = r.route.D, P = r.route.P;
      if (!D.length && !P.length) return null;
      const chip = (c, col) => <span key={col + c} className="bk-c" style={{ color: col, borderColor: col + "55", background: col + "10" }}>{c}</span>;
      /* один маршрут — просто валюты; оба — подписываем, что напрямую, а что через прокси */
      const both = r.route.hasD && r.route.hasP;
      return (
        <span className="bk-cur">
          {D.length > 0 && <React.Fragment><span>{both ? "напрямую" : "валюта"}</span>{D.map((c) => chip(c, BK_KIND.direct.color))}</React.Fragment>}
          {D.length > 0 && P.length > 0 && <span className="mx-0.5">·</span>}
          {P.length > 0 && <React.Fragment><span>{both ? "через прокси" : "валюта"}</span>{P.map((c) => chip(c, BK_KIND.proxy.color))}</React.Fragment>}
        </span>
      );
    }

    /* компактная полоска на странице: каждая цифра открывает окно сразу с нужной группой */
    function BanksStrip() {
      const c = BK.count;
      if (!c.all) return null;
      const fx = BK.fxSec;
      const chip = (k, sec, label) => (
        <button key={k} onClick={() => openBanks("", { sec: sec, grp: k })} className="bk-chip" title={BK_KIND[k].desc}>
          <span className="bk-dot" style={{ background: BK_KIND[k].color }}></span>{label || BK_KIND[k].chip}<span className="n">{nf0.format(c[k])}</span>
        </button>
      );
      return (
        <div className="rise">
          <div className="bk-strip rounded-2xl card px-3.5 py-3">
            <div className="flex flex-col sm:flex-row sm:items-center gap-2.5 sm:gap-4">
              <button onClick={() => openBanks("", { sec: fx })} aria-haspopup="dialog" className="flex items-center gap-2.5 min-w-0 sm:flex-1 text-left">
                <span className="w-9 h-9 rounded-xl sunken flex items-center justify-center shrink-0"><IcBank size={17} style={{ color: "var(--red)" }} /></span>
                <span className="min-w-0">
                  <span className="block text-[14.5px] font-semibold ink leading-tight">Банк получателя: прямой платёж или прокси</span>
                  <span className="block text-[12px] ink-3 mt-0.5">{nf0.format(c.all)} {bkPlur(c.all, "банк", "банка", "банков")}{BK.asOf ? ", список на " + BK.asOf : ""}</span>
                </span>
              </button>
              <button onClick={() => openBanks("", { sec: fx })} aria-haspopup="dialog" className="bk-fake flex items-center gap-2 rounded-xl px-3 py-2 sm:w-[270px] shrink-0 text-[13px] ink-3 text-left">
                <IcSearch size={15} className="shrink-0" /><span className="truncate">Название, SWIFT или страна</span>
                <IcArrow size={15} className="ml-auto shrink-0" style={{ color: "var(--red)" }} />
              </button>
            </div>
            <div className="flex flex-wrap items-center gap-1.5 mt-2.5">
              {BK_ORDER_FX.map((k) => chip(k, fx))}
              {BK.ruSec >= 0 && chip("ru_ok", BK.ruSec, "Юани по РФ: принимают")}
            </div>
          </div>
        </div>
      );
    }

    function BkHelp() {
      const pill = (k, text) => (<div key={k}><BkPill k={k} /> <span className="ml-1">{text}</span></div>);
      return (
        <div className="m-3 sm:m-4 rounded-xl card-soft p-3.5 sm:p-4 text-[13px] ink-2 leading-relaxed grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-2.5">
          {pill("direct", "Альфа отправляет платёж напрямую в банк получателя.")}
          {pill("proxy", "платёж идёт через банк-корреспондент в РФ, обычно в местной валюте (тенге, сумы, манаты, драмы, лари, лиры, реалы, юани). Как правило — только несанкционные товары и стороны.")}
          {pill("mixed", "маршрут зависит от валюты: например, рубли напрямую, сомы через прокси. Валюты подписаны у банка.")}
          {pill("cond", "условно рекомендованы или на усмотрение банка-получателя. Платёж может вернуться.")}
          {pill("agent", "прямые расчёты не рекомендованы. Платим через агента, банк клиента в цепочке не участвует.")}
          <div>Маршрут взят из комментария в исходном списке. Если про прокси там ничего нет — платёж прямой.</div>
          <div>«Юани по РФ» — отдельная вкладка: принимает ли российский банк юани. Если не принимает, спросите у клиента, в каких ещё банках у него счёт в юанях.</div>
          <div>SWIFT в списке записан первыми шестью знаками. Полный код тоже можно вставить в поиск, банк найдётся.</div>
          <div>Банка нет в списке: платежей в него было меньше трёх или не было за месяц, прямой маршрут не проверен.</div>
          <div>У банка — комиссия за перевод по тарифу «Быстрое развитие» «от и до»; в карточке — все валюты и кнопка «на сумму».</div>
          <div>«Скопировать список» — готовое сообщение по текущей выборке: страна, группа, поиск. Кратко или с комментариями и комиссиями.</div>
          <div className="md:col-span-2">Рублёвый платёж не подписывается и банк пишет «В этот банк сейчас не получится отправить платёж»? Согласуйте отправку через прокси-маршрут. Инструкция в базе знаний: ВЭД, Текущая ситуация, Международные расчёты через банки-корреспонденты в РФ (прокси-маршрут), Переводы в рублях.</div>
        </div>
      );
    }

    function BankDetail({ r, goCalc, goTariff, copySwift, copied }) {
      const K = BK_KIND[r.g] || BK_KIND.agent;
      const cn = /китай|гонконг|тайвань/i.test(r.country);
      const viaAgent = r.g === "agent" || r.g === "cond" || r.g === "ru_no" || r.g === "ru_cond";
      const showFull = r.st.f && r.st.f.length > 30 && bkNorm(r.st.f) !== bkNorm(r.st.s);
      const T = bkTariff(r), tf = T.lines;
      const lbl = "text-[11px] font-semibold uppercase tracking-wider ink-3 mb-0.5";
      return (
        <div className="bk-detail">
          <div className="rounded-xl sunken p-3 sm:p-3.5 grid grid-cols-1 md:grid-cols-12 gap-3 md:gap-5">
            <div className="md:col-span-7 space-y-2.5 min-w-0">
              <div className="flex items-start gap-2 text-[13.5px] ink leading-relaxed">
                <K.Ic size={15} className="shrink-0 mt-1" style={{ color: K.color }} /><span>{bkAdvice(r)}</span>
              </div>
              {r.cm && <div><div className={lbl}>Комментарий</div><div className="bk-pre text-[13px] ink-2 leading-relaxed">{r.cm}</div></div>}
              {showFull && <div><div className={lbl}>Итог в исходном списке</div><div className="bk-pre text-[13px] ink-2 leading-relaxed">{r.st.f}</div></div>}
              {tf.length > 0 && (
                <div>
                  <div className={lbl}>Комиссия за перевод по тарифу «Быстрое развитие»</div>
                  {T.guess && <div className="text-[12px] ink-3 mb-1">Валюта в списке не указана — ставки для валюты страны и для рублей.</div>}
                  <div className="rounded-lg overflow-hidden" style={{ border: "1px solid var(--line)" }}>
                    {tf.map((x, i) => (
                      <div key={i} className="px-2.5 py-2 text-[12.5px] flex flex-wrap items-center gap-x-3 gap-y-1" style={{ background: "#fffdfa", borderTop: i ? "1px solid var(--line-2)" : "none" }}>
                        <span className="min-w-0 flex-1 basis-[180px] ink-2 leading-snug">{x.label}{x.s ? <span className="ink-3"> · {x.s}</span> : null} <span className="tf-p">п. {x.p}</span></span>
                        <span className="num whitespace-nowrap"><b style={{ color: "var(--vtb)" }}>{pct2(x.pct)}</b> <span className="ink">{tfRange(x)}</span></span>
                        <button onClick={() => goTariff("calc", x.calc)} className="inline-flex items-center gap-1 rounded-full btn-ghost px-2.5 py-1 text-[12px]"><IcCalc size={12} />на сумму</button>
                      </div>
                    ))}
                    <div className="px-2.5 py-2 text-[12.5px] flex flex-wrap items-center gap-x-3 gap-y-1" style={{ background: "#f8f4ee", borderTop: "1px solid var(--line-2)" }}>
                      <span className="min-w-0 flex-1 basis-[180px] ink-2 leading-snug">Плюс ФАВК, контракт на учёте <span className="tf-vat">+ НДС</span> <span className="tf-p">п. 4.1</span></span>
                      <span className="num whitespace-nowrap"><b style={{ color: "var(--vtb)" }}>0,20%</b> <span className="ink">от 1 200 ₽, без потолка</span></span>
                    </div>
                    <div className="px-2.5 py-2 text-[12.5px] flex flex-wrap items-center gap-x-3 gap-y-1" style={{ background: "#f8f4ee", borderTop: "1px solid var(--line-2)" }}>
                      <span className="min-w-0 flex-1 basis-[180px] ink-2 leading-snug">или ФАВК, контракт без учёта <span className="tf-vat">+ НДС</span> <span className="tf-p">п. 4.3</span></span>
                      <span className="num whitespace-nowrap"><b style={{ color: "var(--vtb)" }}>0,20%</b> <span className="ink">от 1 200 до 60 000 ₽</span></span>
                    </div>
                  </div>
                  <div className="text-[11.5px] ink-3 mt-1">Комиссии банков-корреспондентов и банка получателя — сверху. Только для ПУ «Быстрое развитие».</div>
                </div>
              )}
            </div>
            <div className="md:col-span-5 space-y-2.5 min-w-0">
              <div className="grid gap-x-3 gap-y-1 text-[12.5px]" style={{ gridTemplateColumns: "auto 1fr" }}>
                <span className="ink-3">Раздел</span><span className="ink">{bkSecLabel(BK.sections[r.sec])}</span>
                <span className="ink-3">Страна</span><span className="ink">{r.country}</span>
                <span className="ink-3">SWIFT/БИК</span><span className="ink num">{r.swift ? r.swift + " (первые 6 знаков)" : "не указан"}</span>
                <span className="ink-3">Маршрут</span><span className="ink">{K.title}</span>
              </div>
              <div className="flex flex-wrap gap-2">
                {r.swift && (
                  <button onClick={() => copySwift(r.swift)} className="inline-flex items-center gap-1.5 rounded-full btn-ghost px-3.5 py-2 text-[12.5px]">
                    {copied === r.swift ? <IcCheck size={14} /> : <IcCopy size={14} />}{copied === r.swift ? "Скопировано" : "Скопировать SWIFT"}
                  </button>
                )}
                {viaAgent && <button onClick={() => goCalc("import")} className="inline-flex items-center gap-1.5 rounded-full btn-red px-3.5 py-2 text-[12.5px] font-medium"><IcCalc size={14} />Посчитать через финагента</button>}
                {viaAgent && cn && <button onClick={() => goCalc("clearing")} className="inline-flex items-center gap-1.5 rounded-full btn-ghost px-3.5 py-2 text-[12.5px]"><IcMap size={14} />Клиринг в Китай</button>}
                {tf.length > 0 && <button onClick={() => goTariff(cn ? "cny" : "fx")} className="inline-flex items-center gap-1.5 rounded-full btn-ghost px-3.5 py-2 text-[12.5px]"><IcLayers size={14} />Условия тарифа</button>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function BankRow({ r, re, on, onToggle, goCalc, goTariff, copySwift, copied }) {
      const K = BK_KIND[r.g] || BK_KIND.agent;
      const tf = bkTariff(r).lines;
      return (
        <div className={"bk-row k-" + r.g + (on ? " on" : "")} style={{ "--k": K.color }}>
          <button className="bk-main bk-grid" onClick={onToggle} aria-expanded={on}>
            <span className="a-name min-w-0">
              <span className="bk-name block text-[14px] font-semibold ink leading-snug"><Hl text={r.name} re={re} /></span>
              {r.cm && !on && <span className="bk-cm block text-[12.5px] ink-3 mt-0.5 leading-snug"><Hl text={r.cm} re={re} /></span>}
            </span>
            <span className="a-cty text-[12.5px] ink-2 leading-snug"><Hl text={r.country} re={re} /></span>
            <span className="a-sw num text-[12.5px] font-semibold ink-2" style={{ fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" }}>{r.swift ? <Hl text={r.swift} re={re} /> : "—"}</span>
            <span className="a-st min-w-0">
              <BkPill k={r.g} />
              <BkCurs r={r} />
              {r.g === "cond" && <span className="block text-[12px] ink-3 mt-1 leading-snug">{r.st.s}</span>}
              {tf.length > 0 && (
                <span className="block text-[12px] mt-1 leading-snug ink-2">
                  <span className="ink-3">комиссия </span><b className="num" style={{ color: "var(--vtb)" }}>{tf[0].code} {pct2(tf[0].pct)}</b> <span className="num">{tfRangeShort(tf[0])}</span>
                  {tf.length > 1 && <span className="ink-3"> · ещё {tf.length - 1}</span>}
                </span>
              )}
              {r.stop && <span className="block text-[12px] ink-3 mt-1 leading-snug">в списке «рекомендованы», но платежи из РФ не принимает</span>}
              {r.st.k === "none" && <span className="block text-[12px] ink-3 mt-1 leading-snug">статус в списке не указан</span>}
            </span>
          </button>
          {on && <BankDetail r={r} goCalc={goCalc} goTariff={goTariff} copySwift={copySwift} copied={copied} />}
        </div>
      );
    }

    function BkGroupHead({ k, n }) {
      const K = BK_KIND[k] || BK_KIND.agent;
      return (
        <div className="bk-ghead" style={{ background: K.color + "0f", borderTop: "2px solid " + K.color }}>
          <span className="t" style={{ color: K.color }}>{K.head}</span>
          <span className="n" style={{ color: K.color }}>{nf0.format(n)}</span>
          <span className="d">{K.desc}</span>
        </div>
      );
    }

    /* сообщение со списком банков по текущей выборке: страны по алфавиту, внутри — группы маршрута */
    function bkCursText(r) {
      const D = r.route.D, P = r.route.P;
      if (D.length && P.length) return "напрямую: " + D.join(", ") + "; через прокси: " + P.join(", ");
      if (D.length || P.length) return "валюта: " + D.concat(P).join(", ");
      return "";
    }
    function bkListText(rows, title, detail) {
      const L = [];
      L.push("Банки-получатели" + (title ? ": " + title : ""));
      L.push("Список Альфа-Банка" + (BK.asOf ? " на " + BK.asOf : "") + " — " + nf0.format(rows.length) + " " + bkPlur(rows.length, "банк", "банка", "банков"));
      const byC = {};
      rows.forEach((r) => { (byC[r.country] = byC[r.country] || []).push(r); });
      Object.keys(byC).sort((a, b) => a.localeCompare(b, "ru")).forEach((c) => {
        const arr = byC[c];
        L.push("");
        L.push(c.toUpperCase() + " — " + nf0.format(arr.length));
        const order = bkSecIsRu(BK.sections[arr[0].sec]) ? BK_ORDER_RU : BK_ORDER_FX;
        order.forEach((k) => {
          const g = arr.filter((r) => r.g === k).sort((a, b) => a.name.localeCompare(b.name, "ru"));
          if (!g.length) return;
          L.push(BK_KIND[k].head + " (" + g.length + "):");
          g.forEach((r) => {
            const cur = bkCursText(r);
            L.push("• " + r.name + (r.swift ? " — SWIFT " + r.swift : "") + (cur ? " — " + cur : ""));
            if (!detail) return;
            if (r.cm) L.push("   " + r.cm.replace(/\s*\n+\s*/g, " ").trim());
            const t = bkTariff(r);
            if (t.lines.length) L.push("   Комиссия по тарифу «Быстрое развитие»: " + t.lines.map(tfLineText).join("; ") + (t.guess ? " — валюта в списке не указана" : ""));
          });
        });
      });
      const hasFx = rows.some((r) => !bkSecIsRu(BK.sections[r.sec]));
      L.push("");
      if (hasFx) L.push("Прямой платёж — Альфа отправляет его напрямую в банк получателя. Прокси-маршрут — через банк-корреспондент в РФ, обычно в местной валюте и только по несанкционным сделкам.");
      L.push("SWIFT — первые 6 знаков кода.");
      if (detail && hasFx) L.push("К комиссии за перевод добавляется ФАВК 0,20%, от 1 200 ₽ (+ НДС), и комиссии банков-корреспондентов. Ставки — только для пакета услуг «Быстрое развитие».");
      return L.join("\n");
    }

    const BK_PAGE = 120;
    /* большое окно со всем списком: вкладки «Зарубежные» / «Юани по РФ», поиск, страны, группы */
    function BanksModal({ onPick }) {
      const gateOk = useContext(GateCtx);
      const [open, setOpen] = useState(false);
      const [q, setQ] = useState("");
      const [sec, setSec] = useState(BK.fxSec);
      const [grp, setGrp] = useState("");
      const [country, setCountry] = useState("");
      const [limit, setLimit] = useState(BK_PAGE);
      const [openId, setOpenId] = useState(null);
      const [help, setHelp] = useState(false);
      const [copied, setCopied] = useState(null);
      const [copyOpen, setCopyOpen] = useState(false);
      const [copyMsg, setCopyMsg] = useState("");
      const [copyFallback, setCopyFallback] = useState("");
      const inputRef = useRef(null), listRef = useRef(null), moreRef = useRef(null), popped = useRef(false);

      useEffect(() => {
        const f = (e) => {
          const d = (e && e.detail) || {};
          /* открыли с группой — старый поиск не мешает; без неё — продолжаем с того же места */
          setQ((old) => (d.q ? d.q : d.grp ? "" : old));
          if (typeof d.sec === "number" && d.sec >= 0) { setSec(d.sec); setCountry(""); }
          setGrp(d.grp || "");
          if (d.country) setCountry(d.country);
          setOpen(true);
        };
        window.addEventListener("banks:open", f);
        return () => window.removeEventListener("banks:open", f);
      }, []);
      useEffect(() => { if (!gateOk) setOpen(false); }, [gateOk]);

      /* пока окно открыто: страница не прокручивается, Esc и жест «назад» закрывают окно */
      useEffect(() => {
        if (!open) return;
        const root = document.documentElement, body = document.body;
        const was = { o: root.style.overflow, p: body.style.paddingRight };
        const gap = window.innerWidth - root.clientWidth;
        root.style.overflow = "hidden";
        if (gap > 0) body.style.paddingRight = gap + "px";
        let pushed = false;
        popped.current = false;
        try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; history.pushState({ banks: 1 }, ""); pushed = true; } catch (e) {}
        const onPop = () => { popped.current = true; setOpen(false); };
        const onKey = (e) => {
          if (e.key !== "Escape" && e.key !== "Esc") return;
          const inp = inputRef.current;
          if (inp && document.activeElement === inp && inp.value) { setQ(""); return; }
          setOpen(false);
        };
        window.addEventListener("popstate", onPop);
        window.addEventListener("keydown", onKey);
        let t = null;
        try { if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) t = setTimeout(() => { try { inputRef.current.focus(); inputRef.current.select(); } catch (e) {} }, 40); } catch (e) {}
        return () => {
          clearTimeout(t);
          root.style.overflow = was.o; body.style.paddingRight = was.p;
          window.removeEventListener("popstate", onPop);
          window.removeEventListener("keydown", onKey);
          if (pushed && !popped.current) { try { if (history.state && history.state.banks) history.back(); } catch (e) {} }
        };
      }, [open]);

      const ru = bkSecIsRu(BK.sections[sec]);
      const order = ru ? BK_ORDER_RU : BK_ORDER_FX;
      const qq = useMemo(() => bkQuery(q), [q]);
      const hits = useMemo(() => (qq.toks.length ? BK.rows.filter((r) => bkHit(r, qq.toks)) : BK.rows), [qq]);
      const inSec = useMemo(() => hits.filter((r) => r.sec === sec), [hits, sec]);
      const ctys = useMemo(() => { const c = {}; BK.rows.forEach((r) => { if (r.sec === sec) c[r.country] = (c[r.country] || 0) + 1; }); return c; }, [sec]);
      const base = useMemo(() => (country ? inSec.filter((r) => r.country === country) : inSec), [inSec, country]);
      const cnt = useMemo(() => { const c = {}; base.forEach((r) => { c[r.g] = (c[r.g] || 0) + 1; }); return c; }, [base]);
      const secHits = useMemo(() => { const c = {}; hits.forEach((r) => { if (!country || r.country === country || r.sec !== sec) c[r.sec] = (c[r.sec] || 0) + 1; }); return c; }, [hits, country, sec]);
      const list = useMemo(() => {
        const l = grp ? base.filter((r) => r.g === grp) : base.slice();
        if (qq.toks.length) {
          const sc = {};
          l.forEach((r) => { sc[r.id] = bkScore(r, qq.toks); });
          l.sort((a, b) => (a.ord - b.ord) || (sc[a.id] - sc[b.id]));
        }
        return l;
      }, [base, grp, qq]);
      const otherSec = BK.sections.map((s, i) => i).filter((i) => i !== sec && (secHits[i] || 0) > 0);

      useEffect(() => { setLimit(BK_PAGE); setOpenId(null); if (listRef.current) listRef.current.scrollTop = 0; }, [q, sec, country, grp]);
      useEffect(() => {
        if (!open || !moreRef.current || !("IntersectionObserver" in window)) return;
        const io = new IntersectionObserver((es) => { if (es[0] && es[0].isIntersecting) setLimit((n) => n + BK_PAGE); }, { root: listRef.current, rootMargin: "500px 0px" });
        io.observe(moreRef.current);
        return () => io.disconnect();
      }, [open, list, limit]);

      if (!open || !gateOk) return null;

      const close = () => setOpen(false);
      /* переход на страницу запускаем после того, как окно ушло из истории, иначе «назад» его оборвёт */
      const after = (fn) => {
        let done = false;
        const run = () => {
          if (done) return;
          done = true;
          window.removeEventListener("popstate", run);
          setTimeout(fn, 30);
        };
        let inHistory = false;
        try { inHistory = !!(history.state && history.state.banks); } catch (e) {}
        if (inHistory) { window.addEventListener("popstate", run); setTimeout(run, 800); } else setTimeout(run, 0);
        setOpen(false);
      };
      const goCalc = (id) => after(() => { if (onPick) onPick(id); });
      const goTariff = (cat, calc) => after(() => openTariff(cat, calc));
      const copySwift = async (sw) => { const ok = await copyText(sw); setCopied(ok ? sw : null); setTimeout(() => setCopied(null), 1800); };
      const filtered = !!(q || country || grp);
      const reset = () => { setQ(""); setCountry(""); setGrp(""); };
      const pickSec = (i) => { setSec(i); setGrp(""); setCountry(""); };
      /* название выборки для сообщения: вкладка, страна, группа, поиск */
      const selTitle = [bkSecLabel(BK.sections[sec]), country, grp ? BK_KIND[grp].head : "", q.trim() ? "поиск «" + q.trim() + "»" : ""].filter(Boolean).join(" · ");
      const doCopyList = async (detail) => {
        const text = bkListText(list, selTitle, detail);
        const ok = await copyText(text);
        setCopyFallback(ok ? "" : text);
        setCopyMsg(ok ? "Скопировано: " + nf0.format(list.length) + " " + bkPlur(list.length, "банк", "банка", "банков") + ". Можно вставлять в сообщение." : "Браузер не дал скопировать — выделите текст ниже и нажмите Ctrl+C.");
        if (ok) setTimeout(() => { setCopyMsg(""); setCopyOpen(false); }, 2200);
      };

      /* строки списка с заголовками групп */
      const rowsOut = [];
      let lastG = null;
      list.slice(0, limit).forEach((r) => {
        if (r.g !== lastG) { rowsOut.push(<BkGroupHead key={"g-" + r.g} k={r.g} n={cnt[r.g] || 0} />); lastG = r.g; }
        rowsOut.push(<BankRow key={r.id} r={r} re={qq.re} on={openId === r.id}
          onToggle={() => setOpenId((v) => (v === r.id ? null : r.id))}
          goCalc={goCalc} goTariff={goTariff} copySwift={copySwift} copied={copied} />);
      });

      return ReactDOM.createPortal(
        <div className="bk-layer" onMouseDown={(e) => { if (e.target === e.currentTarget) close(); }}>
          <div className="bk-panel" role="dialog" aria-modal="true" aria-labelledby="bk-title">
            <div className="bk-top px-3.5 sm:px-5 pt-3 sm:pt-4 pb-3">
              <div className="relative flex items-start gap-2 sm:gap-3">
                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-2">
                    <IcBank size={19} style={{ color: "var(--red)" }} className="shrink-0" />
                    <h2 id="bk-title" className="text-[19px] sm:text-[23px] font-semibold ink leading-tight" style={{ letterSpacing: "-0.02em" }}>Банки-получатели</h2>
                  </div>
                  <div className="text-[12.5px] ink-3 mt-1 leading-snug">
                    {nf0.format(BK.count.all)} {bkPlur(BK.count.all, "банк", "банка", "банков")} из {BK.countries.length} {bkPlur(BK.countries.length, "страны", "стран", "стран")}{BK.asOf ? ", список на " + BK.asOf : ""}.
                    <span className="hidden sm:inline"> Нажмите на банк — увидите комментарий и ставку по тарифу.</span>
                  </div>
                </div>
                <div className="shrink-0">
                  <button onClick={() => { setCopyOpen((o) => !o); setCopyMsg(""); setCopyFallback(""); }} aria-expanded={copyOpen} disabled={!list.length}
                    className={"h-10 min-w-[40px] px-2.5 sm:px-3.5 rounded-full inline-flex items-center justify-center gap-1.5 text-[12.5px] " + (copyOpen ? "btn-dark" : "btn-ghost") + (list.length ? "" : " opacity-50")}
                    title="Скопировать список банков по текущей выборке">
                    <IcCopy size={15} /><span className="hidden sm:inline">Скопировать список</span>
                  </button>
                  {copyOpen && (
                    <div className="absolute left-0 right-0 sm:left-auto sm:w-[340px] top-[48px] z-20 rounded-xl card emboss p-3 text-left" style={{ boxShadow: "0 20px 50px -20px rgba(36,26,20,0.55)" }}>
                      <div className="text-[13.5px] font-semibold ink">Скопировать выборку · {nf0.format(list.length)} {bkPlur(list.length, "банк", "банка", "банков")}</div>
                      <div className="text-[12px] ink-3 mt-0.5 mb-2 leading-snug">{selTitle}. Банки по странам и группам — готовое сообщение. Выборку меняют вкладка, страна, группа и поиск.</div>
                      <button onClick={() => doCopyList(false)} className="w-full text-left rounded-lg btn-ghost px-3 py-2 mb-1.5">
                        <span className="block text-[13px] font-semibold ink">Кратко</span>
                        <span className="block text-[11.5px] ink-3">название, SWIFT, маршрут и валюта</span>
                      </button>
                      <button onClick={() => doCopyList(true)} className="w-full text-left rounded-lg btn-ghost px-3 py-2">
                        <span className="block text-[13px] font-semibold ink">Подробно</span>
                        <span className="block text-[11.5px] ink-3">плюс комментарий банка и комиссия по тарифу «от и до»</span>
                      </button>
                      {copyMsg && <div className="text-[12px] mt-2 leading-snug" style={{ color: copyFallback ? "var(--red-ink)" : "var(--green)" }}>{copyMsg}</div>}
                      {copyFallback && <textarea readOnly value={copyFallback} onFocus={(e) => e.target.select()} autoFocus className="fld mt-2 text-[12px]" style={{ height: "160px", resize: "vertical" }} />}
                    </div>
                  )}
                </div>
                <button onClick={() => setHelp((h) => !h)} aria-pressed={help}
                  className={"h-10 min-w-[40px] px-2.5 sm:px-3.5 rounded-full inline-flex items-center justify-center gap-1.5 text-[12.5px] shrink-0 " + (help ? "btn-dark" : "btn-ghost")}>
                  <IcInfo size={15} /><span className="hidden sm:inline">Как читать</span>
                </button>
                <button onClick={close} className="w-10 h-10 rounded-full btn-ghost flex items-center justify-center shrink-0" aria-label="Закрыть"><IcX size={18} /></button>
              </div>

              <div className="flex flex-col md:flex-row md:items-center gap-2 mt-3">
                <div className="bk-tabs shrink-0 self-start" role="tablist">
                  {BK.sections.map((s, i) => (
                    <button key={i} role="tab" aria-selected={sec === i} onClick={() => pickSec(i)} className={"bk-tab " + (sec === i ? "on" : "")}>
                      {bkSecLabel(s)}<span className="n">{nf0.format(qq.toks.length ? (secHits[i] || 0) : (BK.secN[i] || 0))}</span>
                    </button>
                  ))}
                </div>
                <div className="relative flex-1 min-w-0">
                  <IcSearch size={17} className="absolute left-3 top-1/2 -translate-y-1/2 ink-3 pointer-events-none" />
                  <input ref={inputRef} type="text" value={q} onChange={(e) => setQ(e.target.value)}
                    placeholder="Банк, SWIFT, страна, валюта или слово из комментария"
                    autoComplete="off" spellCheck="false" enterKeyHint="search" aria-label="Поиск банка"
                    className="fld" style={{ paddingLeft: "38px", paddingRight: "42px", fontSize: "15px", height: "44px" }} />
                  {q && (
                    <button onClick={() => { setQ(""); try { inputRef.current.focus(); } catch (e) {} }}
                      className="absolute right-1.5 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full flex items-center justify-center ink-3 hover:ink" aria-label="Очистить поиск"><IcX size={15} /></button>
                  )}
                </div>
              </div>

              <div className="bk-scroll flex items-center gap-1.5 mt-2.5 -mx-3.5 px-3.5 sm:mx-0 sm:px-0 pb-0.5">
                {Object.keys(ctys).length > 1 && (
                  <select value={country} onChange={(e) => setCountry(e.target.value)} aria-label="Страна"
                    className="fld shrink-0" style={{ width: "auto", minWidth: "150px", height: "33px", padding: "0 30px 0 11px", fontSize: "12.5px", borderRadius: "999px" }}>
                    <option value="">Все страны</option>
                    {Object.keys(ctys).sort((a, b) => a.localeCompare(b, "ru")).map((c) => <option key={c} value={c}>{c} · {ctys[c]}</option>)}
                  </select>
                )}
                <button onClick={() => setGrp("")} className={"bk-chip " + (!grp ? "on" : "")} aria-pressed={!grp}>Все<span className="n">{nf0.format(base.length)}</span></button>
                {order.map((k) => (
                  <button key={k} onClick={() => setGrp(grp === k ? "" : k)} className={"bk-chip " + (grp === k ? "on" : "")} aria-pressed={grp === k} title={BK_KIND[k].desc}>
                    <span className="bk-dot" style={{ background: BK_KIND[k].color }}></span>{BK_KIND[k].chip}<span className="n">{nf0.format(cnt[k] || 0)}</span>
                  </button>
                ))}
                {filtered && <button onClick={reset} className="shrink-0 px-2 text-[12.5px] ink-3 hover:ink underline underline-offset-2">Сбросить</button>}
              </div>
            </div>

            <div ref={listRef} className="bk-list">
              {help && <BkHelp />}
              {qq.toks.length > 0 && otherSec.length > 0 && list.length > 0 && (
                <div className="mx-3 sm:mx-4 mt-3 rounded-lg px-3 py-2 text-[12.5px] ink-2 flex flex-wrap items-center gap-2" style={{ background: "#f6f1ea", border: "1px solid var(--line)" }}>
                  <IcInfo size={14} className="ink-3 shrink-0" />
                  {otherSec.map((i) => (
                    <button key={i} onClick={() => pickSec(i)} className="underline underline-offset-2 hover:ink">Ещё {nf0.format(secHits[i])} во вкладке «{bkSecLabel(BK.sections[i])}»</button>
                  ))}
                </div>
              )}
              {list.length > 0 && (
                <div className="bk-colhead bk-grid px-[17px] py-2 text-[11px] font-semibold uppercase tracking-wider ink-3 mt-2">
                  <span className="a-name">Банк и комментарий · {nf0.format(list.length)}</span><span className="a-cty">Страна</span><span className="a-sw">SWIFT</span><span className="a-st">{ru ? "Юани" : "Маршрут"}</span>
                </div>
              )}
              {rowsOut}
              {list.length > limit && (
                <div ref={moreRef} className="p-4 text-center">
                  <button onClick={() => setLimit((n) => n + BK_PAGE)} className="rounded-full btn-ghost px-5 py-2 text-[13px]">Показать ещё, осталось {nf0.format(list.length - limit)}</button>
                </div>
              )}
              {list.length > 0 && list.length <= limit && (
                <div className="px-4 py-5 text-center text-[12.5px] ink-3 leading-relaxed max-w-2xl mx-auto">
                  Нужного банка нет в списке? Значит, платежей в него было меньше трёх или не было за месяц. Расчёты возможны через финансовых агентов.
                </div>
              )}
              {!list.length && (
                <div className="p-5 sm:p-10 text-center max-w-xl mx-auto">
                  <div className="w-12 h-12 mx-auto rounded-2xl sunken flex items-center justify-center mb-3"><IcSearch size={20} className="ink-3" /></div>
                  {qq.toks.length > 0 && otherSec.length > 0 ? (
                    <React.Fragment>
                      <div className="text-[16px] font-semibold ink mb-1.5">Здесь пусто, но есть в другой вкладке</div>
                      <p className="text-[13.5px] ink-2 leading-relaxed mb-4">По запросу «{q.trim()}» банки нашлись в другом разделе.</p>
                      <div className="flex flex-wrap justify-center gap-2">
                        {otherSec.map((i) => (
                          <button key={i} onClick={() => pickSec(i)} className="rounded-full btn-dark px-5 py-2.5 text-[13.5px] font-medium">{bkSecLabel(BK.sections[i])} · {nf0.format(secHits[i])}</button>
                        ))}
                      </div>
                    </React.Fragment>
                  ) : (grp || country) && inSec.length > 0 ? (
                    <React.Fragment>
                      <div className="text-[16px] font-semibold ink mb-1.5">С этими фильтрами пусто</div>
                      <p className="text-[13.5px] ink-2 leading-relaxed mb-4">{country ? "В стране «" + country + "» таких банков в списке нет." : "Таких банков в списке нет."} Выберите другую группу или страну.</p>
                      <button onClick={() => { setCountry(""); setGrp(""); }} className="rounded-full btn-dark px-5 py-2.5 text-[13.5px] font-medium">Показать без фильтров</button>
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      <div className="text-[16px] font-semibold ink mb-1.5">{q.trim() ? "«" + q.trim() + "» в списке нет" : "Ничего не найдено"}</div>
                      <p className="text-[13.5px] ink-2 leading-relaxed mb-4">Если банка нет в списке, платежей в него было меньше трёх или не было за отчётный месяц, прямой маршрут не проверен. Расчёты возможны через финансовых агентов.</p>
                      <div className="flex flex-wrap justify-center gap-2">
                        <button onClick={() => goCalc("import")} className="inline-flex items-center gap-1.5 rounded-full btn-red px-5 py-2.5 text-[13.5px] font-medium"><IcCalc size={15} />Посчитать через финагента</button>
                        {filtered && <button onClick={reset} className="rounded-full btn-ghost px-5 py-2.5 text-[13.5px]">Сбросить поиск</button>}
                      </div>
                    </React.Fragment>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>,
        document.body
      );
    }

    /* ---- поиск по справочнику ---- */
    const tfNorm = (s) => String(s || "").toLowerCase().replace(/ё/g, "е");
    const tfCellText = (x) => (x == null ? "" : typeof x === "object" ? [x.v, x.s].join(" ") : String(x));
    const tfRowText = (r) => tfNorm(Object.keys(r).map((k) => (k === "vat" ? (r.vat ? "ндс" : "") : tfCellText(r[k]))).join(" "));
    /* окончание отрезаем: «справка» находит и «справки», «юань» — и «юани» */
    function tfTokens(q) { return tfNorm(q).split(/\s+/).filter(Boolean).slice(0, 6).map((t) => (t.length >= 4 && /[аяыиеоуюьй]$/.test(t) ? t.slice(0, -1) : t)); }
    function tfRe(toks) {
      if (!toks.length) return null;
      try { return new RegExp("(" + toks.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/е/g, "[её]")).join("|") + ")", "gi"); } catch (e) { return null; }
    }
    const tfHit = (text, toks) => toks.every((t) => text.indexOf(t) >= 0);

    /* strong — колонка ставки (синим, жирно), mono — SWIFT */
    function TfCell({ x, re, strong, mono }) {
      if (x == null || x === "") return null;
      if (typeof x === "object") return (<span><span className={strong ? "tf-v" : "font-semibold"}><Hl text={x.v} re={re} /></span>{x.s && <span className="tf-s"><Hl text={x.s} re={re} /></span>}</span>);
      if (mono) return <span className="tf-p" style={{ color: "var(--ink-2)", fontSize: "12.5px" }}><Hl text={x} re={re} /></span>;
      return <span className={strong ? "tf-v" : "num"}><Hl text={x} re={re} /></span>;
    }
    function TfTable({ cols, rows, re }) {
      const C = cols || C_STD;
      const tpl = C.map((c) => c.w).join(" ");
      return (
        <div className="tf-t" style={{ "--cols": tpl }}>
          <div className="tf-h">{C.map((c) => <span key={c.k}>{c.t}</span>)}</div>
          {rows.map((r, i) => (
            <div key={i} className="tf-r">
              {C.map((c) => {
                if (c.k === "p") return <span key="p" className="c-p tf-p"><Hl text={r.p || ""} re={re} /></span>;
                if (c.k === "op") return (
                  <span key="op" className="c-op min-w-0">
                    <Hl text={r.op} re={re} />{r.vat ? <span className="tf-vat" title="Без учёта НДС: НДС начисляется сверху">+ НДС</span> : null}

                const val = r[c.k];
                const empty = val == null || val === "";
                return (
                  <span key={c.k} className={"c-x min-w-0" + (empty ? " empty" : "")}>
                    {!empty && <span className="tf-lbl">{c.t}:</span>}
                    {empty ? <span className="ink-3 hidden md:inline">—</span> : <TfCell x={val} re={re} strong={c.k === "v" || c.k === "reg" || c.k === "urg"} mono={c.mono} />}

                );
              })}
            </div>
          ))}
        </div>
      );

      return (

      { id: "QDRCCN", n: "Qingdao Rural (QDRCCN)", pct: 0.017, min: 10000, p: "9.1.4", noThird: 1 },
      { id: "G1", n: "Банки группы 1 (Bank of Langfang, Industrial Bank…)", pct: 0.018, min: 10000, p: "9.1.11" },
      { id: "HRCMCN", n: "Hei he Rural (HRCMCNBH)", pct: 0.04, min: 15000, p: "9.1.7" },
      { id: "VTBRCN", n: "VTB Shanghai (VTBRCN)", pct: 0.049, min: 3000, p: "9.1.1" },
      { id: "OTHER_CN", n: "Прочие банки материкового Китая", pct: 0.049, min: 3000, p: "9.1.9" },
      { id: "NOT_CN", n: "Банк не в материковом Китае (Гонконг и др.)", pct: 0.003, min: 3000, max: 20000, p: "9.2" },
    ];
    /* рубли за рубеж (п. 2.1.2.26): ставка зависит от корсчёта банка-получателя в РФ */
    const TC_RUB = [
      { id: "GEN", n: "Любой корсчёт, кроме перечисленных ниже", pct: 0.0015, min: 2000, max: 50000, p: "2.1.2.26.1" },
      { id: "KZ_VTB", n: "Казахстан — корсчёт в Банке ВТБ", pct: 0.0015, min: 2000, max: 50000, p: "2.1.2.26.7" },
      { id: "KZ_UZ", n: "Казахстан (другие корсчета), Узбекистан", pct: 0.006, min: 3000, p: "2.1.2.26.8" },
      { id: "VN_VTB", n: "Вьетнам — корсчёт в Банке ВТБ", pct: 0.007, min: 2000, p: "2.1.2.26.6" },
      { id: "CN_SOL", n: "Китай — корсчёт в КБ «Солидарность»", pct: 0.011, min: 3000, p: "2.1.2.26.4" },
      { id: "IN_SBER", n: "Индия — корсчёт в ПАО Сбербанк", pct: 0.017, min: 2000, p: "2.1.2.26.5" },
      { id: "CN_MKB", n: "Китай, Лаос — корсчёт в ПАО МКБ", pct: 0.031, min: 15000, p: "2.1.2.26.3" },
      { id: "CN_VTB", n: "Китай — корсчёт в Банке ВТБ", pct: 0.047, min: 3000, p: "2.1.2.26.2" },
    ];
    /* конвертация: группы порогов (в единицах валюты) и пункт тарифа */
    const TC_CONV = [
      { c: ["USD", "AZN"], p: "5.2", th: [1e5, 5e5, 1e6] }, { c: ["EUR", "CHF"], p: "5.4", th: [1e5, 5e5, 1e6] },
      { c: ["GBP", "AUD", "CAD", "NZD", "SGD"], p: "5.9", th: [1e5, 5e5, 1e6] }, { c: ["JPY", "AMD", "INR"], p: "5.10", th: [1e7, 5e7, 1e8] },
      { c: ["NOK", "CNY", "SEK", "HKD", "PLN", "DKK", "TRY", "TJS", "KGS", "RSD", "UZS", "BRL", "GEL"], p: "5.11", th: [5e5, 3e6, 6e6] },
      { c: ["CZK", "ZAR", "MXN"], p: "5.12", th: [1e6, 2e6, 1e7] }, { c: ["KZT"], p: "5.13", th: [1e7, 5e7, 1e8] },
      { c: ["BYN"], p: "5.14", th: [1e5, 5e5, 1e6] }, { c: ["VND"], p: "5.15", th: [1e9, 5e9, 1e10] },
    ];
    function tcConv(cur, amount) {
      const g = TC_CONV.find((x) => x.c.indexOf(cur) >= 0);
      if (!g) return null;
      const pct = amount <= g.th[0] ? 0.006 : amount <= g.th[1] ? 0.005 : amount <= g.th[2] ? 0.004 : 0.003;
      return { pct: pct, p: g.p };
    }
    const clamp = (x, lo, hi) => Math.min(hi == null ? Infinity : hi, Math.max(lo || 0, x));
    /* как в тарифе: целые — «1%», дробные — два знака: «1,20%», «0,30%» */
    const pct2 = (x) => { const v = Math.round(x * 10000) / 100; return (Number.isInteger(v) ? String(v) : v.toFixed(2).replace(".", ",")) + "%"; };

    function TfCalc({ preset }) {
      const pr = preset || {};
      const { rates, cbrDate, status } = useCbr();
      const [cur, setCur] = useState(pr.cur || "USD");
      const [amount, setAmount] = useState(pr.cur === "RUB" ? "1000000" : "50000");
      const [bank, setBank] = useState(pr.cur === "CNY" && pr.bank ? pr.bank : "BKCHCN");
      const [rbank, setRbank] = useState(pr.cur === "RUB" && pr.bank ? pr.bank : "GEN");
      const [urgent, setUrgent] = useState(false);
      const [conv, setConv] = useState(true);
      const [vk, setVk] = useState("4.1");
      const [our, setOur] = useState(false);
      const [manual, setManual] = useState("");
      const A = parseNum(amount, 0);
      const isRub = cur === "RUB";
      const auto = isRub ? 1 : rates[cur];
      const R = isRub ? 1 : parseNum(manual, 0) > 0 ? parseNum(manual, 0) : (auto || 0);
      const rub0 = A * R;
      const lines = [];
      /* перевод */
      if (isRub) {
        const b = TC_RUB.find((x) => x.id === rbank) || TC_RUB[0];
        lines.push({ l: "Трансграничный перевод в рублях", s: pct2(b.pct) + ", мин. " + nf0.format(b.min) + " ₽" + (b.max ? ", макс. " + nf0.format(b.max) + " ₽" : "") + " · п. " + b.p, v: clamp(A * b.pct, b.min, b.max) });
        if (urgent) lines.push({ l: "Текущим днём через сервис срочного перевода ЦБ", s: "0,10%, мин. 350 ₽, макс. 3 500 ₽ · п. 2.1.2.9 · с акцептом банка", v: clamp(A * 0.001, 350, 3500) });
      } else if (cur === "CNY") {
        const b = TC_CNY.find((x) => x.id === bank) || TC_CNY[0];
        const fee = clamp(rub0 * b.pct, b.min, b.max);
        lines.push({ l: "Перевод в юанях", s: (urgent ? "срочный, " : "") + pct2(b.pct) + ", мин. " + nf0.format(b.min) + " ₽" + (b.max ? ", макс. " + nf0.format(b.max) + " ₽" : "") + " · п. " + (urgent ? "2.2.2.2." : "2.2.2.1.") + b.p, v: fee });
      } else {
        const f = TC_FX[cur] || TC_FX.OTHER;
        const other = !TC_FX[cur];
        let fee, s;
        if (urgent && f.urgC) { fee = f.urgC * R; s = f.urgC + " " + cur + " за перевод · п. " + f.pu; }
        else if (urgent && f.urgR) { fee = f.urgR; s = nf0.format(f.urgR) + " ₽ за перевод · п. " + f.pu; }
        else if (f.cur) { fee = clamp(A * f.pct, f.min, f.max) * R; s = pct2(f.pct) + ", мин. " + f.min + " " + cur + ", макс. " + f.max + " " + cur + " · п. " + f.p; }
        else { fee = clamp(rub0 * f.pct, f.min, f.max); s = (urgent ? "срочный, " : "") + pct2(f.pct) + ", мин. " + nf0.format(f.min) + " ₽" + (f.max ? ", макс. " + nf0.format(f.max) + " ₽" : "") + " · п. " + (urgent ? f.pu : f.p) + (other ? " (прочие валюты)" : ""); }
        lines.push({ l: urgent ? "Срочный перевод" : "Перевод", s: s, v: fee });
      }
      /* конвертация */
      if (conv && !isRub) {
        const c = tcConv(cur, A);
        if (c) lines.push({ l: "Конвертация по Alfa FX", s: pct2(c.pct) + " от суммы поручения · п. " + c.p, v: rub0 * c.pct });
        else lines.push({ l: "Конвертация", s: "этой валюты нет в п. 5.2–5.15: по курсу банка (п. 5.1) или по согласованию, без комиссии", v: 0, zero: true });
      }
      /* ФАВК */
      if (vk !== "none") {
        const fee = vk === "4.3" ? clamp(rub0 * 0.002, 1200, 60000) : Math.max(rub0 * 0.002, 1200);
        lines.push({ l: "ФАВК", s: "0,20%, мин. 1 200 ₽" + (vk === "4.3" ? ", макс. 60 000 ₽" : "") + " · п. " + vk + " · без НДС", v: fee });
      }
      if (our && cur === "USD") lines.push({ l: "Доставка полной суммы (OUR)", s: "п. 2.2.2.5", v: 1650 });
      const total = lines.reduce((a, x) => a + x.v, 0);
      const bankInfo = cur === "CNY" ? TC_CNY.find((x) => x.id === bank) : null;
      const dateStr = cbrDate ? new Date(cbrDate).toLocaleDateString("ru-RU") : "";
      const lab = "text-[13px] font-semibold ink mb-1.5";
      const tog = (on, set, text, sub) => (
        <button onClick={() => set(!on)} className="w-full flex items-start gap-2.5 rounded-lg px-3 py-2 text-left" style={on ? { background: "rgba(10,40,150,0.06)", border: "1px solid rgba(10,40,150,0.22)" } : { background: "#fbf8f4", border: "1px solid var(--line-2)" }} aria-pressed={on}>
          <span className="inline-flex items-center justify-center w-5 h-5 rounded shrink-0 mt-0.5" style={on ? { background: "var(--vtb)" } : { border: "1px solid var(--line)", background: "#fff" }}>{on && <IcCheck size={12} stroke="#fff" />}</span>
          <span className="min-w-0"><span className="block text-[13.5px] font-semibold ink">{text}</span>{sub && <span className="block text-[12px] ink-3 leading-snug">{sub}</span>}</span>
        </button>
      );
      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 items-start">
          <div className="rounded-2xl card pad space-y-3">
            <div className="grid grid-cols-2 gap-2">
              <label className="block col-span-2 sm:col-span-1"><div className={lab}>Валюта перевода</div>
                <select className="fld" value={cur} onChange={(e) => { setCur(e.target.value); setManual(""); }}>{TC_CUR.map((x) => <option key={x.c} value={x.c}>{x.c} — {x.n}</option>)}</select>
              </label>
              <label className="block col-span-2 sm:col-span-1"><div className={lab}>Сумма, {cur}</div>
                <input type="number" inputMode="decimal" min="0" className="fld num" value={amount} onChange={(e) => setAmount(e.target.value)} />
              </label>
            </div>
            {cur === "CNY" && (
              <label className="block"><div className={lab}>Банк получателя</div>
                <select className="fld" value={bank} onChange={(e) => setBank(e.target.value)}>{TC_CNY.map((x) => <option key={x.id} value={x.id}>{x.n} — {pct2(x.pct)}</option>)}</select>
              </label>
            )}
            {isRub && (
              <label className="block"><div className={lab}>Корсчёт банка получателя в РФ</div>
                <select className="fld" value={rbank} onChange={(e) => setRbank(e.target.value)}>{TC_RUB.map((x) => <option key={x.id} value={x.id}>{x.n} — {pct2(x.pct)}</option>)}</select>
                <div className="text-[12px] ink-3 mt-1">Счёт получателя 30111, 30303 или 30231 — корсчёт иностранного банка в российском банке.</div>
              </label>
            )}
            {!isRub && <label className="block"><div className={lab}>Курс для пересчёта, ₽ за 1 {cur}</div>
              <input type="number" inputMode="decimal" min="0" step="0.0001" className="fld num" value={manual} onChange={(e) => setManual(e.target.value)}
                placeholder={auto ? "ЦБ" + (dateStr ? " на " + dateStr : "") + ": " + nf4.format(auto) : (status === "loading" ? "загружаем курс ЦБ…" : "впишите курс")} />
              <div className="text-[12px] ink-3 mt-1">{manual ? "Свой курс. Очистите поле, чтобы вернуть курс ЦБ." : auto ? "Курс ЦБ" + (dateStr ? " на " + dateStr : "") + " — по нему банк пересчитывает комиссии." : "Курса ЦБ нет — впишите вручную."}</div>
            </label>}
            <div className="space-y-1.5">
              {isRub
                ? tog(urgent, setUrgent, "Текущим днём", "через сервис срочного перевода ЦБ: +0,10%, от 350 до 3 500 ₽")
                : tog(urgent, setUrgent, "Срочный перевод", "с признаком «срочный перевод», в отведённое окно")}
              {!isRub && tog(conv, setConv, "Покупаю валюту за рубли", "конвертация по курсу Alfa FX / Дилера с комиссией по сумме")}
              {cur === "USD" && tog(our, setOur, "Полная сумма получателю (OUR)", "без вычета комиссий банков-корреспондентов")}
            </div>
            <label className="block"><div className={lab}>Валютный контроль</div>
              <select className="fld" value={vk} onChange={(e) => setVk(e.target.value)}>
                <option value="4.1">Контракт на учёте — п. 4.1</option>
                <option value="4.3">Контракт без постановки на учёт — п. 4.3</option>
                <option value="none">Без ФАВК</option>
              </select>
            </label>
          </div>

          <div className="rounded-2xl card pad" style={{ borderColor: "rgba(10,40,150,0.28)" }}>
            <div className="flex flex-wrap items-center justify-between gap-2 mb-1">
              <div className="text-[15px] font-semibold ink">Комиссии банка по тарифу</div>
              <span className="text-[12px] px-2.5 py-1 rounded-full font-semibold" style={{ background: "rgba(10,40,150,0.08)", color: "var(--vtb)", border: "1px solid rgba(10,40,150,0.24)" }}>ПУ {PU_NAME}</span>
            </div>
            <Row label="Сумма перевода" sub={isRub ? "в рублях" : nf0.format(A) + " " + cur + (R ? " × " + nf4.format(R) + " ₽" : "")} value={rub(rub0)} />
            {lines.map((x, i) => <Row key={i} label={x.l} sub={x.s} value={rub(x.v)} zero={x.zero} color="var(--vtb)" />)}
            <div className="mt-3 rounded-xl px-4 py-3.5" style={{ background: "rgba(10,40,150,0.06)", border: "1px solid rgba(10,40,150,0.22)" }}>
              <div className="row">
                <div className="row-l">
                  <div className="text-[16px] font-semibold ink">Комиссии итого</div>
                  <div className="text-[12.5px] ink-3 mt-0.5">{rub0 > 0 ? pctStr(total / rub0 * 100, 2) + " от суммы" : "впишите сумму"}</div>
                </div>
                <div className="row-r">
                  <div className="num text-2xl font-bold" style={{ color: "var(--vtb)" }}>{rub(total)}</div>
                  <div className="text-[12.5px] ink-3 mt-0.5 num">с суммой ≈ {rub(rub0 + total)}</div>
                </div>
              </div>
            </div>
            <ul className="tf-notes mt-3">
              <li>Комиссии банков-корреспондентов и банка получателя сюда не входят — банк спишет их отдельно{bankInfo && bankInfo.noThird ? " (для этого банка — не берутся)" : ""}.</li>
              <li>ФАВК — без НДС, НДС начисляется сверху.</li>
              {!isRub && <li>Валюту банк продаёт по своему курсу (Alfa FX), а не по ЦБ, — итог с суммой ориентировочный.</li>}
              <li>Только тариф ПУ {PU_NAME}, редакция от {PU_EDITION}.</li>
            </ul>
          </div>
        </div>
      );
    }

    function TfMain({ go }) {
      return (
        <div className="space-y-3">
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-2">
            {TF_MAIN.map((x, i) => (
              <button key={i} onClick={() => go(x.cat)} className="tf-tile rounded-xl card px-3.5 py-3">
                <div className="text-[20px] font-bold num leading-tight" style={{ color: "var(--vtb)" }}>{x.k}</div>
                <div className="text-[14px] font-semibold ink mt-0.5 leading-snug">{x.t}</div>
                <div className="text-[12.5px] ink-3 mt-0.5 leading-snug">{x.s}</div>
              </button>
            ))}
          </div>
          <div className="text-[12.5px] ink-3">Нажмите на плитку — откроется раздел с полной таблицей и оговорками.</div>
        </div>
      );
    }

    function TariffPU() {
      const [cat, setCat] = useState("main");
      const [q, setQ] = useState("");
      const [preset, setPreset] = useState(null);
      const topRef = useRef(null), navRef = useRef(null);
      /* на телефоне разделы — лента с прокруткой: выбранный раздел держим в поле зрения */
      useEffect(() => {
        const nav = navRef.current;
        if (!nav || nav.scrollWidth <= nav.clientWidth) return;
        const b = nav.querySelector("button.on");
        if (!b) return;
        const x = b.getBoundingClientRect().left - nav.getBoundingClientRect().left + nav.scrollLeft;
        nav.scrollTo({ left: Math.max(0, x - nav.clientWidth / 2 + b.offsetWidth / 2), behavior: "smooth" });
      }, [cat, q]);
      useEffect(() => {
        const f = (e) => {
          const d = (e && e.detail) || {};
          setCat(TF_CATS.some((x) => x.id === d.cat) ? d.cat : "main"); setQ("");
          if (d.calc) setPreset(Object.assign({ n: Date.now() }, d.calc));
          setTimeout(() => goTo(null, "tariff"), 30);
        };
        window.addEventListener("tariff:open", f);
        return () => window.removeEventListener("tariff:open", f);
      }, []);
      const go = (c) => { setCat(c); setQ(""); try { if (topRef.current && topRef.current.getBoundingClientRect().top < 0) topRef.current.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) {} };
      const toks = tfTokens(q);
      const re = tfRe(toks);
      /* результаты поиска: строки таблиц и оговорки из всех разделов */
      const found = useMemo(() => {
        if (!toks.length) return null;
        const out = [];
        TF_CATS.forEach((c) => {
          const blocks = (TF_DATA[c.id] || []).map((b) => {
            const head = tfNorm(b.t + " " + (b.s || ""));
            const rows = (b.rows || []).filter((r) => tfHit(head + " " + tfRowText(r), toks));
            const notes = (b.notes || []).filter((n) => tfHit(tfNorm(n), toks));
            return rows.length || notes.length ? Object.assign({}, b, { rows: rows.length ? rows : null, notes: notes.length ? notes : null, foot: null }) : null;
          }).filter(Boolean);
          const notes = (TF_NOTES[c.id] || []).filter((n) => tfHit(tfNorm(n), toks));
          if (blocks.length || notes.length) out.push({ c: c, blocks: blocks, notes: notes });
        });
        return out;
      }, [q]);
      const C = TF_CATS.find((x) => x.id === cat) || TF_CATS[0];
      return (
        <section id="tariff" className="slide">
          <div className="wrap w-full" ref={topRef}>
            <Head badge={"ПУ " + PU_NAME} icon={IcLayers} tone="vtb"
              title="Условия тарифа по ВЭД"
              text={"Всё по международным расчётам из пакета услуг «Быстрое развитие» Альфа-Банка: переводы в валюте и рублях за рубеж, юани по банкам Китая, валютный контроль, конвертация, валютные счета, справки и время приёма. Редакция тарифа от " + PU_EDITION + "."} />

            <div className="rise rounded-xl tf-warn px-3.5 py-2.5 mb-3 flex items-start gap-2.5">
              <IcAlert size={16} className="shrink-0 mt-0.5" style={{ color: "var(--vtb)" }} />
              <div className="text-[13.5px] ink leading-relaxed"><b>Только для ПУ «Быстрое развитие».</b> У клиентов на других пакетах и стандартных тарифах ставки другие — по ним данных пока нет, добавим позже.</div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-3 items-start">
              <aside className="rise lg:col-span-3 lg:sticky lg:top-[64px]">
                <div className="rounded-2xl card p-2.5 sm:p-3">
                  <div className="relative mb-2">
                    <IcSearch size={16} className="absolute left-3 top-1/2 -translate-y-1/2 ink-3 pointer-events-none" />
                    <input value={q} onChange={(e) => setQ(e.target.value)} className="fld" placeholder="Поиск: юани, СПД, SWIFT, 4.1…" aria-label="Поиск по тарифу"
                      style={{ paddingLeft: "34px", paddingRight: q ? "36px" : undefined, height: "40px" }} autoComplete="off" spellCheck="false" />
                    {q && <button onClick={() => setQ("")} className="absolute right-1 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full flex items-center justify-center ink-3 hover:ink" aria-label="Очистить"><IcX size={14} /></button>}
                  </div>
                  <nav ref={navRef} className="tf-nav" aria-label="Разделы тарифа">
                    {TF_CATS.map((c) => (
                      <button key={c.id} onClick={() => go(c.id)} className={!q && cat === c.id ? "on" : ""} aria-current={!q && cat === c.id ? "true" : undefined}>
                        <c.Ic size={15} className="shrink-0" />{c.label}
                      </button>
                    ))}
                  </nav>
                </div>
              </aside>

              <div className="lg:col-span-9 min-w-0 space-y-4">
                {found ? (
                  found.length ? found.map((g) => (
                    <div key={g.c.id} className="space-y-3">
                      <div className="flex items-center justify-between gap-2">
                        <div className="flex items-center gap-2 text-[13px] font-semibold uppercase tracking-wider ink-3"><g.c.Ic size={15} />{g.c.label}</div>
                        <button onClick={() => go(g.c.id)} className="text-[12.5px] underline underline-offset-2 ink-2 hover:ink">открыть раздел</button>
                      </div>
                      {g.blocks.map((b, i) => <TfBlock key={i} b={b} re={re} />)}
                      {g.notes.length > 0 && <TfNotes notes={g.notes} re={re} />}
                    </div>
                  )) : (
                    <div className="rounded-2xl card pad text-center">
                      <div className="text-[16px] font-semibold ink mb-1">«{q.trim()}» в тарифе не нашлось</div>

    /* ================= ВЕРХНЯЯ ПАНЕЛЬ ПРИ ПРОКРУТКЕ И КНОПКА «НАВЕРХ» ================= */
    const SNAV = [
      { label: "Банки", banks: true },
      { label: "Быстрое развитие", to: "tariff" },
      { label: "Калькулятор", to: "calc" },

    ];
    function StickyNav() {
      const [show, setShow] = useState(false);
      const [active, setActive] = useState("");
      useEffect(() => {
        let raf = 0;
        const run = () => {
          raf = 0;
          const y = window.pageYOffset || document.documentElement.scrollTop || 0;
          setShow(y > 320);
          let cur = "";
          const lim = Math.min(window.innerHeight * 0.35, 260);
          SNAV.forEach((l) => {
            if (!l.to) return;
            const el = document.getElementById(l.to);
            if (el && el.getBoundingClientRect().top <= lim) {
              if (!cur || document.getElementById(cur).getBoundingClientRect().top < el.getBoundingClientRect().top) cur = l.to;
            }
          });
          setActive(cur);
        };
        const on = () => { if (!raf) raf = requestAnimationFrame(run); };
        window.addEventListener("scroll", on, { passive: true });
        window.addEventListener("resize", on);
        run();
        return () => { window.removeEventListener("scroll", on); window.removeEventListener("resize", on); if (raf) cancelAnimationFrame(raf); };
      }, []);
      const top = (e) => { if (e) e.preventDefault(); try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (_) { window.scrollTo(0, 0); } };
      return (
        <React.Fragment>
          <div className={"snav " + (show ? "on" : "")} aria-hidden={!show}>
            <div className="wrap snav-in">
              <a href="#top" onClick={top} className="flex items-center gap-1.5 shrink-0 pr-1" tabIndex={show ? 0 : -1}>
                <IcGlobe size={18} style={{ color: "var(--red)" }} /><span className="hidden sm:inline text-[15px] font-bold tracking-tight ink">ДЕМИН</span>

                ) : (
                  <a key={l.label} href={"#" + l.to} onClick={(e) => goTo(e, l.to)} className={active === l.to ? "on" : ""} tabIndex={show ? 0 : -1}>{l.label}</a>
                ))}
              </div>
              <span className="hidden xl:inline-flex shrink-0"><Clock compact /></span>
            </div>
          </div>
          <button onClick={top} className={"to-top btn-dark " + (show ? "on" : "")} aria-label="Наверх" tabIndex={show ? 0 : -1}>
            <IcDown size={18} stroke="#fdf6ec" style={{ transform: "rotate(180deg)" }} />
          </button>
        </React.Fragment>

    /* ---------- 1. ИМПОРТ ЧЕРЕЗ ФИНАНСОВОГО АГЕНТА ---------- */
    const IMPORT_WAS_PCT = [0.017, 0.017, 0.015, 0.012];

      const [customMode, setCustomMode] = useState(false);
      const [cr, setCr] = useState({ USD: String(FALLBACK.USD), EUR: String(FALLBACK.EUR), CNY: String(FALLBACK.CNY) });
      const [currency, setCurrency] = useState("USD");
      const [amount, setAmount] = useState("25000");
      useEffect(() => { if (status === "ok") setCr({ USD: rates.USD.toFixed(4), EUR: rates.EUR.toFixed(4), CNY: rates.CNY.toFixed(4) }); }, [status]);

      const eff = customMode ? { USD: parseNum(cr.USD, rates.USD), EUR: parseNum(cr.EUR, rates.EUR), CNY: parseNum(cr.CNY, rates.CNY) } : rates;
      const P = parseNum(amount, 0);
      const Prub = P * eff[currency];
      const Pusd = eff.USD > 0 ? Prub / eff.USD : 0;
      const tier = tierFor(Pusd);
      const tierIdx = IMPORT_TIERS.indexOf(tier);
      const mainComm = Prub * tier.pct + tier.fix * eff.USD;
      const wasComm  = Prub * IMPORT_WAS_PCT[tierIdx] + tier.fix * eff.USD;
      const valCtl = Math.max(Prub * VC_PCT, VC_MIN);
      const finAg  = faFee(Prub);
      const totalComm = mainComm + valCtl + finAg;
      const total = Prub + totalComm;
      const totalWas = Prub + wasComm + valCtl + finAg;
      const saved = totalWas - total;

              </label>

                <div className="space-y-2 mt-3">

                      <div className="text-[13px] ink-3 w-[112px] shrink-0">{c.full}, ₽</div>
                      <input type="number" inputMode="decimal" step="0.0001" value={cr[c.code]} onChange={(e) => setCrField(c.code, e.target.value)} className="fld num flex-1 min-w-0" />

    /* карточка маршрута: шапка, строки, итог */
