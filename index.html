      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 6px 18px -14px rgba(70,50,34,0.26);

      border: 1px solid var(--line); color: var(--ink-2);

    .win-gold { border-color: #b3862f; box-shadow: 0 0 0 3px rgba(179,134,47,0.16), 0 12px 28px -20px rgba(70,50,34,0.5); }

    .fu { animation: fadeUp .55s cubic-bezier(.2,.75,.2,1) both; }
    .rise { opacity: 0; transform: translateY(16px); transition: opacity .55s ease-out, transform .6s cubic-bezier(.2,.75,.2,1); }
    .rise.in { opacity: 1; transform: none; }
    @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .pulse { animation: pulseDot 1.8s ease-in-out infinite; }

    a, button { -webkit-tap-highlight-color: rgba(0,0,0,0.06); }
    ::selection { background: rgba(194,53,43,0.16); }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .fu, .pulse { animation: none; }
      .rise { opacity: 1; transform: none; transition: none; }
    }
  </style>
</head>

    /* ====== ССЫЛКИ: работают и внутри iframe (Google Sites и т.п.) ====== */
    function goTo(e, id) {
      if (e && e.preventDefault) e.preventDefault();
      const el = document.getElementById(id);
      if (!el) return;
      try { el.scrollIntoView({ behavior: "smooth", block: "start" }); }
      catch (_) { try { el.scrollIntoView(); } catch (__) {} }
    }
    function openUrl(e, url) {
      if (e && e.preventDefault) e.preventDefault();
      if (!url) return;
      if (url.indexOf("tel:") === 0 || url.indexOf("mailto:") === 0) {
        try { window.location.href = url; return; } catch (_) {}
        try { if (window.top !== window.self) window.top.location.href = url; } catch (_) {}
        return;
      }
      let w = null;
      try { w = window.open(url, "_blank", "noopener,noreferrer"); } catch (_) {}
      if (w) { try { w.opener = null; } catch (_) {} return; }
      try { if (window.top !== window.self) { window.top.location.href = url; return; } } catch (_) {}
      try { window.location.href = url; } catch (_) {}
    }

    const DANDONG_PCT = 0.008, DANDONG_MIN = 3000;      // Bank of Dandong: перевод 0,8%, мин. 3 000 ₽

    /* прямой платёж в Bank of Dandong: юань по нашему курсу, перевод 0,8%, всё вместе не более 1,8% */
    function dandongCalc(n, Rmoex) {
      const base = n * Rmoex;
      const mk = n * FX_MARKUP;
      const tr = Math.max(base * DANDONG_PCT, DANDONG_MIN);
      const rest = Math.max(0, base * DANDONG_CAP - mk - tr);
      const comm = mk + tr + rest;
      return { base, mk, tr, rest, comm, total: base + comm, pct: base > 0 ? (comm / base) * 100 : 0 };
    }

    function pickRow(block, names) {
      if (!block || !block.data || !block.data[0]) return null;
      const cols = block.columns, row = block.data[0];
      for (let i = 0; i < names.length; i++) {
        const idx = cols.indexOf(names[i]);

    function useMoexCny() {
      const [state, setState] = useState({ price: null, time: null, kind: null, status: "loading", at: null });
      const [tick, setTick] = useState(0);
      /* автообновление раз в минуту, вручную — кнопкой */

        const id = setInterval(() => setTick((t) => t + 1), 60000);

        setState((s) => Object.assign({}, s, { status: "loading" }));

        const getJson = (u) => fetch(u + bust, { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error("http"); return r.json(); });
        const run = (attempt) => {
          Promise.all([getJson(MOEX_MD).catch(() => null), getJson(MOEX_SEC).catch(() => null)])
            .then(([md, sec]) => {
              if (!alive) return;
              const live = md ? pickRow(md.marketdata, ["LAST", "MARKETPRICE", "WAPRICE"]) : null;
              if (live) {
                const kinds = { LAST: "последняя сделка", MARKETPRICE: "рыночная цена", WAPRICE: "средневзвешенная" };
                setState({ price: live.value, time: md ? getCol(md.marketdata, "UPDATETIME") : null, kind: kinds[live.name], status: "ok", at: Date.now() });
                return;

              if (attempt < 2) { setTimeout(() => run(attempt + 1), 1200); return; }
              setState((s) => Object.assign({}, s, { status: "error" }));
            })
            .catch(() => { if (!alive) return; if (attempt < 2) setTimeout(() => run(attempt + 1), 1200); else setState((s) => Object.assign({}, s, { status: "error" })); });

        run(1);

        const ta = document.createElement("textarea");
        ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0";
        ta.style.width = "1px"; ta.style.height = "1px"; ta.style.opacity = "0";

    }

    /* ====== мобильная компактность: тяжёлые блоки сворачиваются ====== */
    const NARROW_Q = "(max-width: 1023px)";
    function useIsNarrow() {
      const [n, setN] = useState(() => { try { return window.matchMedia(NARROW_Q).matches; } catch (e) { return false; } });
      useEffect(() => {
        let mq;
        try { mq = window.matchMedia(NARROW_Q); } catch (e) { return; }
        const f = () => setN(mq.matches);
        f();
        if (mq.addEventListener) mq.addEventListener("change", f);
        else if (mq.addListener) mq.addListener(f);
        const onResize = () => setN(window.innerWidth < 1024);
        window.addEventListener("resize", onResize);
        return () => {
          if (mq.removeEventListener) mq.removeEventListener("change", f);
          else if (mq.removeListener) mq.removeListener(f);
          window.removeEventListener("resize", onResize);
        };
      }, []);
      return n;
    }

    function Gate({ children }) {
      const [ok, setOk] = useState(false);

      const submit = (e) => {

    /* ================= ВРЕМЯ: местное и московское ================= */
    const MSK_TZ = "Europe/Moscow";
    const WORK_FROM = 9, WORK_TO = 18;   // финагенты работают с 9:00 до 18:00 МСК
    function mskParts(d) {
      try {
        const s = new Intl.DateTimeFormat("ru-RU", { timeZone: MSK_TZ, hour: "2-digit", minute: "2-digit", hour12: false }).format(d);
        const p = s.split(":");
        return { text: s, h: parseInt(p[0], 10), m: parseInt(p[1], 10) };
      } catch (e) {
        const u = d.getTime() + d.getTimezoneOffset() * 60000 + 3 * 3600000;
        const x = new Date(u);
        const hh = String(x.getHours()).padStart(2, "0"), mm = String(x.getMinutes()).padStart(2, "0");
        return { text: hh + ":" + mm, h: x.getHours(), m: x.getMinutes() };

    function useClock() {
      const [now, setNow] = useState(() => new Date());
      useEffect(() => {
        const id = setInterval(() => setNow(new Date()), 15000);
        return () => clearInterval(id);
      }, []);
      const msk = mskParts(now);
      let local = "";
      try { local = new Intl.DateTimeFormat("ru-RU", { hour: "2-digit", minute: "2-digit", hour12: false }).format(now); }

      let tzName = "";
      try { tzName = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
      const sameAsMsk = local === msk.text;
      const open = msk.h >= WORK_FROM && msk.h < WORK_TO;
      const mins = msk.h * 60 + msk.m;
      let left = "";
      if (open) {
        const d = WORK_TO * 60 - mins;
        left = d >= 60 ? "ещё " + Math.floor(d / 60) + " ч " + (d % 60) + " мин" : "ещё " + d + " мин";
      } else {
        const d = mins < WORK_FROM * 60 ? WORK_FROM * 60 - mins : (24 * 60 - mins) + WORK_FROM * 60;
        left = d >= 60 ? "через " + Math.floor(d / 60) + " ч " + (d % 60) + " мин" : "через " + d + " мин";
      }
      return { local, msk: msk.text, tzName, sameAsMsk, open, left };
    }

    }

    /* ---------- 1. ИМПОРТ ЧЕРЕЗ ФИНАНСОВОГО АГЕНТА ---------- */
    const IMPORT_WAS_PCT = [0.017, 0.017, 0.015, 0.012];

    function ImportPanel() {
      const { rates, cbrDate, status } = useCbr();
      const [customMode, setCustomMode] = useState(false);
      const [cr, setCr] = useState({ USD: String(FALLBACK.USD), EUR: String(FALLBACK.EUR), CNY: String(FALLBACK.CNY) });
      const [currency, setCurrency] = useState("USD");
      const [amount, setAmount] = useState("25000");
      useEffect(() => { if (status === "ok") setCr({ USD: rates.USD.toFixed(4), EUR: rates.EUR.toFixed(4), CNY: rates.CNY.toFixed(4) }); }, [status]);

      const eff = customMode ? { USD: parseNum(cr.USD, rates.USD), EUR: parseNum(cr.EUR, rates.EUR), CNY: parseNum(cr.CNY, rates.CNY) } : rates;
      const P = parseNum(amount, 0);
      const Prub = P * eff[currency];
      const Pusd = eff.USD > 0 ? Prub / eff.USD : 0;
      const tier = tierFor(Pusd);
      const tierIdx = IMPORT_TIERS.indexOf(tier);
      const mainComm = Prub * tier.pct + tier.fix * eff.USD;
      const wasComm  = Prub * IMPORT_WAS_PCT[tierIdx] + tier.fix * eff.USD;
      const valCtl = Math.max(Prub * VC_PCT, VC_MIN);
      const finAg  = Math.max(Prub * FA_PCT, FA_MIN);
      const totalComm = mainComm + valCtl + finAg;
      const total = Prub + totalComm;
      const totalWas = Prub + wasComm + valCtl + finAg;
      const saved = totalWas - total;
      const overall = Prub > 0 ? (totalComm / Prub) * 100 : 0;
      const dateStr = cbrDate ? new Date(cbrDate).toLocaleDateString("ru-RU") : "";
      const setCrField = (k, v) => setCr((o) => Object.assign({}, o, { [k]: v }));
      const symbol = CURRENCIES.find((c) => c.code === currency).sym;
      const srcName = customMode ? "Investing или свой курс" : "ЦБ" + (dateStr ? " на " + dateStr : "");

      const kp = [
        "Иван Иванович, добрый день!",
        "",
        "Платёж " + cur(P) + " " + currency + " обойдётся в " + rub(total) + ", это " + pctStr(overall, 1) + " сверх суммы.",
        "",
        "РАСЧЁТ",
        "Сумма: " + cur(P) + " " + currency + " по курсу " + srcName + " " + rate(eff[currency]) + " = " + rub(Prub),
        "Комиссия агента " + tier.now + ": " + rub(mainComm),
        "Валютный контроль 0,2% (мин. 1 200 ₽): " + rub(valCtl),
        "Перевод агенту 0,15% (мин. 1 000 ₽): " + rub(finAg),

        "К ОПЛАТЕ: " + rub(total) + " ($" + cur(total / eff.USD) + " / ¥" + cur(total / eff.CNY) + " / €" + cur(total / eff.EUR) + ")",
        "",
        "ТАРИФ ПО СУММЕ, до " + PROMO_UNTIL,
      ].concat(IMPORT_TIERS.map((t) => t.range + " — " + t.now + " (было " + t.was + ")"))

        "По прежней ставке " + tier.was + " платёж стоил бы " + rub(totalWas) + ", разница " + rub(saved) + ".",

        "Платёж идёт через финансового агента-нерезидента, ваш банк в цепочке не участвует. Конвертация по ЦБ или по Investing, на ваш выбор. Валютный контроль и проверка контракта включены.",

                  ))}

            <div className="mt-3">
              <Ext href={INVESTING} className="inline-flex items-center gap-1.5 text-[13px] underline underline-offset-4" style={{ color: "var(--red)" }}>курс на investing.com<IcExt size={14} /></Ext>

            <div className="mt-3 rounded-xl px-4 py-3.5" style={{ background: "rgba(194,53,43,0.07)", border: "1px solid rgba(194,53,43,0.26)" }}>
              <div className="row">
                <div className="row-l text-[16px] font-semibold ink">ИТОГО к оплате</div>
                <div className="row-r">
                  <div className="num text-2xl font-bold" style={{ color: "var(--red)" }}>{rub(total)}</div>
                  <div className="text-[12.5px] ink-3 mt-0.5 num">${cur(total / eff.USD)} · ¥{cur(total / eff.CNY)} · €{cur(total / eff.EUR)}</div>

            </div>
            <div className="mt-3 rounded-xl card-soft px-4 py-3">

                  <div className="text-[13.5px] font-semibold ink">Экономия по акции</div>

            <div className="mt-auto pt-3 text-[13px] ink-3 leading-relaxed flex gap-2">
              <IcInfo size={14} className="shrink-0 mt-0.5" />
              <span>Цифры ориентировочные. <Ext href={TG} className="underline underline-offset-2" style={{ color: "var(--red)" }}>Напишите, посчитаю точно под вашу сделку</Ext>.</span>
            </div>
          </div>

          <KpBlock text={kp} note={"Ставки зафиксированы до " + PROMO_UNTIL + "."} />
        </div>
      );
    }

    /* ---------- 2. ЭКСПОРТ ЧЕРЕЗ ФИНАНСОВОГО АГЕНТА ---------- */
    const ACCEPT = ["USD", "EUR", "CNY", "AED", "TRY", "KZT", "HKD", "INR", "GBP", "JPY"];
    const EXPORT_ADV = [
      { Ic: IcSwap,  t: "Платит удобной валютой", d: "Покупатель платит тем, что ликвидно у него: юанем, долларом, дирхамом. Искать редкую валюту не нужно." },
      { Ic: IcBank,  t: "Курс ЦБ, без спреда",    d: "Агент конвертирует по курсу ЦБ на момент перевода и зачисляет рубли на ваш расчётный счёт в РФ." },
      { Ic: IcTrend, t: "Одна ставка на все суммы", d: "0,2% и на разовую отгрузку, и на годовой контракт. Комиссия не растёт вместе с оборотом." },

    function ExportPanel() {

      const eff = rates;
      const P = parseNum(amount, 0);
      const gross = P * eff[currency];
      const Pusd = eff.USD > 0 ? gross / eff.USD : 0;
      const comm = gross * EXPORT_PCT;
      const commWas = gross * 0.005;
      const net = gross - comm;
      const netWas = gross - commWas;
      const saved = net - netWas;
      const dateStr = cbrDate ? new Date(cbrDate).toLocaleDateString("ru-RU") : "";
      const symbol = CURRENCIES.find((c) => c.code === currency).sym;

      const kp = [
        "Иван Иванович, добрый день!",
        "",
        "С платежа " + cur(P) + " " + currency + " вы получите " + rub(net) + " на расчётный счёт. Удержим 0,2%, конвертация по курсу ЦБ без спреда.",
        "",
        "РАСЧЁТ",
        "Платёж от покупателя: " + cur(P) + " " + currency + " по курсу ЦБ" + (dateStr ? " на " + dateStr : "") + " " + rate(eff[currency]) + " = " + rub(gross),
        "Комиссия агента 0,2% (было 0,5%): " + rub(comm),
        "К ЗАЧИСЛЕНИЮ: " + rub(net) + " ($" + cur(net / eff.USD) + " / ¥" + cur(net / eff.CNY) + " / €" + cur(net / eff.EUR) + ")",
        "По прежней ставке пришло бы " + rub(netWas) + ", разница " + rub(saved) + ". Ставка 0,2% действует до " + PROMO_UNTIL + " на любые суммы.",
        "",
        "Покупатель платит удобной ему валютой: USD, EUR, CNY, AED, TRY, KZT, HKD, INR, GBP, JPY и другие. Агент принимает платёж, конвертирует по курсу ЦБ и зачисляет рубли на ваш счёт в РФ. Валютный контроль на нас.",
        "Так снимается двойная конвертация, на которой теряется до 17% контракта.",
        "Расчёт ориентировочный, финальные цифры фиксируем перед сделкой.",
        "",
      ].concat(SIGN).join("\n");

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3">

          <Fold icon={IcInflow} title="Что это даёт" sub="и в каких валютах принимаем">
            <div className="space-y-2.5">
              {EXPORT_ADV.map((a, i) => (
                <div key={i} className="rounded-xl card-soft p-3.5">
                  <div className="flex items-center gap-2 mb-1">
                    <a.Ic size={17} className="shrink-0" style={{ color: GREEN }} />
                    <div className="text-[15px] font-semibold ink leading-tight">{a.t}</div>
                  </div>
                  <div className="text-[13px] ink-2 leading-relaxed">{a.d}</div>
                </div>
              ))}
            </div>
            <div className="mt-3 rounded-xl px-4 py-3" style={{ background: "rgba(28,122,77,0.08)", border: "1px solid rgba(28,122,77,0.26)" }}>
              <div className="flex items-center gap-2 mb-1"><IcTrend size={18} style={{ color: GREEN }} /><span className="text-2xl font-bold num" style={{ color: GREEN }}>до 17%</span></div>
              <div className="text-[13px] ink-2 leading-relaxed">теряется на неликвидной валюте и двойной конвертации. У нас потери падают <span className="ink font-semibold">до долей процента</span>.</div>
            </div>

              <div className="text-[13px] ink-3 mb-2">Принимаем валюты</div>
              <div className="flex flex-wrap gap-1.5">

          <div className="rounded-2xl card pad h-full flex flex-col">

            <div className="text-[14px] font-semibold ink mt-4 mb-2">Валюта покупателя</div>

              <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xl ink-3">{symbol}</span>

    /* ---------- ОБЩЕЕ ДЛЯ СРАВНЕНИЙ ---------- */
    function Col({ children }) { return (<div className="flex flex-col gap-3">{children}</div>); }
    const GRID4 = "grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3 items-start";
    function ModeSwitch({ byCny, setMode }) {
      return (
        <div className="grid grid-cols-2 gap-2">
          <button onClick={() => setMode("cny")} className={"rounded-xl py-2 text-[13.5px] font-medium transition-all " + (byCny ? "btn-dark" : "btn-ghost")}>Сумму в ¥</button>

    /* курс биржи + ползунок наценки ВТБ — один блок на все сравнения */

                <div className="text-[12.5px] font-semibold" style={{ color: "var(--red-ink)" }}>Мосбиржа · CNYRUB_TOM</div>

    /* ---------- ПОКУПКА ЮАНЯ: У НАС ИЛИ В ВТБ ---------- */
    function routes(R, mV, byCny, nWanted, budget) {
      const rateA = R + mV;
      const rateB = (R + ALFA_MARKUP) * (1 + ALFA_CONV) / (1 - ALFA_TRANSFER);
      let nA, nB, rubA, rubB;
      if (byCny) { nA = nB = nWanted; rubA = nA * rateA; rubB = nB * rateB; }
      else { rubA = rubB = budget; nA = rateA > 0 ? budget / rateA : 0; nB = rateB > 0 ? budget / rateB : 0; }
      const aWins = rateA < rateB;
      const diffRub = Math.abs(rubA - rubB), diffCny = Math.abs(nA - nB);
      const saveRub = byCny ? diffRub : diffCny * R;
      const saveCny = byCny ? (R > 0 ? diffRub / R : 0) : diffCny;
      const savePct = byCny ? (Math.max(rubA, rubB) > 0 ? (diffRub / Math.max(rubA, rubB)) * 100 : 0)
                            : (Math.max(nA, nB) > 0 ? (diffCny / Math.max(nA, nB)) * 100 : 0);
      return { rateA, rateB, nA, nB, rubA, rubB, aWins, saveRub, saveCny, savePct };
    }

                    </div>

              </div>
            </Fold>
          </Col>

          <Col>

            <Verdict color={winColor} title={dWins ? (byCny ? "Прямой платёж дешевле" : "Прямым доходит больше") : "На этой сумме дешевле ВТБ"}
              stats={[
                { k: byCny ? "Разница, ₽" : "Юаней больше", v: byCny ? rub(diffRub) : cny(diffCny) },
                { k: byCny ? "Это, ¥" : "В деньгах", v: byCny ? cny(diffCny) : rub(diffRub) },
                { k: "В процентах", v: pctStr(savePct) },
              ]}
              lines={[
                "Юань обходится: Dandong " + rate4(perDand) + ", ВТБ " + rate4(perVtb) + ". Разница почти вся сидит в курсе: у нас копейка к бирже, у ВТБ " + Math.round(vtbMarkup * 100) + ".",
                "Всё вместе у нас " + pctStr(D.pct) + " и не больше 1,8%. И это без " + CN_VTB + ", которые ВТБ Шанхай снимает с китайской стороны — у нас там ноль.",
              ]} />
            <KpBlock text={kp} />
          </Col>
        </div>
      );
    }

    /* ================= КОНСТРУКТОР КП ================= */
    const NA = "— не указано —";
    const O_TASK = [NA, "Импорт из Китая", "Экспорт в Китай", "Импорт из другой страны", "Экспорт в другую страну", "Импорт и экспорт", "Покупка юаня"];

    function Field({ label, children }) {
      return (<label className="block"><div className="text-[12.5px] font-semibold ink mb-1">{label}</div>{children}</label>);
    }
    function Sel({ value, onChange, options }) {
      return (<select className="fld" value={value} onChange={(e) => onChange(e.target.value)}>{options.map((o) => <option key={o} value={o}>{o}</option>)}</select>);
    }
    const isSet = (v) => v && v !== NA;

    /* ---- сборка текста ---- */
    function buildKp(f, c) {
      const S = parseNum(f.amount, 1000000);
      const has = S > 0;
      const L = [];
      const add = (s) => L.push(s);
      const gap = () => { if (L.length && L[L.length - 1] !== "") L.push(""); };
      /* строка «а на вашей сумме это столько» */
      const ex = (comm, pct) => { if (has) add("Например, на " + rub(S) + " это " + rub(comm) + " — " + pctStr(pct, 2) + " за всё."); };

      const who = (f.client || "").trim();
      const co = (f.company || "").trim();
      const on = f.blocks;

      add(who ? who + ", добрый день!" : "Добрый день!");
      gap();
      add(co ? "Подготовил предложение по международным расчётам для " + co + "." : "Подготовил предложение по международным расчётам.");
      if (isSet(f.task)) add("Задача: " + f.task.toLowerCase() + ".");

      if (on.china) {
        gap();
        add("ПЛАТЕЖИ В КИТАЙ");
        gap();
        add("Клиринг через финансового агента");
        add("Клиринг — совместный проект Центробанков России и Китая, мы аккредитованы по нему работать. Платёж идёт межбанковским каналом, без цепочки посредников, отсюда и цена.");
        add("Рубли уходят от нас, поставщику платит банк материкового Китая — для него это внутренний платёж, а не перевод из России.");
        add("Курс — ЦБ на день перевода, наценки в курсе нет.");
        add("Комиссия 0,5%, минимум 20 000 ₽. Это и есть вся стоимость: ни за платёж, ни за валютный контроль отдельно не берём.");
        if (has && c.clearMin) add("Например, на " + rub(S) + " это " + rub(c.clearComm) + ": здесь ещё работает минимум. Сама ставка 0,5% включается от " + rub(CLEARING_MIN / CLEARING_PCT) + ", и дальше комиссия почти не растёт вместе с суммой.");
        else ex(c.clearComm, c.clearPct);
        add("Получатель в Китае платит финагенту " + CN_CLEARING + ", тогда как в ВТБ Шанхай с него удержали бы " + CN_VTB + ". Ему тоже выгоднее.");
        add("Требования: китайская компания без иностранного участия — ни среди учредителей и юрлиц-участников, ни в лице генерального директора. Банк получателя — материковый Китай, кроме банков с американским участием.");
        add("География: " + PROVINCES.join(", ") + ", а также " + CITIES.join(" и ") + ".");
        gap();
        add("Bank of Dandong, прямой платёж");
        add("Юань уходит напрямую в банк получателя, без посредников в цепочке. В этом и смысл маршрута.");
        add("Конвертация по нашему курсу AlfaFX — биржевой плюс одна копейка на юань. Не по банковскому курсу с наценкой в четверть рубля.");
        add("Перевод 0,8%, минимум 3 000 ₽ — в начале года было 1,2%.");
        add("Валютный контроль, конвертация и перевод вместе не превышают 1,8%. Выше этой цифры не выйдет ни при каком раскладе.");
        ex(c.dandComm, c.dandPct);
        add("С получателя в Китае комиссия " + CN_DANDONG + ", по редким санкционным позициям 0,2%.");
      }

      if (on.vtb) {
        gap();
        add("ПЛАТЕЖИ НА ВТБ ШАНХАЙ");
        add("Для сравнения: сам банк удерживает 1,99% за платёж и 0,2% за валютный контроль, вместе 2,19%. Плюс " + CN_VTB + " с китайской стороны — это теряет ваш поставщик и закладывает в цену.");
        add("Юань под такой платёж: в ВТБ комиссий нет, но в курсе сидит наценка 14–25 копеек на юань, и в тарифах её не показывают.");
        add("У нас курс AlfaFX — биржа плюс копейка, конвертация 0,6%, перевод в ВТБ 0,3%. По эффективному курсу почти всегда выходит дешевле.");
        if (has) add("Например, на " + rub(S) + " один только ВТБ Шанхай возьмёт " + rub(c.vtbFee) + " — и это без наценки в курсе.");
        add("Если получатель проходит по клирингу, тот же платёж дешевле провести по курсу ЦБ, а деньги всё равно придут на счёт в ВТБ Шанхай.");
      }

      if (on.world) {
        gap();
        add("ПЛАТЕЖИ В ДРУГИЕ СТРАНЫ");
        gap();
        add("Импорт через финансового агента-нерезидента");
        add("Платёж уходит от лица агента, ваш банк в цепочке не участвует. Конвертация по курсу ЦБ или по Investing, на ваш выбор.");
        add("Ставка агента: до $50 000 — 1,4%, от $50 000 до $100 000 — 1,0%, свыше $100 000 — 0,8%. На платежи до $10 000 плюс фиксированные $100. Год назад те же ставки были 2,2%, 1,9% и 1,5%.");
        add("Сверху валютный контроль 0,2%, минимум 1 200 ₽, и перевод агенту 0,15%, минимум 1 000 ₽. Всё вместе на крупных суммах не превышает 1,15%.");
        ex(c.impComm, c.impPct);
        gap();
        add("Приём экспортной выручки");
        add("Покупатель платит удобной ему валютой: доллар, евро, юань, дирхам, лира, тенге, гонконгский доллар, рупия. Конвертируем по курсу ЦБ и зачисляем рубли на ваш счёт в России.");
        add("Комиссия 0,2% на любые суммы, было 0,5%. Больше ничего не удерживаем.");
        if (has) add("Например, с " + rub(S) + " удержим " + rub(c.expComm) + ", на счёт придёт " + rub(c.expNet) + ".");
        add("Страны: Китай и Гонконг, Турция, ОАЭ, Индия, Казахстан и ЕАЭС, Юго-Восточная Азия, Европа, Латинская Америка.");
      }

      gap();
      add("Тарифы действуют до " + PROMO_UNTIL + ". Курс меняется каждый день, поэтому суммы в примерах ориентировочные.");
      add("Работаем с 9:00 до 18:00 по Москве. Пришлите контракт или инвойс — посчитаю точно под вашу сделку и скажу, каким маршрутом её вести.");
      gap();
      add((f.manager || "Евгений Демин").trim());
      add("Международные расчёты");
      return L.join("\n");
    }

    const KP_DEFAULT = {
      client: "", company: "", manager: "Евгений Демин",
      task: NA,
      blocks: { china: true, vtb: true, world: true },
      amount: "1000000",
    };
    const PRESETS = [
      { id: "all",   label: "Общее КП",      hint: "всё, что умеем",     blocks: { china: true,  vtb: true,  world: true  } },
      { id: "china", label: "Китай",         hint: "клиринг и Dandong",  blocks: { china: true,  vtb: false, world: false } },
      { id: "vtb",   label: "ВТБ Шанхай",    hint: "юань и комиссии",    blocks: { china: false, vtb: true,  world: false } },
      { id: "world", label: "Другие страны", hint: "мир и экспорт",      blocks: { china: false, vtb: false, world: true  } },
    ];
    const BLOCK_LIST = [
      { key: "china", label: "Платежи в Китай", sub: "клиринг, Bank of Dandong" },
      { key: "vtb",   label: "ВТБ Шанхай",      sub: "покупка юаня и комиссии банка" },
      { key: "world", label: "Другие страны",   sub: "импорт по миру и приём выручки" },
    ];

    function KpBuilder() {
      const [f, setF] = useState(KP_DEFAULT);
      const { rates: cbr, cbrDate, status: cbrStatus } = useCbr();
      const moex = useMoexCny();
      const set = (k) => (v) => setF((o) => Object.assign({}, o, { [k]: v }));
      const toggleBlock = (k) => setF((o) => Object.assign({}, o, { blocks: Object.assign({}, o.blocks, { [k]: !o.blocks[k] }) }));
      const applyPreset = (b) => setF((o) => Object.assign({}, o, { blocks: Object.assign({}, b) }));
      const activePreset = PRESETS.find((p) => p.blocks.china === f.blocks.china && p.blocks.vtb === f.blocks.vtb && p.blocks.world === f.blocks.world);

      /* стоимость по каждому маршруту на введённую сумму */
      const S = parseNum(f.amount, 0);
      const Rcb = cbr.CNY;
      const Rmoex = moex.status === "ok" && moex.price ? moex.price : cbr.CNY;
      const nAt = Rmoex > 0 ? S / Rmoex : 0;
      const clearComm = Math.max(S * CLEARING_PCT, CLEARING_MIN);
      const D = dandongCalc(nAt, Rmoex);
      const vtbFee = S * (SH_PAY + SH_VC);
      const usd = cbr.USD > 0 ? S / cbr.USD : 0;
      const tier = tierFor(usd);
      const impComm = S * tier.pct + tier.fix * cbr.USD + Math.max(S * VC_PCT, VC_MIN) + Math.max(S * FA_PCT, FA_MIN);
      const expComm = S * EXPORT_PCT;
      const c = {
        clearComm, clearPct: S > 0 ? clearComm / S * 100 : 0, clearMin: S * CLEARING_PCT < CLEARING_MIN,
        dandComm: D.comm, dandPct: D.pct,
        vtbFee,
        impComm, impPct: S > 0 ? impComm / S * 100 : 0,
        expComm, expNet: S - expComm, tier,
      };
      const text = buildKp(f, c);
      const noBlocks = !f.blocks.china && !f.blocks.vtb && !f.blocks.world;

      return (
        <section id="kp" className="slide">
          <div className="wrap w-full">
            <Head badge="Конструктор КП" icon={IcEdit} tone="gold"
              title="Соберите коммерческое предложение"
              text="По умолчанию собирается общее КП: Китай, ВТБ Шанхай и остальные страны. Впишите сумму сделки — в текст добавятся примеры вида «на такую сумму комиссия не превысит столько-то за всё»." />

            <div className="grid grid-cols-1 xl:grid-cols-12 gap-3">
              <div className="rise xl:col-span-4">
                <div className="rounded-2xl card pad h-full">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-2.5">
                    <div className="text-[14px] font-semibold ink">Что войдёт в письмо</div>
                    <button onClick={() => setF(KP_DEFAULT)} className="inline-flex items-center gap-1 text-[12.5px] ink-2 hover:ink"><IcRefresh size={13} />сбросить</button>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5 mb-2.5">
                    {PRESETS.map((p) => {
                      const on = activePreset && activePreset.id === p.id;
                      return (
                        <button key={p.id} onClick={() => applyPreset(p.blocks)} className={"rounded-lg px-2.5 py-2 text-left transition-all " + (on ? "btn-red" : "btn-ghost")}>
                          <div className="text-[12.5px] font-semibold leading-tight">{p.label}</div>
                          <div className={"text-[11px] leading-snug mt-0.5 " + (on ? "opacity-85" : "ink-3")}>{p.hint}</div>
                        </button>
                      );
                    })}
                  </div>

                  <div className="space-y-1.5 mb-3">
                    {BLOCK_LIST.map((b) => {
                      const on = f.blocks[b.key];
                      return (
                        <button key={b.key} onClick={() => toggleBlock(b.key)} className="w-full rounded-lg px-3 py-2 text-left transition-all"
                          style={on ? { background: "rgba(194,53,43,0.07)", border: "1px solid rgba(194,53,43,0.30)" } : { background: "#fbf8f4", border: "1px solid var(--line-2)" }}>
                          <div className="row">
                            <div className="row-l">
                              <div className={"text-[13px] font-semibold " + (on ? "ink" : "ink-3")}>{b.label}</div>
                              <div className="text-[11.5px] ink-3">{b.sub}</div>
                            </div>
                            <div className="row-r">
                              <span className="inline-flex items-center justify-center w-5 h-5 rounded" style={on ? { background: "var(--red)" } : { border: "1px solid var(--line)", background: "#fff" }}>
                                {on && <IcCheck size={12} stroke="#fff" />}
                              </span>
                            </div>
                          </div>
                        </button>
                      );
                    })}
                    {noBlocks && <div className="text-[12px] rounded-lg px-2.5 py-1.5" style={{ background: "rgba(194,53,43,0.08)", color: "var(--red-ink)" }}>Отметьте хотя бы один блок.</div>}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <Field label="Имя клиента"><input className="fld" value={f.client} onChange={(e) => set("client")(e.target.value)} placeholder="Иван Иванович" /></Field>
                    <Field label="Компания"><input className="fld" value={f.company} onChange={(e) => set("company")(e.target.value)} placeholder="ООО «Ромашка»" /></Field>
                    <Field label="Задача"><Sel value={f.task} onChange={set("task")} options={O_TASK} /></Field>
                    <Field label="Сумма сделки для примера">
                      <div className="relative">
                        <input type="number" inputMode="decimal" min="0" value={f.amount} onChange={(e) => set("amount")(e.target.value)} className="fld num" style={{ paddingRight: "28px" }} />
                        <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[14px] ink-3">₽</span>
                      </div>
                    </Field>
                  </div>

                  {S > 0 && (
                    <div className="mt-2.5 rounded-lg sunken p-2.5">
                      <div className="text-[12px] font-semibold ink mb-1.5">На {rub(S)} комиссия не превысит</div>
                      <div className="grid grid-cols-2 gap-1.5">
                        {[
                          { k: "Клиринг", v: pctStr(c.clearPct, 2), s: rub(c.clearComm), on: f.blocks.china, col: ALFA_RED },
                          { k: "Dandong", v: pctStr(c.dandPct, 2), s: rub(c.dandComm), on: f.blocks.china, col: GOLD },
                          { k: "Импорт", v: pctStr(c.impPct, 2), s: rub(c.impComm), on: f.blocks.world, col: GREEN },
                          { k: "Экспорт", v: "0,20%", s: rub(c.expComm), on: f.blocks.world, col: VTB_BLUE },
                        ].filter((x) => x.on).map((x, i) => (
                          <div key={i} className="rounded-lg card-soft px-2.5 py-1.5">
                            <div className="text-[11.5px] ink-3 leading-tight">{x.k}</div>
                            <div className="text-[15px] font-bold num leading-tight" style={{ color: x.col }}>{x.v}</div>
                            <div className="text-[11px] ink-3 num">{x.s}</div>
                          </div>
                        ))}
                      </div>
                      <div className="text-[11px] ink-3 mt-1.5">Курс ЦБ {cbrStatus === "loading" ? "…" : rate4(Rcb)}, биржа {moex.status === "ok" ? rate4(Rmoex) : "…"}.</div>
                    </div>
                  )}
                </div>
              </div>

              <div className="rise xl:col-span-8" style={{ transitionDelay: "60ms" }}>
                <KpBlock tall text={text} title={activePreset && activePreset.id === "all" ? "Общее коммерческое предложение" : "Коммерческое предложение"}
                  note={S > 0 ? "Примеры посчитаны на " + rub(S) + " по живому курсу." : "Впишите сумму сделки, чтобы в письме появились примеры расчёта."} />
              </div>
            </div>
          </div>
        </section>
      );
    }
    /* ================= КОНТАКТЫ ================= */
    function Contacts({ onPick }) {
      return (
        <section id="contacts" className="w-full py-8 md:py-10">
          <div className="wrap">
            <div className="rise rounded-2xl card emboss pad">
              <div className="grid grid-cols-1 xl:grid-cols-12 gap-4 items-center">
                <div className="xl:col-span-7">
                  <div className="mb-2"><Badge tone="red" icon={IcZap}>Следующий шаг</Badge></div>
                  <h2 className="text-[22px] sm:text-[28px] font-semibold tracking-tight ink mb-2" style={{ letterSpacing: "-0.03em" }}>Подберу схему под вашу сделку</h2>
                  <p className="text-[13.5px] ink-2 leading-relaxed max-w-2xl">Клиринг, Bank of Dandong, прямой платёж или связка через агента — выбор зависит от суммы, страны, товара и сроков. Пришлите контракт, посчитаю точные цифры. Тарифы держим до {PROMO_UNTIL}.</p>
                  <div className="flex flex-wrap gap-2 mt-3">
                    <Ext href={TG} className="flex items-center gap-2 rounded-full btn-red px-5 py-2.5 font-medium text-[14px]">Telegram<IcArrow size={16} /></Ext>
                    <Ext href={PHONE} title={PHONE_TITLE} className="flex items-center gap-2 rounded-full btn-ghost px-5 py-2.5 font-medium text-[14px]"><IcPhone size={16} />{PHONE_DISPLAY}</Ext>
                    <Jump to="calc" className="flex items-center gap-2 rounded-full btn-ghost px-5 py-2.5 font-medium text-[14px]"><IcCalc size={16} />Калькулятор</Jump>
                  </div>
                </div>
                <div className="xl:col-span-5">
                  <WorkHours />
                  <div className="hidden sm:grid grid-cols-2 lg:grid-cols-3 gap-1.5 mt-2">
                    {TABS.map((t) => (
                      <button key={t.id} onClick={() => onPick(t.id)} className="tab">
                        <div className="flex items-center gap-1.5">
                          <t.Ic size={15} className="shrink-0" style={{ color: "var(--red)" }} />
                          <span className="text-[12.5px] font-semibold ink leading-tight">{t.short}</span>
                          <span className="ml-auto text-[12px] font-bold num" style={{ color: "var(--red)" }}>{t.price}</span>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
              <div className="mt-4 pt-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-[12px] ink-3" style={{ borderTop: "1px solid var(--line-2)" }}>
                <div className="flex items-center gap-3 flex-wrap">
                  <span className="flex items-center gap-1.5"><IcGlobe size={14} style={{ color: "var(--red)" }} /><span className="font-semibold ink">Евгений Демин</span> · международные расчёты</span>
                  <button onClick={() => { try { location.reload(); } catch (e) {} }} className="inline-flex items-center gap-1 ink-3 hover:ink"><IcLock size={12} />закрыть доступ</button>
                </div>
                <div>Расчёты ориентировочные. Финальные условия фиксируются перед сделкой.</div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    /* ================= ПРИЛОЖЕНИЕ ================= */
    function App() {
      const [tab, setTab] = useState("import");
      const pick = (id) => { setTab(id); setTimeout(() => goTo(null, "calc"), 30); };
      useEffect(() => {
        const els = Array.prototype.slice.call(document.querySelectorAll(".rise"));
        if (!("IntersectionObserver" in window)) { els.forEach((el) => el.classList.add("in")); return; }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
        }, { threshold: 0.05, rootMargin: "0px 0px -4% 0px" });
        els.forEach((el) => io.observe(el));
        return () => io.disconnect();
      }, []);
      return (
        <React.Fragment>
          <Hero onPick={pick} />
          <Promo onPick={pick} />
          <Pressure onPick={pick} />
          <CalcHub tab={tab} setTab={setTab} />
          <KpBuilder />
          <Contacts onPick={pick} />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Gate><App /></Gate>);
  </script>

  <script>
