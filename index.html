<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Евгений Демин — Международные расчёты</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- версии закреплены: без них CDN отдаёт новые мажорные версии (Babel уже 8.x) и сайт может перестать собираться -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>

  <style>
    :root {
      color-scheme: light;
      --bg:      #f3efe9;
      --paper:   #ffffff;
      --sunk:    #f2ede5;
      --line:    #e6ded2;
      --line-2:  #f0e9df;
      --ink:     #241a14;
      --ink-2:   #55483e;
      --ink-3:   #827365;
      --red:     #c2352b;
      --red-2:   #d6281f;
      --red-ink: #96271f;
      --vtb:     #0a2896;
      --green:   #1c7a4d;
      --gold:    #9a6a24;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif; color: var(--ink);
      background-color: var(--bg);
      background-image: radial-gradient(1100px 520px at 12% -8%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 64%);
      background-repeat: no-repeat;
      overflow-x: hidden;
    }
    #root { min-height: 100svh; }
    img, video, svg { max-width: 100%; }

    .wrap {
      width: 100%; max-width: 2000px; margin-left: auto; margin-right: auto;
      padding-left: clamp(12px, 2vw, 34px); padding-right: clamp(12px, 2vw, 34px);
    }
    /* секции больше не растягиваются на экран — сайт стал заметно короче */
    .slide { position: relative; width: 100%; padding-top: 40px; padding-bottom: 40px; }
    @media (min-width: 1024px) { .slide { padding-top: 52px; padding-bottom: 52px; } }

    /* ---------- рельеф ---------- */
    .card {
      background: #ffffff;
      border: 1px solid var(--line);
      box-shadow: 0 1px 2px rgba(70,50,34,0.04), 0 8px 22px -18px rgba(70,50,34,0.30);
    }
    .card-soft {
      background: linear-gradient(180deg, #fdfbf7 0%, #f9f5ef 100%);
      border: 1px solid var(--line-2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 6px 18px -14px rgba(70,50,34,0.26);
    }
    .sunken {
      background: linear-gradient(180deg, #f0eae1 0%, #faf7f2 70%);
      border: 1px solid var(--line);
      box-shadow: inset 0 2px 4px rgba(90,66,44,0.08), inset 0 -1px 0 rgba(255,255,255,0.85);
    }
    .emboss { box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 2px 3px rgba(70,50,34,0.06), 0 16px 36px -22px rgba(70,50,34,0.34); }
    /* единый внутренний отступ карточек — компактный */
    .pad { padding: 15px; }
    @media (min-width: 640px) { .pad { padding: 20px; } }

    .ink { color: var(--ink); } .ink-2 { color: var(--ink-2); } .ink-3 { color: var(--ink-3); }
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* ---------- строки без наложений ---------- */
    .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .row > .row-l { min-width: 0; flex: 1 1 auto; }
    .row > .row-r { flex: 0 0 auto; text-align: right; }

    /* ---------- поля ---------- */
    .fld {
      width: 100%; border-radius: 10px; padding: 8px 11px; color: var(--ink);
      background: #fffdfa; border: 1px solid var(--line); outline: none;
      box-shadow: inset 0 2px 4px rgba(90,66,44,0.06); font-size: 14px; font-family: inherit;
    }
    .fld:focus { border-color: rgba(194,53,43,0.55); box-shadow: inset 0 2px 4px rgba(90,66,44,0.05), 0 0 0 3px rgba(194,53,43,0.10); }
    select.fld { appearance: none; -webkit-appearance: none; padding-right: 30px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2382736f' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat; background-position: right 9px center; }
    .fld-big { font-size: 20px; font-weight: 600; padding: 9px 38px 9px 12px; }
    input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="range"] { height: 22px; accent-color: #0a2896; }
    label { cursor: pointer; }

    /* ---------- кнопки ---------- */
    .btn-dark { background: linear-gradient(180deg, #3a2a20 0%, #241a14 100%); color: #fdf6ec; box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 8px 20px -14px rgba(36,26,20,0.9); }
    .btn-dark:hover { background: linear-gradient(180deg, #4a3628 0%, #31241b 100%); }
    .btn-red { background: linear-gradient(180deg, #d33a2f 0%, #bd2f26 100%); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 20px -14px rgba(189,47,38,0.9); }
    .btn-red:hover { filter: brightness(1.06); }
    .btn-ghost { background: rgba(255,255,255,0.75); border: 1px solid var(--line); color: var(--ink-2); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9); }
    .btn-ghost:hover { background: #fff; color: var(--ink); }

    /* ---------- бренд-карточки ---------- */
    .c-vtb  { background: linear-gradient(180deg, #eff2fc 0%, #ffffff 62%); border: 1px solid #c8d2ee; }
    .c-alfa { background: linear-gradient(180deg, #fdeeec 0%, #ffffff 62%); border: 1px solid #f2c6bf; }
    .c-gold { background: linear-gradient(180deg, #fbf2e2 0%, #ffffff 62%); border: 1px solid #ead6b4; }
    .win-red  { border-color: #d6281f; box-shadow: 0 0 0 3px rgba(214,40,31,0.14), 0 12px 28px -20px rgba(70,50,34,0.5); }
    .win-vtb  { border-color: #0a2896; box-shadow: 0 0 0 3px rgba(10,40,150,0.13), 0 12px 28px -20px rgba(70,50,34,0.5); }
    .win-gold { border-color: #b3862f; box-shadow: 0 0 0 3px rgba(179,134,47,0.16), 0 12px 28px -20px rgba(70,50,34,0.5); }

    .kp-pre {
      white-space: pre-wrap; overflow-wrap: anywhere;
      font-size: 13px; line-height: 1.62; color: var(--ink-2);
      max-height: min(44vh, 440px); overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    @media (max-width: 1023px) { .kp-pre { max-height: 260px; } }
    .kp-tall .kp-pre { max-height: min(66vh, 760px); }
    @media (max-width: 1023px) { .kp-tall .kp-pre { max-height: 320px; } }
    .bank-cols { column-count: 1; column-gap: 22px; }
    @media (min-width: 640px)  { .bank-cols { column-count: 2; } }
    @media (min-width: 1280px) { .bank-cols { column-count: 3; } }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .fu { animation: fadeUp .55s cubic-bezier(.2,.75,.2,1) both; }
    /* .rise — от старой длинной ленты; на вкладках всё видно сразу */
    .rise { opacity: 1; }
    @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .pulse { animation: pulseDot 1.8s ease-in-out infinite; }

    /* приветственный экран: плавно появляется, держится, плавно уходит */
    @keyframes greetIn { from { opacity: 0; transform: translateY(18px) scale(.96); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
    .greet-in { animation: greetIn .8s cubic-bezier(.2,.75,.2,1) both; }
    @keyframes greetOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-12px) scale(.98); } }
    .greet-out { animation: greetOut .45s ease-in both; }
    @keyframes greetBar { from { width: 0%; } to { width: 100%; } }
    .greet-bar { width: 0%; animation: greetBar 7s linear .5s both; }

    /* ================= КАРКАС: вкладки вместо длинной ленты =================
       Сверху — шапка с вкладками (на телефоне вкладки внизу экрана). Одна вкладка — один экран, без повторяющихся кнопок. */
    :root { --top-h: 60px; --bot-h: 0px; }
    @media (max-width: 1023px) { :root { --top-h: 54px; --bot-h: 62px; } }
    .page { max-width: 1200px; margin: 0 auto; padding: 22px 16px 32px; }
    @media (min-width: 640px) { .page { padding: 28px 24px 40px; } }
    /* поиск банка прилипает под шапкой */
    .bk-sticky { position: sticky; top: var(--top-h); z-index: 20; margin: 0 -16px; padding: 10px 16px 8px; background: rgba(243,239,233,0.96); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); }
    @media (min-width: 640px) { .bk-sticky { margin: 0 -24px; padding: 10px 24px 8px; } }
    .bk-sticky .bk-scroll { margin: 0; }
    .top { position: sticky; top: 0; z-index: 60; background: rgba(255,255,255,0.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .top-in { max-width: 1200px; margin: 0 auto; height: var(--top-h); display: flex; align-items: center; gap: 10px; padding: 0 16px; }
    @media (min-width: 640px) { .top-in { padding: 0 24px; } }
    .tabs { display: none; }
    @media (min-width: 1024px) { .tabs { display: flex; align-items: center; gap: 2px; } }
    .tabs button { display: inline-flex; align-items: center; gap: 7px; padding: 8px 10px; border-radius: 10px; font-size: 14.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
    .tabs button svg { display: none; }
    @media (min-width: 1280px) { .tabs button { padding: 8px 12px; } .tabs button svg { display: inline; } }
    .pu-pick { flex-shrink: 0; }
    .tabs button:hover { background: var(--sunk); color: var(--ink); }
    .tabs button.on { background: var(--ink); color: #fdf6ec; }
    .bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
      height: calc(var(--bot-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
      background: rgba(255,255,255,0.97); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
    @media (min-width: 1024px) { .bnav { display: none; } }
    .bnav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--ink-3); min-width: 0; }
    .bnav button.on { color: var(--red); font-weight: 700; }
    .pu-pick { appearance: none; -webkit-appearance: none; border: 1px solid rgba(10,40,150,0.22); background: rgba(10,40,150,0.06) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%230a2896' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>") no-repeat right 9px center;
      color: var(--vtb); font: 600 13px/1.2 inherit; font-family: inherit; border-radius: 999px; padding: 7px 28px 7px 12px; max-width: 220px; cursor: pointer; }
    .h1 { font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -0.025em; color: var(--ink); }
    @media (min-width: 640px) { .h1 { font-size: 32px; } }
    .lead { font-size: 16px; line-height: 1.6; color: var(--ink-2); max-width: 780px; }
    .h2 { font-size: 20px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
    @media (min-width: 640px) { .h2 { font-size: 22px; } }
    .why { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; line-height: 1.55; color: #5b4a2a; background: #fff8e8; border: 1px solid #f0e0b8; border-radius: 12px; padding: 9px 12px; }
    .why b { color: #3f3216; }
    .why-s { display: flex; gap: 6px; margin-top: 4px; font-size: 12.5px; line-height: 1.45; color: #6b5527; }
    .hint-on { background: #fff4d6; border: 1px solid #ecd59a; color: #6b5527; }
    .step-n { width: 30px; height: 30px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff; background: var(--red); flex: 0 0 auto; }
    /* схема «кто кому платит» */
    .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; }
    .flow-n { display: inline-flex; flex-direction: column; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.25; }
    .flow-n small { font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
    .flow-a { display: inline-flex; align-items: center; gap: 3px; color: var(--ink-3); font-size: 11.5px; }
    /* урок */
    .lesson p { font-size: 16.5px; line-height: 1.7; color: var(--ink); }
    .lesson p + p { margin-top: 12px; }
    .quiz-o { width: 100%; text-align: left; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; font-size: 15px; color: var(--ink); }
    .quiz-o:hover { border-color: rgba(194,53,43,0.4); }
    .quiz-o.ok { border-color: #1c7a4d; background: rgba(28,122,77,0.08); }
    .quiz-o.no { border-color: #c2352b; background: rgba(194,53,43,0.07); }
    /* выбор расчёта */
    .scen { width: 100%; text-align: left; border-radius: 14px; padding: 12px 14px; background: #fff; border: 1px solid var(--line); transition: border-color .15s ease, box-shadow .15s ease; }
    .scen:hover { border-color: rgba(194,53,43,0.35); }
    .scen.on { border-color: var(--red); box-shadow: 0 0 0 3px rgba(194,53,43,0.12); }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
    @media print { .top, .bnav { display: none !important; } }

    /* ---------- вкладка «Банки» ---------- */
    .bk-scroll { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .bk-scroll::-webkit-scrollbar { display: none; }
    @media (min-width: 640px) { .bk-scroll { flex-wrap: wrap; overflow: visible; row-gap: 6px; } }
    .bk-chip {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      padding: 6px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
      background: rgba(255,255,255,0.8); border: 1px solid var(--line); color: var(--ink-2);
    }
    .bk-chip:hover { background: #fff; color: var(--ink); }
    .bk-chip.on { background: var(--ink); border-color: var(--ink); color: #fdf6ec; }
    .bk-chip .n { font-variant-numeric: tabular-nums; opacity: .7; }
    .bk-dot { width: 8px; height: 8px; border-radius: 999px; flex: 0 0 auto; }

    /* телефон: название и SWIFT, ниже статус и страна; ПК: четыре колонки */
    .bk-grid { display: grid; gap: 6px 12px; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name sw" "st cty"; }
    .bk-grid > .a-name { grid-area: name; } .bk-grid > .a-cty { grid-area: cty; text-align: right; align-self: start; padding-top: 3px; }
    .bk-grid > .a-sw { grid-area: sw; }     .bk-grid > .a-st { grid-area: st; }
    @media (min-width: 900px) {
      .bk-grid { gap: 0 16px; align-items: start; grid-template-columns: minmax(0, 2.4fr) minmax(0, 0.9fr) 72px minmax(0, 1.55fr); grid-template-areas: "name cty sw st"; }
      .bk-grid > .a-cty { text-align: left; padding-top: 0; }
    }
    .bk-colhead { position: sticky; top: 0; z-index: 2; background: #f6f1ea; border-bottom: 1px solid var(--line); }
    .bk-grid.bk-colhead { display: none; }
    @media (min-width: 900px) { .bk-grid.bk-colhead { display: grid; } }
    .bk-row { position: relative; border-bottom: 1px solid var(--line-2); background: #fffdfa; }
    .bk-row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--k); }
    .bk-row.k-direct { background: linear-gradient(90deg, rgba(28,122,77,0.085) 0%, rgba(28,122,77,0.02) 55%, #fffdfa 100%); }
    .bk-row.k-cond   { background: linear-gradient(90deg, rgba(154,106,36,0.06) 0%, #fffdfa 50%); }
    .bk-main { width: 100%; text-align: left; padding: 10px 14px 10px 17px; }
    .bk-main:hover { background: rgba(255,255,255,0.65); }
    .bk-row.on .bk-main { background: rgba(255,255,255,0.8); }
    .bk-name { overflow-wrap: anywhere; }
    .bk-cm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .bk-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1.3; border: 1px solid; }
    .bk-pill.direct { background: #1c7a4d; border-color: #1c7a4d; color: #fff; box-shadow: 0 4px 12px -6px rgba(28,122,77,0.9); }
    .bk-mark { background: rgba(255,190,0,0.38); color: inherit; border-radius: 3px; padding: 0 1px; }
    .bk-detail { padding: 2px 14px 14px 17px; }
    .bk-pre { white-space: pre-line; overflow-wrap: anywhere; }
    /* маршрут: прямой / прокси — разные цвета и подписи, чтобы не путать */
    .bk-row.k-proxy { background: linear-gradient(90deg, rgba(106,63,181,0.075) 0%, rgba(106,63,181,0.015) 55%, #fffdfa 100%); }
    .bk-row.k-mixed { background: linear-gradient(90deg, rgba(14,124,134,0.08) 0%, rgba(14,124,134,0.015) 55%, #fffdfa 100%); }
    .bk-row.k-ru_ok { background: linear-gradient(90deg, rgba(28,122,77,0.085) 0%, rgba(28,122,77,0.02) 55%, #fffdfa 100%); }
    .bk-row.k-ru_cond { background: linear-gradient(90deg, rgba(154,106,36,0.06) 0%, #fffdfa 50%); }
    .bk-pill.solid { color: #fff; border-color: transparent; }
    .bk-ghead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 11px 14px 9px 17px; border-bottom: 1px solid var(--line-2); }
    .bk-ghead .t { font-size: 12.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    .bk-ghead .n { font-variant-numeric: tabular-nums; font-weight: 700; }
    .bk-ghead .d { font-size: 12.5px; color: var(--ink-2); }
    .bk-cur { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 4px; font-size: 11.5px; color: var(--ink-3); }
    .bk-c { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 6px; font: 700 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; border: 1px solid; }
    .bk-tabs { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(36,26,20,0.06); gap: 3px; }
    .bk-tab { padding: 6px 12px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
    .bk-tab.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(70,50,34,0.12), 0 4px 10px -6px rgba(70,50,34,0.35); }
    .bk-tab .n { font-variant-numeric: tabular-nums; opacity: .6; margin-left: 5px; font-weight: 500; }

    /* ---------- справочник по тарифу ---------- */
    .tf-nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .tf-nav::-webkit-scrollbar { display: none; }
    .tf-nav button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 11px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); background: rgba(255,255,255,0.75); border: 1px solid var(--line); white-space: nowrap; text-align: left; }
    .tf-nav button:hover { background: #fff; color: var(--ink); }
    .tf-nav button.on { background: var(--ink); border-color: var(--ink); color: #fdf6ec; }
    .tf-nav button .n { margin-left: auto; font-size: 11.5px; opacity: .65; font-variant-numeric: tabular-nums; }
    @media (min-width: 1024px) {
      .tf-nav { flex-direction: column; overflow: visible; }
      .tf-nav button { width: 100%; }
    }
    .tf-t { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fffdfa; }
    .tf-h, .tf-r { display: grid; grid-template-columns: var(--cols); gap: 0 14px; padding: 9px 14px; align-items: baseline; }
    .tf-h { background: #f4eee6; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
    .tf-r { border-top: 1px solid var(--line-2); font-size: 14px; color: var(--ink); }

    }
    function selectNode(node) {
      try { const sel = window.getSelection(); const range = document.createRange();
        range.selectNodeContents(node); sel.removeAllRanges(); sel.addRange(range); return true; } catch (e) { return false; }

    function KpBlock({ text, title, note, tall }) {

    /* ====== подсказки «простыми словами»: включены по умолчанию, выключаются одной кнопкой ====== */
    const HintCtx = React.createContext({ on: true, set: () => {} });

    /* ====== мобильная компактность: тяжёлые блоки сворачиваются ====== */
    const NARROW_Q = "(max-width: 1023px)";
    function useIsNarrow() {
      const [n, setN] = useState(() => { try { return window.matchMedia(NARROW_Q).matches; } catch (e) { return false; } });
      useEffect(() => {
        let mq;
        try { mq = window.matchMedia(NARROW_Q); } catch (e) { return; }
        const f = () => setN(mq.matches);
        f();
        if (mq.addEventListener) mq.addEventListener("change", f);
        else if (mq.addListener) mq.addListener(f);
        const onResize = () => setN(window.innerWidth < 1024);
        window.addEventListener("resize", onResize);
        return () => {
          if (mq.removeEventListener) mq.removeEventListener("change", f);
          else if (mq.removeListener) mq.removeListener(f);
          window.removeEventListener("resize", onResize);
        };
      }, []);
      return n;
    }
    /* На широком экране блок всегда раскрыт, на телефоне свёрнут в одну строку. */

    /* ====== вход по кодовому слову ====== */
    const norm = (s) => String(s).trim().toLowerCase().replace(/\s+/g, "").replace(/ё/g, "е");
    /* обычные слова и отдельное — с приветствием */
    const CODE_WORDS = ["альфавэд", "хард", "0"].map(norm);
    const CODE_GREET = norm("чистякова");
    const GREET_MS = 7000;              // сколько держим приветствие на экране
    const SESSION_MS = 5 * 60 * 1000;   // доступ закрывается после 5 минут без действий
    /* Доступ нигде не сохраняется: любое обновление страницы снова спрашивает слово.
       Пока человек работает (клики, клавиши, прокрутка), доступ не закрывается. */
    /* открыт ли доступ: окна поверх страницы (список банков) закрываются вместе с ним */
    const GateCtx = React.createContext(true);
    function Gate({ children }) {
      const [ok, setOk] = useState(false);
      const [val, setVal] = useState("");
      const [denied, setDenied] = useState(false);
      const [expired, setExpired] = useState(false);
      const [greet, setGreet] = useState(false);
      const [leaving, setLeaving] = useState(false);
      const inputRef = useRef(null);
      useEffect(() => { if (!ok && !greet && inputRef.current) { try { inputRef.current.focus(); } catch (e) {} } }, [ok, greet]);
      useEffect(() => {
        if (!ok) return;
        let last = Date.now();
        const bump = () => { last = Date.now(); };
        const evs = ["pointerdown", "pointermove", "keydown", "wheel", "touchstart", "scroll"];
        evs.forEach((n) => window.addEventListener(n, bump, { passive: true, capture: true }));
        const id = setInterval(() => {
          if (Date.now() - last >= SESSION_MS) { setOk(false); setVal(""); setExpired(true); setDenied(false); }
        }, 5000);
        return () => { clearInterval(id); evs.forEach((n) => window.removeEventListener(n, bump, { capture: true })); };
      }, [ok]);
      useEffect(() => {
        if (!greet) return;
        const t1 = setTimeout(() => setLeaving(true), GREET_MS);
        const t2 = setTimeout(() => { setGreet(false); setLeaving(false); setOk(true); }, GREET_MS + 500);
        return () => { clearTimeout(t1); clearTimeout(t2); };
      }, [greet]);
      const enterNow = () => { setLeaving(true); setTimeout(() => { setGreet(false); setLeaving(false); setOk(true); }, 350); };
      const submit = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const v = norm(val);
        if (v === CODE_GREET) { setDenied(false); setExpired(false); setGreet(true); }
        else if (CODE_WORDS.indexOf(v) >= 0) { setDenied(false); setExpired(false); setOk(true); }
        else { setDenied(true); }
      };
      const [everOk, setEverOk] = useState(false);
      useEffect(() => { if (ok) setEverOk(true); }, [ok]);
      /* После первого входа сайт остаётся в памяти: при автозакрытии он только прячется,
         поэтому недописанное КП и введённые суммы не пропадают. Обновление страницы сбрасывает всё. */
      const kept = (ok || everOk) ? <div style={ok ? null : { display: "none" }} aria-hidden={!ok}>{children}</div> : null;
      return (<React.Fragment><GateCtx.Provider value={ok}>{kept}</GateCtx.Provider>{ok ? null : renderScreen()}</React.Fragment>);

      function renderScreen() {
      if (greet) return (
        <div className="min-h-[100svh] flex items-center justify-center px-4 py-10">
          <div className={"w-full " + (leaving ? "greet-out" : "greet-in")} style={{ maxWidth: "520px" }}>
            <div className="rounded-3xl card emboss pad text-center">
              <div className="mb-3" style={{ fontSize: "46px", lineHeight: 1 }}>😉</div>
              <div className="text-[24px] sm:text-[30px] font-semibold ink leading-snug mb-2.5" style={{ letterSpacing: "-0.03em" }}>Настя, привет!</div>
              <p className="text-[15px] sm:text-[16px] ink-2 leading-relaxed mb-6">Творение лысого РН-ВЭД с Иркутска приветствует тебя!</p>
              <div className="rounded-full sunken overflow-hidden mb-4" style={{ height: "4px" }}>

              </div>
              <button onClick={enterNow} className="rounded-xl btn-red px-6 py-2.5 text-[14px] font-medium">Заходи<IcArrow size={16} className="inline-block ml-1.5 -mt-0.5" /></button>
            </div>
          </div>

      return (

                  <div className="text-xl sm:text-2xl font-semibold ink mb-2" style={{ letterSpacing: "-0.02em" }}>Сессия закрыта</div>
                  <p className="text-[14px] ink-2 leading-relaxed mb-5">Пять минут без действий — доступ закрылся автоматически. Введите кодовое слово ещё раз, всё введённое на месте.</p>

              <form onSubmit={submit}>
                <input ref={inputRef} type="text" value={val} autoComplete="off" spellCheck="false"
                  onChange={(e) => { setVal(e.target.value); if (denied) setDenied(false); }}

    }

    }

    /* ================= ВРЕМЯ: местное и московское ================= */
    const MSK_TZ = "Europe/Moscow";
    const WORK_FROM = 9, WORK_TO = 18;   // финагенты работают с 9:00 до 18:00 МСК
    function mskParts(d) {
      try {
        const s = new Intl.DateTimeFormat("ru-RU", { timeZone: MSK_TZ, hour: "2-digit", minute: "2-digit", hour12: false }).format(d);
        const p = s.split(":");
        return { text: s, h: parseInt(p[0], 10), m: parseInt(p[1], 10) };
      } catch (e) {
        const u = d.getTime() + d.getTimezoneOffset() * 60000 + 3 * 3600000;
        const x = new Date(u);
        const hh = String(x.getHours()).padStart(2, "0"), mm = String(x.getMinutes()).padStart(2, "0");
        return { text: hh + ":" + mm, h: x.getHours(), m: x.getMinutes() };
      }
    }
    function useClock() {
      const [now, setNow] = useState(() => new Date());
      useEffect(() => {
        const id = setInterval(() => setNow(new Date()), 15000);
        return () => clearInterval(id);
      }, []);
      const msk = mskParts(now);
      let local = "";
      try { local = new Intl.DateTimeFormat("ru-RU", { hour: "2-digit", minute: "2-digit", hour12: false }).format(now); }
      catch (e) { local = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0"); }
      let tzName = "";
      try { tzName = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
      const sameAsMsk = local === msk.text;
      const open = msk.h >= WORK_FROM && msk.h < WORK_TO;
      const mins = msk.h * 60 + msk.m;
      let left = "";
      if (open) {
        const d = WORK_TO * 60 - mins;
        left = d >= 60 ? "ещё " + Math.floor(d / 60) + " ч " + (d % 60) + " мин" : "ещё " + d + " мин";
      } else {
        const d = mins < WORK_FROM * 60 ? WORK_FROM * 60 - mins : (24 * 60 - mins) + WORK_FROM * 60;
        left = d >= 60 ? "через " + Math.floor(d / 60) + " ч " + (d % 60) + " мин" : "через " + d + " мин";
      }
      return { local, msk: msk.text, tzName, sameAsMsk, open, left };
    }
    /* строка-пояснение про часы работы */
    function WorkHours() {
      const c = useClock();
      return (
        <div className="rounded-xl card-soft px-3.5 py-2.5 flex items-start gap-2">

            Финагенты работают <span className="ink font-semibold">с 9:00 до 18:00 по Москве</span>.
            Сейчас у вас {c.local}{c.sameAsMsk ? "" : ", в Москве " + c.msk}.{" "}
            <span style={{ color: c.open ? "var(--green)" : "var(--red-ink)" }} className="font-semibold">{c.open ? "Заявку успеваем поставить сегодня, " + c.left + " до конца дня." : "Сейчас нерабочее время, начнём " + c.left + "."}</span>
          </div>
        </div>
      );
    }

    /* ================= ВКЛАДКИ САЙТА ================= */
    const PAGES = [

    };
    /* юани в банки Китая: 2.2.2.1.9.1.х / 2.2.2.2.9.1.х — одинаково во всех пакетах */
    const CN_TARIFF = {
      VTBRCN: { pct: 0.049, min: 3000, p: "9.1.1", n: "VTB Shanghai" },
      ZDRBCN: { pct: 0.017, min: 10000, p: "9.1.2", n: "Shandong Zhangdian", noThird: 1 },
      KCBCCN: { pct: 0.017, min: 10000, p: "9.1.2", n: "Kincheng Bank", noThird: 1 },
      CKLBCN: { pct: 0.01, min: 7500, p: "9.1.3", n: "Bank of Kunlun" },
      CZCBCN: { pct: 0.017, min: 10000, p: "9.1.4", n: "Zhejiang Chouzhou" },
      QDRCCN: { pct: 0.017, min: 10000, p: "9.1.4", n: "Qingdao Rural", noThird: 1 },
      LZCBCN: { pct: 0.012, min: 7500, p: "9.1.5", n: "Bank of Lanzhou" },
      HCCBCN: { pct: 0.01, min: 7500, p: "9.1.6", n: "Harbin Bank" },
      HRCMCN: { pct: 0.04, min: 15000, p: "9.1.7", n: "Hei he" },
      DDBKCN: { pct: 0.012, min: 3000, p: "9.1.8", n: "Dandong Bank" },
      BKCHCN: { pct: 0.012, min: 7500, p: "9.1.10", n: "Bank of China" },
    };
    const CN_GROUP1 = ["HFCBCN", "FJIBCN", "JNSHCN", "HSSYCN", "NBRCCN", "FSBCCN", "GDROCN", "YZBKCN", "NJCBCN", "JRCBCN", "BOLFCN"];
    const sw6 = (s) => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
    /* тариф за юани по SWIFT банка получателя (+ акция) */
    function cnyTariff(swift, urgent) {
      const s = sw6(swift);
      const pre = urgent ? "2.2.2.2." : "2.2.2.1.";
      const inCN = s.length === 6 && s.slice(4, 6) === "CN";
      let t;
      if (CN_TARIFF[s]) t = Object.assign({ grp: "" }, CN_TARIFF[s]);
      else if (CN_GROUP1.indexOf(s) >= 0) t = { pct: 0.018, min: 10000, p: "9.1.11", grp: "банки группы 1" };
      else if (inCN) t = { pct: 0.049, min: 3000, p: "9.1.9", grp: "прочие банки Китая" };
      else t = { pct: 0.003, min: 3000, max: 20000, p: "9.2", grp: "банк вне материкового Китая" };
      t.p = pre + t.p;
      t.inCN = inCN;
      const pr = CN_PROMO[s];
      return pr ? Object.assign({}, t, { pct: pr.pct, min: pr.min, max: null, promo: true, was: { pct: t.pct, min: t.min, max: t.max } }) : t;
    }
    /* тариф перевода в валюте по пакету: {pct, min, max, unit, fix, p} */
    function fxRule(P, code, urgent) {
      const tbl = urgent ? P.urg : P.fx;
      const known = !!tbl[code];
      const r = tbl[code] || tbl.OTHER;
      const no = FX_NO[known ? code : "OTHER"];
      return Object.assign({ unit: r.cur || r.fixC ? code : "RUB", p: (urgent ? "2.2.2.2." : "2.2.2.1.") + no, other: !known }, r);
    }
    /* комиссия за перевод, ₽: A — сумма в валюте, R — курс ЦБ */
    function fxFee(rule, A, R) {
      if (rule.fix) return rule.fix;
      if (rule.fixC) return rule.fixC * R;
      if (rule.cur) return clamp(A * rule.pct, rule.min, rule.max) * R;
      return clamp(A * R * rule.pct, rule.min, rule.max);
    }
    /* подпись тарифа: «0,25%, от 45 до 225 $», «6 600 ₽ за перевод» */
    function ruleText(rule) {
      const u = rule.unit || "RUB";
      if (rule.fix) return money(rule.fix, "RUB") + " за перевод";
      if (rule.fixC) return money(rule.fixC, u) + " за перевод";
      return pct2(rule.pct) + ", " + (rule.max ? "от " + nf0.format(rule.min) + " до " + money(rule.max, u) : "от " + money(rule.min, u) + ", без потолка");
    }
    /* ФАВК по пакету: kind "4.1" — контракт на учёте, "4.3" — без постановки на учёт */
    function favkRule(P, kind) { return { pct: P.favk.pct, min: P.favk.min, max: kind === "4.3" ? P.favk.max43 : null, p: kind }; }
    const favkFee = (P, kind, rubAmount) => { const r = favkRule(P, kind); return clamp(rubAmount * r.pct, r.min, r.max); };
    /* конвертация за рубли (п. 5.2–5.15): группы валют и пороги «Быстрого развития» (по сумме поручения в валюте) */
    const CONV_GROUPS = [
      { c: ["USD", "AZN"], p: "5.2", th: [1e5, 5e5, 1e6] }, { c: ["EUR", "CHF"], p: "5.4", th: [1e5, 5e5, 1e6] },
      { c: ["GBP", "AUD", "CAD", "NZD", "SGD"], p: "5.9", th: [1e5, 5e5, 1e6] }, { c: ["JPY", "AMD", "INR"], p: "5.10", th: [1e7, 5e7, 1e8] },
      { c: ["NOK", "CNY", "SEK", "HKD", "PLN", "DKK", "TRY", "TJS", "KGS", "RSD", "UZS", "BRL", "GEL"], p: "5.11", th: [5e5, 3e6, 6e6] },
      { c: ["CZK", "ZAR", "MXN"], p: "5.12", th: [1e6, 2e6, 1e7] }, { c: ["KZT"], p: "5.13", th: [1e7, 5e7, 1e8] },
      { c: ["BYN"], p: "5.14", th: [1e5, 5e5, 1e6] }, { c: ["VND"], p: "5.15", th: [1e9, 5e9, 1e10] },
    ];
    const BR_CONV = [0.006, 0.005, 0.004, 0.003];
    /* ставка конвертации: A — сумма поручения в валюте; usd — её эквивалент в $ по ЦБ;
       vol — для «Активных расчётов»: больший из объёмов конвертаций прошлого и этого месяца ($), без этого поручения */
    function convRule(P, code, A, usd, volPrev, volCur) {
      const g = CONV_GROUPS.find((x) => x.c.indexOf(code) >= 0);
      if (!g) return null;
      if (P.conv.kind === "flat") return { pct: P.conv.pct, p: g.p, how: "одна ставка на любые суммы" };
      const tier = (v, th) => (v <= th[0] ? 0 : v <= th[1] ? 1 : v <= th[2] ? 2 : 3);
      if (P.conv.kind === "month") {
        const vol = Math.max(volPrev || 0, (volCur || 0) + usd);
        return { pct: P.conv.tiers[tier(vol, [1e5, 5e5, 1e6])], p: g.p, how: "по объёму конвертаций за месяц: " + money(vol, "USD"), vol: vol };
      }
      return { pct: BR_CONV[tier(A, g.th)], p: g.p, how: "по сумме поручения" };
    }

    /* ---- какой пакет смотрим: общий для всего сайта, запоминается в браузере ---- */
    const PuCtx = React.createContext({ id: "br", P: PUS.br, set: () => {} });
    const usePu = () => useContext(PuCtx);
    function PuProvider({ children }) {
      const [id, setId] = useState(() => { try { const s = localStorage.getItem("pu"); if (PUS[s]) return s; } catch (e) {} return "br"; });
      const set = (v) => { if (!PUS[v]) return; setId(v); try { localStorage.setItem("pu", v); } catch (e) {} };
      const val = useMemo(() => ({ id: id, P: PUS[id], set: set }), [id]);
      return <PuCtx.Provider value={val}>{children}</PuCtx.Provider>;
    }

    /* ================= БАНКИ-ПОЛУЧАТЕЛИ: прямой платёж, прокси или через агента =================
       Данные лежат в <script id="banks-data">, их переносит из Excel «обновление списка банков/обновить.py». */
    const bkSecLabel = (s) => (/зарубеж/i.test(s) ? "Зарубежные банки" : s);
    const bkPlur = (n, one, few, many) => { const a = n % 100, b = n % 10; return (a > 10 && a < 20) ? many : b === 1 ? one : (b >= 2 && b <= 4) ? few : many; };
    const bkSecIsRu = (s) => /юан/i.test(s || "");
    const bkIsRu = (r) => bkSecIsRu(BK.sections[r.sec]);

    /* ---- маршрут из комментария: прямой, прокси или оба сразу (по валютам) ----
       В исходном списке маршрут написан только в комментарии. Если про прокси не сказано — платёж прямой. */
    const BK_CUR_RE = [
      ["KZT", /тенге|kzt/], ["UZS", /узбекск|uzs/], ["KGS", /киргизск|kgs/], ["AZN", /манат|azn/],
      ["AMD", /драм(?:а|ы|ах|ов)?(?![а-я])|amd/], ["GEL", /(?:^|[^а-я])лари(?![а-я])|gel/],
      ["TRY", /(?:^|[^а-я])лир(?:а|ы|ах|ам|ой|у)?(?![а-я])|турецк/], ["BRL", /(?:^|[^а-я])реал(?:ах|ы|ов)?(?![а-я])|brl/],
      ["CNY", /юан|cny/], ["INR", /рупи|inr/], ["VND", /донг|vnd/], ["RSD", /динар|rsd/], ["BYN", /белорусск\S*\s+рубл|byn/],
    ];
    function bkCurs(t, country) {
      const out = [];
      BK_CUR_RE.forEach((x) => { if (x[1].test(t)) out.push(x[0] === "AZN" && /туркмен/i.test(country) ? "TMT" : x[0]); });
      if (/рубл|(?:^|[^a-z])rub(?![a-z])/.test(t.replace(/белорусск\S*\s+рубл\S*/g, ""))) out.push("RUB");
      return out;
    }
    function bkRoute(cm, country) {
      const res = { P: [], D: [], hasP: false, hasD: false };
      if (!cm) return res;
      /* «г. Москва» не должно рвать фразу на две */
      const text = cm.replace(/(^|[\s(])г\.\s+/g, "$1г ");
      text.split(/\n+|\.\s+(?=[А-ЯЁA-Z])|;\s*/).forEach((c) => {
        const t = c.toLowerCase().replace(/ё/g, "е");
        const px = /прокси|покси/.test(t);
        const dr = /прям\S*\s+(?:маршрут|расч)/.test(t) || (/напрямую/.test(t) && !/обрат\S*\s+напрямую/.test(t));
        if (!px && !dr) return;
        if (/не провод|не рекоменд|отсутств|нет маршрут|заглушк|не принима/.test(t)) return;
        const cs = bkCurs(t, country);
        if (px) { res.hasP = true; cs.forEach((x) => { if (res.P.indexOf(x) < 0) res.P.push(x); }); }
        if (dr) { res.hasD = true; cs.forEach((x) => { if (res.D.indexOf(x) < 0) res.D.push(x); }); }
      });
      return res;
    }

    /* группы: зарубежные банки и «Юани по РФ» — разные шкалы, не смешиваем */
    const BK_ORDER_FX = ["direct", "proxy", "mixed", "cond", "agent"];
    const BK_ORDER_RU = ["ru_ok", "ru_cond", "ru_no"];
    const BK_KIND = {
      direct:  { title: "Прямой платёж",     chip: "Прямые",          color: "#1c7a4d", Ic: IcCheck, head: "Прямые платежи",                desc: "Платёж уходит напрямую в банк получателя." },
      proxy:   { title: "Прокси-маршрут",    chip: "Прокси",          color: "#6a3fb5", Ic: IcSwap,  head: "Прокси-маршрут",                desc: "Платёж идёт через банк-корреспондент в РФ, обычно в местной валюте и только по несанкционным сделкам." },
      mixed:   { title: "Прямой + прокси",   chip: "Прямые + прокси", color: "#0e7c86", Ic: IcLayers, head: "Прямой и прокси — по валюте",  desc: "В одной валюте платёж идёт напрямую, в другой — через прокси. Валюты указаны у банка." },
      cond:    { title: "С оговорками",      chip: "С оговорками",    color: "#b07a22", Ic: IcAlert, head: "Прямые с оговорками",           desc: "Условно или на усмотрение банка-получателя: платёж может вернуться." },
      agent:   { title: "Не рекомендованы",  chip: "Не рекомендованы", color: "#c2352b", Ic: IcX,    head: "Прямые расчёты не рекомендованы", desc: "Платёж скорее всего вернётся. Платим через финансовых агентов." },
      ru_ok:   { title: "Принимает юани",    chip: "Принимают",       color: "#1c7a4d", Ic: IcCheck, head: "Принимают юани",                desc: "Юани в этот российский банк можно отправить." },
      ru_cond: { title: "Условно",           chip: "Условно",         color: "#b07a22", Ic: IcAlert, head: "Условно",                       desc: "По согласованию с банком-получателем, платёж может вернуться." },
      ru_no:   { title: "Не принимает юани", chip: "Не принимают",    color: "#c2352b", Ic: IcX,     head: "Не принимают юани",             desc: "Спросите у клиента, в каких ещё банках у него счёт в юанях." },
    };

    const BK_TR = { "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ж":"zh","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"","э":"e","ю":"yu","я":"ya" };
    const bkNorm = (s) => String(s || "").toLowerCase().replace(/ё/g, "е").replace(/[«»"'`“”„‘’()\[\]{},.;:!?\/\\|+*_–—-]+/g, " ").replace(/\s+/g, " ").trim();
    /* латиницей: «втб» находит VTB BANK, «sber» — Сбер */
    const bkLat = (s) => s.replace(/[а-я]/g, (ch) => (BK_TR[ch] !== undefined ? BK_TR[ch] : ch));

    const BK = (function () {
      let d = {};
      try { d = JSON.parse(document.getElementById("banks-data").textContent || "{}"); } catch (e) {}
      const secs = d.sections || [], ctys = d.countries || [], sts = d.statuses || [], cms = d.comments || [];
      const byCountry = {}, inSec = {};
      (d.rows || []).forEach((r) => {
        const c = ctys[r[1]] || "";
        byCountry[c] = (byCountry[c] || 0) + 1;
        inSec[r[0] + "|" + c] = (inSec[r[0] + "|" + c] || 0) + 1;
      });
      const rows = (d.rows || []).map((r, i) => {
        const st = sts[r[4]] || { k: "none", s: "Статус не указан", f: "" };
        const o = { id: i, sec: r[0], country: ctys[r[1]] || "", swift: r[2] || "", name: r[3] || "", st: st, cm: r[5] >= 0 ? (cms[r[5]] || "") : "" };
        const ru = bkSecIsRu(secs[o.sec]);
        const low = o.cm.toLowerCase().replace(/ё/g, "е");
        /* «рекомендованы», но в комментарии банк платежи из РФ не принимает — верим комментарию */
        o.stop = !ru && st.k !== "agent" && /не принимает платежи из рф|установлена заглушка|банк под заглушкой/.test(low) && !/открыти\S* заглушк/.test(low);
        o.route = ru ? { P: [], D: [], hasP: false, hasD: false } : bkRoute(o.cm, o.country);
        if (ru) o.g = st.k === "direct" ? "ru_ok" : st.k === "cond" ? "ru_cond" : "ru_no";
        else if (st.k === "agent" || st.k === "none" || o.stop) o.g = "agent";
        else if (st.k === "cond") o.g = "cond";
        else o.g = o.route.hasP && o.route.hasD ? "mixed" : o.route.hasP ? "proxy" : "direct";
        o.ord = ru ? BK_ORDER_RU.indexOf(o.g) : BK_ORDER_FX.indexOf(o.g);
        o.nameN = bkNorm(o.name);
        o.nameLat = bkLat(o.nameN);
        o.hay = bkNorm([o.name, o.country, secs[o.sec], st.s, st.f, o.cm, BK_KIND[o.g].title, o.route.P.join(" "), o.route.D.join(" ")].join(" "));
        o.hayLat = bkLat(o.hay);
        return o;
      });
      /* внутри раздела: сначала группа (прямые, прокси…), потом страны, где банков больше */
      rows.sort((a, b) => (a.sec - b.sec) || (a.ord - b.ord)
        || ((inSec[b.sec + "|" + b.country] || 0) - (inSec[a.sec + "|" + a.country] || 0))
        || a.country.localeCompare(b.country, "ru")
        || a.name.localeCompare(b.name, "ru"));
      const count = { all: rows.length };
      Object.keys(BK_KIND).forEach((k) => { count[k] = 0; });
      const secN = {};
      rows.forEach((r) => { count[r.g]++; secN[r.sec] = (secN[r.sec] || 0) + 1; });
      const fxSec = secs.findIndex((s) => !bkSecIsRu(s));
      const ruSec = secs.findIndex((s) => bkSecIsRu(s));
      return { asOf: d.asOf || "", sections: secs, secN: secN, fxSec: fxSec < 0 ? 0 : fxSec, ruSec: ruSec,
        countries: Object.keys(byCountry).sort((a, b) => a.localeCompare(b, "ru")), byCountry: byCountry, rows: rows, count: count };
    })();

    function bkAdvice(r) {
      switch (r.g) {
        case "direct": return "Прямой платёж: Альфа отправляет его напрямую в банк получателя. Валюта и ограничения, если есть, — в комментарии.";
        case "proxy":  return "Прокси-маршрут: платёж идёт через банк-корреспондент в РФ" + (r.route.P.length ? " в " + r.route.P.join(", ") : "") + ". Обычно только несанкционные товары и стороны — сверьтесь с комментарием.";
        case "mixed":  return "Маршрут зависит от валюты: " + [r.route.D.length ? "напрямую — " + r.route.D.join(", ") : "", r.route.P.length ? "через прокси — " + r.route.P.join(", ") : ""].filter(Boolean).join("; ") + ".";
        case "cond":   return "Прямой платёж возможен, но может вернуться. Если важны сроки, надёжнее через финансового агента.";
        case "ru_ok":  return "Банк принимает юани, платёж можно отправить напрямую. Ограничения, если есть, — в комментарии.";
        case "ru_cond": return "Юани — условно, по согласованию с банком-получателем. Платёж может вернуться.";
        case "ru_no":  return "Юани в этот банк не проходят. Спросите у клиента, в каких ещё банках у него счёт в юанях. Расчёты возможны через финансовых агентов.";
        default:
          if (r.stop) return "В исходном списке банк отмечен как рекомендованный, но в комментарии сказано, что платежи из РФ он не принимает. Считаем прямые расчёты невозможными — платим через финансовых агентов.";
          if (r.st.k === "none") return "Статус в списке не указан, маршрут перед отправкой уточняйте. Расчёты возможны через финансовых агентов.";
          return "Прямые расчёты не рекомендованы, платёж скорее всего вернётся. Расчёты возможны через финансовых агентов.";
      }
    }

    /* поиск: все слова должны найтись; SWIFT сверяется с начала кода,
       полный SWIFT (8 или 11 знаков) — по первым шести, как записано в списке */
    function bkQuery(q) {
      const n = bkNorm(q);
      if (!n) return { toks: [], re: null };
      const toks = n.split(" ").filter(Boolean).slice(0, 8).map((s) => {
        const lat = bkLat(s), lat2 = bkLat(s.replace(/х/g, "h"));   // «халык» находит и HALYK
        return { s: s, lat: lat, lat2: lat2 !== lat ? lat2 : "", up: lat.length >= 3 ? lat.toUpperCase() : "", sw: /^[a-z]{6}[a-z0-9]{0,5}$/.test(s) ? s.slice(0, 6).toUpperCase() : "" };
      });
      const esc = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const alts = [];
      toks.forEach((t) => {
        alts.push(esc(t.s).replace(/е/g, "[её]"));
        if (t.lat !== t.s && t.lat.length >= 2) alts.push(esc(t.lat));
        if (t.lat2) alts.push(esc(t.lat2));
      });
      let re = null;
      try { re = new RegExp("(" + alts.join("|") + ")", "gi"); } catch (e) {}
      return { toks: toks, re: re };
    }
    const bkSwiftHit = (r, t) => !!r.swift && ((t.sw && r.swift === t.sw) || (t.up && r.swift.indexOf(t.up) === 0));
    function bkHit(r, toks) {
      for (let i = 0; i < toks.length; i++) {
        const t = toks[i];
        if (bkSwiftHit(r, t)) continue;
        if (r.hay.indexOf(t.s) >= 0 || r.hayLat.indexOf(t.lat) >= 0 || (t.lat2 && r.hayLat.indexOf(t.lat2) >= 0)) continue;
        return false;
      }
      return true;
    }
    function bkScore(r, toks) {
      const t = toks[0];
      if (bkSwiftHit(r, t)) return 0;
      const p = r.nameN.indexOf(t.s);
      if (p === 0) return 1;
      if (p > 0 || r.nameLat.indexOf(t.lat) >= 0 || (t.lat2 && r.nameLat.indexOf(t.lat2) >= 0)) return 2;
      return 3;
    }
    function Hl({ text, re }) {
      if (!re || !text) return text || null;
      const parts = String(text).split(re);
      if (parts.length < 2) return text;
      return parts.map((p, i) => (i % 2 ? <mark key={i} className="bk-mark">{p}</mark> : p));
    }
    /* открыть окно банков: можно сразу с поиском, разделом, группой или страной */
    function openBanks(q, opts) {
      try { window.dispatchEvent(new CustomEvent("banks:open", { detail: Object.assign({ q: q || "" }, opts || {}) })); } catch (e) {}
    }
    /* открыть справочник по тарифу на нужном разделе */
    function openTariff(cat, calc) {
      try { window.dispatchEvent(new CustomEvent("tariff:open", { detail: { cat: cat || "main", calc: calc || null } })); } catch (e) {}
    }

    /* ---- комиссия за перевод у каждого банка: по выбранному пакету, «от и до» ----
       Цифры — из тех же таблиц, что и калькуляторы (PUS, CN_TARIFF, CN_PROMO, TC_RUB). */
    /* рубли за рубеж: какие корсчета бывают для страны */
    const BK_RUB_OPTS = {
      "Казахстан": [["KZ_VTB", "через корсчёт в ВТБ"], ["KZ_UZ", "через другие корсчета"]],
      "Узбекистан": [["KZ_UZ", "трансграничный перевод"]],
      "Индия": [["IN_SBER", "через корсчёт в Сбербанке"], ["GEN", "через другие корсчета"]],
      "Вьетнам": [["VN_VTB", "через корсчёт в ВТБ"], ["GEN", "через другие корсчета"]],
      "Китай": [["CN_SOL", "через КБ «Солидарность»"], ["CN_MKB", "через МКБ"], ["CN_VTB", "через ВТБ"], ["GEN", "через другие корсчета"]],
    };
    /* «от 3 000 ₽, без потолка» / «от 3 000 до 20 000 ₽»; у фиксированных — «6 600 ₽ за перевод» */
    const tfRange = (l) => (l.fix ? money(l.fix, "RUB") + " за перевод" : l.fixC ? money(l.fixC, l.unit) + " за перевод"
      : l.max ? "от " + nf0.format(l.min) + " до " + money(l.max, l.unit) : "от " + money(l.min, l.unit) + ", без потолка");
    const tfRangeShort = (l) => (l.fix ? money(l.fix, "RUB") : l.fixC ? money(l.fixC, l.unit) : l.max ? nf0.format(l.min) + "–" + money(l.max, l.unit) : "от " + money(l.min, l.unit));
    const tfPct = (l) => (l.fix || l.fixC ? "" : pct2(l.pct));
    function tfLineCur(P, code) {
      const r = fxRule(P, code, false);
      return Object.assign({}, r, { code: code, label: "Перевод в " + curSign(code) + (r.other ? " (прочие валюты)" : ""), calc: { cur: code } });
    }
    function tfLineCny(sw) {
      const t = cnyTariff(sw, false);
      const lbl = t.promo ? "Юани ¥ в этот банк — акция" : "Юани ¥ в этот банк" + (t.grp ? " (" + t.grp + ")" : "");
      const s = t.promo ? "по тарифу " + pct2(t.was.pct) + ", от " + money(t.was.min) : t.noThird ? "без комиссий стороннего банка" : "";
      return Object.assign({}, t, { code: "CNY", unit: "RUB", label: lbl, s: s, calc: { cur: "CNY", bank: sw6(sw) } });
    }
    function tfLinesRub(country) {
      return (BK_RUB_OPTS[country] || [["GEN", "трансграничный перевод"]]).map((x) => {
        const b = TC_RUB.find((y) => y.id === x[0]);
        return { code: "RUB", unit: "RUB", label: "Рубли ₽ — " + x[1], pct: b.pct, min: b.min, max: b.max, p: b.p, calc: { cur: "RUB", bank: x[0] } };
      });
    }
    function bkTariff(r, P) {
      if (bkIsRu(r) || r.g === "agent") return { lines: [], guess: false };
      const out = [];
      const curs = r.route.D.concat(r.route.P).filter((c, i, a) => a.indexOf(c) === i);
      const sw = r.swift || "";
      /* банк Китая — «CN» в 5–6 знаке SWIFT; ставка за юани зависит от конечного банка получателя */
      const inCN = sw.length >= 6 && sw.slice(4, 6) === "CN";
      const noCny = /юан[^.\n]*не провод|не провод[^.\n]*юан/i.test(r.cm);
      let guess = false;
      if (inCN && !noCny) out.push(tfLineCny(sw));
      else if (!inCN && curs.indexOf("CNY") >= 0) out.push(Object.assign(tfLineCny(sw), { label: "Юани ¥ в банк вне материкового Китая" }));
      let list = curs.filter((c) => c !== "CNY");
      /* валюта в списке не указана — ставки для валюты страны и рублей */
      const nat = COUNTRY_CUR[r.country];
      if (!curs.length && !inCN && nat && nat !== "EUR") { list = [nat, "RUB"]; guess = true; }
      list.forEach((c) => {
        if (c === "RUB") tfLinesRub(r.country).forEach((l) => out.push(l));
        else out.push(tfLineCur(P, c));
      });
      return { lines: out, guess: guess };
    }
    /* одна строка для сообщения: «в ₸ — 1%, от 4 500 ₽, без потолка (п. 2.2.2.1.6)» */
    const tfLineText = (l) => "в " + curSign(l.code) + " — " + (tfPct(l) ? tfPct(l) + ", " : "") + tfRange(l) + (l.promo ? " (акция)" : "") + " (п. " + l.p + ")";

    function BkPill({ k }) {
      const K = BK_KIND[k] || BK_KIND.agent;
      const solid = k === "direct" || k === "proxy" || k === "mixed" || k === "ru_ok";
      const st = solid ? { background: K.color, boxShadow: "0 4px 12px -6px " + K.color }
        : { background: K.color + "12", borderColor: K.color + "55", color: k === "cond" || k === "ru_cond" ? "#7d5518" : "#96271f" };
      return (<span className={"bk-pill " + (solid ? "solid" : "")} style={st}><K.Ic size={12} className="shrink-0" />{K.title}</span>);
    }
    /* валюты маршрута знаками: зелёные — напрямую, фиолетовые — через прокси */
    function BkCurs({ r }) {
      const D = r.route.D, P = r.route.P;
      if (!D.length && !P.length) return null;
      const chip = (c, col) => <span key={col + c} className="bk-c" title={curName(c) + " (" + c + ")"} style={{ color: col, borderColor: col + "55", background: col + "10" }}>{curSign(c)}</span>;
      /* один маршрут — просто валюты; оба — подписываем, что напрямую, а что через прокси */
      const both = r.route.hasD && r.route.hasP;
      return (
        <span className="bk-cur">
          {D.length > 0 && <React.Fragment><span>{both ? "напрямую" : "валюта"}</span>{D.map((c) => chip(c, BK_KIND.direct.color))}</React.Fragment>}
          {D.length > 0 && P.length > 0 && <span className="mx-0.5">·</span>}
          {P.length > 0 && <React.Fragment><span>{both ? "через прокси" : "валюта"}</span>{P.map((c) => chip(c, BK_KIND.proxy.color))}</React.Fragment>}
        </span>
      );
    }

    function BkHelp() {
      const pill = (k, text) => (<div key={k}><BkPill k={k} /> <span className="ml-1">{text}</span></div>);
      return (
        <div className="m-3 sm:m-4 rounded-xl card-soft p-3.5 sm:p-4 text-[13px] ink-2 leading-relaxed grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-2.5">
          {pill("direct", "Альфа отправляет платёж напрямую в банк получателя.")}
          {pill("proxy", "платёж идёт через банк-корреспондент в РФ, обычно в местной валюте (тенге, сумы, манаты, драмы, лари, лиры, реалы, юани). Как правило — только несанкционные товары и стороны.")}
          {pill("mixed", "маршрут зависит от валюты: например, рубли напрямую, сомы через прокси. Валюты подписаны у банка.")}
          {pill("cond", "условно рекомендованы или на усмотрение банка-получателя. Платёж может вернуться.")}
          {pill("agent", "прямые расчёты не рекомендованы. Платим через агента, банк клиента в цепочке не участвует.")}
          <div>Маршрут взят из комментария в исходном списке. Если про прокси там ничего нет — платёж прямой.</div>
          <div>«Юани по РФ» — отдельная вкладка: принимает ли российский банк юани. Если не принимает, спросите у клиента, в каких ещё банках у него счёт в юанях.</div>
          <div>SWIFT в списке записан первыми шестью знаками. Полный код тоже можно вставить в поиск, банк найдётся.</div>
          <div>Банка нет в списке: платежей в него было меньше трёх или не было за месяц, прямой маршрут не проверен.</div>
          <div>У банка — комиссия за перевод «от и до» по выбранному пакету (переключатель в карточке банка); в карточке — все валюты и кнопка «на сумму». Валюты показаны знаками: ₽ рубли, ¥ юани, ₸ тенге и т. д.</div>
          <div>«Скопировать список» — готовое сообщение по текущей выборке: страна, группа, поиск. Кратко или с комментариями и комиссиями.</div>
          <div className="md:col-span-2">Рублёвый платёж не подписывается и банк пишет «В этот банк сейчас не получится отправить платёж»? Согласуйте отправку через прокси-маршрут. Инструкция в базе знаний: ВЭД, Текущая ситуация, Международные расчёты через банки-корреспонденты в РФ (прокси-маршрут), Переводы в рублях.</div>
        </div>
      );
    }

    function BankDetail({ r, goCalc, goTariff, copySwift, copied }) {
      const K = BK_KIND[r.g] || BK_KIND.agent;
      const { P } = usePu();
      const cn = /китай|гонконг|тайвань/i.test(r.country);
      const viaAgent = r.g === "agent" || r.g === "cond" || r.g === "ru_no" || r.g === "ru_cond";
      const showFull = r.st.f && r.st.f.length > 30 && bkNorm(r.st.f) !== bkNorm(r.st.s);
      const T = bkTariff(r, P), tf = T.lines;
      const f41 = favkRule(P, "4.1"), f43 = favkRule(P, "4.3");
      const lbl = "text-[11px] font-semibold uppercase tracking-wider ink-3 mb-0.5";
      return (
        <div className="bk-detail">
          <div className="rounded-xl sunken p-3 sm:p-3.5 grid grid-cols-1 md:grid-cols-12 gap-3 md:gap-5">
            <div className="md:col-span-7 space-y-2.5 min-w-0">
              <div className="flex items-start gap-2 text-[13.5px] ink leading-relaxed">
                <K.Ic size={15} className="shrink-0 mt-1" style={{ color: K.color }} /><span>{bkAdvice(r)}</span>
              </div>
              {r.cm && <div><div className={lbl}>Комментарий</div><div className="bk-pre text-[13px] ink-2 leading-relaxed">{r.cm}</div></div>}
              {showFull && <div><div className={lbl}>Итог в исходном списке</div><div className="bk-pre text-[13px] ink-2 leading-relaxed">{r.st.f}</div></div>}
              {tf.length > 0 && (
                <div>
                  <div className={lbl}>Комиссия за перевод · пакет {puName(P)}</div>
                  {T.guess && <div className="text-[12px] ink-3 mb-1">Валюта в списке не указана — ставки для валюты страны и для рублей.</div>}
                  <div className="rounded-lg overflow-hidden" style={{ border: "1px solid var(--line)" }}>
                    {tf.map((x, i) => (
                      <div key={i} className="px-2.5 py-2 text-[12.5px] flex flex-wrap items-center gap-x-3 gap-y-1" style={{ background: "#fffdfa", borderTop: i ? "1px solid var(--line-2)" : "none" }}>
                        <span className="min-w-0 flex-1 basis-[180px] ink-2 leading-snug">{x.label}{x.s ? <span className="ink-3"> · {x.s}</span> : null} <span className="tf-p">п. {x.p}</span></span>
                        <span className="num whitespace-nowrap">{x.promo && <span className="tf-promo">акция</span>}<b style={{ color: x.promo ? "var(--red)" : "var(--vtb)" }}>{tfPct(x)}</b> <span className="ink">{tfRange(x)}</span></span>
                        <button onClick={() => (x.code === "CNY" ? goCalc("china", { bank: r.swift }) : goCalc("fx", x.calc))} className="inline-flex items-center gap-1 rounded-full btn-ghost px-2.5 py-1 text-[12px]"><IcCalc size={12} />на сумму</button>
                      </div>
                    ))}
                    <div className="px-2.5 py-2 text-[12.5px] flex flex-wrap items-center gap-x-3 gap-y-1" style={{ background: "#f8f4ee", borderTop: "1px solid var(--line-2)" }}>
                      <span className="min-w-0 flex-1 basis-[180px] ink-2 leading-snug">Плюс ФАВК, контракт на учёте <span className="tf-vat">+ НДС</span> <span className="tf-p">п. 4.1</span></span>
                      <span className="num whitespace-nowrap"><b style={{ color: "var(--vtb)" }}>{pct2(f41.pct)}</b> <span className="ink">{tfRange(Object.assign({ unit: "RUB" }, f41))}</span></span>
                    </div>
                    <div className="px-2.5 py-2 text-[12.5px] flex flex-wrap items-center gap-x-3 gap-y-1" style={{ background: "#f8f4ee", borderTop: "1px solid var(--line-2)" }}>
                      <span className="min-w-0 flex-1 basis-[180px] ink-2 leading-snug">или ФАВК, контракт без учёта <span className="tf-vat">+ НДС</span> <span className="tf-p">п. 4.3</span></span>
                      <span className="num whitespace-nowrap"><b style={{ color: "var(--vtb)" }}>{pct2(f43.pct)}</b> <span className="ink">{tfRange(Object.assign({ unit: "RUB" }, f43))}</span></span>
                    </div>
                  </div>
                  <div className="text-[11.5px] ink-3 mt-1">Плюс конвертация, если покупаете валюту за рубли. Комиссии банков-корреспондентов и банка получателя — сверху.</div>
                </div>
              )}
            </div>
            <div className="md:col-span-5 space-y-2.5 min-w-0">
              <div className="grid gap-x-3 gap-y-1 text-[12.5px]" style={{ gridTemplateColumns: "auto 1fr" }}>
                <span className="ink-3">Раздел</span><span className="ink">{bkSecLabel(BK.sections[r.sec])}</span>
                <span className="ink-3">Страна</span><span className="ink">{countryLabel(r.country)}</span>
                <span className="ink-3">SWIFT/БИК</span><span className="ink num">{r.swift ? r.swift + " (первые 6 знаков)" : "не указан"}</span>
                <span className="ink-3">Маршрут</span><span className="ink">{K.title}</span>
              </div>
              <div className="flex flex-wrap gap-2">
                {r.swift && (
                  <button onClick={() => copySwift(r.swift)} className="inline-flex items-center gap-1.5 rounded-full btn-ghost px-3.5 py-2 text-[12.5px]">
                    {copied === r.swift ? <IcCheck size={14} /> : <IcCopy size={14} />}{copied === r.swift ? "Скопировано" : "Скопировать SWIFT"}
                  </button>
                )}
                {viaAgent && <button onClick={() => goCalc("import")} className="inline-flex items-center gap-1.5 rounded-full btn-red px-3.5 py-2 text-[12.5px] font-medium"><IcCalc size={14} />Посчитать через финагента</button>}
                {viaAgent && cn && <button onClick={() => goCalc("clearing")} className="inline-flex items-center gap-1.5 rounded-full btn-ghost px-3.5 py-2 text-[12.5px]"><IcMap size={14} />Клиринг в Китай</button>}
                {cn && r.g !== "agent" && <button onClick={() => goCalc("china", { bank: r.swift })} className="inline-flex items-center gap-1.5 rounded-full btn-red px-3.5 py-2 text-[12.5px] font-medium"><IcCalc size={14} />Платёж в Китай: все комиссии</button>}
                {tf.length > 0 && <button onClick={() => goTariff(cn ? "cny" : "fx")} className="inline-flex items-center gap-1.5 rounded-full btn-ghost px-3.5 py-2 text-[12.5px]"><IcLayers size={14} />Условия тарифа</button>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function BankRow({ r, re, on, onToggle, goCalc, goTariff, copySwift, copied }) {

      return (
        <div className={"bk-row k-" + r.g + (on ? " on" : "")} style={{ "--k": K.color }}>
          <button className="bk-main bk-grid" onClick={onToggle} aria-expanded={on}>
            <span className="a-name min-w-0">
              <span className="bk-name block text-[14px] font-semibold ink leading-snug"><Hl text={r.name} re={re} /></span>
              {r.cm && !on && <span className="bk-cm block text-[12.5px] ink-3 mt-0.5 leading-snug"><Hl text={r.cm} re={re} /></span>}
            </span>
            <span className="a-cty text-[12.5px] ink-2 leading-snug"><Hl text={r.country} re={re} />{COUNTRY_CUR[r.country] && <span className="ink-3" title={countryCurText(r.country)}> · {curSign(COUNTRY_CUR[r.country])}</span>}</span>
            <span className="a-sw num text-[12.5px] font-semibold ink-2" style={{ fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" }}>{r.swift ? <Hl text={r.swift} re={re} /> : "—"}</span>
            <span className="a-st min-w-0">
              <BkPill k={r.g} />
              <BkCurs r={r} />
              {r.g === "cond" && <span className="block text-[12px] ink-3 mt-1 leading-snug">{r.st.s}</span>}
              {tf.length > 0 && (
                <span className="block text-[12px] mt-1 leading-snug ink-2">
                  <span className="ink-3">комиссия в {curSign(tf[0].code)}: </span>{tf[0].promo && <span className="tf-promo">акция</span>}<b className="num" style={{ color: tf[0].promo ? "var(--red)" : "var(--vtb)" }}>{tfPct(tf[0])}</b> <span className="num">{tfRangeShort(tf[0])}</span>
                  {tf.length > 1 && <span className="ink-3"> · ещё {tf.length - 1}</span>}
                </span>
              )}
              {r.stop && <span className="block text-[12px] ink-3 mt-1 leading-snug">в списке «рекомендованы», но платежи из РФ не принимает</span>}

          </button>
          {on && <BankDetail r={r} goCalc={goCalc} goTariff={goTariff} copySwift={copySwift} copied={copied} />}
